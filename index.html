wn": "苗栗縣造橋鄉", "theme": "trail-near", "kind": "古道", "lat": 24.6398, "lng": 120.8639, "coord_conf": "high", "diff": "散步", "time": "全程 3 公里約 1 小時，海拔僅 18–68 公尺", "drive": "從新竹市區約 35 分", "desc": "南北向的低海拔林蔭路，一趟收三顆基石——老庄山 54 公尺、菜瓜窩山 87 公尺、造橋口山 68 公尺，另有木造周生橋與木製高架瞭望平台；步道口外就是 1903 年落成的造橋車站與日式宿舍群。", "season": "4–5 月桐花", "note": "南登山口在造橋國中旁、北登山口在清明福德祠旁；停車可停造橋國中，搭台鐵山線到造橋站步行約 400 公尺即到南口。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=507", "far": false, "route": "toufen-city", "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [4, 5]}, {"id": "pa243d985", "name": "鄭漢紀念步道", "town": "苗栗縣造橋鄉", "theme": "trail-near", "kind": "步道", "lat": 24.6532, "lng": 120.8471, "coord_conf": "high", "diff": "散步", "time": "全長 800 公尺，單程約 20 分", "drive": "從新竹市區約 35 分", "desc": "終點觀景平台俯瞰談文湖稻田、中港溪平原直到台灣海峽，也是海線鐵路 C 型彎道的知名拍攝點；紀念碑立於 1965 年，紀念前一年跳河救童溺斃的青年鄭漢，教育部長閻振興題「人溺己溺」。", "season": "稻作綠毯期約 4–5 月與 9–10 月", "note": "登山口在育達科技大學前的小巷內，巷口有小指標，巷內岔路左轉再走約 350 公尺。清單標三灣有誤，實際在造橋鄉。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1155", "far": false, "route": "toufen-city", "stay_h": 0.33, "drive_min": 35, "total_h": 1.5, "season_months": [4, 5, 9, 10]}, {"name": "鹿廚坑步道", "town": "苗栗縣頭份市", "lat": 24.65642, "lng": 120.89151, "theme": "trail-near", "kind": "步道", "diff": "散步", "time": "全程 3.4 公里約 1 小時 20 分（內環 3 公里／外環 2 公里可自選）", "drive": "從新竹市區約 35 分", "desc": "頭份市廣興社區的低海拔環狀步道，海拔只有 34–104 公尺、落差 70 公尺，分內環線、外環線與山背伯公支線，可依體力自由組合。觀景台可眺望竹南市區與海線的風力發電機，途中會經過一座廢置的維也納公園，還留著歐式建築造景。注意這是苗栗頭份的「鹿廚坑」，跟新竹芎林的「鹿寮坑」是兩個不同地方，常被搞混。", "note": "走國道1 號頭份交流道下接台13 線往尖山，轉苗5-1 線進廣興社區。離新竹最近，適合半天行程。", "season": "4–5 月沿途桐花林是社區主打的賞桐點。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1243", "route": "toufen-city", "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [4, 5], "id": "pb14a913e"}, {"name": "永和山水庫", "town": "苗栗縣頭份市", "theme": "water", "kind": "水庫", "diff": "開車", "time": "環湖公路一圈約 13 公里（單車）", "drive": "從新竹市區約 35 分", "desc": "台灣第一座沒有水門和水閘的水庫（舊名東興水庫）。環湖公路兼自行車道，沿途小公園、百年楓樹、茄苳、挑擔古道，還有因建水庫遷來的 27 位土地公一整排。", "note": "水源保護區，禁止進入水域、禁止垂釣戲水；沿線沒有停車場只能路邊找空地，廁所商店要回三灣或頭份。", "season": "4–5 月桐花，滿山油桐", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1602", "lat": 24.66111, "lng": 120.92278, "coord_conf": "high", "route": "toufen-city", "stay_h": 0.5, "drive_min": 35, "total_h": 1.7, "season_months": [4, 5], "id": "p4bbfea93"}, {"id": "p7eb4280c", "name": "龍昇綠龍隧道（龍昇湖）", "town": "苗栗縣造橋鄉", "theme": "water", "kind": "步道", "lat": 24.63511140789278, "lng": 120.8243550441761, "coord_conf": "high", "diff": "散步", "time": "環湖 2.2 公里約 45 分", "drive": "從新竹市區約 30 分", "desc": "十一公頃的龍昇湖環湖步道上搭了 250 公尺瓜棚隧道，頂上垂著南瓜、蒲瓜、絲瓜，走進去整條是綠的；沿途另有古廟與水鳥。", "season": "5–7 月瓜果盛產，隧道最好看", "note": "免門票免申請；非瓜季只剩空棚架。導航設「靈天禪寺」較準。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1418", "far": false, "route": "toufen-city", "stay_h": 0.75, "drive_min": 30, "total_h": 1.8, "season_months": [5, 6, 7], "nav": [24.63521784917707, 120.82517805049476], "nav_target": "龍昇綠龍隧道 361苗栗縣造橋鄉13號 龍昇湖畔"}, {"name": "噢哈娜咖啡屋", "town": "苗栗縣西湖鄉", "lat": 24.56018, "lng": 120.75766, "theme": "cafe", "kind": "景觀咖啡", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 40 分", "desc": "西湖鄉金獅村的紫色主題咖啡莊園，整園以紫色布景串起來——紫色傘海、紫藤花裝飾隧道、小歐洲花園、棒棒糖步道，園區裡還養了羊駝。以拍照為主，咖啡屋內供應飲品、甜點和簡單輕食。", "note": "目前只在週六、日 09:00–17:30 營業（Google 顯示平日休息，與早期部落格寫的公休日不同，出發前再確認）；門票 200 元可折抵 100 元；有停車場、不能刷卡。", "season": "紫藤約在春季 3–4 月開花，其餘時間以紫色人造造景為主。", "source": "https://shin.tw/miaoli-ohana/", "route": "xihu", "stay_h": 1.5, "drive_min": 40, "total_h": 2.8, "season_months": [3, 4], "id": "p479063d0"}, {"name": "柴燒卡帕尼", "town": "苗栗縣西湖鄉", "lat": 24.56348, "lng": 120.74994, "theme": "food", "kind": "窯烤麵包", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 40 分", "desc": "西湖鄉山路邊的柴燒窯烤店，凌晨兩點就點龍眼木起窯，一個麵包從養酵種到出爐走完約 48 小時，只加鮮奶不加水，招牌是柴燒鮮奶吐司和酒釀核桃麵包。餐點主打窯烤大盆雞和土耳其餅，用餐附無限供應的滷肉飯與蘿蔔味噌湯。", "note": "週二、三、五公休；週四、週一 11:00–17:00，週六日 11:00–16:00；大盆雞要先預約；寵物友善，有停車位。", "season": "", "source": "https://minimiigo.com/campagne/", "route": "xihu", "stay_h": 1.5, "drive_min": 40, "total_h": 2.8, "season_months": [], "id": "p973e24e0"}, {"name": "田媽媽祕密花園", "town": "苗栗縣西湖鄉", "lat": 24.55168, "lng": 120.78605, "theme": "food", "kind": "田媽媽合菜", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 45 分", "desc": "農委會輔導的「田媽媽」班經營的餐廳，開在西湖鄉金獅村的山坡上，用在地食材做套餐與合菜，常見的有迷迭香烤腿、香茅東坡肉、麻油雞。園區腹地大，有草皮和花圃可以讓小孩跑，也開手作 DIY 課程。", "note": "週二公休，約 10:00 開門、供餐 11:00–17:00；人多建議先訂位；有停車空間。", "season": "", "source": "https://yoke918.tw/tian-ma/", "route": "xihu", "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "p1de0d7b3"}, {"name": "劉恩寬古宅（彭城堂）", "town": "苗栗縣西湖鄉", "lat": 24.52891, "lng": 120.75085, "theme": "heritage", "kind": "古厝", "diff": "開車", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "西湖鄉四湖村瑞湖國小前方的劉家宗祠，來台祖恩寬公約兩百多年前渡海定居於此。建築為傳統三合院，覆綠色琉璃瓦、燕尾式屋脊，堂內保存「三代明經」「禮部朝考」「庚辰科恩進士」「候選儒學正堂」四塊功名執事牌，門外立有象徵貢生身分的旗杆座石，分別刻於咸豐 8 年與光緒 14 年。劉家耕讀傳家，第三世於道光 9 年辦私塾，道光 20 年遷至山仔頂擴建為雲梯書院，1900 年改設鸞堂修省堂，民國 65 年改建為今日的宣王宮，可一併順遊。", "note": "為劉氏家族私有宗祠、仍在使用中，非常態開放的觀光景點，沒有售票與導覽；一般只能在外埕欣賞建築與旗杆座石，入內須經家族同意，遇祭祀活動請勿打擾。鄉道狹窄，停車請找路邊安全處。", "season": "", "source": "https://www.xihu.gov.tw/News_Content.aspx?n=3604&s=135540", "gmap": "劉恩寬古宅", "route": "xihu", "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [], "id": "pa63a554f"}, {"name": "吳濁流藝文館", "town": "苗栗縣西湖鄉", "lat": 24.52467, "lng": 120.77033, "theme": "heritage", "kind": "文學館", "diff": "開車", "time": "約 40 分", "drive": "從新竹市區約 50 分", "desc": "紀念《亞細亞的孤兒》作者吳濁流的地方文學館，2003 年落成，設於西湖鄉五湖社區活動中心二樓。吳濁流 1922 年因文章被降調到四湖公學校（今西湖國小）任教，之後又輾轉任教於五湖分教場，前後在西湖鄉待了十五年。館內分兩間：一間珍藏本室存放吳濁流的著作、手稿與照片；另一間展示空間定期更換主題並開放創作者預約策展。", "note": "免費入館。開放週二至週日 10:00–18:00，每週一與春節休館。館舍規模不大，是社區型小館，前往前建議先致電西湖鄉公所確認當日開放。", "season": "", "source": "https://www.xihu.gov.tw/News_Content.aspx?n=3604&s=135547", "route": "xihu", "stay_h": 0.67, "drive_min": 50, "total_h": 2.3, "season_months": [], "id": "pca5db0de"}, {"name": "賴屋武秀才崇達公伙房", "town": "苗栗縣西湖鄉", "lat": 24.52014, "lng": 120.77494, "theme": "heritage", "kind": "古厝", "diff": "開車", "time": "約 20 分", "drive": "從新竹市區約 50 分", "desc": "西湖鄉五湖村的客家伙房，是全台罕見保存下來的武秀才宅第。賴崇達早年在北埔金廣福姜家習武，清同治初年中武秀才，之後在自家土地興建三進三合院，宅第與埕面積逾兩千坪。正廳門楣懸「武秀才宅第」匾額已約一百六十年；正門比一般民宅加高三尺以示秀才身分，屋內還保存 50 斤與 160 斤的練武石。1935 年關刀山大地震部分毀損後重建，維持白牆黑瓦的樸素樣貌。侯孝賢《悲情城市》曾在此取景。", "note": "這是私人住宅兼賴氏祭祀場所，並非對外開放的景點，沒有固定開放時間、也無導覽與售票。僅適合在外埕與路邊外觀欣賞，請勿擅入廳堂、勿打擾住戶，拍照請徵得同意。周邊為鄉間小路，停車請找路邊安全處。", "season": "", "source": "https://1817box.tw/wu-xiucai/", "route": "xihu", "stay_h": 0.33, "drive_min": 50, "total_h": 2.0, "season_months": [], "id": "pf0b7b645"}, {"name": "西湖老街（店仔街）", "town": "苗栗縣西湖鄉", "lat": 24.55777, "lng": 120.75703, "theme": "oldstreet", "kind": "老街", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 40 分", "desc": "西湖鄉三湖村、西湖溪東岸的客家小聚落街市，舊稱店仔街——清代此地原僅設驛站，後逐漸發展成街肆。街道全長僅約 600 公尺、寬約 6 公尺，呈 Y 字型分布，Y 字中央是飛龍宮，北邊出口接五龍宮，村內另有三湖福神；三座廟宇加上百年打鐵舖年盛鐵店與傳統柑仔店構成主要看點。", "note": "規模很小、只有短短一段街，且非商業化觀光老街，店家零星、平日多半安靜無人，不要期待像內灣或南庄老街那樣的攤販規模。適合安排成順遊點而非主要目的地。路邊停車。", "season": "", "source": "https://www.xihu.gov.tw/News_Content.aspx?n=3604&s=135557", "gmap": "西湖老街", "route": "xihu", "stay_h": 1.0, "drive_min": 40, "total_h": 2.3, "season_months": [], "id": "p490b986e"}, {"name": "柚子山步道（玉春亭）", "town": "苗栗縣西湖鄉", "lat": 24.57237, "lng": 120.76948, "theme": "trail-near", "kind": "步道", "diff": "散步", "time": "環形約 1.8–2 公里、約 1 小時", "drive": "從新竹市區約 50 分", "desc": "西湖鄉湖東村大小窩山區的柚園步道，民國 91 年鄉公所為推廣柚花觀賞而闢建，幾乎全是好走的產業道路，沒有石階或碎石小徑，坡度平緩適合親子。稜線上有數座觀景涼亭，站上去可俯瞰整片文旦柚園。座標的「玉春亭」是其中一座亭子，但鄉公所與健行資料列的亭名是海水亭、金來亭、出豬台、琴義小站，沒有玉春亭，可能是後來增設或在地慣稱。", "note": "台1線 117K 轉產業道路約 1 公里到大窩停車場，車停那裡走環線最順。", "season": "3–4 月柚花盛開，西湖鄉會辦柚花季；9–11 月是柚子採收期。", "source": "https://www.url.com.tw/blog/?p=29480", "gmap": "玉春亭(柚子山步道)", "route": "xihu", "stay_h": 1.0, "drive_min": 50, "total_h": 2.7, "season_months": [3, 4, 9, 10, 11], "id": "p549fce35"}, {"name": "龍王峽谷", "town": "苗栗縣西湖鄉", "lat": 24.55741, "lng": 120.78438, "theme": "trail-near", "kind": "峽谷", "diff": "挑戰", "time": "1 號步道進、3 號步道出的 O 形約 2.6 公里、約 2 小時", "drive": "從新竹市區約 45 分", "desc": "西湖鄉金獅村杜石地、龍洞溪切出來的野溪峽谷，谷壁高約 10–20 公尺，岩層以石灰岩為主，壁上可見鐘乳石、風化壁與海膽化石群——這是台灣少見的海膽化石產地，證明百萬年前這片是海底。峽谷內有一線天窄縫與大崩壁地形，共三條步道，一般建議 1 號進、3 號出。", "note": "這是真正的野溪地形，不是修好的觀光步道。谷底常年濕滑、崖壁滴水不斷，低窪處積水可深及小腿肚，必須穿長筒雨鞋、帶登山杖，陡降段靠在地人架的拉繩。峽谷內沒有手機訊號，務必結伴同行。停車導航到無極凌雲宮。", "season": "雨季、颱風後或連日大雨後嚴禁進入——溪水暴漲與堰塞湖潰堤都會致命。乾季（秋冬）水量小最適合。", "source": "https://hiking.biji.co/index.php?q=review&act=info&review_id=33393", "route": "xihu", "stay_h": 2.0, "drive_min": 45, "total_h": 3.5, "season_months": [1, 2, 9, 10, 11, 12], "id": "pad609065"}, {"id": "gatherdelicious", "name": "拾午gatherdelicious", "town": "桃園市平鎮區", "theme": "cafe", "kind": "咖啡", "lat": 24.9609342, "lng": 121.2248297, "coord_conf": "high", "diff": "開車", "time": "約 45 分", "drive": "從新竹市區約 40 分", "desc": "在地咖啡／茶飲點。", "season": "", "note": "", "source": "", "far": false, "route": "zhongli", "stay_h": 0.75, "drive_min": 40, "total_h": 2.1, "season_months": []}, {"name": "浮生生甜點工作室", "town": "桃園市中壢區", "lat": 24.97627, "lng": 121.25721, "theme": "cafe", "kind": "甜點", "diff": "開車", "time": "約 1–1.5 小時", "drive": "從新竹市區約 45 分", "desc": "藏在中壢內壢巷弄裡的抹茶甜點工作室，2023 年 6 月開實體店，之前是網路甜點外送起家，英倫鄉村風、只有約十個座位。主打抹茶系列，用丸久小山園、森半宇治抹茶等抹茶粉，也有茶系飲品與咖啡。", "note": "只營業週五到週一 13:00–18:00，週二到週四公休；座位少，建議事先預約或提早到。", "season": "", "source": "https://jeremyfoodie.tw/floatshanshan/", "route": "zhongli", "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "p40b3f72e"}, {"name": "慢食堂", "town": "桃園市桃園區", "lat": 24.99967, "lng": 121.31467, "theme": "food", "kind": "冰品", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 50 分", "desc": "桃園區鎮三街上的老宅改建甜點店，日式老宅氛圍走簡樸路線，招牌是抹茶金時刨冰，也有焙茶金時、草莓系列、烤麻糬、烤糰子等季節限定。離虎頭山公園、桃園火車站都不遠，可以跟虎頭山公園、井上豆花排同一天。", "note": "11:00–19:00，週一公休；附近車位少，建議騎車或找付費停車場。", "season": "", "source": "https://tenjo.tw/tamatama/", "route": "zhongli", "stay_h": 1.0, "drive_min": 50, "total_h": 2.7, "season_months": [], "id": "p3c4123fa"}, {"name": "貝可拉朵義式冰淇淋", "town": "桃園市桃園區", "lat": 25.01554, "lng": 121.31, "theme": "food", "kind": "冰淇淋", "diff": "開車", "time": "約 20–30 分", "drive": "從新竹市區約 /* ═══════════ 狀態 ═══════════

   S.moreOpen      第二層「從主題找」（含時間／主題／費力／季節）：預設展開，

const S = { view:"map", route:new Set(), themes:new Set(), diffs:new Set(), budget:new Set(),

/* 「只看同路線所有點」是一個檢視狀態，不是疊加一個篩選：開著的時候 S.route 是

   只做單向寫入（把路線塞進 S.route 就結束），移掉某條路線的最後一個點之後，
   那條路線還留在篩選和地圖上，變成沒有主人的孤兒。 */

/* 「看順路可搭」：跟 ROUTE_VIEW 平行的第二種檢視。它篩的不是屬性而是「到行程

   代理（把那些點所在的路線整條選起來）會把 57 個點的整條縣120 都帶進來，包含

   距離級距沿用清單「順路可搭」那三段，可以按「再遠一點」放寬。 */
let NEAR_VIEW = false, NEAR_LEVEL = 0;
/* 這一輪的順路集合。passExcept 會對 520 個點各查一次，不快取就變成 O(n²)；

let NEAR_SET = null;
function refreshNearSet(){ NEAR_SET = (NEAR_VIEW && PLAN.length) ? nearViewSet() : null; }
/* 候選池：照直線取最大級距內、最近的 90 個（OSRM table 一次問得完）。實際車程
   一定 ≥ 直線，所以直線近的必然涵蓋路程近的，這個池是安全的上界。
   nearViewSet 必須跟 primeNearView 用同一個池——只在池內判斷，池外一律不收：
   池外的點若退回直線距離就會被放行，40 公里那級曾因此跑出 430 個點（油羅山在
   山裡，實際車程 40 公里根本到不了那麼多地方）。 */
function nearPool(st){
  const maxKm=NEAR_STEPS[NEAR_STEPS.length-1].km;
  // 不再砍到 90：fetchNear 會自己分批，砍掉反而讓第 91 名之後永遠只有直線距離。
  // 實際車程一定 ≥ 直線，所以「直線 40 公里內」是完整且安全的上界。
  return PLACES.filter(x=>x.id!==st.id && nkm(st,x)<=maxKm)
    .sort((a,b)=>nkm(st,a)-nkm(st,b));
}
function nearViewSet(){
  const stops=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  const lim=NEAR_STEPS[Math.min(NEAR_LEVEL, NEAR_STEPS.length-1)].km;
  const out=new Set();
  stops.forEach(st=>{
    out.add(st.id);
    const road=NEAR[st.id];
    nearPool(st).forEach(x=>{
      if (out.has(x.id)) return;
      const r=road&&road[x.id];
      // 拿得到實際里程就用，還在路上就先用直線頂著（跟行程車程同一套兩層做法）
      const d=r ? r.km : nkm(st,x);
      if (d<=lim) out.add(x.id);
    });
  });
  return out;
}
/* 行程各站到周邊的實際里程。順路檢視要用，地圖資訊卡要標「離最近的一站多遠」
   也要用，所以不綁在 NEAR_VIEW 上。fetchNear 內部有單一進行中的鎖，三站會分幾輪
   陸續補齊，每次成功都會觸發 render。 */
function primeNearData(){
  PLAN.map(id=>BY_ID[id]).filter(Boolean).forEach(st=>{
    // 守門用 NEAR_DONE 不是 NEAR[st.id]——後者在第一批回來後就存在了，
    // 用它當條件的話剩下的批次永遠不會啟動（457 個候選只會抓到 95 個）。
    if (!NEAR_DONE.has(st.id)) fetchNear(st, nearPool(st));
  });
}

function nearestStop(p){
  let best=null;
  PLAN.map(id=>BY_ID[id]).filter(Boolean).forEach(st=>{
    if (st.id===p.id) return;
    const r=NEAR[st.id] && NEAR[st.id][p.id];
    const d=r ? r.km : nkm(st,p);
    if (!best || d<best.km) best={stop:st, km:d, min:r?r.min:null, real:!!r};
  });
  return best;
}

/* 分享連結：#plan=id,id&start=09:00 */
function readHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if (!h) return;
  const q={};
  h.split("&").forEach(kv=>{ const i=kv.indexOf("="); if (i>0) q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
  if (q.plan){
    const ids=q.plan.split(",").filter(id=>BY_ID[id]);
    if (ids.length){ PLAN=ids; TRIP_OPEN=true; S.open=false; }
  }
  if (/^\d{1,2}:\d{2}$/.test(q.start||"")){
    const [hh,mm]=q.start.split(":").map(Number);
    START=(hh||0)*60+(mm||0);
  }
}

/* 篩選：passExcept(p, skip) 會忽略指定的那一軸，
   讓每個 chip 的數量可以「套用其他條件之後」才算，數字才不會跟結果打架。 */
function passExcept(p, skip){
  // 順路檢視是「底集」不是「取代」——先把範圍限縮到行程附近，其他 chip 再疊上去。
  // 這樣主題／時間／費力的計數也會自動變成「這個範圍內有幾個」，而不是全域數字。
  if (NEAR_SET && !NEAR_SET.has(p.id)) return false;
  if (skip!=="route" && S.route.size && !S.route.has(p.route)) return false;
  if (skip!=="themes" && S.themes.size && !S.themes.has(p.theme)) return false;
  if (skip!=="diffs" && S.diffs.size && !S.diffs.has(p.diff)) return false;
  if (skip!=="budget" && S.budget.size && !S.budget.has(bud(p))) return false;
  if (skip!=="mine" && S.mine==="yes" && !p.in_user_list) return false;
  if (skip!=="mine" && S.mine==="no" && p.in_user_list) return false;
  if (skip!=="inseason" && S.inseason && !months(p).includes(MONTH)) return false;
  if (S.q){
    const hay=(p.name+p.town+p.desc+p.note+p.season+p.kind).toLowerCase();
    if (!hay.includes(S.q)) return false;
  }
  return true;
}

const RAD = Math.PI/180;
function km(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLng=(b.lng-a.lng)*RAD, la=(a.lat+b.lat)/2*RAD;
  return Math.hypot(dLat, dLng*Math.cos(la))*6371;
}
/* 送給 OSRM 的座標。圖釘標的是真正的地點，但山頂與步道開不到——OSRM 會把座標
   吸附到最近的道路，而直線最近的那段路往往不是登山口那一段，算出來的里程就歪了。
   所以有 nav（登山口／停車場／入口）就用 nav 算路，地圖上的位置不受影響。 */
const rc = p => (p.nav ? p.nav[1]+","+p.nav[0] : p.lng+","+p.lat);
// 同樣的道理套到直線距離：估算值與候選挑選都要跟真實算路用同一組座標，
// 不然 OSRM 失敗退回估算時，數字會跟排序基準對不起來。
const navpt = p => (p.nav ? {lat:p.nav[0], lng:p.nav[1]} : p);
const nkm = (a,b) => km(navpt(a), navpt(b));

/* 點與點之間的車程。兩層：先用離線估算即時顯示，背景再去問真實路徑換成實測值。

   平均車速也從 53 掉到 40 km/h。用同一組數字算全部（原本是直線 ÷ 30）在山區會低估很多。
   下面三組參數是拿 111 組真實路徑實測回歸出來的。 */
const HILLY = new Set(["jianshi-front","jianshi-back","shuitian","nanqing","luoshan",

function legEstimate(a,b){
  const n=(HILLY.has(a.route)?1:0)+(HILLY.has(b.route)?1:0);
  const [detour,speed] = n===0 ? [1.41,53] : n===1 ? [1.54,44] : [1.69,40];
  const d=nkm(a,b)*detour;
  return {km:d, min:Math.round(d/speed*60), real:false};

const LEG={}; let legBusy=false, legFails=0;
const legKey = (a,b) => (a.id||"HOME") + ">" + (b.id||"HOME");
const legOf = (a,b) => LEG[legKey(a,b)] || legEstimate(a,b);
function fetchLegs(ps){
  if (legBusy || legFails>=3 || !ps.length || navigator.onLine===false) return;
  const full=[HOME, ...ps, HOME];
  if (full.slice(1).every((p,i)=>LEG[legKey(full[i],p)])) return;
  legBusy=true;
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(), 8000);
  const path=full.map(rc).join(";");
  // continue_straight=false 不能省：OSRM 對多點路線預設禁止在中途點迴轉，
  // 山區「開到底再原路折返」就會被繞成一大圈——麥巴來溪→油羅山會從 9.4 公里
  // 變成 25.2 公里、46 分變 134 分，首段距離也會被灌水十幾公里。
  fetch("https://router.project-osrm.org/route/v1/driving/"+path
        +"?overview=false&continue_straight=false",{signal:ctl.signal})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{
      const legs=(j.routes&&j.routes[0]&&j.routes[0].legs)||[];
      if (legs.length!==full.length-1) throw 0;
      legs.forEach((lg,i)=>{
        LEG[legKey(full[i],full[i+1])]={km:lg.distance/1000, min:Math.round(lg.duration/60), real:true};
      });
      legFails=0; legBusy=false; renderTrip();
    })
    .catch(()=>{ legFails++; legBusy=false; })
    .finally(()=>clearTimeout(timer));
}

/* 「順路可搭」的實際里程。這裡直線距離騙得比行程更兇，而且錯的不只是顯示的數字、
   還有排序本身：油羅山到錦屏美人湯直線 5.1 公里，但實際得沿羅山道路下山再上竹62，
   28.5 公里——照直線排它會排在最前面，可是它一點都不順路。
   做法是先照直線挑候選（實際里程一定 ≥ 直線，所以直線近的必然涵蓋路程近的），
   再用 OSRM 的 table 服務一次問完整批，回來重新排序。一個點只問一次。 */
/* NEAR[id] 是「從這個點出發到各地的實際里程」，分批累積；NEAR_DONE 記哪些點已經
   抓完整批，避免重複發請求。
   為什麼要分批：OSRM 的 table 一次最多約 100 個座標，而 40 公里直線內動輒四百多
   個點——只抓最近的 90 個，第 91 名以後就永遠只有直線距離。實際踩到的例子是
   麥巴來溪天然游泳池到竹東觀光夜市：直線 13.9 公里，但有 92 個點比它更近，於是
   它落在池外，清單上只顯示 13.9 km、沒有車程時間，跟行程面板的 48 分／28.3 km
   對不起來。 */
const NEAR={}, NEAR_DONE=new Set(); let nearBusy=null, nearFails=0;
const TABLE_CHUNK=95;
function fetchNear(p, pool){
  if (nearBusy || nearFails>=3 || NEAR_DONE.has(p.id) || !pool.length || navigator.onLine===false) return;
  const have=NEAR[p.id]||{};
  const todo=pool.filter(x=>!(x.id in have));
  if (!todo.length){ NEAR_DONE.add(p.id); return; }
  const chunk=todo.slice(0, TABLE_CHUNK);
  nearBusy=p.id;
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(), 12000);
  const pts=[p].concat(chunk);
  fetch("https://router.project-osrm.org/table/v1/driving/"
        + pts.map(rc).join(";")
        + "?sources=0&annotations=distance,duration", {signal:ctl.signal})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(j=>{
      const ds=j.distances&&j.distances[0], ts=j.durations&&j.durations[0];
      if (!ds || ds.length!==pts.length) throw 0;
      const m=NEAR[p.id]||(NEAR[p.id]={});
      chunk.forEach((x,i)=>{
        // 算不出路的回 null，還是要記一筆，否則下一輪又會把它排進 todo 無限重試
        m[x.id] = ds[i+1]!=null ? {km:ds[i+1]/1000, min:Math.round(ts[i+1]/60)} : null;
      });
      if (chunk.length>=todo.length) NEAR_DONE.add(p.id);
      nearFails=0; nearBusy=null; render();   // render 會再叫一次，剩下的批次接著跑
    })
    .catch(()=>{ nearFails++; nearBusy=null; })
    .finally(()=>clearTimeout(timer));
}

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(min){
  const m=((Math.round(min)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}
/* 車程要不要秀公里數，看拿不拿得到 km（null＝沒有，維持原本只顯示分鐘的行為）。 */
function legText(min, km, real){
  return km!=null ? `${real?"":"約 "}${min} 分 · ${km.toFixed(1)} km` : `${min} 分`;
}

/* ═══════════ 地圖 ═══════════
   底圖用 OpenStreetMap（免金鑰）。標記遠看是主題色圓點（看得出密度），
   拉近到 zoom 14 以上換成主題 icon。導航與「在地圖看」仍然開 Google 地圖 app。
   ═══════════════════════════ */
let engine=null, map=null, marks={}, lines=null, pts=null, ready=false, zoom=11;
const ICON_ZOOM = 14;

function note(html){
  const el=document.getElementById("mapnote");
  if (!html){ el.style.display="none"; return; }
  el.style.display="block"; el.innerHTML=html;
}
function loadOSM(why){
  if (engine) return;
  engine="loading";
  const css=document.createElement("link");
  css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);
  const js=document.createElement("script");
  js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  js.onload=()=>initOSM(why);
  js.onerror=()=>{
    engine=null;
    const m=document.getElementById("mapmsg");
    m.style.display="flex";
    m.textContent="底圖載不進來，可能是沒連網。切到「清單」，內容一樣看得到。";
  };
  document.head.appendChild(js);
}
function initOSM(why){
  engine="osm";
  map=L.map("map",{zoomControl:true}).setView([24.76,121.06],11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
              {maxZoom:18, attribution:"© OpenStreetMap"}).addTo(map);
  lines=L.layerGroup().addTo(map);
  pts=L.layerGroup().addTo(map);
  L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"hubpin",
    html:'<svg viewBox="0 0 16 16"><path d="M2.5 8.5 8 3l5.5 5.5M4 7v6h8V7"/></svg>'})})
    .bindTooltip(HOME.name,{direction:"top",offset:[0,-11],className:"tt",opacity:1})
    .addTo(map);
  zoom=map.getZoom();
  // 點地圖空白處收掉資訊卡，跟再點一次同一個圖釘、按 × 是同一件事的三種入口
  map.on("click", ()=>{ if (S.sel){ S.sel=null; render(); } });
  map.on("zoomend", ()=>{
    const z=map.getZoom();
    const crossed = (z>=ICON_ZOOM) !== (zoom>=ICON_ZOOM);
    zoom=z;
    if (crossed) draw();
  });
  ready=true;
  note(why ? "底圖用 OpenStreetMap：" + why : "");
  draw();
}

function markerHTML(p){
  const c=(TH[p.theme]||{}).color||"#888";
  // 這支只在圖示模式（zoom >= ICON_ZOOM）被呼叫，所以名字標籤不必再判斷縮放層級
  return `<div class="pin${p.id===S.sel?" on":""}" style="color:${c}">` +
         `<svg viewBox="0 0 16 16" class="ic" style="margin:0">${ICON[p.theme]||""}</svg>` +
         `<span class="pinlbl">${esc(p.name)}</span></div>`;
}
/* 行程中的站：圖示模式沿用主題 icon＋掛編號徽章；圓點模式改用同一種 divIcon
   （不能再用 circleMarker——那是純 SVG 圖形，畫不出文字），保留主題色當底色，
   讓使用者還是看得出這站是什麼類型。編號＝PLAN 的索引 +1，跟「今天的行程」
   面板的 .stop .no 一致。 */
function planPinHTML(p, n){
  const c=(TH[p.theme]||{}).color||"#888";
  return `<div class="pin planpin${p.id===S.sel?" on":""}" style="color:${c}">` +
         `<svg viewBox="0 0 16 16" class="ic" style="margin:0">${ICON[p.theme]||""}</svg>` +
         `<span class="plan-badge">${n}</span>` +
         `<span class="pinlbl">${esc(p.name)}</span></div>`;
}
function planDotHTML(p, n){
  const c=(TH[p.theme]||{}).color||"#888";
  return `<div class="dotpin" style="background:${c}"><span class="plan-badge">${n}</span></div>`;
}
function tipHTML(p){
  return `<b>${esc(p.name)}</b>` +
    `<i>${esc(p.town)}　${EFFORT[p.diff]||p.diff}　` +
    `<span class="mi" title="車程">${CAR_SVG}${p.drive_min} 分</span>　` +
    `<span class="mi" title="停留">${HOURGLASS_SVG}${p.stay_h} 小時</span></i>` +
    (p.season?`<i>◈ ${esc(p.season)}</i>`:"") +
    (inPlan(p.id)?`<i>✓ 已在行程裡</i>`:"");
}

function draw(){
  if (!ready) return;
  const list=shown().slice();
  const ids=new Set(list.map(p=>p.id));
  if (S.sel && BY_ID[S.sel] && !ids.has(S.sel)){ list.push(BY_ID[S.sel]); ids.add(S.sel); }
  // 行程中的每一站無論篩選都要畫出來——這是使用者已經排進行程的點，篩選只
  // 決定「還能再挑什麼」，不該連已經選定的東西都藏起來。
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p && !ids.has(id)){ list.push(p); ids.add(id); } });
  const planRoutes=new Set();
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p) planRoutes.add(p.route); });
  // 「顯示路線所有點」：只補行程各站所屬路線上的點，用上面預先建好的
  // ROUTE_POINTS 索引查表（O(行程路線數 × 該路線點數)），不是每次 draw() 都
  // 對全部 PLACES 掃一遍。
  if (engine==="osm"){
    lines.clearLayers(); pts.clearLayers(); marks={};
    ROUTES.forEach(c=>{
      if (!c.path || !c.path.length) return;
      // 行程中有站落在這條路線上，這條路線就一律全亮度畫，不受篩選影響——
      // 使用者已經排進這條路線的點，路線本身沒道理跟著篩選變暗。
      const forced=planRoutes.has(c.id);
      const dim=!forced && S.route.size && !S.route.has(c.id);
      /* 不透明度 0.9 不是 0.7：南向好幾條路線共用台3，半透明線疊起來會變深，
         結果同一個綠看起來深淺不一（台3｜峨眉有 50% 路點跟別條重疊，竹37 完全
         沒有，所以竹37 看起來淺）。拉高之後單線本身就接近疊兩層的深度，
         重疊與不重疊的落差從 0.21 縮到 0.09。 */
      const style={color:(DR[c.dir]||{}).color||"#888", opacity:dim?.25:.9,
                   weight:dim?3:5, lineCap:"round"};
      // path 可能是單條線 [[lat,lng],…]，也可能是多條 [[[lat,lng],…],…]——
      // 真實路型是從 OSM 抓的，同一條路在 OSM 裡常被切成不相連的幾段，
      // 硬接起來會在斷口畫出不存在的直線，所以斷開的就分開畫。
      const segs = Array.isArray(c.path[0][0]) ? c.path : [c.path];
      segs.forEach(s=>{ if (s.length>1) L.polyline(s,style).addTo(lines); });
    });
    const asIcon = zoom >= ICON_ZOOM;
    const planNo={}; PLAN.forEach((id,i)=>{ planNo[id]=i+1; });
    list.forEach(p=>{
      const on=p.id===S.sel;
      const n=planNo[p.id];
      let m;
      if (n){
        // 行程中的站：兩種模式都放大＋掛編號徽章，疊在其他點最上面（見下面
        // zIndexOffset／bringToFront）。
        m = asIcon
          ? L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planPinHTML(p,n), iconSize:[26,26]}),
                                     zIndexOffset:1000})
          : L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planDotHTML(p,n), iconSize:[20,20]}),
                                     zIndexOffset:1000});
      } else if (asIcon){
        // 「顯示路線所有點」補進來、不是篩選結果的點：降低不透明度，跟真正
        // 篩選出來的點做視覺區分（見下面 fillOpacity 那支路的同一個決定）。
        m = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:markerHTML(p), iconSize:[26,26]}),
                                     zIndexOffset:on?900:0});
      } else {
        // bubblingMouseEvents:false 不能省——circleMarker 是 SVG path，點擊預設會
        // 冒泡到地圖容器，觸發「點空白處收合卡片」，卡片就會閃一下立刻消失。
        // divIcon 的 L.Marker 本來就不冒泡，所以只有這一支需要。
        m = L.circleMarker([p.lat,p.lng],{radius:on?9:5.5, color:"#fff", weight:on?2.5:1.2,
                                          fillColor:(TH[p.theme]||{}).color||"#888", fillOpacity:1,
                                          bubblingMouseEvents:false});
      }
      m.addTo(pts);
      m.bindTooltip(tipHTML(p), {direction:"top", offset:[0,asIcon?-14:-8], className:"tt", opacity:1});
      m.on("mouseover", ()=>highlightRow(p.id,true));
      m.on("mouseout", ()=>highlightRow(p.id,false));
      m.on("click", ()=>select(p.id));
      marks[p.id]=m;
    });
    if (S.sel && marks[S.sel] && marks[S.sel].bringToFront) marks[S.sel].bringToFront();
    // circleMarker（圓點模式的非行程點）走 SVG overlayPane；行程中的站不管哪種
    // 模式都是 divIcon，落在 markerPane，pane 的預設 z-index 本來就比
    // overlayPane 高，所以圓點模式不需要額外處理就不會被蓋住。這裡的
    // bringToFront 主要是處理圖示模式下同一個 pane 內、行程點之間與其他
    // icon markers 的疊放順序。
    PLAN.forEach(id=>{ const m=marks[id]; if (m && m.bringToFront) m.bringToFront(); });
  }
}
function fit(items){
  if (!ready || !items.length) return;
  map.fitBounds(L.latLngBounds(items.map(p=>[p.lat,p.lng])).pad(.15));
}
function panTo(p){
  if (!ready) return;
  map.setView([p.lat,p.lng], Math.max(map.getZoom(),13), {animate:true});
}
/* 手機的地圖模式把清單整個藏起來了，點圖釘原本等於沒反應——select() 有選中、
   細節也產生了，但全被 display:none 蓋掉。這張卡就是那個缺口的補法：辨識與常用
   動作留在地圖上，要完整資訊才按「看詳細」切回清單。桌機清單本來就在旁邊，
   不需要這張卡。 */
const isMapOnly = () => S.view==="map" && getComputedStyle(document.querySelector(".stage")).height!=="auto"
  && !matchMedia("(min-width:900px) and (min-height:560px)").matches;
function renderMapCard(){
  const box=document.getElementById("mapcard");
  if (!box) return;
  const p = (isMapOnly() && S.sel) ? BY_ID[S.sel] : null;
  box.className = "mapcard" + (p ? " on" : "");
  if (!p){ box.innerHTML=""; return; }
  // 有行程就以「離最近的一站」當參照，那才是使用者當下在想的距離；沒有行程才
  // 退回「離新竹」。卡片上孤零零一個「25 分」很容易被讀成「離這裡 25 分」。
  primeNearData();
  const ns=nearestStop(p);
  const legHTML = ns
    ? `<span class="mi" title="離行程最近的一站">${CAR_SVG}離${esc(ns.stop.name)} ` +
        (ns.min!=null ? `<span class="num">${ns.min}</span> 分 · ` : ``) +
        `<span class="num">${ns.km.toFixed(1)}</span> km</span>`
    : `<span class="mi" title="從新竹市區出發的車程">${CAR_SVG}<span class="num">${p.drive_min}</span> 分</span>`;
  box.innerHTML =
    `<div class="ttl"><b>${esc(p.name)}</b>` +
      `<button class="x" data-act="close" aria-label="關閉">×</button></div>` +
    `<p class="sub">${esc(p.town)}　${esc((TH[p.theme]||{}).name||"")}　${EFFORT[p.diff]||p.diff}</p>` +
    `<p class="m">${legHTML}` +
      `<span class="mi" title="停留">${HOURGLASS_SVG}<span class="num">${p.stay_h}</span> 小時</span></p>` +
    `<div class="acts">` +
      `<button data-act="plan"${inPlan(p.id)?"":' class="primary"'}>${inPlan(p.id)?"從行程移除":"加進行程"}</button>` +
      `<button data-act="detail">看詳細</button>` +
      `<a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(HOME.name)}&destination=${encodeURIComponent(gnav(p))}" target="_blank" rel="noopener">導航</a>` +
      `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(gview(p))}" target="_blank" rel="noopener">看 Google 地圖</a>` +
    `</div>`;
  box.onclick=e=>{
    const b=e.target.closest("[data-act]"); if (!b) return;
    const act=b.dataset.act;
    if (act==="close"){ S.sel=null; render(); }
    else if (act==="plan"){ togglePlan(p.id); }
    else if (act==="detail"){ S.view="list"; syncViews(); S.listOpen=true; SCROLL_TO=p.id; save(); render(); }
  };
}

/* 地圖左下角那兩顆。都跟「我現在在看什麼範圍」有關，所以擺在地圖上而不是行程
   面板裡；沒有行程時整組不出現（兩者都以行程為前提）。 */
function renderMapBtns(){
  const box=document.getElementById("mapbtns");
  if (!box) return;
  box.innerHTML="";
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return;

  const only=document.createElement("button");
  only.textContent="看行程同路線地點";
  only.setAttribute("aria-pressed", ROUTE_VIEW);
  only.title="清掉其他篩選，只留行程經過的那幾條路線，從頭瀏覽整條路線上的點";
  only.onclick=()=>{
    if (ROUTE_VIEW){
      ROUTE_VIEW=false; S.route=new Set();
    } else {
      // 這是「切換到一個檢視」不是「多加一個條件」——其他篩選一律清掉，
      // 否則按了還是看不到整條路線的點（主題篩選仍在擋），那正是原本的矛盾。
      ROUTE_VIEW=true; NEAR_VIEW=false; NEAR_LEVEL=0;   // 兩種檢視互斥
      S.themes=new Set(); S.diffs=new Set(); S.budget=new Set();
      S.inseason=false; S.mine=null; S.q="";
      const qi=document.getElementById("q"); if (qi) qi.value="";
      S.route=planRouteSet();
      S.listOpen=true; SCROLL_GROUP=true;
      // 路線是程式替使用者勾的，不是他自己點的——把「從路線找」展開，他才看得到
      // 現在被勾了哪幾條、也才能從那裡取消。手機地圖模式不做：那邊清單本來就
      // 藏著，展開只會壓縮地圖高度。
      if (!isMapOnly()){ S.open=true; S.routesOpen=true; }
      fit(PLACES.filter(p=>S.route.has(p.route)));
    }
    S.sel=null; EXTRA=new Set(); save(); render();
  };

  // 「看行程附近地點」：同一顆按鈕循環四個狀態——未選取 → 10 → 20 → 40 公里 →
  // 回到未選取。放寬與開關合在一顆，省下獨立一行「再遠一點」的版面。
  const near=document.createElement("button");
  near.textContent = NEAR_VIEW ? `行程 ${NEAR_STEPS[NEAR_LEVEL].km} 公里內` : "看行程附近地點";
  near.setAttribute("aria-pressed", NEAR_VIEW);
  near.title="只看到行程任何一站的實際車程在範圍內的點；再按放寬距離，最後一次按取消";
  near.onclick=()=>{
    if (NEAR_VIEW && NEAR_LEVEL < NEAR_STEPS.length-1){
      NEAR_LEVEL++;                       // 放寬一級
    } else if (NEAR_VIEW){
      NEAR_VIEW=false; NEAR_LEVEL=0;      // 已在最寬，再按就取消
    } else {
      NEAR_VIEW=true; NEAR_LEVEL=0; ROUTE_VIEW=false;
      S.route=new Set(); S.themes=new Set(); S.diffs=new Set(); S.budget=new Set();
      S.inseason=false; S.mine=null; S.q="";
      const qi=document.getElementById("q"); if (qi) qi.value="";
      S.listOpen=true; SCROLL_RESET=true;
    }
    primeNearView();
    S.sel=null; EXTRA=new Set(); save(); render();
  };

  const all=document.createElement("button");
  all.textContent="行程為中心";
  all.title="把地圖縮放到剛好涵蓋行程裡的所有點";
  all.onclick=()=>fit(ps);

  box.append(only, near, all);
}
function resizeMap(){
  if (!ready) return;
  setTimeout(()=>map.invalidateSize({animate:false}),60);
}
/* #map 容器尺寸監控——通用解（2026-08-22，本人真機回報「地圖下半截灰帶未
   載入」，根因是 Leaflet 初始化後容器尺寸變了卻沒補呼叫 invalidateSize()）。
   會讓 #map 容器尺寸改變的時機不只「切到地圖檢視」一種：iOS standalone 高度
   修正 JS、visualViewport 變化（鍵盤/工具列）、轉向、篩選面板展開收合改變
   .main 高度……與其在每個時機各自補一次 invalidateSize()，這裡對 #map 本身
   掛 ResizeObserver，尺寸一變就（debounce 後）補一次，一次覆蓋全部來源；
   下面 resizeMap() 在檢視切換時的呼叫、iOS standalone 修正 JS 內的呼叫都繼續
   保留，屬於同一件事的多層防線，不互斥。debounce 純粹是避免同一輪連續多次
   ResizeObserver 回呼時重複呼叫，不依賴 requestAnimationFrame（這個工具的
   環境裡 rAF 不觸發，見 HANDOFF §6.15，改用 setTimeout）。*/
(function(){
  const mapEl = document.getElementById("map");
  if (!mapEl || typeof ResizeObserver === "undefined") return;
  let t = null;
  new ResizeObserver(function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){
      if (ready && map) map.invalidateSize({animate:false});
    }, 100);
  }).observe(mapEl);
})();
function emphasize(id,on){
  const m=marks[id];
  if (!m) return;
  // 行程中的站是 divIcon（要畫編號徽章用的），沒有 setStyle。少了這一支，滑到
  // 清單裡「已在行程」那幾列時地圖上會完全沒反應——其他點都有，只有它們沒有。
  if (!m.setStyle){
    const el = m.getElement && m.getElement();
    if (el) el.classList.toggle("hot", !!on);
    if (m.setZIndexOffset) m.setZIndexOffset(on ? 1200 : 1000);
    return;
  }
  const sel=id===S.sel;
  m.setStyle({radius: on?8.5:(sel?9:5.5), weight: on?2.5:(sel?2.5:1.2)});
  if (on && m.bringToFront) m.bringToFront();
}
function highlightRow(id,on){
  const el=document.querySelector(`.row[data-id="${id}"]`);
  if (el) el.style.background = on ? "var(--sunk)" : "";
}

/* ═══════════ 行程 ═══════════
   一天排得下嗎，看的是時間而不是總時數，所以這裡直接算出每一站的抵達與離開。
   停留可以自己加減；順序用 ↑↓ 換（手機也點得到），也可以請它照地理位置重排。
   ═══════════════════════════ */
const inPlan = id => PLAN.includes(id);
const stayOf = p => (STAY[p.id]==null ? p.stay_h : STAY[p.id]);
function stayLabel(h){
  const m=Math.round(h*60);
  if (m<60) return `停 ${m} 分`;
  return m%60 ? `停 ${Math.floor(m/60)} 小時 ${m%60} 分` : `停 ${m/60} 小時`;
}
function adjustStay(p, delta){
  STAY[p.id]=Math.max(0.25, Math.round((stayOf(p)+delta)*4)/4);
  save(); renderTrip();
}
function togglePlan(id){
  const i=PLAN.indexOf(id);
  if (i<0){ PLAN.push(id); TRIP_OPEN=true; } else PLAN.splice(i,1);
  syncRouteView(); syncNearView();   // 兩種檢視都以行程為前提，行程一動就重算
  save(); render();
}
function movePlan(i, dir){
  const j=i+dir;
  if (j<0 || j>=PLAN.length) return;
  const t=PLAN[i]; PLAN[i]=PLAN[j]; PLAN[j]=t;
  save(); render();
}
function optimizePlan(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (ps.length<3) return;
  const rest=ps.slice(), order=[];
  let cur=HOME;
  while (rest.length){
    let bi=0, bd=Infinity;
    rest.forEach((p,i)=>{ const d=km(cur,p); if (d<bd){ bd=d; bi=i; } });
    cur=rest[bi]; order.push(rest.splice(bi,1)[0]);
  }
  PLAN=order.map(p=>p.id);
  save(); render();
}
function schedule(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return null;
  let t=START, stayTotal=0, driveTotal=0;
  const items=ps.map((p,i)=>{
    let legMin, legKm, legReal;
    if (i===0){
      // 家→第一站：分鐘用策展的 drive_min，只從 OSRM 取公里數。
      // 不改分鐘是刻意的——清單上每個點顯示的車程就是 drive_min，這裡若改用 OSRM
      // 會變成同一頁對同一段路報兩個數字；而且 OSRM 對山路偏樂觀（麥巴來溪這段
      // 策展 100 分、OSRM 只給 64 分），策展值比較接近實際。
      const home=LEG[legKey(HOME,p)];
      legMin=p.drive_min;
      if (home){ legKm=home.km; legReal=true; }
    } else {
      const lg=legOf(ps[i-1],p);
      legMin=lg.min; legKm=lg.km; legReal=lg.real;
    }
    driveTotal += legMin;
    const arrive=t+legMin, stay=stayOf(p), leave=arrive+stay*60;
    t=leave; stayTotal+=stay;
    return {p, n:i+1,
      leg: legText(legMin, legKm, legReal),
      win: `${fmt(arrive)}–${fmt(leave)}`,
      stay: stayLabel(stay),
      warn: (months(p).length && !months(p).includes(MONTH)) ? "這季節不是它最好的時候" : ""};
  });
  const last=ps[ps.length-1];
  const homeBack=LEG[legKey(last,HOME)];   // 同上：分鐘照策展值，公里數才取 OSRM
  const back = last.drive_min;
  const backKm = homeBack ? homeBack.km : null;
  const backReal = !!homeBack;
  driveTotal+=back;
  return {ps, items, back, backKm, backReal, backTime:t+back, stay:Math.round(stayTotal*10)/10,
          driveTotal, total:Math.round(((t+back)-START)/6)/10};
}
function planURL(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return "#";
  const last=ps[ps.length-1];
  const way=ps.slice(0,-1).map(gnav).join("|"); // 途經點也是要「開到得了」，跟單點導航同一套規則
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving" +
    "&origin=" + encodeURIComponent(HOME.name) +
    "&destination=" + encodeURIComponent(gnav(last)) +
    (way ? "&waypoints=" + encodeURIComponent(way) : "");
}

function renderTrip(){

  // 展開／未展開共用 .fbtn 既有的 CSS；沒有行程時整顆停用，但呈現仍是「未展開」的樣子

  const toggleTrip=()=>{ if (st){ TRIP_OPEN=!TRIP_OPEN; renderTrip(); } };

  tripBtn.className="fbtn";

  tripBtn.onclick=toggleTrip;

  if (st){
    const hint=document.createElement("span"); hint.className="hint";

  // 說明預設不佔版面，點了才展開 .tfoot；用 hidden 屬性而不是壓高度，
