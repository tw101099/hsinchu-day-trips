<style>
/* ──────────────────────────────────────────────
   個人決策工具，不是行銷頁。
   形狀：可互動的一律膠囊（999px），容器一律 10px。
   顏色：強調色只有一個（--accent）。主題色是資料編碼（八個 icon）。
   ────────────────────────────────────────────── */
:root{
  --bg:#faf9f7; --panel:#ffffff; --sunk:#f2efe9;
  --ink:#1c1a17; --ink2:#6b645b; --ink3:#9a938a;
  --line:#e3ddd3; --line2:#cfc7ba;
  --accent:#5c5449; --accent-soft:#eae4d9; --on-accent:#ffffff;
  --warn:#9a5b17;
  /* --danger：專供「刪除」這個破壞性動作用，跟 --warn（提醒/注意，難度標籤／
     季節旗標／已晚點行程）刻意分開成獨立變數——語意不同：警示是黃橙、刪除是紅，
     共用 --warn 會讓兩種完全不同意圖的視覺訊號長一樣。只有 .swipebg（橫滑刪除
     揭示的背景／icon）用它，不影響任何既有 --warn 的用法。 */
  --danger:#9c3b2c;
  --sb:#cfc7ba; --sb-hover:#a89f92;
  --r:10px; --barh:56px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
    --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
  }
}
:root[data-theme="dark"]{
    --bg:#131211; --panel:#1b1a18; --sunk:#232120;
    --ink:#efeae2; --ink2:#a29a8f; --ink3:#787066;
    --line:#332f2b; --line2:#454039;
    --accent:#bcb2a2; --accent-soft:#2c2822; --on-accent:#17150f;
    --warn:#e0a45c;
    --danger:#c17167;
    --sb:#4a443c; --sb-hover:#6a6157;
}
*{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--sb) transparent;
  -webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--sb); border-radius:999px; border:3px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover); background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
/* App shell（2026-08-21 手機流暢工程第一段）：html/body 固定滿版、永不捲動，
   真正會捲的只有 .panel（清單）／.trip .sheet（行程站列）兩個內部容器——
   下面各自有 overflow-y:auto + overscroll-behavior:contain。這裡的
   overscroll-behavior:none 是外層防線，擋 iOS Safari 在頁面本身沒東西可捲時
   仍可能出現的下拉重整／過捲回彈。UI 文字預設不可選（原生 app 手感），
   景點描述文字例外開回可選，見 .detail .desc。 */
/* touch-action:manipulation 點在 html／body（本人 2026-08-22 明講要全域套，
   不要只點名幾個容器）——消雙擊縮放與 300ms 點擊延遲。touch-action 沿祖先鏈
   做交集，不是繼承：#map 由 Leaflet 自己在 .leaflet-container 直接寫行內
   style（touchAction:"none"），行內樣式特異度天生蓋過任何外部 stylesheet，
   所以這裡不管怎麼設都動不到 Leaflet 自己管的地圖手勢（拖曳／雙指縮放）。
   .trip 底下 .stop／.grip 既有更嚴格的 pan-y／none（橫滑刪除、長按拖曳排序
   用），交集只會取更嚴格那個，跟這裡的 manipulation 不衝突——原本只點名
   .bar／.panel／.trip／.totop／.mapbtns／.mapcard 六個容器，改成 html／body
   兩層等於同時蓋住這六個容器＋沒被點到的邊角空白（.app／.main／.stage 自己
   的背景），效果只增不減。 */
html{height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation}
body{
  margin:0; height:100dvh; overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
button{font:inherit; color:inherit; cursor:pointer}
.num{font-family:var(--mono); font-size:.92em; letter-spacing:-.01em}
.ic{width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; margin-right:4px}

/* ── 版面 ──
   .app 固定 100dvh、overflow:hidden——它本身不是捲動容器，只是把可用高度分給
   .bar（頁首，內容自身高度）與 .main（flex:1，吃剩下全部）。padding-bottom
   留一條空白給底部固定的 .trip 收合狀態，清單捲到底也不會被蓋住（跟原本桌機版
   同一招，現在窄畫面也套用）。這條空白**必須跟 .trip 收合時的真實高度一致**：
   .trip 收合高度＝var(--barh) 加它自己的 env(safe-area-inset-bottom)（見下面
   .trip 的 padding-bottom）——本人實機報過「行程面板下多一截空白」，根因就是
   這裡漏了 safe-area 那一截：只留 var(--barh)，.trip 實際卻更高（多了
   safe-area 的量），.trip 的頂緣因此比這裡讓出的空白還要往上蓋一截，蓋住清單
   最下面那一小段——不是真的多出空白，是清單被蓋住一截、看起來像少了內容／
   底下留白錯位。桌面瀏覽器 safe-area 恆為 0 感覺不出來，裝成 App（standalone，
   無瀏覽器工具列）才會浮現，因為只有 standalone 模式的 safe-area-inset-bottom
   才是裝置實際的值（home indicator 高度，iPhone 約 34px）。 */
.app{display:flex; flex-direction:column; height:100dvh; overflow:hidden; padding-bottom:calc(var(--barh) + env(safe-area-inset-bottom))}
/* iOS standalone 版面缺口修正（本人 2026-08-22 真機診斷數據，見 HANDOFF §6.20）：
   實測 iPhone standalone、black-translucent 狀態列——innerHeight／
   visualViewport.height／100dvh 全部回報 793，但 WebView 實際從螢幕實體頂端
   （screen.height＝852）畫起，少算的 59px 正好是狀態列高度，於是行程列
   （.trip）下方多出一截沒鋪到版面的空洞。這是 iOS standalone 模式下 WebKit
   已知的視口回報怪癖，只發生在「已加到主畫面、無瀏覽器工具列」的情境，一般
   瀏覽器分頁不會踩到——所以刻意用 @media(display-mode:standalone) 圈住，不讓
   -webkit-fill-available 蓋掉 §6.15 已驗證過、桌機與一般手機瀏覽器分頁都正常
   的 100dvh 行為（含一般 Mobile Safari 分頁，即使它本身認得
   -webkit-fill-available，這個 media query 對它就是 false，不會套用）。
   100vh→-webkit-fill-available 兩行疊放是傳統 fallback 寫法：不支援
   -webkit-fill-available 的引擎會整行忽略、停在 100vh，只有支援的 WebKit
   才會吃到最後一行。若這層 CSS 在某些 WebKit 版本仍不夠力（真機缺口沒補滿），
   下面 </body> 前有一層 JS 再補一道防線（直接量 screen.height 改寫行內高度），
   兩層互不衝突、可疊加生效。 */
/* 2026-08-22 本人橫向截圖回報新症狀（見 HANDOFF §6.27）：iPhone standalone
   轉橫向後，地圖（.stage/#map）下緣跟行程列（.trip）之間多出一大條頁面底色
   的空白（不是 §6.26 修的灰帶——那是圖磚未補、這裡是容器本身沒撐滿）。這個工具
   環境測不出真機橫向的 screen.height／display-mode:standalone（同 §6.20 記過的
   限制），根因無法閉環驗證，改採防禦性做法：把上面這整支 standalone 高度覆蓋
   分支限縮到 portrait 方向。理由——這支修法原本對應的症狀（WebView 從螢幕實體
   頂端畫起、狀態列高度沒被算進視口）是本人 portrait 真機實測到的，landscape
   下沒有對應的實測數據；同時 landscape 下疊了兩個未經證實的變因：
   -webkit-fill-available 在橫向有已知的 WebKit 計算怪癖（可能吃到跟目前方向
   不符的快取值），部分 iOS 版本的 screen.height 轉向時也不互換（恆回報長邊，
   下面 JS 那層同步處理）。與其在測不到的環境裡替 landscape 現配一條公式，不如
   讓沒有實測根據的分支完全不介入，landscape 交還給外層 100dvh（§6.15 已驗證
   桌機與手機兩種視窗尺寸都逐位元組正確，不受任何 standalone 特判影響）。 */
@media (display-mode:standalone) and (orientation:portrait){
  html, body, .app{ height:100vh; height:-webkit-fill-available; }
}
.bar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.logo{font-weight:700; white-space:nowrap}
.logo small{display:block; font-weight:400; font-size:11px; color:var(--ink3); letter-spacing:.06em}
.seg{display:flex; background:var(--sunk); border-radius:999px; padding:2px}
.seg button{border:0; background:none; padding:4px 13px; border-radius:999px; font-size:13px; color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent); color:var(--on-accent)}
/* font-size 16px 是底線，不是隨手選的數字：iOS Safari 對 <16px 的輸入框
   聚焦時會強制放大整個頁面（本人實機報過「打完字要費力縮回來」），這是瀏覽器
   內建行為，CSS 攔不住，只能讓 computed font-size ≥16px 從根本避開。padding
   從 6px 收到 5px 抵掉字級變大多出來的高度，膠囊視覺不至於明顯變胖。 */
#q{
  flex:1 1 150px; max-width:250px; min-width:110px; padding:5px 13px; border-radius:999px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:16px;
}
#q:hover{border-color:var(--accent)}
#q:focus{outline:1px solid var(--accent); border-color:var(--accent)}
#theme{
  flex:none; border:1px solid var(--line2); background:var(--bg); border-radius:999px;
  padding:5px 9px; line-height:1; color:var(--ink2);
}
#theme:hover{border-color:var(--accent); color:var(--accent)}
#theme svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px}
.tally{margin-left:auto; font-size:12px; color:var(--ink3); white-space:nowrap}
/* 窄畫面藏掉「66 / 520」：它會把主題切換鈕擠到第二行、為一個數字多吃掉 38px 的
   高度，而同一個數字「景點清單」那條折疊列本來就有。搜尋框也讓它能再縮一點。 */
@media (max-width:520px){
  .tally{display:none}
  /* flex-basis 也要縮，不然這一列排版時先用 150px 去算，主題鈕仍會被擠到第二行
     （可用寬 347px，四個元件加間距要 391px）。 */
  #q{flex:1 1 80px; min-width:80px; max-width:none}
}

/* .main／.panel／.stage 三者現在永遠是一組 flex：窄畫面直欄（面板疊在地圖
   上方或單獨佔滿）、桌機橫排（見 900px 斷點覆寫 flex-direction:row）。.panel
   永遠是自己的捲動容器（overflow-y:auto）——不再有「窄畫面整頁捲、桌機面板
   自己捲」兩套邏輯，JS 端的捲動目標也因此只剩 .panel 一個（見 renderPanel／
   updateTotop／totop 按鈕）。flex:0 1 auto＋min-height:0＋overflow-y:auto
   讓它預設吃自己內容的高度（地圖模式時只有篩選列那一小塊），內容多到超過
   可用空間才會被壓縮並改成自己內部捲（不會把 .stage 擠出畫面）；清單模式
   （.nomap）改用 flex:1 讓它固定吃滿整個 .main，見下面 .main.nomap .panel。 */
.main{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.panel{
  background:var(--panel); border-top:1px solid var(--line);
  flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.stage{position:relative; flex:1 1 auto; min-height:220px; background:var(--sunk)}
#map{position:absolute; inset:0}
.mapnote{
  position:absolute; left:10px; bottom:10px; z-index:500; display:none; max-width:calc(100% - 20px);
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:5px 10px; font-size:11.5px; color:var(--ink2); box-shadow:0 1px 6px rgba(0,0,0,.12);
}
.mapmsg{
  position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
  padding:26px; gap:8px; color:var(--ink2); font-size:13.5px; text-align:center;
}
/* 地圖左下角的浮動層：上面是那幾顆跟視野有關的按鈕，下面是點到圖釘時滑出的
   資訊卡。兩者放同一個 flex 直欄，卡片出現時按鈕自然被頂上去，不必去算高度。
   容器本身 pointer-events:none，否則會蓋住地圖的拖曳與點擊。 */
/* 版權標示是 OSM 的授權要求，不該被行程面板永久遮住——面板展開時跟著往上讓，
   用的是跟資訊卡同一個 --tripup。選擇器要帶 .stage：Leaflet 的 CSS 是執行期才
   注入 <head>，排在這份樣式之後，同特異度會被它蓋掉。 */
.stage .leaflet-bottom{bottom:var(--tripup, 0px)}
.mapoverlay{
  position:absolute; left:10px; right:10px; z-index:600;
  /* 行程面板展開時會從畫面下緣蓋上來，卡片要跟著往上讓——收合行程面板是使用者
     剛剛才做的動作，替他關掉等於跟他作對。--tripup 由 renderTrip 量出來。 */
  bottom:calc(10px + var(--tripup, 0px));
  display:flex; flex-direction:column; align-items:flex-start; gap:8px; pointer-events:none;
}
.mapoverlay > *{pointer-events:auto}
.mapbtns{display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width:100%}
.mapbtns button{
  border:1px solid var(--line); background:var(--panel); color:var(--ink2);
  border-radius:999px; padding:5px 12px; font-size:12.5px; white-space:nowrap;
  box-shadow:0 1px 6px rgba(0,0,0,.18);
}
.mapbtns button:hover{border-color:var(--accent); color:var(--accent)}
.mapbtns button[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
/* 浮動回頂鈕（本人 2026-08-20 裁示）：只顯示 icon，貼在「清單那一側」的右下角。
   預設固定在視窗右下（手機清單模式、桌機「清單」檢視時面板佔滿全寬，都是這個
   位置）；桌機「地圖」檢視時面板固定 410px 靠左、地圖在右，這時要收窄到面板
   自己的右下角，不然會浮在地圖上——.docked 用 calc(100vw - 394px) 把右邊界
   收在面板右緣（410px）往內 16px 處，跟 .panel 的寬度寫死在同一個數字上。
   手機地圖模式（清單隱藏）完全不出現，用 [hidden] 而不是只調透明度，避免它
   還能被 tab 到或被螢幕報讀器唸出來。
   bottom 偏移**必須跨過 .trip 收合時的真實高度**（本人實機回報「回頂鈕從沒
   出現過」的根因）：.trip 是 position:fixed／z-index:1100／整條不透明底，這顆
   鈕原本只墊 16px，遠低於 .trip 收合高度（var(--barh) + safe-area），結果整顆
   鈕的可視範圍全部落在 .trip 底下——不是沒畫出來，是被蓋住，z-index 550 也
   打不過 .trip 的 1100。改成貼齊 .trip 頂緣之上再加 16px 間距，兩者不再重疊，
   z-index 差距就不影響了（.trip 收合時完全碰不到這顆鈕）；.trip 展開
   （.trip.open，行程站列滑出）時仍會蓋過去——那是預期行為，展開時使用者在看
   行程清單，不是在捲景點清單。 */
.totop{
  position:fixed; z-index:550;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(var(--barh) + env(safe-area-inset-bottom) + 16px);
  width:40px; height:40px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line2); color:var(--ink2);
  box-shadow:0 2px 10px rgba(0,0,0,.22); opacity:0; pointer-events:none;
  transition:opacity .15s, border-color .15s, color .15s;
}
.totop[hidden]{display:none}
.totop svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.totop:hover{border-color:var(--accent); color:var(--accent)}
.totop.show{opacity:1; pointer-events:auto}
.totop.docked{right:calc(100vw - 394px + env(safe-area-inset-right))}
/* 手機地圖模式沒有清單可看，點圖釘就從底部滑出這張卡：辨識＋常用動作都在上面，
   不用被丟出地圖。要完整資訊（描述、季節、順路可搭）才按「看詳細」切到清單。 */
.mapcard{
  display:none; align-self:stretch; background:var(--panel); border:1px solid var(--line2);
  border-radius:var(--r); box-shadow:0 2px 14px rgba(0,0,0,.22); padding:10px 12px;
}
.mapcard.on{display:block}
.mapcard .ttl{display:flex; align-items:flex-start; gap:8px}
.mapcard .ttl b{font-size:14px; font-weight:600; flex:1; min-width:0}
.mapcard .x{flex:none; border:0; background:none; color:var(--ink3); font-size:16px; line-height:1; padding:0 2px}
.mapcard .x:hover{color:var(--accent)}
.mapcard .sub{margin:3px 0 0; font-size:12px; color:var(--ink3)}
.mapcard .m{margin:5px 0 0; font-size:12px; color:var(--ink2); display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px}
.mapcard .acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.mapcard .acts a, .mapcard .acts button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2); text-decoration:none;
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
}
.mapcard .acts .primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
/* 放大到圖示模式後直接把名字標在圖釘旁邊——不點下去也知道那是什麼。
   縮小時不顯示，520 個名字擠在一起會看不清。 */
.pinlbl{
  position:absolute; left:30px; top:50%; transform:translateY(-50%); white-space:nowrap;
  font-size:11.5px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px; box-shadow:0 1px 3px rgba(0,0,0,.16);
  cursor:pointer;   /* 點名字跟點圖釘同一件事——標籤在 .pin 裡，點擊會冒泡到 marker */
}
.main.nomap .stage{display:none}
/* 清單模式（沒有地圖可以分高度）：.panel 從「吃自己內容高度」改成 flex:1，
   固定撐滿整個 .main，不管清單長短，捲軸行為才會跟桌機版一致（一個固定高度
   的框，內容用內部捲動）。 */
.main.nomap .panel{flex:1 1 auto}
/* 窄畫面的「地圖」模式＝真的只看地圖。原本這個模式是地圖與清單都顯示，而地圖
   排在 520 筆清單後面——實測要捲 41.9 個畫面才到得了，那顆按鈕等於名不副實。
   篩選列留著（它決定地圖上出現哪些點），收起來的只有清單本體與它的附屬說明。
   .stage 的高度不用再手算：.panel 是 flex:0 1 auto（吃自己內容），.stage 是
   flex:1（吃剩下全部），flexbox 自己會算出正確高度，只留一個 min-height 底線
   防止篩選展開內容太多時把地圖擠沒了。 */
@media (max-width:899px), (max-height:559px){
  .main:not(.nomap) .results,
  .main:not(.nomap) .legend,
  .main:not(.nomap) .foot,
  .main:not(.nomap) .sec.toplevel{display:none}
  .main:not(.nomap) .stage{min-height:280px}
}
/* 桌機：.main 改橫排，.panel 固定寬側欄、.stage 吃剩下寬度——兩者都還是
   flex:0 1 auto／flex:1 1 auto 那套（見基礎規則），只是方向從直欄變橫排，
   捲動容器（.panel 內部捲）沒有變。 */
@media (min-width:900px) and (min-height:560px){
  .main{flex-direction:row}
  .panel{width:410px; flex:0 0 410px; border-top:0; border-right:1px solid var(--line)}
  .main.nomap .panel{width:auto; flex:1 1 auto}
}

/* ── 篩選列 ── */
/* .fbar 黏在 .panel 捲動內容的最上面——.panel 現在任何寬度都是自己的捲動容器
   （見上面版面那節），.fbar 的 sticky 祖先永遠是它，不再有「窄畫面文件捲、
   桌機面板捲」兩種情境要分別對付，top:0 到哪個寬度都對，不用再量 .bar 高度。 */
.fbar{
  position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
}
.fbtn{
  flex:none; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  border-radius:999px; padding:4px 12px; font-size:13px; white-space:nowrap; font-weight:600;
}
.fbtn[aria-expanded=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chev{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round;
      stroke-linejoin:round; margin-left:4px; vertical-align:-1px; transition:transform .15s}
.fbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.fsum{
  /* font:inherit 要寫在 font-size 前面——font 是簡寫，寫在後面會把 font-size 重設回
     繼承值（實測渲染成 15px，不是這行寫的 12.5px）。字級對齊行程摘要的 13.5px。 */
  flex:1; min-width:0; font:inherit; font-size:13.5px; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; border:0; background:none; padding:2px 0; text-align:left;
}
.fsum:hover{color:var(--ink)}
.fsum b{color:var(--ink); font-weight:600}
/* 「清除」「照位置排序」「複製分享連結」「清空」原本各長各的（底線、--line2 外框、
   accent 外框、透明底），跟篩選選項不是同一套。統一到 chip 的規格：--line 外框、
   --bg 底、ink2 字、12.5px、3px 10px、圓角。差別只留在「導航」那顆填滿 accent——
   同一個形狀、不同份量，才看得出誰是主要動作。 */
.clear, .ghost, .trip .go a, .trip .go button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2);
  border-radius:999px; padding:3px 10px; font-size:12.5px; white-space:nowrap;
  text-decoration:none; font-family:inherit; line-height:1.5;
}
.clear:hover, .ghost:hover, .trip .go a:hover, .trip .go button:hover{border-color:var(--line2); color:var(--ink)}
.clear:hover{color:var(--accent)}
#sort{
  flex:none; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--ink2);
  font:inherit; font-size:12.5px; padding:3px 10px; max-width:120px;
}

/* ── 篩選面板：三層 ──
   第一層「時間」永遠在；第二層「從主題找」選了時間會自動展開；第三層「從路線找」預設收起。 */
.filters{padding:10px 14px 12px; border-bottom:1px solid var(--line)}
.frow{display:flex; align-items:flex-start; gap:9px; padding:4px 0}
.fkey{flex:none; width:52px; padding-top:4px; font-size:11.5px; color:var(--ink3); letter-spacing:.06em}
.chips{display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0}
.chip{
  border:1px solid var(--line); background:var(--bg); border-radius:999px;
  padding:3px 10px; font-size:12.5px; color:var(--ink2); line-height:1.5;
  transition:border-color .15s, background .15s, color .15s;
}
.chip:hover{border-color:var(--line2); color:var(--ink)}
/* 選中用淺底＋一般文字色，跟「從路線找」的 .rrow 一致。深色 accent 留給「篩選」
   按鈕本身——那是上一層的東西，選項跟它撞色會失去階層的鑑別度。 */
.chip[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.chip:disabled{opacity:.45; cursor:default; pointer-events:none}
.cnt{margin-left:5px; color:var(--ink3); font-size:11px}
.chip[aria-pressed=true] .cnt{color:var(--ink3)}
.sec{
  display:flex; align-items:center; gap:7px; width:100%; border:0; background:none;
  padding:9px 0 0; margin-top:11px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink2); text-align:left;
}
.sec:hover{color:var(--accent)}
.sec .n{color:var(--ink3); font-family:var(--mono)}
/* 「從主題找」的摺疊列改放選中主題的 icon（名字太長會撐爆那一行）。
   縮到 13px 並跟文字基線對齊，不然會把那一行撐高。 */
.sec .n .ic{width:13px; height:13px; vertical-align:-2px; margin-left:3px}
/* 「景點清單」這顆跟「從主題找」「從路線找」不一樣：後兩者是 .filters 的子元素，
   靠 .filters 的 padding:10px 14px 12px 取得左右留白；這顆是直接掛在 panel 底下，
   沒有那層留白，文字跟 chev 都會貼齊面板邊緣、比上面兩顆縮進去一截。
   補上同樣的 14px 讓三顆對齊。 */
/* 它永遠接在 .fbar 或 .filters 後面，那兩者都自帶 border-bottom——自己再畫一條
   上緣線就會變成兩條並排。收合時下面沒有清單接著，補一條下緣線才不會浮在半空。 */
.sec.toplevel{padding-left:14px; padding-right:14px; border-top:0; margin-top:0}
/* .filters 的第一個 section 上方不用再畫線——篩選列自己的 border-bottom 就在那裡，
   兩條會並排。 */
.filters > .sec:first-child{border-top:0; margin-top:0; padding-top:2px}
.sec.toplevel[aria-expanded=false]{border-bottom:1px solid var(--line); padding-bottom:9px}
.sec .chev{margin-left:auto}
.sec[aria-expanded=true] .chev{transform:rotate(180deg)}
.subrows{margin-top:5px}
.rgroup{margin-top:6px}
/* 方位子標題沿用 .sec 的按鈕骨架（section() 產生），但巢在「從路線找」底下
   不該再畫一條頂層分隔線、留白也要收窄一截；--dc 由 JS 逐條寫入方位色，
   前面點一顆色點跟 .rrow 的色條呼應，摺起來時也看得出這組是哪個方位。 */
.dirsec{border-top:0; margin-top:4px; padding-top:4px; font-size:12px}
/* 「從路線找」展開後的第一組不用再留 4px——前面「從路線找」那顆 .sec 本身已經
   有 margin-top:11px 隔出間距了。.rgroup:first-child 選不到：.rgroup 不是
   .filters 的第一個子元素（前面還有兩顆 .sec），所以用 JS 直接標記。 */
.rgroup.first .dirsec{margin-top:0}
.dirsec::before{content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--dc,var(--ink3))}
.dirsec .n{font-family:var(--mono)}
.rlist{margin-top:4px}
.rrow{
  display:flex; width:100%; align-items:center; gap:9px; padding:6px 8px; font-size:13px;
  border:1px solid transparent; border-radius:8px; background:none; text-align:left; color:var(--ink2);
}
.rrow:hover{background:var(--sunk); color:var(--ink)}
.rrow[aria-pressed=true]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
/* 方位色條刻意不叫 .bar：頁首那條 header 也叫 .bar，帶 padding:8px 14px，
   加上全域 box-sizing:border-box 會把色條從 3px 撐成 28px（左右內距壓不下去）。 */
.rrow .rbar{flex:none; width:3px; height:17px; border-radius:2px}
.rrow .nm{flex:1; min-width:0}
.rrow .n{flex:none; font-size:11.5px; color:var(--ink3)}

/* ── 結果 ── */
.results{padding:2px 12px 20px}
/* ghead＝清單裡每組路線的標題列，2026-08-22 改成可展開的按鈕：收合時只留路線名
   （單行、超寬省略號），展開後是路線簡介卡 .gintro（風格 chip＋簡介文字＋道路
   組成，方案 c）。同日第二輪本人裁示拿掉名字前的小圓點與「走的路」標題，只留
   左緣 3px 方位色條作屬性標記——刻意用細條、不用整列底色／邊框，跟下面
   「從路線找」.rrow 的選取樣式（[aria-pressed=true] 整列淺底＋邊框）在視覺
   語彙上分開，兩者不能混淆（本人核可方案，任務 2）。 */
.ghead{
  position:relative; display:flex; width:100%; align-items:center; gap:7px;
  margin:14px 0 6px; padding:6px 10px 6px 15px; border:0; border-radius:8px;
  border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer;
  font:inherit; font-size:12px; color:var(--ink3); transition:background .12s;
}
.ghead:hover{background:var(--sunk)}
.ghead::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:2px; background:var(--dc,var(--ink3));
}
.ghead .gnm{
  flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ghead .num{flex:none}
.ghead .chev{flex:none; width:12px; height:12px; color:var(--ink3); transition:transform .15s}
.ghead[aria-expanded=true] .chev{transform:rotate(180deg)}
/* 展開後的路線簡介卡：跟 .ghead 一樣 grid-column:1/-1（見下方 .main.nomap 那條），
   多欄清單模式下也要撐滿整列，不然會卡在第一欄看起來斷頭。刻意用 --sunk 平底、
   無強調色邊框——跟景點卡片展開的 .detail（--accent-soft 底＋--accent 邊框，見
   下方）在視覺語彙上區隔：.detail 是「你選中的這一個點」，.gintro 是路線層級
   的背景資訊，讀起來不能像同一種「選取」狀態。 */
.gintro{
  margin:0 0 8px; padding:10px 13px 11px; border-radius:8px; background:var(--sunk);
}
.gintro .gstyle{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px}
.gintro .gchip{
  font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel);
  border:1px solid var(--line2); color:var(--ink2); white-space:nowrap;
}
/* 簡介是內容不是介面，跟 .detail .desc 一樣開回可選（見該條註解）。 */
.gintro .gdesc{
  font-size:13px; color:var(--ink2); line-height:1.65; margin:0 0 7px;
  -webkit-user-select:text; user-select:text;
}
/* 道路組成：淡色小字、無標題自然呈現（本人方案 c 裁示，不要「走的路」四字標籤）。 */
.gintro .groads{font-size:11.5px; color:var(--ink3); line-height:1.5; margin:0}
.row{
  position:relative; display:flex; width:100%; text-align:left; gap:8px; align-items:flex-start;
  border:1px solid transparent; border-radius:var(--r); background:none; padding:7px 9px;
  transition:background .12s, border-color .12s;
}
.row:hover{background:var(--sunk)}
.row[aria-expanded=true]{background:var(--accent-soft); border-color:var(--accent)}
.row .rbody{flex:1; min-width:0}
.row .t{display:flex; gap:6px; align-items:center; font-size:14.5px; font-weight:600}
/* 對齊用 baseline 不是 center：數字是等寬字型（11.04px／行高 17.66px），中文是
   12px／19.2px，兩種字型的基線在各自行高盒裡的位置不同——盒子中心對齊時，
   基線還差 2.25px，看起來就是中文字偏低。圖示不吃基線（inline SVG 的基線在
   盒底），另外用 align-self 置中。 */
.row .m{font-size:12px; color:var(--ink2); margin-top:1px; display:flex; align-items:baseline; flex-wrap:wrap}
.row .off{color:var(--ink3); font-size:11px; border:1px dashed var(--line2); border-radius:999px; padding:0 6px}
.add{
  flex:none; align-self:center; border:1px solid var(--line2); background:var(--bg);
  width:26px; height:26px; border-radius:999px; font-size:14px; line-height:1;
  color:var(--ink3); padding:0;
}
.add:hover{border-color:var(--accent); color:var(--accent)}
.add[data-in=true]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
/* 已加入行程時 hover 不能沿用上面那條——底色是 accent，若文字也被 :hover 蓋成
   accent 就跟底色同色、字看不見。這裡蓋回 on-accent，靠後面順序贏過前一條。 */
.add[data-in=true]:hover{border-color:var(--accent); color:var(--on-accent)}
.tag{font-size:11px; padding:0 7px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.tag.hard{border-color:var(--warn); color:var(--warn)}
.star{color:var(--accent); font-size:11px}
.empty{padding:26px 6px; color:var(--ink2); font-size:14px}
.empty button{border:0; background:none; color:var(--accent); text-decoration:underline; padding:0}
/* 每欄至少 320px（原本 280）：280 在 1280px 寬會排成四欄、每格的資訊行只剩約
   247px，停留時間常被折到第二行。320 排三欄，每格約 415px 就放得下。 */
.main.nomap .results{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:0 14px; align-items:start}
.main.nomap .ghead, .main.nomap .gintro, .main.nomap .detail{grid-column:1/-1}
/* 多欄模式下詳情跨滿整列，上緣接不到被選中那一格的 row（它只佔一欄），少了那條
   線看起來像缺一邊。單欄時（手機）原本「接在該列下方、共用邊框」的設計是對的，
   所以限定在真的排得出兩欄以上的寬度：320px×2 + 間距 + 內距 ≈ 678px。 */
@media (min-width:700px){
  .main.nomap .detail{border-top:1px solid var(--accent); border-radius:var(--r); margin-top:6px}
}

/* ── 展開的詳情：折在該列底下，不是另一頁 ── */
.detail{
  border:1px solid var(--accent); border-top:0; border-radius:0 0 var(--r) var(--r);
  margin:-1px 9px 10px; padding:11px 13px 13px; background:var(--accent-soft);
}
.detail h3{margin:0 0 8px; font-size:12px; color:var(--ink3); font-weight:600; letter-spacing:.06em}
.facts{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; font-size:13px; margin:0 0 10px}
.facts dt{color:var(--ink3)}
.facts dd{margin:0}
/* UI 文字預設不可選（見 body 的 user-select:none），景點描述是內容不是介面，
   開回可選——想複製一段描述去查證或分享，是合理的需求。 */
.detail .desc{font-size:14px; margin:0 0 9px; -webkit-user-select:text; user-select:text}
.flag{font-size:12.5px; color:var(--ink2); background:var(--panel); border-radius:8px; padding:7px 10px; margin:0 0 8px}
.flag.season{color:var(--warn); background:none; padding:0 0 0 1px}
.acts{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 4px}
.acts a, .acts button{
  font-size:12.5px; text-decoration:none; color:var(--ink2); border:1px solid var(--line2);
  border-radius:999px; padding:4px 12px; background:var(--panel);
}
.acts a:hover, .acts button:hover{color:var(--accent); border-color:var(--accent)}
.acts .primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.nearby{margin-top:11px; border-top:1px solid var(--line); padding-top:8px}
.nearby .row{padding:5px 6px}
.nearby .nonear{margin:2px 6px 0; font-size:12px; color:var(--ink3); line-height:1.6}
.wider{border:0; background:none; color:var(--ink3); font-size:12px; text-decoration:underline; padding:4px 6px 0}
.wider:hover{color:var(--accent)}

/* 圖例與頁尾說明是「景點清單」的附屬說明，收在同一個折疊區塊裡；上緣補一條
   跟各折疊列同款的分隔線，讓它跟上面的清單分得開。 */
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; padding:11px 15px 8px; font-size:11.5px;
        color:var(--ink3); margin-top:11px; border-top:1px solid var(--line)}
.legend span{display:inline-flex; align-items:center}
.foot{font-size:11.5px; color:var(--ink3); line-height:1.75; padding:6px 15px 24px; margin:0}

/* ── 行程：釘在畫面底部，是一條有時間的當日時程 ── */
/* z-index 要壓過 Leaflet 的 .leaflet-bottom（它是 1000，而 .stage 沒有自己的層疊
   脈絡，所以會直接跟這裡比大小）——原本 950 會讓右下角的版權標示蓋在面板上。 */
.trip{
  position:fixed; left:0; right:0; bottom:0; z-index:1100; background:var(--panel);
  border-top:1px solid var(--line2); box-shadow:0 -2px 14px rgba(0,0,0,.10);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
.trip .head{
  display:flex; align-items:center; gap:10px; min-height:var(--barh); padding:8px 14px;
  font-size:13.5px;
}
.trip .head .fbtn:disabled{cursor:default}
.trip .head .hint{flex:1; min-width:0; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.trip .head .hint.none{color:var(--ink3)}
.trip .head .right{flex:none; display:flex; align-items:center; gap:8px}
.trip .head .clock{font-family:var(--mono); font-size:12.5px; color:var(--ink2); white-space:nowrap}
.trip .sheet{display:none; max-height:min(60vh,520px); overflow-y:auto; overscroll-behavior:contain; padding:0 14px 14px; border-top:1px solid var(--line)}
.trip.open .sheet{display:block}
.setrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 0 4px}
.setrow .lab{font-size:12px; color:var(--ink3); letter-spacing:.06em}
/* 底色／文字色／外框色比照 .chip（主題 chip 那顆膠囊）。字級原本刻意維持
   13px（跟 .chip 的 12.5px 差距很小），2026-08-22 改回 16px——這是 `<input
   type="time">`，iOS Safari 對任何 <16px 的表單控制項聚焦都會強制放大頁面
   （不限文字鍵盤，含時間選輪），跟 #q 同一條規則，優先權更高，蓋掉原本
   「跟 .chip 對齊」的視覺考量。**font-size:16px 是底線，不能再動**（§6.17
   記過的 iOS 聚焦放大線）。padding 從 4px 收到 3px 抵一點高度差。
   2026-08-22 本人回報框偏大：根因不是 padding，是 `font:inherit` 把 body
   的 `line-height:1.6` 也一併帶進來（`font` shorthand 的 inherit 涵蓋
   line-height，後面單獨覆寫的只有 font-size），16px×1.6＝25.6px 的行高
   撐出一顆比視覺需要大一截的行內框，跟旁邊 22px 的「家」圖示、12px 的
   label 不成比例。改法只動 line-height／padding 這兩個不影響 font-size 的
   屬性——line-height 不是 iOS 判斷聚焦放大的依據（那條規則只看 font-size
   computed value），把它收緊到 1.15（貼近字級本身的自然行高）就夠讓框變
   小，不用動用 transform:scale() 這種要另外補償版面寬度、風險更高的手段。 */
#start{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2); border-radius:999px;
  padding:2px 7px; font:inherit; font-size:16px; line-height:1.15; font-family:var(--mono);
  cursor:pointer; color-scheme:light;
}
#start:hover{border-color:var(--accent)}
#start:focus{outline:1px solid var(--accent); border-color:var(--accent)}
/* 瀏覽器內建的時鐘圖示预設是純黑（亮色）／純白（設 color-scheme:dark 之後）。
   opacity 混色：圖示疊在 #start 自己的底色（var(--bg)）上方，算出來的表觀色要
   落在 var(--ink3) 附近——兩個主題的底色／目標色代入算出的透明度都落在 ~0.4，
   所以两边共用同一個數字。只在 Chromium 系有效（-webkit- 專屬偽元素），
   Firefox／Safari 目前沒有對應的可調 hook，做不到就是做不到。 */
#start::-webkit-calendar-picker-indicator{ cursor:pointer; filter:opacity(.42); }
:root[data-theme="dark"] #start{ color-scheme:dark; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #start{ color-scheme:dark; } }
/* 站數多的時候不讓清單無限長高——面板會蓋掉底下的景點清單，就沒辦法連續挑點。
   捲的是站列表本身，出發時間、導航按鈕與說明都留在外面不動。 */
.plan{display:flex; flex-direction:column; margin:6px 0 10px; max-height:38vh; overflow-y:auto; overscroll-behavior:contain}
.plan .end{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink3)}
.plan .end.late{color:var(--warn)}
.plan .end .home, .setrow .home{
  flex:none; width:22px; height:22px; border-radius:999px; border:1px dashed var(--line2);
  display:grid; place-items:center; font-size:10px; color:var(--ink3);
}
.plan .end.back{border-top:1px solid var(--line); padding-top:7px; color:var(--ink)}
.plan .leg{display:inline-flex; align-items:center; font-size:11.5px; color:var(--ink3); font-family:var(--mono); white-space:nowrap}
/* .mi／.caric／.hgic 原本鎖在 .row .m 底下，現在 tooltip（.tt i）也要用同一組
   icon＋文字的小容器，所以拿掉範圍限制、變成共用類別。.leg 場景（行程列）的車子
   icon 要大一點、還要貼齊文字，用 .leg .caric 疊加尺寸與 margin，其餘（stroke 等）
   繼續吃這裡的基礎值，不重複宣告。 */
.mi{display:inline-flex; align-items:baseline; gap:3px}
/* align-self:center 對齊的是彈性行的中心，量出來比中文字的視覺中線低約 0.61px
   （12px 字級下）。用 em 相對量修正，行程面板與地圖卡片字級不同也跟著縮放。 */
.mi .caric, .mi .hgic{align-self:center; position:relative; top:-0.05em}
.caric{width:15px; height:8px; flex:none; stroke:currentColor; fill:none; stroke-width:5;
       stroke-linecap:round; stroke-linejoin:round}
.hgic{width:10px; height:10px; flex:none; stroke:currentColor; fill:none; stroke-width:1.3;
      stroke-linecap:round; stroke-linejoin:round}
.leg .caric{width:16px; height:8px; margin-right:3px; vertical-align:-1px}
/* 每一站是「可橫滑刪除」的外層 .stopwrap（分隔線、滑動背景都掛在這層，滑動時
   維持原位）＋裡面實際位移的 .stop（三欄 grid：編號＋名字＋車程／時間窗＋停留／
   操作鈕，順序跟窄螢幕兩行版一致，只是窄螢幕把後兩欄疊起來）。 */
.stopwrap{position:relative; border-top:1px solid var(--line)}
.stop{
  display:grid; grid-template-columns:var(--leadw,max-content) 1fr auto; column-gap:10px;
  align-items:center; padding:5px 0; background:var(--panel); position:relative; z-index:1;
  touch-action:pan-y; cursor:grab; user-select:none; -webkit-touch-callout:none;
}
/* 名字／±／把手／↑↓×這些本身可點的元件維持一般游標，不是可拖曳區域。 */
.stop .nm, .stop .stepper button, .stop .ops button{cursor:pointer}
.stopwrap.dragging{z-index:5}
.stopwrap.dragging .stop{box-shadow:0 4px 14px rgba(0,0,0,.18); border-radius:8px; cursor:grabbing}
.stopwrap.drag-over-top{box-shadow:inset 0 2px 0 var(--accent)}
.stopwrap.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent)}
/* 2026-08-22（本人真機複驗批次任務 0）：改用主題強調色 --accent（跟本檔案
   頭「強調色只有一個」的設計原則一致），上一輪加的 --danger 紅色棄用——本人
   這輪回報紅色跟整體低飽和暖灰色系還是不搭，--accent 本身就是這個介面唯一
   的強調色，滑刪揭示用它跟其他強調用途（選取態、進度條等）視覺語彙一致。
   --danger 變數定義保留在 :root（不刪，未來如果需要破壞性動作的獨立警示色
   可以再用），只是 .swipebg 不再引用它。 */
.swipebg{
  position:absolute; inset:0; border-radius:8px; background:var(--accent); color:var(--on-accent);
  display:flex; align-items:center; justify-content:flex-end; gap:6px; padding:0 14px;
  font-size:12.5px; font-weight:600; opacity:0; pointer-events:none;
}
.swipebg svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.5;
             stroke-linecap:round; stroke-linejoin:round}
.stopwrap.swiping .swipebg, .stopwrap.del-armed .swipebg{opacity:1}
.stop .lead{display:flex; align-items:center; gap:4px; min-width:0; overflow:hidden}
.stop .no{
  flex:none; width:22px; height:22px; border-radius:999px; background:var(--accent); color:var(--on-accent);
  font-size:11px; font-weight:700; text-align:center; line-height:22px; font-family:var(--mono);
}
.stop .nm{border:0; background:none; padding:0; text-align:left; font-size:14px; font-weight:600; white-space:nowrap}
.stop .nm:hover{color:var(--accent)}
.stop .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}
.stop .win{font-size:12px; color:var(--ink2); font-family:var(--mono); white-space:nowrap}
.stop .warn{font-size:11.5px; color:var(--warn)}
/* 外框／底色比照 .chip；.stepper .v 的字級（11.5px）刻意比 .chip 小，維持不動
   ——這是有意的設計，讓這顆膠囊不占太多版面。 */
.stepper{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:1px 2px}
.stepper button{border:0; background:none; color:var(--ink3); width:20px; height:20px; border-radius:999px; line-height:1; font-size:14px; padding:0}
.stepper button:hover{color:var(--accent)}
.stepper .v{font-size:11.5px; color:var(--ink2); font-family:var(--mono); min-width:52px; text-align:center; white-space:nowrap}
.stop .ops{flex:none; display:flex; align-items:center; gap:2px}
.stop .ops .grip{
  display:grid; place-items:center; width:20px; height:28px; color:var(--ink3);
  cursor:grab; touch-action:none; flex:none;
}
.stop .ops .grip svg{width:13px; height:13px; fill:currentColor}
.stop .ops .grip:active{cursor:grabbing}
.stop .ops button{
  border:1px solid var(--line); background:var(--bg); color:var(--ink2);
  width:28px; height:28px; border-radius:999px; line-height:1; font-size:12px; padding:0;
}
.stop .ops button:disabled{color:var(--line2); cursor:default}
.stop .ops button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
/* 兩欄疊起來的窄版：編號＋名字＋車程一行；時間窗＋停留跟操作鈕（含拖曳把手）
   同一行、操作鈕靠右——不再讓操作鈕跨兩行占掉一整欄寬度。車程原本要藏公里數
   讓位，現在車程換成 icon 省出寬度，兩行都留得住公里數了。
   是否套用這個窄版，不是靠固定的螢幕寬度斷點，是 alignLeadColumn() 量完
   「這一輪的內容」實際需不需要才決定（見該函式）——單一斷點寬度沒辦法同時
   應付「一般短名字」與「極端長名字＋車程」兩種內容，量了才準。 */
.trip.stacked .stop{
  grid-template-columns:1fr auto;
  grid-template-areas:"lead lead" "meta ops";
  row-gap:4px;
}
/* 極端長名字（如 24 字的店名）加上車程還是可能擠不下一行——寧可讓 leg
   整組（icon＋分鐘＋公里）掉到自己的第二行，也不要被 overflow 默默切字。
   一般長度的名字這條不會觸發，還是穩穩一行。 */
.trip.stacked .stop .lead{grid-area:lead; flex-wrap:wrap; overflow:visible}
.trip.stacked .stop .nm{white-space:normal}
/* 第二行擠不下時（如「停 2 小時 30 分」這種長停留標籤＋車程窗口一起），先讓
   .meta 自己內部換行，不動 .ops——寧可第二行變高，也不要橫向溢出或切字。 */
.trip.stacked .stop .meta{grid-area:meta; min-width:0}
.trip.stacked .stop .ops{grid-area:ops; align-self:center; justify-self:end}
.trip.stacked .stop .ops .grip{width:18px}
.trip.stacked .stop .ops button{width:24px; height:24px}
.trip.stacked .stop .ops{gap:1px}
.trip.stacked .stepper .v{min-width:46px}
/* gap 6 而不是 8：375px 手機上這排剛好差 3px 就要換行、多吃掉一整行版面。 */
.trip .go{display:flex; gap:6px; flex-wrap:wrap; padding-bottom:4px}
.trip .go a.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.trip .go a.primary:hover{color:var(--on-accent); border-color:var(--accent)}
/* 說明只是輔助資訊的開關，不該跟導航／分享那幾顆平起平坐搶注意力，所以不畫外框。 */
.trip .go .infobtn{border:0; background:none; color:var(--ink3); padding:4px 3px; display:grid; place-items:center; margin-left:auto}
.trip .go .infobtn:hover{color:var(--accent)}
.trip .go .infobtn[aria-expanded=true]{color:var(--accent)}
.trip .tfoot{font-size:11.5px; color:var(--ink3); margin:8px 0 0; line-height:1.7}

/* 地圖 */
.gw{font-family:inherit; max-width:230px; line-height:1.5}
.gw b{font-size:14px}
.gw span{display:block; font-size:12px; color:#555; margin-top:2px}
.hubpin{
  width:22px !important; height:22px !important; margin:-11px 0 0 -11px !important;
  display:grid; place-items:center; border-radius:999px;
  background:#7B57A8; border:2.5px solid var(--panel); box-shadow:0 1px 5px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .hubpin{background:#B79BDB}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hubpin{background:#B79BDB} }
.hubpin svg{width:12px; height:12px; stroke:var(--panel); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.pin{
  position:relative; display:grid; place-items:center; width:26px !important; height:26px !important;
  margin:-13px 0 0 -13px !important; border-radius:999px; background:var(--panel);
  border:1.5px solid currentColor; box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.pin svg{width:15px; height:15px; margin:0; stroke-width:1.6}
/* planpin 不叫 plan：.plan 是行程站列表的 class（max-height + overflow-y:auto），
   同名的話圖釘會吃到它的 overflow，把掛在 top:-6px 的編號徽章整個裁掉。 */
.pin.on, .pin.planpin{outline:3px solid var(--accent); outline-offset:1px}
/* 滑鼠移到清單那一列時，地圖上對應的點要有反應。圓點靠 setStyle 放大，
   行程站是 divIcon 沒有那支 API，改用 class 做等效的視覺強調。 */
.leaflet-marker-icon .pin, .leaflet-marker-icon .dotpin{transition:transform .12s}
.leaflet-marker-icon.hot .pin, .leaflet-marker-icon.hot .dotpin{transform:scale(1.3)}
/* 行程中的點：不管圓點／圖示模式都要放大＋掛編號徽章。徽章樣式比照 .stop .no
   （accent 底、白字、等寬字型）。圓點模式原本是 SVG circleMarker，畫不出文字
   子節點，所以行程中的點改用跟圖示模式同一種 divIcon（.dotpin），兩種模式
   才能共用同一顆編號徽章。 */
.plan-badge{
  position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 3px;
  border-radius:999px; background:var(--accent); color:var(--on-accent);
  font-family:var(--mono); font-size:10px; font-weight:700; line-height:16px; text-align:center;
  box-shadow:0 0 0 1.5px var(--panel); pointer-events:none;
}
.dotpin{
  position:relative; width:20px !important; height:20px !important;
  margin:-10px 0 0 -10px !important; border-radius:999px;
  border:2.5px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.32);
}
.leaflet-container{font:inherit}
.leaflet-popup-content{margin:9px 12px; font-size:13px; line-height:1.5}
.leaflet-tooltip.tt{
  background:var(--panel); color:var(--ink); border:1px solid var(--line2); border-radius:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.16); font-size:12.5px; padding:5px 9px; line-height:1.45;
}
.leaflet-tooltip.tt::before{display:none}
.leaflet-tooltip.tt b{font-size:13.5px}
.leaflet-tooltip.tt i{font-style:normal; color:var(--ink3); display:flex; align-items:baseline; flex-wrap:wrap; font-size:11.5px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85)}
}
:root[data-theme="dark"] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85)}

@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
<!-- PWA（2026-08-22 掛載，資產在 docs/hsinchu-map/pwa/，見 HANDOFF §6.16）。
     相對路徑：發布時 manifest/sw.js/icons 與 index.html 同層（publish.py 負責複製）。 -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#5c5449">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="新竹一日">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <!-- id="logo" 供下面「真機診斷模式」長按偵測用（長按 3 秒開關，standalone
         沒網址列不能走 query 參數，見診斷模式那段 script）。 -->
    <div class="logo" id="logo">新竹一日</div>
    <div class="seg" id="views">
      <button data-v="map" aria-pressed="true">地圖</button>
      <button data-v="list" aria-pressed="false">清單</button>
    </div>
    <input id="q" type="search" placeholder="搜尋：步道、瀑布、溫泉…">
    <button id="theme" title="切換明暗" aria-label="切換明暗"></button>
    <div class="tally" id="tally"></div>
  </header>

  <div class="main" id="main">
    <aside class="panel" id="panel"></aside>
    <!-- id="stage" 供下面「真機診斷模式」浮層量測用（本人 2026-08-22 橫向
         留白回報後新增，見 HANDOFF §6.27）；.stage 本身選擇器不受影響（class
         照舊）。 -->
    <div class="stage" id="stage">
      <div id="map"></div>
      <div class="mapnote" id="mapnote"></div>
      <div class="mapmsg" id="mapmsg"></div>
      <div class="mapoverlay">
        <div class="mapbtns" id="mapbtns"></div>
        <div class="mapcard" id="mapcard"></div>
      </div>
    </div>
  </div>
</div>
<div class="trip" id="trip"></div>
<button id="totop" class="totop" type="button" aria-label="回到清單頂端" title="回到清單頂端">
  <svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>

枕頭而得名，海拔 641 公尺。清代與日治時期都曾在山頂平台架設砲台鎮壓當地泰雅族部落，是大嵙崁事件與枕頭山事件的古戰場。稜線步道穿行相思林與桂竹林，可眺望三民聚落與北橫公路。", "note": "免門票。山徑原始，部分路段土徑濕滑，建議穿登山鞋。台7線 12.3K 或 14.5K 兩處可接產業道路上登山口，還要再步行 1–2 公里才到正式步道口。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=619", "route": "beiheng", "stay_h": 4.0, "drive_min": 65, "total_h": 6.2, "season_months": [], "id": "p9705818f", "nav": [24.81418, 121.3316]}, {"name": "角板山公園", "town": "桃園市復興區", "lat": 24.81397, "lng": 121.35068, "theme": "heritage", "kind": "歷史公園", "diff": "散步", "time": "含行館、梅園、戰備隧道繞行約 1.5–2 小時", "drive": "從新竹市區約 65 分", "desc": "台地上原為泰雅族部落舊址，蔣中正 1960 年闢建角板山行館作為北部行館之一。園內思親亭可俯瞰大漢溪河谷，另有戰備隧道、樟腦收納所史蹟，與近 300 棵梅樹的梅園——是北台灣最大的梅園之一。", "note": "行館與公園免門票；戰備隧道開放時段以現場公告為準。假日人潮多、車位有限，建議提早到。", "season": "12 月到隔年 1 月梅花季；秋季部分區域楓紅。", "source": "https://www.scenic.tycg.gov.tw/cp.aspx?n=9507", "route": "beiheng", "stay_h": 2.0, "drive_min": 65, "total_h": 4.2, "season_months": [1, 12], "id": "pb206995f"}, {"name": "拉拉山國家森林遊樂區", "town": "桃園市復興區", "lat": 24.711290529794812, "lng": 121.43303330990288, "theme": "trail-mountain", "kind": "國家森林遊樂區", "diff": "散步", "time": "遊客中心與巨木步道約 2–3 小時；四條步道走完可達整天", "drive": "從新竹市區約 120 分", "desc": "桃園復興區的森林遊樂區，海拔 1,400–2,130 公尺，園區內有多達 22 株珍貴的紅檜巨木群，最老一棵樹齡逾 2,800 年，另有四稜神木等巨木景觀；四條難易不同的步道可選，短則繞遊客中心周邊，長則接巨木群步道走完全程。", "note": "門票全票 150 元、半票 75 元、優待票 10 元（平假日均同）；園區開放 06:00–17:00，除夕休園一日，遊客中心服務 08:00–17:00；山路狹窄，不開放甲乙類客車與保母車，進入車輛限車長 6 公尺、車寬 2 公尺；管理站電話 03-3912142。", "season": "", "source": "https://recreation.forest.gov.tw/forest/RA?typ_id=0200005", "route": "beiheng", "stay_h": 3.0, "drive_min": 120, "total_h": 7.0, "season_months": [], "id": "p2296bb13", "gmap": "336桃園市復興區華陵里巴陵207號拉拉山國家森林遊樂區 遊客中心", "nav_target": "336桃園市復興區華陵里巴陵207號拉拉山國家森林遊樂區 遊客中心"}, {"name": "東眼山國家森林遊樂區", "town": "桃園市復興區", "lat": 24.83126, "lng": 121.40794, "theme": "trail-mountain", "kind": "森林遊樂區", "diff": "健行", "time": "自導式步道環一圈約 2 小時；加走東滿步道等路線可安排 4–6 小時", "drive": "從新竹市區約 85 分", "desc": "海拔約 1212 公尺的台灣小百岳，日治時期是主要伐木基地，現轉型為柳杉人工林生態園區，主步道多為平緩土徑與木棧道。園內另有全長 7.36 公里的東滿步道，可一路連通滿月圓國家森林遊樂區。", "note": "需購票：平日全票 80 元、假日 100 元，半票 50 元。開放平日 08:00–17:00、例假日 07:00–17:00，除夕休園。小型車停車另計（平日 100 元、假日 150 元）。", "season": "楓紅季 11–12 月。", "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200003", "route": "beiheng", "stay_h": 6.0, "drive_min": 85, "total_h": 8.8, "season_months": [11, 12], "id": "p36a266ff"}, {"name": "小烏來天空步道", "town": "桃園市復興區", "lat": 24.79033, "lng": 121.37548, "theme": "trail-near", "kind": "玻璃步道", "diff": "健行", "time": "天空步道停留約 20–30 分；含天空繩橋、風動石步道全程約 1.5–2 小時", "drive": "從新竹市區約 70 分", "desc": "突出崖邊的 U 形玻璃廊道可直視腳下的小烏來瀑布，另有全國最長的繩索吊橋「天空繩橋」與著名的風動石景觀。園區海拔約 650 公尺，四周是陡峭溪谷地形。", "note": "**採總量管制與時段預約制**：每日限額、每半小時一梯次，開放 08:00–12:00 與 13:00–17:00（中午清潔整備不開放）。線上預約於入園前 2–30 天申請，也可當日到石板廣場現場候補。每週一休園（遇連續假日順延一日）。出發前務必上官方系統確認名額。", "season": "", "source": "https://www.taiwan.net.tw/m1.aspx?sNo=0001107&id=A12-00239", "route": "beiheng", "stay_h": 2.0, "drive_min": 70, "total_h": 4.3, "season_months": [], "id": "p5daf103d"}, {"name": "打鐵寮古道", "town": "桃園市大溪區", "lat": 24.85336118209008, "lng": 121.29799705455716, "theme": "trail-near", "kind": "古道", "diff": "健行", "time": "約 3 小時", "drive": "從新竹市區約 55 分", "route": "beiheng", "desc": "清代大溪往復興的挑運舊路，日治時期用來運樟腦。沿線有三座糯米橋（濟安橋、東興橋、太平橋），溪谷段林蔭密、石階與土路交錯，是大溪這一帶最完整的一條古道。", "note": "登山口在三層地區、慈康宮附近；可以只走到東興橋折返，也可以接白石山，兩種走法時間差很多。", "season": "", "source": "", "coord_conf": "high", "stay_h": 3.0, "drive_min": 55, "total_h": 4.8, "season_months": [], "id": "pf30e665c"}, {"id": "p4ef79e58", "name": "白石山", "town": "桃園市大溪區", "theme": "trail-near", "kind": "步道", "lat": 24.8527, "lng": 121.3176, "coord_conf": "high", "diff": "健行", "time": "單走 4.5 公里約 1 小時 45 分；接打鐵寮古道 O 形 3–4 小時", "drive": "從新竹市區約 60 分", "desc": "山頂一整片砂岩壁長約 700 公尺、垂直落差數十公尺，末段要沿岩稜壁橫渡；打鐵寮古道段是日治時期樟腦採集的挑運舊路。", "season": "春季金毛杜鵑；7–8 月艷紅鹿子百合", "note": "兩個起登點：桃118鄉道、百吉隧道南口往復興方向約 1.7 公里處，或從白石埤起登。岩稜段雨後濕滑。打鐵寮古道另有獨立條目，那是可以分開走的另一趟行程。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1027", "far": false, "route": "beiheng", "stay_h": 4.0, "drive_min": 60, "total_h": 6.0, "season_months": [7, 8], "gmap": "白石山（接打鐵寮古道）", "nav": [24.8454, 121.31705]}, {"name": "百吉林蔭步道", "town": "桃園市大溪區", "lat": 24.83898, "lng": 121.30729, "theme": "trail-near", "kind": "林蔭步道", "diff": "散步", "time": "全長約 2.6 公里，單程約 1 小時、原路折返約 2 小時", "drive": "從新竹市區約 55 分", "desc": "沿石龜坑山腰整建的舊時越嶺道，柏油路面平緩好走，早年是大溪通往角板山唯一的山路。西入口就在後慈湖南管制門對面，往東翻過稜線後接近舊百吉隧道，東端終點在石龜坑橋。", "note": "免門票。林蔭遮蔭度高但展望有限。可與舊百吉隧道、後慈湖排在同一站順遊（後慈湖需另外預約入園）。", "season": "4–5 月螢火蟲季。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=519", "route": "beiheng", "stay_h": 2.0, "drive_min": 55, "total_h": 3.8, "season_months": [4, 5], "id": "p6e4f3a10"}, {"id": "pee43d4ea", "name": "石龜坑古道（百吉林蔭步道）", "town": "桃園市大溪區", "theme": "trail-near", "kind": "古道", "lat": 24.8347, "lng": 121.3039, "coord_conf": "high", "diff": "散步", "time": "林蔭步道段來回約 1.5 小時；接石龜坑山、白石山 O 形 4–5 小時", "drive": "從新竹市區約 55 分", "desc": "路線本體是廢棄的舊桃118鄉道，順山稜緩上、路面土石、林相完整；石龜坑山 485 公尺山頂立一顆「總督府」基石，位在林間無展望。清代至日治是大溪往角板山的幹線。西入口旁就是舊百吉隧道——1944 年日治時期開鑿供輕便車與行人通行，1969 年拓寬通車，1993 年新百吉隧道啟用後封閉了 14 年，2007 年整修重新開放；洞內平整涼爽，南洞口留有前台灣省主席黃杰題字「北段橫貫公路」，走步道前後順道進去看一趟。", "season": "", "note": "停車在百吉隧道口。可與湳仔溝古道（總督府步道）串走。", "source": "https://hiking.biji.co/index.php?q=news&act=info&id=18499", "far": false, "route": "beiheng", "stay_h": 5.0, "drive_min": 55, "total_h": 6.8, "season_months": [], "gmap": "335桃園市大溪區百吉林蔭步道-西入口", "nav_target": "335桃園市大溪區百吉林蔭步道-西入口"}, {"name": "蝙蝠洞", "town": "桃園市復興區", "lat": 24.83814, "lng": 121.35027, "theme": "trail-near", "kind": "天然洞穴", "diff": "健行", "time": "蝙蝠洞到觀音洞的連通步道約 2 公里，來回約 2 小時", "drive": "從新竹市區約 65 分", "desc": "三民溪谷間天然形成的砂岩洞穴，洞口高約 20 公尺、寬約 50 公尺、深約 20 公尺，早年洞內棲有大量蝙蝠而得名。市府已完成觀音洞步道連通蝙蝠洞的工程，兩點現在能一次串走。", "note": "免門票。步道沿溪岸修築，部分路段濕滑，雨後注意落石與溪水暴漲。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1062", "route": "beiheng", "stay_h": 2.0, "drive_min": 65, "total_h": 4.2, "season_months": [], "id": "p3ccd1c6b"}, {"name": "觀音洞橋", "town": "桃園市復興區", "lat": 24.83538, "lng": 121.35571, "theme": "trail-near", "kind": "溪谷步道", "diff": "健行", "time": "觀音洞步道全長約 2 公里，單程約 1 小時", "drive": "從新竹市區約 65 分", "desc": "觀音洞步道沿三民溪上游溪谷而建，串連秋山清泉岩觀音洞與三民蝙蝠洞。步道中段的觀音洞橋橋面已改鋪鐵板，走上去會隨腳步晃動並發出聲響，是全程最有記憶點的一段。", "note": "免門票。鐵板橋面雨天濕滑要小心。建議與蝙蝠洞排在同一趟走完整條溪谷步道。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1062", "route": "beiheng", "stay_h": 1.0, "drive_min": 65, "total_h": 3.2, "season_months": [], "id": "pe2b887c6"}, {"name": "鐵木瀑布（優霞雲瀑布）", "town": "桃園市復興區", "lat": 24.81381, "lng": 121.38484, "theme": "water", "kind": "瀑布", "diff": "健行", "time": "停車處步行約 5–10 分鐘即達，來回約 30–40 分", "drive": "從新竹市區約 70 分", "desc": "位於霞雲里庫志道路旁，因泰雅族頭目 Temu 首先發現而稱鐵木瀑布，又因鄰近優霞雲部落也稱優霞雲瀑布。落差不算高但水量豐沛、峽谷地形陡峭，步行距離短，親子也能輕鬆到達。", "note": "免門票、免費停車。步道短但溪石濕滑，雨後水量暴漲時勿靠近戲水。", "season": "夏季戲水消暑。", "source": "https://fullfen.tw/youxiayun-waterfall/", "route": "beiheng", "stay_h": 0.67, "drive_min": 70, "total_h": 3.0, "season_months": [6, 7, 8], "id": "p7b98017b"}, {"id": "pf34c63fb", "name": "阿姆坪（石門水庫東岸）", "town": "桃園市大溪區", "theme": "water", "kind": "水庫", "lat": 24.81779, "lng": 121.31181, "coord_conf": "high", "diff": "開車", "time": "停車走 40 分–1 小時", "drive": "從新竹市區約 60 分", "desc": "環湖公路東端的湖畔營地與碼頭，湖面在這裡收窄成峽谷狀，是少數能從水面高度看石門水庫的角度；往薑母島的渡船也從這一帶出發。", "season": "枯水期水位下降時湖岸露出大片礫灘，景觀差很多。", "note": "從大溪走台 7 乙轉環湖路，路窄彎多、大車不易會車；渡船班次不固定，要現場問；水域禁止戲水。", "source": "https://zh.wikipedia.org/wiki/石門水庫_(臺灣)", "far": false, "route": "beiheng", "stay_h": 1.0, "drive_min": 60, "total_h": 3.0, "season_months": []}, {"name": "霞雲生態池", "town": "桃園市復興區", "lat": 24.81163, "lng": 121.38675, "theme": "water", "kind": "生態池", "diff": "散步", "time": "池畔繞行約 20–30 分", "drive": "從新竹市區約 70 分", "desc": "官方多稱「嘎嘎生態池」，因夜晚蛙鳴此起彼落而得名。位於霞雲國小前庫志道路約 400 公尺處，池水因水生植物與微生物作用呈現特別的水色。與鐵木瀑布同在庫志溪沿線，可安排同一趟。", "note": "免門票。生態敏感，請勿下水或餵食。", "season": "", "source": "https://travel.tycg.gov.tw/zh-tw/travel/attraction/1182", "route": "beiheng", "stay_h": 0.5, "drive_min": 70, "total_h": 2.8, "season_months": [], "id": "pef834993"}, {"id": "pa07d3f31", "name": "回咖啡", "town": "新竹市香山區", "theme": "cafe", "kind": "咖啡", "lat": 24.7975562, "lng": 120.95192899999999, "coord_conf": "high", "diff": "開車", "time": "約 45 分", "drive": "從新竹市區約 10 分", "desc": "在地咖啡／茶飲點，備註：開心果巴斯克。", "season": "", "note": "備註：開心果巴斯克", "source": "", "far": false, "route": "coast-17km", "stay_h": 0.75, "drive_min": 10, "total_h": 1.1, "season_months": []}, {"id": "p91705bb8", "name": "示畐", "town": "新竹市香山區", "theme": "cafe", "kind": "咖啡", "lat": 24.794681699999998, "lng": 120.9451089, "coord_conf": "high", "diff": "開車", "time": "約 45 分", "drive": "從新竹市區約 10 分", "desc": "在地咖啡／茶飲點。", "season": "", "note": "", "source": "", "far": false, "route": "coast-17km", "stay_h": 0.75, "drive_min": 10, "total_h": 1.1, "season_months": []}, {"id": "p3a892109", "name": "飛帆生活藝術·人文·咖啡館", "town": "新竹市香山區", "theme": "cafe", "kind": "咖啡", "lat": 24.7195, "lng": 120.9194, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "香山中華路（台1線）邊的人文咖啡館，往西走就是香山濕地賞蟹步道與香山車站（1928 年的日式木造車站），適合排在海線行程的中段。", "season": "香山濕地退潮時才看得到招潮蟹，需先查潮汐", "note": "台1線邊，注意迴轉動線", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": []}, {"id": "pc3a06666", "name": "十七公里海岸線自行車道", "town": "新竹市北區", "theme": "coast", "kind": "自行車道", "lat": 24.84406, "lng": 120.92516, "coord_conf": "high", "diff": "散步", "time": "單程 17.5 公里、高度落差僅 3 公尺；騎乘來回約 3 小時，全程步行 4 小時 25 分", "drive": "從新竹市區約 15 分", "desc": "從漁港生態公園一路鋪到鹽水港溪南岸，3.5 公尺車道與 1.5 公尺人行道分開走，中途跨港北運河、客雅溪、三姓公溪、鹽水港溪等五座橋，串起看海公園、海天一線、港南運河、紅樹林、賞蟹步道到南港賞鳥區。", "season": "全程無遮蔽、正對西面海風；10–3 月東北季風季由北往南騎順風，回程逆風要多留半小時。", "note": "南寮與港南都有租車店；沿線便利商店少，帶水；全線無下水點，海側都是堤岸與消波塊。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "stay_h": 4.0, "drive_min": 15, "total_h": 4.5, "season_months": [1, 2, 3, 10, 11, 12]}, {"id": "pf3c5a336", "name": "南寮漁港與魚鱗天梯", "town": "新竹市北區", "theme": "coast", "kind": "海岸", "lat": 24.84694, "lng": 120.9225, "coord_conf": "high", "diff": "開車", "time": "港區加魚鱗天梯散步 1–2 小時", "drive": "從新竹市區約 20 分", "desc": "91 公頃的二級漁港，看點是浪形屋頂的波光市集與魚鱗天梯——一整片階梯狀消波工事，退潮時能走下石階看堤外潮間帶。十七公里海岸線自行車道從這裡起算，租車站就在停車場旁。", "season": "面西北，日落全年落在海上；秋冬東北季風最強，新竹風箏節就是借這股風在漁港旁草地辦的。", "note": "停車每小時 30 元，假日第一停車場常滿；波光市集週四至週日 11:00–20:00；港區與魚鱗天梯都不可游泳，石階濕滑、漲潮勿下。", "source": "https://zh.wikipedia.org/wiki/新竹漁港", "far": false, "route": "coast-17km", "stay_h": 2.0, "drive_min": 20, "total_h": 2.7, "season_months": [1, 2, 9, 10, 11, 12]}, {"id": "p93ffd9fa", "name": "海之聲", "town": "新竹市香山區", "theme": "coast", "kind": "海岸", "lat": 24.73789, "lng": 120.88347, "coord_conf": "high", "diff": "開車", "time": "停車走 30 分", "drive": "從新竹市區約 20 分", "desc": "南港里一條伸進海裡的長堤，走上去像走向海天交界，所以叫「天堂路」。但堤身被侵蝕多年，2022 年起已有大段坍塌中空——現在能做的是站在岸邊看堤與風機，不是走出去。", "season": "面西，日落落海；漲潮時海水會灌進堤身破口。", "note": "堤面有斷裂與中空段落，不要走上去；路邊空地停車，沒有廁所與商家；風大時砂石打臉。", "source": "https://linnote.com/sound-of-the-sea/", "far": false, "route": "coast-17km", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": []}, {"id": "pe01fe4bd", "name": "海天一線看海區", "town": "新竹市北區", "theme": "coast", "kind": "觀景", "lat": 24.8328, "lng": 120.9154, "coord_conf": "high", "diff": "開車", "time": "停車走 20–30 分", "drive": "從新竹市區約 20 分", "desc": "看海公園南邊約 400 公尺的堤岸觀景區，一條直線堤頂步道往海裡延伸，兩側是消波塊與泥灘。純堤岸、不能下水，但人比看海公園少，畫面也更空。", "season": "面西，日落全年落海；冬季東北季風時堤上風強到站不住。", "note": "停車格不多，多半停自行車道旁；堤面無護欄，浪大時勿靠邊緣。", "source": "https://bobbytravel.tw/17km/", "far": false, "route": "coast-17km", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 12]}, {"id": "p9da3c555", "name": "港南運河公園", "town": "新竹市香山區", "theme": "coast", "kind": "觀景", "lat": 24.81034, "lng": 120.9095, "coord_conf": "high", "diff": "散步", "time": "環運河散步約 1 小時", "drive": "從新竹市區約 25 分", "desc": "一條人工運河切進海岸防風林，水岸有木棧道、拱橋與看海平台，是十七公里車道中段唯一有樹蔭與座位的休息點。運河是內陸水域，海側仍是堤岸，不能下水。", "season": "冬季風被防風林擋掉大半，是這條線上少數不會被吹翻的段落；春夏傍晚蚊子多。", "note": "運河旁有免費停車場、公廁與自行車租借站；假日午後親子人潮集中在拱橋一帶。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [1, 2, 3, 4, 5, 6, 7, 8, 12]}, {"id": "pe8449a79", "name": "看海公園", "town": "新竹市北區", "theme": "coast", "kind": "觀景", "lat": 24.83616, "lng": 120.91843, "coord_conf": "high", "diff": "開車", "time": "停車走 20–40 分", "drive": "從新竹市區約 20 分", "desc": "自行車道北段的大草坡加觀景平台，堤外是消波塊與離岸風機——堤岸地形、沒有沙灘也沒有下水點。是從新竹市區最快能站到「看得到整片海」的位置。", "season": "正面朝西，冬季約 17:20、夏季約 18:40 日落直接落海；秋冬風大到草地上排隊放風箏。", "note": "小型停車場加路邊停車，假日傍晚易滿；堤上部分段落無護欄，帶小孩注意。", "source": "https://bobbytravel.tw/17km/", "far": false, "route": "coast-17km", "stay_h": 0.67, "drive_min": 20, "total_h": 1.3, "season_months": [1, 2, 6, 7, 8, 9, 10, 11, 12]}, {"id": "pf301a90c", "name": "豎琴橋", "town": "新竹市香山區", "theme": "coast", "kind": "自行車道", "lat": 24.74891, "lng": 120.90408, "coord_conf": "high", "diff": "散步", "time": "停車走 15–30 分（十七公里車道南端）", "drive": "從新竹市區約 20 分", "desc": "鹽水港溪口的斜張橋，白色主塔拉出扇形鋼索像一把豎琴，是十七公里海岸線的南端意象。橋下是紅樹林與泥灘，人比北段少很多。", "season": "日落時拍橋的剪影最好；冬季河口風強。", "note": "橋兩端都有停車空間；夜間有燈但周邊沒有商家與廁所。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 12]}, {"id": "ped8edd52", "name": "香山濕地賞蟹步道", "town": "新竹市香山區", "theme": "coast", "kind": "步道", "lat": 24.78313, "lng": 120.91434, "coord_conf": "high", "diff": "散步", "time": "步道全長 250 公尺，含等退潮約 1 小時", "drive": "從新竹市區約 15 分", "desc": "從堤岸伸進潮間帶的心型石滬造型棧道，全長 250 公尺，退潮時腳下整片泥灘是招潮蟹與和尚蟹大軍。只能走步道，泥灘禁止進入，不能下水。", "season": "退潮才有蟹；滿潮前後兩小時步道封閉，風速六級以上也封閉——冬季東北季風常中招，出發前先查潮汐與新竹市政府公告。", "note": "免費；開放 9:00–18:00、週一公休；停車在海山漁港側停車場，假日退潮時段人非常多。", "source": "https://bobbyworld.tw/2023-08-31-2508/", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 15, "total_h": 1.5, "season_months": [1, 2, 12]}, {"id": "p6f366fec", "name": "香山紅樹林公園", "town": "新竹市香山區", "theme": "coast", "kind": "觀景", "lat": 24.80811, "lng": 120.91788, "coord_conf": "high", "diff": "散步", "time": "棧道來回 30 分", "drive": "從新竹市區約 15 分", "desc": "客雅溪口的水筆仔林，架高木棧道穿林而過，退潮時泥灘上滿是招潮蟹與彈塗魚。堤岸與泥灘地形，不能下水，也不能走進灘地。", "season": "退潮前後兩小時才看得到蟹；夏季蚊子多，長袖比防曬重要。", "note": "自行車道旁有停車空間與觀景平台；木棧道濕滑。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [6, 7, 8]}, {"id": "ronghua-garden-dining", "name": "Ronghua Garden & Dining", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.8235007, "lng": 120.928781, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "在地餐飲點，備註：露營車早午餐。", "season": "", "note": "備註：露營車早午餐", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": []}, {"id": "p47b0a5e4", "name": "古今車用中蔬食餐廳", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.739176399999998, "lng": 120.93113989999999, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 25 分", "desc": "在地餐飲點。", "season": "", "note": "", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": []}, {"name": "同心豆花（香山大庄路）", "town": "新竹市香山區", "lat": 24.79043, "lng": 120.92696, "theme": "food", "kind": "豆花", "diff": "開車", "time": "約 20 分", "drive": "從新竹市區約 10 分", "desc": "香山大庄路上的豆花剉冰店，豆花軟硬適中、豆香濃郁，配料選項多（地瓜、芋頭、仙草、小薏仁、軟花生），是在地人常去的平價甜品店。注意「同心豆花」在新竹市東區西大路另有一家，兩者地址不同、不是同一間店面。", "note": "地址香山區大庄路66號，12:00–21:00，週六公休。", "season": "", "source": "https://blog.pklife.tw/2023/06/hsinchu-tong-xin.html", "gmap": "同心豆花", "route": "coast-17km", "stay_h": 0.33, "drive_min": 10, "total_h": 0.7, "season_months": [], "id": "pc1975bf9"}, {"id": "p8290d930", "name": "村落餐廳", "town": "新竹市北區", "theme": "food", "kind": "西班牙料理", "lat": 24.8482, "lng": 120.9293, "coord_conf": "high", "diff": "開車", "time": "約 1–1.5 小時", "drive": "從新竹市區約 15 分", "desc": "南寮舊港旁的西班牙鄉村風料理餐廳，兩層樓，二樓用餐區可眺望海景。主打西班牙海鮮燉飯（蛤蜊、鮮蝦、綜合海鮮）與義大利麵，燉飯鐵盤邊緣會微焦。距竹風漁市約 300 公尺，可以先逛漁市買現流、再過來吃燉飯。", "season": "夏季傍晚西曬強，看夕陽時間約 18:00–19:00", "note": "週二、週三公休；平日 11:30–21:30，假日 11:30–15:00、17:30–21:30。人多常客滿，建議先電話預約。寵物牽繩可入內。", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [6, 7, 8]}, {"name": "沒有名字的甜點專賣", "town": "新竹市香山區", "lat": 24.74324, "lng": 120.91536, "theme": "food", "kind": "甜點", "diff": "開車", "time": "約 40 分", "drive": "從新竹市區約 20 分", "desc": "藏在香山田園間、沒有招牌的透天民宅甜點店，主理的甜點師傅資歷超過 25 年，用日本國產小麥、北海道奶油與新鮮水果現做。招牌是彩虹水果捲、鮮芒果卡士達蛋糕、北海道原味生乳捲與檸檬奶油蛋糕，也接生日與彌月蛋糕客製。行政區雖屬香山，但實際位置離竹南公義路那幾家只有一公里，可以排同一趟。", "note": "地址香山區中華路六段331巷335號，平日 13:30–20:00、假日 10:30–20:00，週二公休，店家有停車位。", "season": "", "source": "https://bobowin.blog/noname/", "route": "coast-17km", "stay_h": 0.67, "drive_min": 20, "total_h": 1.3, "season_months": [], "id": "p9a770e5d"}, {"name": "竹風漁市-南寮漁產直銷中心", "town": "新竹市北區", "lat": 24.84808, "lng": 120.92547, "theme": "food", "kind": "漁產直銷中心", "diff": "散步", "time": "約 1–2 小時", "drive": "從新竹市區約 15 分", "desc": "新竹市府斥資逾四億改建的南寮漁港漁貨直銷中心，取代用了 29 年、2025 年 10 月拆除的舊館，2026 年 2 月重新開幕。館內分兩區：現撈海鮮生鮮市場約 86 攤，賣鮮魚、蝦蟹貝類、現切生魚片與乾貨；海味嘗鮮代客料理區約 14 家，可以買了現流海鮮直接請店家煮上桌。是可以逛著買、也能坐下來吃的市集，不是單一店家。走路五分鐘可到村落餐廳，兩點常排在同一趟南寮行程，也是十七公里海岸線自行車道的起點區。", "note": "生鮮市場區約 08:00–20:00、代客料理區約 10:00–22:00（單一來源，建議行前再確認）。代客料理的計價曾被消保官稽查要求落實價格標示，點餐前務必先確認秤重與計價方式。中午前後是漁船進港、海鮮最新鮮的時段。", "season": "", "source": "https://udn.com/news/story/7324/9297743", "route": "coast-17km", "stay_h": 2.0, "drive_min": 15, "total_h": 2.5, "season_months": [], "id": "p89d29978"}, {"id": "pffc05117", "name": "綠谷沙拉生菜園", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.744345046361232, "lng": 120.93901266792355, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "desc": "香山的生菜農場直營餐廳，現採生菜沙拉配自家料理，走的是產地到餐桌路線，適合想吃清爽一點的行程。", "season": "", "note": "地址：新竹市香山區五福路一段602巷120號；電話 0988-515-181；08:00–17:30", "source": "https://hsinchucitymuseum.hccg.gov.tw/home/zh-tw/store/1451", "far": false, "drive": "從新竹市區約 25 分", "route": "coast-17km", "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": []}, {"id": "p4a925fb6", "name": "長興釣蝦場", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.745898999999998, "lng": 120.90507699999999, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "在地餐飲點。", "season": "", "note": "", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": []}, {"name": "鷹王肉圓", "town": "新竹市香山區", "lat": 24.80852, "lng": 120.93375, "theme": "food", "kind": "肉圓", "diff": "開車", "time": "約 20 分", "drive": "從新竹市區約 15 分", "desc": "香山延平路上飄香近一甲子（民國 51 年創立）的肉圓老店，厚皮肉圓 Q 彈、內餡蔥肉，配獨門醬汁與蒜泥；旁邊攤位現灌現烤香腸、不加亞硝酸鹽，在地人多推薦肉圓配香腸。鐵皮屋搭建但內用空間乾淨，還保留早期推車攤販的餐車。", "note": "地址香山區延平路二段350號，10:30–19:00，週三公休。", "season": "", "source": "https://tenjo.tw/yingwang-meatball/", "route": "coast-17km", "stay_h": 0.33, "drive_min": 15, "total_h": 0.8, "season_months": [], "id": "p8fb565a6"}, {"id": "p79355a32", "name": "南十八尖山", "town": "新竹市香山區", "theme": "trail-near", "kind": "步道", "lat": 24.735, "lng": 120.8928, "coord_conf": "high", "diff": "散步", "time": "全長約 1.4 公里，主線加支線走完約 40 分", "drive": "從新竹市區約 25 分", "desc": "原名赤山、日治後曾作童軍營地，名字取自「在十八尖山之南」，但與市區十八尖山不同山系；碎石路面寬、配木欄杆，緊鄰十七公里海岸線，常與竹南崎頂子母隧道連走。", "season": "", "note": "入口在南港街；規模小、沿線無商店與廁所，停車靠路邊。行政區歸屬兩來源不一（維基記新竹市香山區、OSM 記苗栗竹南），實際在市縣界稜線上。", "source": "https://zh.wikipedia.org/zh-tw/%E5%8D%97%E5%8D%81%E5%85%AB%E5%B0%96%E5%B1%B1", "far": false, "route": "coast-17km", "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": []}, {"name": "新屋綠色走廊", "town": "桃園市新屋區", "lat": 24.96941, "lng": 121.01238, "theme": "coast", "kind": "自行車道", "diff": "散步", "time": "單程約 40 分；含租車與濱海路段來回約 2–3 小時", "drive": "從新竹市區約 35 分", "desc": "由綠蔭大道與濱海道路組成的海岸自行車道，單程約 4.2 公里，一端林蔭遮蔽、另一端連接海岸線，地勢平坦適合親子與初學者，沿途設有中繼站可補給休息，因茂密林蔭而有「龍貓隧道」之稱。", "note": "入口附近有多家租車店，單人腳踏車約每小時 100–150 元、親子協力車約 200–300 元。", "season": "全年皆宜，夏季林蔭遮陽效果佳。", "source": "https://myjourney.tw/xinwu-green-tunnel/", "route": "coast-north", "stay_h": 3.0, "drive_min": 35, "total_h": 4.2, "season_months": [6, 7, 8], "id": "p1604053c"}, {"id": "pabd968d4", "name": "新月沙灣", "town": "新竹縣竹北市", "theme": "coast", "kind": "沙灘", "lat": 24.86441, "lng": 120.93975, "coord_conf": "high", "diff": "散步", "time": "海濱步道約 1.5 公里，來回 1 小時", "drive": "從新竹市區約 20 分", "desc": "鳳山溪口北岸的新月形沙灘，是這一帶少數真正能踩沙、下水踏浪的地方；步道與海面幾乎沒有落差，直接接上潮間帶。有免費淋浴間、更衣室與沖腳池。", "season": "傍晚夕陽正對沙灘落海；夏季正午完全無遮蔽極曬，秋冬東北季風把沙吹得會打人。", "note": "地址竹北市鳳岡路五段 155 巷 68 號，免費停車場與公廁齊全；無救生員，只適合踏浪不宜游泳；夏季假日人潮多。", "source": "https://bobowin.blog/p4199/", "far": false, "route": "coast-north", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [1, 2, 6, 7, 8, 9, 10, 11, 12], "nav": [24.866237, 120.944249]}, {"name": "新豐紅樹林生態步道", "town": "新竹縣新豐鄉", "theme": "coast", "kind": "海岸", "diff": "散步", "time": "40 分", "drive": "從新竹市區約 25 分", "desc": "北台灣唯一水筆仔與海茄苳混生的紅樹林，8.5 公頃，約 400 公尺木棧道架在林中、枝葉合攏成綠色隧道，是全台唯一設觀賞步道的生態保護區。堤岸與泥灘地形，不能下水。", "note": "免費、24 小時開放，導航「新豐鄉池府路 156 號」，紅毛港遊憩區有停車場；棧道平緩，推車輪椅可行。", "season": "退潮時去才看得到蟹", "source": "https://bunnyann.tw/xinfeng/", "lat": 24.91026, "lng": 120.96915, "coord_conf": "high", "route": "coast-north", "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": [], "id": "p4d3bd668"}, {"id": "p321d35ac", "name": "永安漁港", "town": "桃園市新屋區", "theme": "coast", "kind": "海岸", "lat": 24.98913, "lng": 121.01257, "coord_conf": "high", "diff": "開車", "time": "停車逛 1–1.5 小時", "drive": "從新竹市區約 35 分", "desc": "全台唯一以客家人為主的漁港，港上跨一座觀海橋、入夜亮 LED，魚市是一棟龍蝦造型建築，漁獲以白鯧、土魠、小卷、烏魚為主。港區為堤岸不能下水，但北接新屋綠色走廊自行車道，木麻黃樹蔭下可以騎很久。", "season": "面西日落落海；冬季烏魚季魚市最熱鬧。", "note": "港區大型停車場，假日中午魚市人最多；綠色走廊入口可租自行車。", "source": "https://zh.wikipedia.org/wiki/永安漁港", "far": false, "route": "coast-north", "stay_h": 1.5, "drive_min": 35, "total_h": 2.7, "season_months": [1, 2, 12]}, {"name": "竹圍漁港", "town": "桃園市大園區", "lat": 25.11716, "lng": 121.24448, "theme": "coast", "kind": "漁港", "diff": "散步", "time": "約 2 小時", "drive": "從新竹市區約 55 分", "desc": "北台灣三大漁獲供銷重地之一，港區有漁產品直銷中心（一樓生鮮零售、二樓多家海鮮餐廳含代客料理）。地標紅色彩虹橋跨港而立，沿海岸步行約 15 分鐘可達造型特殊的豬鼻子沙灘（消波塊呈 8 字雙孔造型），可安排看飛機起降、吃海鮮、賞夕陽的複合行程。", "note": "港區有多處免費大型停車場。建議下午前往，可避開用餐尖峰並銜接夕陽時段。", "season": "", "source": "https://misshuan.tw/zhuwei-fishing-harbor/", "route": "coast-north", "stay_h": 2.0, "drive_min": 55, "total_h": 3.8, "season_months": [], "id": "p09438ed1"}, {"id": "p4bf67b9f", "name": "觀新藻礁與藻礁生態環境教室", "town": "桃園市新屋區", "theme": "coast", "kind": "海岸", "lat": 25.01633, "lng": 121.03681, "coord_conf": "high", "diff": "開車", "time": "停車走 30–60 分", "drive": "從新竹市區約 35 分", "desc": "約 370 公頃的藻礁生態系野生動物保護區，範圍從觀音區大潭電廠進水口南堤延伸到新屋永興、永安，含小飯壢溪與新屋溪口；退潮才露出那片殼狀珊瑚藻造的礁台，是本島保存最完整的一段。礁石鋒利，不能下水。", "season": "只有大退潮才看得到礁面，出發前務必查潮汐；冬季東北季風把海浪打上堤岸。", "note": "進入保護區範圍須於 7 日前向桃園市政府環保局申請（水質保護科 03-3386021 分機 1332）；不申請就只在堤岸與生態環境教室周邊看。路邊停車、免費。", "source": "https://tydep.tycg.gov.tw/cp.aspx?n=20010", "far": false, "route": "coast-north", "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [1, 2, 12]}, {"name": "觀音濱海休憩區", "town": "桃園市觀音區", "lat": 25.047211595625996, "lng": 121.07629494059435, "theme": "coast", "kind": "濱海休憩區／燈塔", "diff": "散步", "time": "約 1–1.5 小時", "drive": "從新竹市區約 45 分", "desc": "白沙岬燈塔所在的濱海休憩區。燈塔明治 31 年（1898）動工、明治 34 年（1901）啟用，磚石構造、塔高約 37 公尺，僅次於墾丁鵝鑾鼻燈塔，是台灣現存最完整的日治初期燈塔之一，2021 年指定為國定古蹟。園區有木棧道、小橋流水與百年苦楝樹，仿地中海風格的附屬建物是熱門拍照點，鄰近沙灘與潮間帶，可與觀音草漯沙丘一起排。", "note": "燈塔開放時間夏令（4–10 月）09:00–18:00、冬令（11–3 月）09:00–17:00，週一內部整理不開放；地址桃園市觀音區光明路216號，電話 03-4732249。免費入園，草地平整適合野餐。", "season": "", "source": "https://fullfenblog.tw/ty-baishajia-lighthouse/", "route": "coast-north", "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "pdfeab372", "gmap": "328003桃園市觀音區白玉里中興路469號觀音濱海休憩區", "nav_target": "328003桃園市觀音區白玉里中興路469號觀音濱海休憩區"}, {"name": "觀音草漯沙丘", "town": "桃園市觀音區", "lat": 25.07555722347115, "lng": 121.12669818674584, "theme": "coast", "kind": "沙丘地質公園", "diff": "散步", "time": "約 1–1.5 小時", "drive": "從新竹市區約 45 分", "desc": "全國首座沙丘地質公園，沿海岸線綿延約 8.1 公里，是台灣海岸線中保存最寬廣完整的沙丘地形，搭配一整排風力發電機，有「台版撒哈拉沙漠」之稱。沙丘上有百年張家古厝與門前的老無患子樹，黃昏沙丘與海連成一線、風車剪影很好拍。", "note": "室內的觀音草漯沙丘展示館有 7 大主題與互動體驗設施，可當雨天備案；沙地鬆軟，穿好走的鞋，退潮時可順遊觀音濱海遊憩區的潮間帶。", "season": "", "source": "https://www.taiwan.net.tw/m1.aspx?sNo=0001107&id=A12-00482", "route": "coast-north", "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "p975adcc8", "gmap": "328桃園市觀音區保障里觀音草漯沙丘", "nav_target": "328桃園市觀音區保障里觀音草漯沙丘"}, {"name": "許厝港濕地", "town": "桃園市大園區", "lat": 25.08733, "lng": 121.17625, "theme": "coast", "kind": "濕地", "diff": "散步", "time": "約 1.5–2 小時", "drive": "從新竹市區約 50 分", "desc": "內政部公告的國家級重要濕地，占地 961 公頃、縱長達 10.5 公里。河流水系發達、河口地形發育良好，是候鳥過境的重要棲地，現有鳥種近 200 種。園區設有濱海自行車道與景觀大橋，也是熱門的夕陽觀賞點。", "note": "免費開放。賞鳥建議帶望遠鏡，清晨 6–9 點與下午 3 點到天黑前是鳥類覓食活躍、較易觀察的時段。", "season": "最佳賞鳥季為每年 10 月到隔年 5 月冬候鳥過境期。", "source": "https://taoyuanbird.org.tw/", "route": "coast-north", "stay_h": 2.0, "drive_min": 50, "total_h": 3.7, "season_months": [5, 10], "id": "pecda9368"}, {"id": "p8d69c729", "name": "鳳坑沙灣（鳳坑漁港）", "town": "新竹縣新豐鄉", "theme": "coast", "kind": "海岸", "lat": 24.90449, "lng": 120.96664, "coord_conf": "high", "diff": "開車", "time": "停車走 30–40 分", "drive": "從新竹市區約 25 分", "desc": "數十座圓柱形消波塊一路排到海裡，像一排踏石延伸出去，被稱作「海之聲 2.0」。沙灘小、以礫石與堤岸為主，不適合下水；賣點是人少、安靜。", "season": "面西，黃昏斜光打在圓柱上最有戲；冬季東北季風直吹，體感很冷。", "note": "入口只有一塊碎石空地約可停 10–15 輛，假日搶手；沒有廁所商店；消波塊表面濕滑，不要跳上去。", "source": "https://travel.hsinchu.gov.tw/attraction/content/20YVPOB1vWb6", "far": false, "route": "coast-north", "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": [1, 2, 12]}, {"name": "鳳崎落日步道", "town": "新竹縣新豐鄉", "theme": "coast", "kind": "步道", "diff": "散步", "time": "全長 3 公里，來回約 2 小時", "drive": "從新竹市區約 20 分", "desc": "新豐與竹北交界，海拔 63–131 公尺，鋪面完善坡度平緩。沿途壕溝、碉堡、坑道等軍事遺跡，往西看南寮漁港、竹北平原與風機，天氣好看得到新竹機場的飛機。台灣百大必訪步道。", "note": "天德堂與蓮花寺兩個入口。", "season": "看夕陽抓日落前 1 小時，最佳點在鳳崎咖啡附近", "source": "http://egoldenyears.com/106581/", "lat": 24.8673, "lng": 120.9797, "coord_conf": "high", "route": "coast-north", "stay_h": 2.0, "drive_min": 20, "total_h": 2.7, "season_months": [], "id": "pfa5e3281"}, {
