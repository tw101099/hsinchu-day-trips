/* 行程面板是 position:fixed 貼在畫面下緣，展開時會蓋住地圖底部的資訊卡。把它
   超出「收合高度」的那一截量出來給 CSS，卡片就會自己往上讓。 */
function syncTripUp(){
  const el=document.getElementById("trip");
  if (!el) return;
  const h=el.getBoundingClientRect().height;
  // base＝.trip 收合時的真實高度，不能只讀 --barh（56px）常數：.trip 自己還有
  // env(safe-area-inset-bottom) 的 padding-bottom，standalone 模式那個值不是 0
  // （iPhone home indicator 約 34px），只用 --barh 當 base 會把這截 safe-area
  // 誤算成「展開多出來的高度」，即使行程站列根本沒展開也會把地圖左下角的浮動
  // 卡片／按鈕多推高一截——直接量 .head 實際高度＋.trip 自己的 padding-bottom
  // （getComputedStyle 會把 env() 解成真正的 px 值），跟收合時的 h 對齊，才能
  // 讓 --tripup 在收合狀態穩定算出 0。
  const head=el.querySelector(".head");
  const pad=parseFloat(getComputedStyle(el).paddingBottom)||0;
  const base=(head? head.getBoundingClientRect().height : 0)+pad;
  document.documentElement.style.setProperty("--tripup", Math.max(0, h-base)+"px");
}

/* 桌機三欄 vs. 窄螢幕兩欄疊起來，不是照死的螢幕寬度斷點切換——「編號＋名字＋
   車程」量出來的自然寬度會隨行程內容變（尤其是長店名），固定斷點在「內容剛好
   很長、螢幕剛好中等寬」時會兩頭落空：欄寬鎖太寬、右邊操作鈕被擠出可視範圍。
   改成每次都先照三欄量一次，量出來的「編號＋名字＋車程」欄寬＋中間欄最低可讀
   寬度＋操作鈕欄，若確定塞得進目前的行程列寬度才用三欄鎖寬對齊；塞不進就整個
   換成兩欄疊起來的窄版（.trip.stacked，見上面 CSS），內容自己決定要用哪種版面。 */
function alignLeadColumn(root){
  root.classList.remove("stacked");
  root.style.removeProperty("--leadw");
  const leads=root.querySelectorAll(".stop .lead");
  if (!leads.length) return;
  let max=0;
  leads.forEach(l=>{ max=Math.max(max, l.getBoundingClientRect().width); });
  if (!max) return;   // 面板收合中量到的都是 0（display:none），維持原狀，等展開再量
  const opsEl=root.querySelector(".stop .ops");
  const opsW = opsEl ? opsEl.getBoundingClientRect().width : 100;
  const avail = root.getBoundingClientRect().width || innerWidth;
  const META_MIN = 130;   // 中間欄（時間窗＋停留）擠到這個寬度以下就不好讀了
  const needed = max + 10 + META_MIN + 10 + opsW;
  if (needed > avail) root.classList.add("stacked");
  else root.style.setProperty("--leadw", Math.ceil(max)+"px");
}
/* #trip 欄寬監控——通用解，跟上面 #map 那組 ResizeObserver（HANDOFF §6.26）
   同一個道理（HANDOFF §6.28，本人真機回報橫向轉直向後行程展開區跑版：季節
   備註擠成一字一行直排、時間字串被截斷「10:」、加減鈕被裁在右緣）。根因：
   alignLeadColumn() 只在 renderTrip() 重新產生 DOM 時量一次——量出來的
   --leadw（固定 px 值，見上面）或 .stacked class 只反映「量測當下」的容器
   寬度；轉向這種不經過 renderTrip() 的寬度變化完全沒有補呼叫，殘留的舊
   --leadw 在新的（更窄的）寬度下把中間欄（.meta：時間窗＋停留＋季節備註）
   擠到只剩幾 px，逼得裡面文字一字一行、時間字串被截斷、.ops 加減鈕被裁到
   右緣外——跟 #map 灰帶同一種「容器尺寸變了、卻沒有對應的重新量測入口」，
   用同一招：對 #trip 本身掛 ResizeObserver，尺寸一變就 debounce 後重跑
   alignLeadColumn()，不管是轉向、標籤列展開收合、或任何其他不經過
   renderTrip() 的寬度變化，一次接住。alignLeadColumn() 一開頭就先解除
   stacked／--leadw 鎖定再重新量（見上），本身就是幂等的——每次呼叫都是照
   「當下實測」重算，不會因為呼叫時機多寡而累積誤差或在兩態間來回擺盪；
   面板收合時 leads 量到 0 寬會自動早退、不動既有狀態，呼叫時機多寡也不影響
   收合狀態下的行為。debounce 用 setTimeout（這個工具環境 rAF 不觸發，見
   HANDOFF §6.15，沿用同一個理由不依賴它）。 */
(function(){
  const tripEl = document.getElementById("trip");
  if (!tripEl || typeof ResizeObserver === "undefined") return;
  let t = null;
  new ResizeObserver(function(){
    if (t) clearTimeout(t);
    t = setTimeout(function(){ alignLeadColumn(tripEl); }, 100);
  }).observe(tripEl);
})();

/* ── 行程列：橫滑刪除 ＋ 拖曳排序 ──
   兩種手勢共用同一顆 pointerdown，靠移動方向與起點元素分流：
   - 從 nm／stepper／ops／grip 這些既有互動元件按下的，一律不進手勢邏輯，
     讓它們原本的 click 照常運作。
   - 觸控：起點在 grip 上立刻拖曳排序；起點在該站其他地方，按住不放 400ms
     （中途位移不超過 8px）也會進入拖曳排序——長按判定跟橫滑刪除、原生捲頁
     共用同一顆計時器與同一組位移門檻：位移先超過 8px 的話，橫向判成橫滑
     刪除、縱向判成放手交給原生捲頁接手，兩種情況都會取消長按計時器
     （.stop 本身 touch-action:pan-y 讓垂直手指滑動照樣捲頁）。
   - 滑鼠：沒有長按這回事、也沒有捲頁衝突，起點在列上任一非按鈕處直接判斷
     移動方向——縱向就直接拖曳排序，橫向才是橫滑刪除。
   拖放結束才真的改 PLAN 順序＋save()＋render()；橫滑刪除到門檻才呼叫
   togglePlan()。reduced-motion 開啟時，位移仍然即時跟手指走（那是直接
   操作、不是動畫），但放手後的「彈回」／「飛出」與拖放後的歸位不上
   transition，直接跳到終點。 */
function wireStopGestures(wrap, stop, grip, id){
  grip.addEventListener("pointerdown", e=>{
    if (e.pointerType==="mouse" && e.button!==0) return;
    e.preventDefault();
    startDrag(id, wrap, e);
  });
  // 長按觸發拖曳時，iOS 原生的文字選取／callout 選單會搶走手勢，這裡擋掉。
  wrap.addEventListener("contextmenu", e=>{ if (wrap.classList.contains("dragging")) e.preventDefault(); });

  wrap.addEventListener("pointerdown", e=>{
    if (e.target.closest("button, .grip, a")) return;
    if (e.pointerType==="mouse" && e.button!==0) return;
    GESTURE = { id, wrap, stop, startX:e.clientX, startY:e.clientY,
                pointerId:e.pointerId, mouse:e.pointerType==="mouse", dir:null, dx:0, thresh:SWIPE_DELETE_PX };
    if (e.pointerType!=="mouse"){
      clearTimeout(PRESS_TIMER);
      const pe=e;
      PRESS_TIMER=setTimeout(()=>{
        // 400ms 到的時候手勢還在、方向還沒判定（沒超過 8px）＝真的是長按，不是滑或捲頁
        if (!GESTURE || GESTURE.id!==id || GESTURE.pointerId!==pe.pointerId || GESTURE.dir!=null) return;
        GESTURE=null;
        startDrag(id, wrap, pe);
      }, 400);
    }
  });
  wrap.addEventListener("pointermove", e=>{
    if (!GESTURE || GESTURE.id!==id || e.pointerId!==GESTURE.pointerId) return;
    const dx=e.clientX-GESTURE.startX, dy=e.clientY-GESTURE.startY;
    if (GESTURE.dir==null){
      if (Math.abs(dx)<8 && Math.abs(dy)<8) return;
      clearTimeout(PRESS_TIMER);   // 位移已經超過長按門檻，不會再是長按
      if (GESTURE.mouse && Math.abs(dy)>=Math.abs(dx)){
        // 滑鼠、以縱向為主：交給拖曳排序，這顆手勢狀態機到此結束
        const ev=e; GESTURE=null;
        startDrag(id, wrap, ev);
        return;
      }
      if (Math.abs(dx)>Math.abs(dy)){
        GESTURE.dir="h";
        try{ wrap.setPointerCapture(e.pointerId); }catch(_){}   // 極少數情況（如合成事件）沒有 active pointer 可抓，抓不到就算了，不影響橫滑本身
        wrap.classList.add("swiping");
      } else { GESTURE=null; return; }   // 觸控縱向：放手，讓原生捲頁接手
    }
    if (GESTURE.dir!=="h") return;
    e.preventDefault();
    const clamped=Math.min(0, dx);
    stop.style.transform=`translateX(${clamped}px)`;
    GESTURE.dx=clamped;
    GESTURE.thresh=Math.min(SWIPE_DELETE_PX, wrap.getBoundingClientRect().width*0.35);
    wrap.classList.toggle("del-armed", -clamped>GESTURE.thresh);
  });
  const endSwipe=()=>{
    clearTimeout(PRESS_TIMER);
    if (!GESTURE || GESTURE.id!==id) return;
    if (GESTURE.dir==="h"){
      const commit = -GESTURE.dx > GESTURE.thresh;
      wrap.classList.remove("swiping","del-armed");
      if (commit){
        if (!RM.matches){
          stop.style.transition="transform .16s ease";
          stop.style.transform=`translateX(-${wrap.getBoundingClientRect().width}px)`;
        }
        setTimeout(()=>togglePlan(id), RM.matches?0:150);
      } else {
        if (!RM.matches) stop.style.transition="transform .16s ease";
        stop.style.transform="translateX(0)";
        setTimeout(()=>{ stop.style.transition=""; }, 180);
      }
    }
    GESTURE=null;
  };
  wrap.addEventListener("pointerup", endSwipe);
  wrap.addEventListener("pointercancel", endSwipe);
}

function clearDragIndicators(){
  document.querySelectorAll(".stopwrap.drag-over-top,.stopwrap.drag-over-bottom")
    .forEach(el=>el.classList.remove("drag-over-top","drag-over-bottom"));
}
function markDragOver(id,pos){
  const el=document.querySelector(`.stopwrap[data-id="${id}"]`);
  if (el) el.classList.add(pos==="top"?"drag-over-top":"drag-over-bottom");
}
function startDrag(id, wrap, e){
  const startIndex=PLAN.indexOf(id);
  if (startIndex<0) return;
  const rows=Array.from(document.querySelectorAll("#trip .stopwrap")).map(r=>{
    const rc=r.getBoundingClientRect();
    return {id:r.dataset.id, top:rc.top, h:rc.height};
  });
  DRAG={id, startY:e.clientY, startIndex, targetIndex:startIndex, pointerId:e.pointerId, rows};
  wrap.classList.add("dragging");
  const move=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    ev.preventDefault();
    wrap.style.transform=`translateY(${ev.clientY-DRAG.startY}px)`;
    const others=DRAG.rows.filter(r=>r.id!==id);
    let count=0;
    others.forEach(r=>{ if (ev.clientY > r.top + r.h/2) count++; });
    DRAG.targetIndex=count;
    clearDragIndicators();
    if (count<others.length) markDragOver(others[count].id,"top");
    else if (others.length) markDragOver(others[others.length-1].id,"bottom");
  };
  const up=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.removeEventListener("pointercancel",up);
    clearDragIndicators();
    wrap.classList.remove("dragging");
    const {startIndex:si, targetIndex:ti}=DRAG;
    DRAG=null;
    if (ti!==si){
      const arr=PLAN.slice(); arr.splice(si,1); arr.splice(ti,0,id);
      PLAN=arr; save(); render();
    } else {
      if (!RM.matches) wrap.style.transition="transform .14s ease";
      wrap.style.transform="translateY(0)";
      setTimeout(()=>{ wrap.style.transition=""; }, 160);
    }
  };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
  document.addEventListener("pointercancel",up);
}

/* ═══════════ 面板 ═══════════ */
function chip(label,on,fn,color,theme){
  const b=document.createElement("button");
  b.className="chip"; b.setAttribute("aria-pressed",on);
  b.innerHTML=(theme?ico(theme,color):"")+label;
  b.onclick=fn; return b;
}
function frow(key,nodes){
  const r=document.createElement("div"); r.className="frow";
  const k=document.createElement("div"); k.className="fkey"; k.textContent=key;
  const c=document.createElement("div"); c.className="chips";
  nodes.forEach(n=>c.appendChild(n));
  r.append(k,c); return r;
}
function section(label, count, open, fn, cls){
  const b=document.createElement("button");
  b.className="sec"+(cls?" "+cls:""); b.setAttribute("aria-expanded",open);
  b.innerHTML=`${label}${count!=null?`<span class="n">${count}</span>`:""}` +
              `<svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
  b.onclick=fn; return b;
}
/* 改動任何一個篩選條件都走這裡。重點是清掉 EXTRA——它只是「從順路可搭點進一個
   不在篩選內的點時，讓它在清單上有位置可以展開」的暫存，不是跨篩選的保留機制。
   原本只有切路線會清、改主題改時間都不會，那個不一致正是它是副作用而非設計的
   證據；殘留的結果還剛好相反：刻意挑的主要景點（有通過篩選、不在 EXTRA 裡）會
   消失，順手點開的配角反而留著。要跨篩選留住一個點請用行程列的 ＋，那裡才有
   時間與順序。 */
function filterChanged(){ S.sel=null; EXTRA=new Set(); save(); render(); }
// 純粹加減集合成員，不觸發重繪——呼叫端有各自要先做的事（收合子面板、
// 選完路線要 fit 地圖），所以重繪由呼叫端自己決定時機。
function toggleSet(set,v){ set.has(v)?set.delete(v):set.add(v); }
function toggle(set,v){ toggleSet(set,v); filterChanged(); }
/* 「清除」＝把篩選這一側整個倒帶回剛進站的樣子，讓人可以從頭再篩一次：
   除了清掉條件，三層面板的展開狀態（打開、第二層收起、第三層收起）與卷軸
   都要復位，否則清完之後畫面還停在剛才捲到的位置、第三層還開著，等於只清了
   一半。行程列也一起收折，把版面讓給重新篩出來的清單，省掉一次手動點擊。
   **已經加進「今天的行程」的點不受影響**——收折的只是 TRIP_OPEN 這個顯示
   狀態，PLAN／START／STAY 都不碰。
   排序也刻意不動：它是顯示偏好不是篩選條件，使用者特地選了「依車程」不該被
   清除鍵重設。 */
function clearAll(){
  ROUTE_VIEW=false; NEAR_VIEW=false; NEAR_LEVEL=0;   // 清除篩選也離開這兩種檢視
  S.route=new Set(); S.themes=new Set(); S.diffs=new Set(); S.budget=new Set(); S.mine=null;
  S.inseason=false; S.sel=null; S.q=""; EXTRA=new Set();
  // moreOpen 與 routesOpen 刻意不重設：那兩個是「我現在想看哪一層」的操作狀態，
  // 不是篩選條件。清掉選項卻把面板收回去，使用者得再展開一次才能繼續選。
  // dirOpen 則要重設：本人裁示「清除」按下去方位分組全部收合，它不是選項清單
  // 本身、但被撤掉選項後理當跟著收（S.route 一併清空，選了才展開的規則會自動
  // 成立；這裡明講重設是為了涵蓋「手動展開過但沒選任何路線的組」那種情況）。
  S.dirOpen=new Set();
  S.open=true; S.near=0;
  TRIP_OPEN=false;                        // 只收折行程列，PLAN 本身不動
  const q=document.getElementById("q"); if (q) q.value="";
  SCROLL_RESET=true;
  save(); render();
}
function summary(){
  const bits=[];
  if (NEAR_VIEW && PLAN.length){
    const km=NEAR_STEPS[Math.min(NEAR_LEVEL, NEAR_STEPS.length-1)].km;
    bits.push(`<b>行程附近 ${km} 公里</b>`);
  }
  if (S.route.size) bits.push([...S.route].map(r=>`<b>${esc(RT[r].name)}</b>`).join("、"));
  if (S.inseason) bits.push(`${MONTH} 月當季`);
  if (S.budget.size) bits.push([...S.budget].map(b=>esc((BUDGETS.find(x=>x.id===b)||{}).label||"")).join("、"));
  if (S.diffs.size) bits.push([...S.diffs].map(d=>EFFORT[d]||d).join("、"));
  if (S.themes.size) bits.push([...S.themes].map(t=>TH[t].name).join("、"));
  if (S.mine) bits.push(S.mine==="yes" ? "我收藏過的" : "還沒收的");
  if (S.q) bits.push(`「${esc(S.q)}」`);
  return bits.length ? bits.join("　·　") : `全部 ${PLACES.length} 個點`;
}

/* 展開篩選面板，或點篩選摘要文字，都會把「今天的行程」收起來、清單捲回最上方——
   篩選面板展開時行程面板本來就該讓位；但個別點一顆篩選 chip 不做這件事：篩選展開時
   行程已經收好了（重複收合沒有作用），若使用者是刻意重新展開行程對照篩選結果，
   每點一個 chip 就把它關掉是在跟使用者作對。 */
function collapseTrip(){ TRIP_OPEN=false; SCROLL_RESET=true; }
function toggleFilters(){
  const opening=!S.open; S.open=opening;
  if (opening) collapseTrip();
  save(); render();
}
function renderFilterBar(){
  const bar=document.createElement("div"); bar.className="fbar";
  // 整條列的空白處都能收展，不必精準點到那顆小按鈕；下面的排序下拉與「清除」
  // 會各自 stopPropagation，不會被這層攔截。
  bar.onclick=e=>{ if (e.target===bar) toggleFilters(); };
  const btn=document.createElement("button");
  btn.className="fbtn"; btn.setAttribute("aria-expanded",S.open);
  btn.innerHTML=`篩選<svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
  btn.onclick=toggleFilters;
  const sum=document.createElement("button");
  sum.type="button"; sum.className="fsum"; sum.innerHTML=summary();
  // 摘要那一大片看起來就是空白，點它跟點按鈕做同一件事最不會意外
  sum.onclick=toggleFilters;
  bar.append(btn,sum);
  const sel=document.createElement("select");
  sel.id="sort";
  sel.innerHTML=SORTS.map(s=>`<option value="${s.id}"${S.sort===s.id?" selected":""}>${s.label}</option>`).join("");
  sel.onchange=()=>{ S.sort=sel.value; save(); render(); };
  sel.onclick=e=>e.stopPropagation();
  bar.appendChild(sel);
  if (anyFilter()){
    const c=document.createElement("button"); c.className="clear"; c.textContent="清除";
    c.onclick=e=>{ e.stopPropagation(); clearAll(); }; bar.appendChild(c);
  }
  return bar;
}

/* 第一層：時間。一日來回真正會擋掉選項的只有時間，所以它是唯一永遠在的問題。 */
function renderFilters(){
  const f=document.createElement("div"); f.className="filters";

  /* 第二層：主題／時間／費力／季節。時間原本是獨立一整行、跟主題不同層——
     現在併進同一個 section，點篩選鈕、點摘要、清除篩選對它的影響就會跟
     主題／費力完全一樣，不用再靠「選了時間就自動展開」這條特例。 */
  const open2=moreOn();
  /* 摺疊列上要看得出「這一層有沒有在篩」——收起來的時候光看標題不知道自己
     還套著條件。主題用 icon（名字太長會撐爆那一行），路線與清單用數字。 */
  const thSel=THEMES.filter(t=>S.themes.has(t.id));
  f.appendChild(section("從主題找",
    thSel.length ? thSel.map(t=>ico(t.id,t.color)).join("") : null,
    open2, ()=>{ S.moreOpen=!open2; save(); render(); }));
  if (open2){
    const wrap=document.createElement("div"); wrap.className="subrows";
    const thBase=PLACES.filter(p=>passExcept(p,"themes"));
    wrap.appendChild(frow("主題", THEMES.map(t=>chip(
      `${t.name}<span class="cnt num">${thBase.filter(p=>p.theme===t.id).length}</span>`,
      S.themes.has(t.id), ()=>toggle(S.themes,t.id), t.color, t.id))));
    const budBase=PLACES.filter(p=>passExcept(p,"budget"));
    wrap.appendChild(frow("時間", BUDGETS.map(b=>chip(
      `${b.label}<span class="cnt num">${budBase.filter(p=>bud(p)===b.id).length}</span>`,
      S.budget.has(b.id), ()=>toggle(S.budget,b.id)))));
    const dfBase=PLACES.filter(p=>passExcept(p,"diffs"));
    wrap.appendChild(frow("費力", ["開車","散步","健行","挑戰"].map(d=>chip(
      `${EFFORT[d]}<span class="cnt num">${dfBase.filter(p=>p.diff===d).length}</span>`,
      S.diffs.has(d), ()=>toggle(S.diffs,d)))));
    const sc=PLACES.filter(p=>passExcept(p,"inseason") && months(p).includes(MONTH)).length;
    wrap.appendChild(frow("季節", [chip(`${MONTH} 月當季<span class="cnt num">${sc}</span>`, S.inseason,
      ()=>{ S.inseason=!S.inseason; filterChanged(); })]));
    if (!PUBLIC) wrap.appendChild(frow("來源", [
      chip("我收藏過的", S.mine==="yes", ()=>{ S.mine=S.mine==="yes"?null:"yes"; filterChanged(); }),
      chip("還沒收的", S.mine==="no",  ()=>{ S.mine=S.mine==="no"?null:"no";   filterChanged(); }),
    ]));
    f.appendChild(wrap);
  }

  /* 第三層：路線。資料模型很有價值，但不該是進站第一眼，所以預設收起。 */
  f.appendChild(section("從路線找",
    S.route.size ? `${S.route.size}/${ROUTES.length} 條` : `${ROUTES.length} 條`, S.routesOpen,
    ()=>{ S.routesOpen=!S.routesOpen; save(); render(); }));
  if (S.routesOpen){
    const rtBase=PLACES.filter(p=>passExcept(p,"route"));
    // 依方位再摺一層（本人 2026-08-20 裁示）：29 條路線全展開太長，改成 DIRS
    // 五組各自摺疊，預設全收合。唯二自動展開的時機＝這組有勾選的路線（含
    // 重新整理後回復勾選狀態）——dopen 每次都重算，不靠存檔的展開旗標，
    // 所以「回復勾選狀態」不需要額外程式碼，選了哪條路線自然算得出來。
    // 有勾選的組不能被手動收合（selN>0 時 dopen 恆真），這是刻意的：勾選中
    // 的路線本來就該看得到，不該讓使用者不小心把它摺起來又找不到。
    let firstDir=true;
    DIRS.forEach(d=>{
      const rs=ROUTES.filter(r=>r.dir===d.id);
      if (!rs.length) return;
      const selN=rs.filter(r=>S.route.has(r.id)).length;
      const dopen=S.dirOpen.has(d.id) || selN>0;
      const g=document.createElement("div"); g.className="rgroup"+(firstDir?" first":"");
      firstDir=false;
      const hd=section(d.name, `${selN}/${rs.length}`, dopen,
        ()=>{ if (!selN) toggleSet(S.dirOpen, d.id); render(); }, "dirsec");
      hd.style.setProperty("--dc", d.color);
      g.appendChild(hd);
      if (dopen){
        const list=document.createElement("div"); list.className="rlist";
        rs.forEach(r=>{
          const b=document.createElement("button");
          b.className="rrow"; b.setAttribute("aria-pressed", S.route.has(r.id));
          b.innerHTML=`<span class="rbar" style="background:${d.color}"></span>` +
                      `<span class="nm">${esc(r.name)}</span>` +
                      `<span class="n num">${rtBase.filter(p=>p.route===r.id).length} 處</span>`;
          b.onclick=()=>{
            toggleSet(S.route, r.id); filterChanged();
            if (S.route.size) fit(PLACES.filter(p=>S.route.has(p.route)));
          };
          list.appendChild(b);
        });
        g.appendChild(list);
      }
      f.appendChild(g);
    });
  }
  return f;
}

/* 清單每一列的車程那一段。開著「行程 N 公里內」時，參照點換成離行程最近的那一
   站——那才是使用者當下在衡量的距離；沒開就照舊顯示從新竹出發的車程。 */
/* 清單那一行放不下太長的站名——「麥巴來溪天然游泳池」十個字就會把整行推到換行、
   沙漏落單在第二行，看起來像沒對齊。截短只影響這裡；地圖資訊卡是整寬的，照舊
   顯示完整名字。 */
// 4 個字：清單模式是多欄網格，每格的這一行只有約 247px，量出來 6 個字還差 15px
// 才塞得下「站名＋分鐘＋公里＋停留」。完整站名放在 title，桌機滑過去看得到。
const shortStop = n => n.length>5 ? n.slice(0,4)+"…" : n;
/* rel＝「從目前展開的那個點量出來的距離」，詳細面板的附近清單會帶。它必須自己
   把分鐘也一起帶進來：少了這個分支就會掉到最下面那行的 p.drive_min，而那是
   策展的「從新竹市出發」車程——於是同一行左邊是新竹來的分鐘、右邊是從這個點
   量的公里。實例：展開錦屏美人湯，梅后蔓瀑布步道顯示「車程 60 分 · 8.2 km」，
   60 是新竹→梅后蔓，8.2 是錦屏→梅后蔓，OSRM 對這一段其實回的是 14 分。 */
function legBit(p, rel){
  if (rel) return `<span class="mi" title="車程">${CAR_SVG}` +
    (rel.min!=null ? `<span class="num">${rel.min}</span> 分 · ` : ``) +
    `${rel.real?"":"直線 "}<span class="num">${rel.km.toFixed(1)}</span> km</span>`;
  if (NEAR_SET){
    const ns=nearestStop(p);
    // 只有一站時不寫站名——參照點沒有第二種可能，寫了只是把這一行推到換行，
    // 沙漏落單在第二行。多站才需要指明是離哪一站。
    if (ns){
      const many=PLAN.length>1;
      return `<span class="mi" title="離${esc(ns.stop.name)}">${CAR_SVG}` +
        (many ? `離${esc(shortStop(ns.stop.name))} ` : ``) +
        (ns.min!=null ? `<span class="num">${ns.min}</span> 分 · ` : ``) +
        `<span class="num">${ns.km.toFixed(1)}</span> km</span>`;
    }
  }
  return `<span class="mi" title="車程">${CAR_SVG}<span class="num">${p.drive_min}</span> 分</span>`;
}
function rowFor(p, extra, rel){
  const b=document.createElement("button");
  b.className="row"; b.dataset.id=p.id; b.setAttribute("aria-expanded", S.sel===p.id);
  const off = !pass(p);
  const body=document.createElement("div"); body.className="rbody";
  body.innerHTML =
    `<div class="t">${ico(p.theme,(TH[p.theme]||{}).color)}` +
    `<span>${esc(p.name)}${(!PUBLIC && p.in_user_list)?' <i class="star" title="你收藏過的">★</i>':''}</span>` +
    `<span class="tag ${HARD.has(p.diff)?"hard":""}">${EFFORT[p.diff]||p.diff}</span>` +
    (off?`<span class="off">不在篩選內</span>`:"") + `</div>` +
    // 順路檢視下省略鄉鎮：加上參照站名之後這一行會長到換行，沙漏被擠到第二行
    // 單獨一個，看起來像沒對齊。此時「離哪一站多遠」比鄉鎮更有用。
    `<div class="m">${(NEAR_SET||rel)?"":esc(p.town)+"　"}${legBit(p, rel)}　` +
    `<span class="mi" title="停留">${HOURGLASS_SVG}<span class="num">${p.stay_h}</span> 小時</span>` +
    `${extra||""}</div>`;
  const add=document.createElement("button");
  add.className="add"; add.dataset.in=inPlan(p.id);
  add.textContent = inPlan(p.id) ? "✓" : "＋";
  add.title = inPlan(p.id) ? "移出行程" : "加進行程";
  add.onclick=e=>{ e.stopPropagation(); togglePlan(p.id); };
  b.append(body,add);
  b.onclick=()=>select(p.id);
  b.addEventListener("mouseenter", ()=>emphasize(p.id,true));
  b.addEventListener("mouseleave", ()=>emphasize(p.id,false));
  return b;
}

/* 級距是車程公里，不是直線——實際里程約是直線的 1.4（平地）到 1.7 倍（山區），
   所以比原本的直線級距 5/10/20 放寬。最後一級 40 是給山上的點留的：油羅山在
   30 公里內只有 4 個點，到 40 公里才 79 個，那正是開下山進竹東盆地的門檻。 */
const NEAR_STEPS = [{km:10,n:5},{km:20,n:8},{km:40,n:12}];
/* 純粹依距離排序，附近剛好聚了一堆同主題的點就會把其他類型全部擠出候選——
   實測油羅山 40 公里內 83 個候選，純距離前 12 名被 cafe／food／trail-near 佔滿，
   兩間更值得注意的老街（內灣 28.1km、竹東 30.1km）反而一個都擠不進來，儘管
   使用者的實際需求（回程順路找老街吃晚餐）正是這類點。改成依主題輪流取
   （同主題內仍照距離近到遠），近的主題優先輪到，讓每種存在的主題都有機會
   露出，不會被距離最近的那個主題整批洗掉。 */
function pickNearby(list, n){
  const groups=new Map();
  list.forEach(o=>{ if(!groups.has(o.x.theme)) groups.set(o.x.theme,[]); groups.get(o.x.theme).push(o); });
  const order=[...groups.keys()].sort((a,b)=>groups.get(a)[0].d-groups.get(b)[0].d);
  const picked=[]; let idx=0;
  while (picked.length<n){
    let added=false;
    for (const th of order){
      const g=groups.get(th);
      if (idx<g.length){ picked.push(g[idx]); added=true; if (picked.length>=n) break; }
    }
    if (!added) break;
    idx++;
  }
  return picked.sort((a,b)=>a.d-b.d);
}
function renderDetail(p){
  const step=NEAR_STEPS[Math.min(S.near, NEAR_STEPS.length-1)];
  // 候選只照直線挑一次（取最大級距、上限 90 個，OSRM table 一次問得完），
  // 三個級距都從這同一份結果篩，所以一個點從頭到尾只發一次請求。
  // 抓取一律用完整的 nearPool（不排除同主題）——NEAR[p.id] 是全站共用的快取，
  // 地圖的「行程附近地點」也要讀它。先前這裡餵的是排除同主題後的池，結果
  // 同主題的點在快取裡永遠缺席，只能退回直線距離（油羅山 90 個候選裡有 15 個
  // 是這樣來的，全部都是 trail-mountain）。主題排除移到顯示時才做。
  const full=nearPool(p);
  fetchNear(p, full);
  const pool=full.filter(x=>x.theme!==p.theme);
  const road=NEAR[p.id];
  // min 也要一起帶出來：這一行的公里數是從 p 量的，分鐘就必須同源，
  // 不然會掉回 drive_min（從新竹算的），兩個數字各講各的起點。
  const near=pickNearby(pool.map(x=>{
      const r=road&&road[x.id];
      return {x, d:r?r.km:nkm(p,x), min:r?r.min:null, real:!!r};
    }).filter(o=>o.d<=step.km), step.n);
  const d=document.createElement("div"); d.className="detail";
  d.innerHTML =
    `<p class="crumb" style="margin:0 0 8px;font-size:12px;color:var(--ink3)">` +
      `${esc(RT[p.route].name)}　${esc(TH[p.theme].name)}　${esc(p.kind||"")}</p>` +
    `<dl class="facts">` +
      `<dt>位置</dt><dd>${esc(p.town)}${p.coord_conf==="low"?"（座標估計值）":""}</dd>` +
      `<dt>車程</dt><dd><span class="num">${p.drive_min}</span> 分（單程）</dd>` +
      `<dt>停留</dt><dd>${esc(p.time||"—")}</dd>` +
      `<dt>整趟</dt><dd><span class="num">${p.total_h}</span> 小時　${EFFORT[p.diff]||p.diff}</dd>` +
    `</dl>` +
    (p.desc?`<p class="desc">${esc(p.desc)}</p>`:"") +
    (p.season?`<p class="flag season">${esc(p.season)}</p>`:"") +
    (p.note?`<p class="flag">${esc(p.note)}</p>`:"");
  const acts=document.createElement("div"); acts.className="acts";
  const add=document.createElement("button");
  if (!inPlan(p.id)) add.className="primary";
  add.textContent = inPlan(p.id) ? "從行程移除" : "加進行程";
  add.onclick=()=>togglePlan(p.id);
  acts.appendChild(add);
  acts.insertAdjacentHTML("beforeend",
    `<a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(HOME.name)}&destination=${encodeURIComponent(gnav(p))}" target="_blank" rel="noopener">導航</a>` +
    `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(gview(p))}" target="_blank" rel="noopener">看 Google 地圖</a>` +
    (p.source?`<a href="${esc(p.source)}" target="_blank" rel="noopener">參考</a>`:""));
  d.appendChild(acts);
  // 用實際里程篩之後可能一個都不剩（山上就是這樣），這時仍要把「再遠一點」留著，
  // 不然使用者卡在空白畫面沒得按。
  const canWiden = S.near < NEAR_STEPS.length-1;
  if (near.length || canWiden){
    const n=document.createElement("div"); n.className="nearby";
    n.innerHTML=`<h3>附近精選地點（車程 ${step.km} 公里內）</h3>`;
    if (near.length) near.forEach(({x,d:dd,min,real})=>
      n.appendChild(rowFor(x, null, {km:dd, min, real})));
    else {
      const e=document.createElement("p"); e.className="nonear";
      e.textContent="這個車程範圍內沒有別的點。山上繞路遠，可以放寬距離再看。";
      n.appendChild(e);
    }
    if (canWiden){
      const more=document.createElement("button"); more.className="wider";
      more.textContent=`再遠一點（${NEAR_STEPS[S.near+1].km} 公里內）`;
      more.onclick=()=>{ S.near++; render(); };
      n.appendChild(more);
    }
    d.appendChild(n);
  }
  return d;
}

function renderList(){
  const wrap=document.createElement("div"); wrap.className="results";
  const list=shown();
  if (!list.length){
    const d=document.createElement("div"); d.className="empty";
    d.innerHTML="這組條件沒有東西。";
    const b=document.createElement("button"); b.textContent="清掉條件"; b.onclick=clearAll;
    d.appendChild(b); wrap.appendChild(d); return wrap;
  }
  const cmp=(SORTS.find(s=>s.id===S.sort)||SORTS[0]).fn;
  const g={}; list.forEach(p=>(g[p.route]=g[p.route]||[]).push(p));
  ROUTES.filter(r=>g[r.id]).forEach(r=>{
    const open=ROAD_OPEN.has(r.id);
    const h=document.createElement("button");
    h.className="ghead"; h.setAttribute("aria-expanded", open);
    h.style.setProperty("--dc", DR[r.dir].color);
    h.innerHTML=`<span class="gnm">${esc(r.name)}</span>` +
      `<span class="num">${g[r.id].length}</span>` +
      `<svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>`;
    h.onclick=()=>{ toggleSet(ROAD_OPEN, r.id); render(); };
    wrap.appendChild(h);
    if (open){
      // 路線簡介卡（方案 c）：風格 chip（r.style 用「、」拆成小標籤）＋綜合簡介
      // （r.desc）＋道路組成（r.road，淡色小字、無標題）。三段皆選配——理論上
      // 每條路線三個欄位都有值，缺值時該段整段不渲染，不留空標籤。
      const rd=document.createElement("div"); rd.className="gintro";
      const chips=(r.style||"").split("、").filter(Boolean)
        .map(s=>`<span class="gchip">${esc(s)}</span>`).join("");
      rd.innerHTML =
        (chips ? `<div class="gstyle">${chips}</div>` : "") +
        (r.desc ? `<p class="gdesc">${esc(r.desc)}</p>` : "") +
        (r.road ? `<p class="groads">${esc(r.road)}</p>` : "");
      wrap.appendChild(rd);
    }
    g[r.id].sort(cmp).forEach(p=>{
      wrap.appendChild(rowFor(p));
      if (S.sel===p.id) wrap.appendChild(renderDetail(p));
    });
  });
  return wrap;
}

function renderPanel(){
  const panel=document.getElementById("panel");
  const keep=panel.scrollTop;
  panel.innerHTML="";
  panel.appendChild(renderFilterBar());
  if (S.open) panel.appendChild(renderFilters());
  // 清單很長，窄螢幕上地圖疊在它下面，不折起來要捲很久才到得了。折疊行為與
  // 「從主題找」「從路線找」一致：點篩選、點摘要、清除篩選都不動它。
  panel.appendChild(section("景點清單", `${shown().length}/${PLACES.length}`, S.listOpen,
    ()=>{ S.listOpen=!S.listOpen; save(); render(); }, "toplevel"));
  if (S.listOpen){
    panel.appendChild(renderList());
    // 圖例與免責說明是清單的附屬資訊，跟著清單一起收合——清單收起來時它們留在
    // 畫面上會變成沒有主體的孤兒文字。
    const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML=THEMES.map(t=>`<span>${ico(t.id,t.color)}${t.name}</span>`).join("");
    panel.appendChild(lg);
    const f=document.createElement("p"); f.className="foot";
    f.innerHTML = (PUBLIC ? "" : "★ 是你自己收藏過的地方。") +
      "清單上的車程與停留都是估的；「今天的行程」的點間車程與「順路可搭」的距離會另外去算真實路線，" +
      "算不到才退回估算值（會標「約」或「直線」）。" +
      "山區路況、林道封閉、園區開放時間與店家公休都會變動，出發前請以官方公告與店家粉專為準；" +
      "本頁僅供行程參考，不保證資訊正確或即時。底圖與圖磚為 OpenStreetMap 貢獻者所有。";
    panel.appendChild(f);
  }
  // .panel 現在任何寬度都是唯一的捲動容器（app-shell 化，2026-08-21），
  // 不用再分桌機／窄畫面兩套
  if (SCROLL_RESET){
    panel.scrollTop = 0;
    SCROLL_RESET = false;
  } else {
    panel.scrollTop = keep;
  }
  if (SCROLL_GROUP){
    // 「只看同路線所有點」之後從第一條路線的標題開始看，不是停在原本的捲動位置
    const g=panel.querySelector(".ghead");
    if (g){
      const bar=document.querySelector(".fbar");
      const r=g.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      panel.scrollTop += (r.top-target);
    }
    SCROLL_GROUP=false;
  }
  if (SCROLL_TO){
    const el=panel.querySelector(`.row[data-id="${SCROLL_TO}"]`);
    if (el){
      // 從地圖點選是特意的一次性動作，位置固定貼在篩選列下方一點點，不是螢幕
      // 正中央——「今天的行程」展開時是 position:fixed 貼在畫面下緣，擺在正中央
      // 容易被它蓋住。
      const bar=document.querySelector(".fbar");
      const r=el.getBoundingClientRect();
      const target=(bar?bar.getBoundingClientRect().bottom:r.top)+10;
      panel.scrollTop += (r.top-target);
    }
    SCROLL_TO=null;
  }
}

let SCROLL_TO=null;
function select(id){
  if (S.sel===id){ S.sel=null; S.near=0; render(); return; }
  S.sel=id; S.near=0;
  const p=BY_ID[id];
  if (p){
    if (!pass(p)) EXTRA.add(id);        // 從「附近精選地點」跳到不在篩選裡的點，讓它有位置可展開
    // 手機地圖模式下，縮太小時圖釘只是一個色點——使用者照樣會去點它。這時順便
    // 拉近到會顯示主題圖示與名稱標籤的那一級，卡片跳出來時周圍才看得懂。
    if (isMapOnly() && ready && map.getZoom() < ICON_ZOOM){
      // 不做縮放動畫：從第 11 級跳到第 14 級直接到位比較俐落，也不必等動畫跑完
      map.setView([p.lat,p.lng], ICON_ZOOM, {animate:false});
    } else {
      panTo(p);
    }
  }
  // 手機地圖模式下清單整個是隱藏的，這時不要動清單狀態，改由地圖上的資訊卡承接
  // （見 renderMapCard）；其餘情況照舊展開清單並捲到那一列。
  if (!isMapOnly()){ S.listOpen=true; SCROLL_TO=id; }
  render();
}

function syncViews(){
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.view));
  document.getElementById("main").classList.toggle("nomap", S.view!=="map");
}
/* app-shell 化之後（2026-08-21）.stage／.panel 的高度全部交給 flexbox 自己算
   （見 CSS 版面那節），不再需要量 .bar／.panel 實際高度寫回 --topbarh／
   --panelh 給 calc() 用——原本的 syncBarHeight() 與它掛的兩個 ResizeObserver、
   resize listener 因此整支拿掉，不是遺漏。 */
/* 回頂鈕：可見度（手機地圖模式不出現）、淡入門檻（捲過約 1.75 個畫面高）、
   水平定位（桌機地圖檢視要收窄到面板右下，其餘固定視窗右下）都靠這支重算。
   捲動容器只剩 .panel 一個，不用再判斷是不是文件在捲。 */
function updateTotop(){
  const btn=document.getElementById("totop");
  if (!btn) return;
  btn.hidden = isMapOnly();
  if (btn.hidden) return;
  const main=document.getElementById("main");
  const docked = matchMedia("(min-width:900px) and (min-height:560px)").matches &&
                 main && !main.classList.contains("nomap");
  btn.classList.toggle("docked", docked);
  const panel=document.getElementById("panel");
  const vh = panel.clientHeight || innerHeight;
  btn.classList.toggle("show", panel.scrollTop > vh*1.75);
}
document.getElementById("panel").addEventListener("scroll", updateTotop, {passive:true});
addEventListener("resize", updateTotop);
document.getElementById("totop").onclick=()=>{
  document.getElementById("panel").scrollTo({top:0, behavior: RM.matches ? "auto" : "smooth"});
};
function render(){
  refreshNearSet();
  primeNearView();   // 每輪推進一批；fetchNear 自己有單一進行中的鎖與完成標記
  document.getElementById("tally").innerHTML =
    `<span class="num">${shown().length}</span> / <span class="num">${PLACES.length}</span>`;
  draw(); renderPanel(); renderTrip(); renderMapBtns(); renderMapCard(); updateTotop();
}

document.querySelectorAll("#views button").forEach(b=>{
  b.onclick=()=>{
    if (b.dataset.v===S.view){
      // 再點一次目前已選中的檢視＝把清單捲回最頂端（filters 可見的位置），不做
      // 其他事。.panel 是唯一的捲動容器，不用再兼顧 window。
      document.getElementById("panel").scrollTo({top:0, behavior:"smooth"});
      return;
    }
    S.view=b.dataset.v; syncViews();
    // 換模式時把「現在在看哪個點」帶過去：切到清單就展開並捲到那一列，切到地圖
    // 就把它帶到畫面中央。否則切過去要自己重新找一次，等於斷掉手上的動作。
    if (S.sel){
      if (S.view==="list"){ S.listOpen=true; SCROLL_TO=S.sel; }
      else if (BY_ID[S.sel] && ready){
        // 不做位移動畫：換模式本來就是跳到另一個檢視，直接到位比較利落
        const q=BY_ID[S.sel];
        map.setView([q.lat,q.lng], Math.max(map.getZoom(),13), {animate:false});
      }
    }
    save(); render();
    if (S.view==="map") resizeMap();
  };
});
document.getElementById("q").addEventListener("input", e=>{
  S.q=e.target.value.trim().toLowerCase(); filterChanged();
});
addEventListener("keydown", e=>{ if (e.key==="Escape" && S.sel){ S.sel=null; render(); } });

restore();
applyTheme();
document.getElementById("theme").onclick=()=>{
  THEME = THEME==="auto" ? "light" : (THEME==="light" ? "dark" : "auto");
  applyTheme(); save(); render();
};
syncViews();
loadOSM("");
render();
save();
</script>
<script>
/* PWA service worker 註冊——file:// 或不支援的環境靜默跳過，不擋首屏。 */
(function () {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
  });
})();
</script>
<script>
/* 雙擊放大 JS 攔截層（本人 2026-08-22 二輪實機回報：CSS touch-action:manipulation
   在真機仍擋不住，這裡上重錘）。判準：#map 內完全不攔（Leaflet 自己管雙擊縮放，
   用 closest("#map") 排除，不是排除祖先，是排除「這次點擊落在地圖裡」）；
   #map 外，前後兩次 touchend 間隔 <300ms 視為快速連續操作——瀏覽器原生行為會把
   這個間隔讀成雙擊放大手勢，這裡搶在瀏覽器判定前 preventDefault 擋掉那個放大。
   但正常的「快速連點兩下不同項目」操作語意要保留：對 touchend 呼叫
   preventDefault 會連帶吃掉瀏覽器原本要合成的 click 事件（這是 Touch Events
   規範行為，iOS/Android 一致），所以攔下來之後手動對原始 target 補呼叫一次
   .click()——目標元素還是原來那個（跟瀏覽器原生合成 click 用的 target 相同：
   touchstart 落點），泡起（bubble）走正常 DOM 路徑，所以無論是 li 列直接掛
   onclick 還是點到裡面的 icon/文字，該觸發的處理常式一樣會觸發，兩次快速點擊
   兩個不同項目都各自有反應。註冊在 document、{passive:false}，preventDefault
   才有效。 */
(function(){
  let lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    if (e.target && e.target.closest && e.target.closest("#map")) return;
    const now = Date.now();
    const dt = now - lastTouchEnd;
    lastTouchEnd = now;
    if (dt > 0 && dt < 300){
      e.preventDefault();
      const t = e.target;
      if (t && typeof t.click === "function") t.click();
    }
  }, {passive:false});
})();
</script>
<script>
/* iOS standalone 版面缺口修正——JS 防線（本人 2026-08-22 真機診斷數據，見
   HANDOFF §6.20）。跟上面 CSS 的 @media(display-mode:standalone) 那層是同一件
   事的兩道防線：CSS 是主要修法，這層是補強——量到「非 standalone」就整支提早
   return，不寫任何行內樣式，一般瀏覽器分頁與桌機完全不受影響，不需要額外的
   防呆判斷。standalone 模式下量 screen.height 與 innerHeight 的差值：本人實測
   是 59px（狀態列高度），這裡用 15~100px 當容忍範圍——下限排除「這台裝置/這個
   WebKit 版本其實沒有這個怪癖、CSS 那層已經夠用」的情況（gap 應該接近 0，
   硬改反而可能弄巧成拙）；上限排除鍵盤彈出、其他量測時機不巧的誤判（那些情況
   gap 通常遠大於 100px）。落在範圍內才把 html／body／#app 的高度直接改寫成
   screen.height（行內樣式，特異度最高，保證蓋過任何 CSS）；不在範圍內則清掉
   可能殘留的行內高度，交還給 CSS 層決定。狀態存在 window.__iosStandaloneFix，
   下面的真機診斷浮層會讀它顯示「修正後 .app 實高」。監聽
   orientationchange／resize 重算，避免旋轉後缺口跑掉或殘留舊的行內高度。
   2026-08-22 追加（HANDOFF §6.27）：這整支邏輯限定 portrait 才跑（見下面
   apply() 開頭新增的 isPortrait() 判斷）——landscape 一律清掉行內高度、不
   套用任何新值，理由與上面 CSS media query 那段同一件事。 */
window.__iosStandaloneFix = { active:false, gap:null, screenH:null, appliedH:null };
(function(){
  function isStandaloneMode(){
    return (window.matchMedia && matchMedia("(display-mode:standalone)").matches) ||
           window.navigator.standalone === true;
  }
  /* 2026-08-22 新增（HANDOFF §6.27）：優先信任 orientation media feature（引擎
     自己判斷目前佈局方向，不受 screen.width/height 轉向不互換的怪癖影響）；
     不支援時退而比較 innerWidth/innerHeight（同樣是即時佈局值，不是 screen.*）。
     兩者都刻意不用 window.screen，因為這支修正下面就是在處理 screen.height
     本身不可信的情境，不能拿它來判斷方向。 */
  function isPortrait(){
    if (window.matchMedia){
      const mq = matchMedia("(orientation:portrait)");
      if (typeof mq.matches === "boolean") return mq.matches;
    }
    return window.innerWidth < window.innerHeight;
  }
  function clearInline(){
    document.documentElement.style.height = "";
    document.body.style.height = "";
    const appEl = document.getElementById("app");
    if (appEl) appEl.style.height = "";
  }
  function apply(){
    const state = window.__iosStandaloneFix;
    if (!isStandaloneMode()){
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      return;
    }
    if (!isPortrait()){
      // landscape：整支跳過 gap 判斷，只清掉可能殘留的舊行內高度、不推論新值
      // （理由見上面 CSS @media(display-mode:standalone) and (orientation:portrait)
      // 那段註解，HANDOFF §6.27）。仍呼叫 resizeMap()：清掉行內高度後 #app／
      // #map 的實際尺寸可能改變，跟既有兩個分支收斂處的處理方式一致。
      clearInline();
      state.active = false; state.gap = null; state.screenH = null; state.appliedH = null;
      resizeMap();
      return;
    }
    const sh = window.screen && window.screen.height;
    const ih = window.innerHeight;
    if (!sh || !ih){ state.active = false; return; }
    const gap = sh - ih;
    state.screenH = sh; state.gap = gap;
    if (gap > 15 && gap < 100){
      const px = sh + "px";
      document.documentElement.style.height = px;
      document.body.style.height = px;
      const appEl = document.getElementById("app");
      if (appEl) appEl.style.height = px;
      state.active = true;
      state.appliedH = sh;
    } else {
      clearInline();
      state.active = false;
      state.appliedH = null;
    }
    // 改寫／清掉 html／body／#app 的行內高度後，#map 容器的實際尺寸會跟著變——
    // 上面新掛的 ResizeObserver 理論上會自己補一次 invalidateSize()，這裡額外
    // 主動呼叫一次是第二層防線（本人指示「iOS standalone 高度修正 JS 設定高度
    // 後主動再叫一次，含 orientationchange 分支」）：orientationchange／resize
    // 都會呼叫這支 apply()，兩種分支都在此統一觸發，不用各自另外處理。
    resizeMap();
  }
  apply();
  window.addEventListener("orientationchange", function(){ setTimeout(apply, 250); });
  window.addEventListener("resize", apply);
})();
</script>
<script>
/* 真機診斷模式（本人 2026-08-22 二輪回報後新增，臨時工具——不是交付物，等
   行程面板留白／回頂鈕兩項問題定案後下一輪拆掉，見 HANDOFF §6.18）。
   啟用：長按 topbar 的「新竹一日」logo 3 秒（standalone 模式沒網址列，不能靠
   query 參數切換）。啟用後半透明浮層顯示：innerWidth/innerHeight、
   visualViewport.height、100dvh 實測 px（量一個隱藏的 100dvh 探測 div，不是
   讀常數）、safe-area-inset-top/bottom 實測 px（讀一個帶 env() padding 的探測
   div 的 computed padding，同樣道理——這個環境的行動裝置模擬 env() 恆為 0，
   真機才有意義）、--barh／--tripup 目前值、display-mode 是否 standalone、
   .app／.main／.panel／.trip 各自 getBoundingClientRect() 的 top/bottom/height。
   同時給這四個容器套 2px outline（用 outline 不用 border，不占版面、
   box-sizing 也無感；outline-offset:-2px 避免被 overflow:hidden 的祖先裁掉），
   浮層上有圖例對照顏色，誰蓋誰一眼看出來。浮層本身從 .bar 下緣開始（不是
   inset:0 蓋滿全螢幕），刻意留出 topbar／logo 沒被蓋住，這樣才能再長按一次
   logo 關閉——不然浮層蓋住 logo，開得了關不了。不啟動時只掛了 logo 上幾個
   輕量事件監聽，零額外成本（無 timer、無常駐 DOM）。 */
(function(){
  let diagOn = false, diagTimer = null, overlay = null;
  const OUTLINE = {
    app:   ["#e33", "紅"],
    main:  ["#2a2", "綠"],
    panel: ["#39f", "藍"],
    trip:  ["#f90", "橙"],
    /* 2026-08-22 新增（HANDOFF §6.27，本人橫向截圖回報地圖下緣與行程列之間
       多出空白）：加 stage／map 兩框，量的是「地圖容器有沒有撐滿版面分給它的
       空間」，跟 app/main/panel/trip 那組量的是「外層版面分配」互補——兩組
       疊在一起看才能定位空白卡在哪一層。applyOutlines()／open()／close() 的
       邏輯完全沒改，都是泛用地跑過 Object.keys(OUTLINE)，加這兩個 key 就自動
       套用，不用動那三支函式本體。 */
    stage: ["#0cc", "青"],
    map:   ["#c0c", "紫"],
  };

  /* 2026-08-22 新增（HANDOFF §6.28，本人真機回報橫向轉直向後行程展開區
     跑版：季節備註擠成一字一行直排、時間字串被截斷、加減鈕被裁在右緣）：
     量 .trip 展開區裡第一個行程站的關鍵欄（.lead／.meta／.win／.stepper／
     .warn／.ops）寬度，加上 --leadw 目前值與 .stacked 是否套用——跟
     alignLeadColumn() 判斷用的是同一批量測依據，本人截圖若再跑版，這幾行
     能直接看出是「--leadw 殘留舊值撐不住新寬度」還是別的原因。跟上面
     app/main/panel/stage/map/trip 那組「外層版面分配」互補，量的是「版面
     分給 .trip 之後，裡面的欄位有沒有跟著正確分配」。純新增讀值，
     applyOutlines()／open()／close()／toggleDiag() 都沒動。 */
  function tripRowRects(){
    const trip = document.getElementById("trip");
    const stop = trip && trip.querySelector(".stop");
    if (!trip) return ["(找不到 #trip)"];
    const leadw = getComputedStyle(trip).getPropertyValue("--leadw").trim();
    const lines = [
      "--leadw: " + (leadw || "(未設定，用 max-content)"),
      ".trip.stacked: " + trip.classList.contains("stacked"),
    ];
    if (!stop) return lines.concat(["(目前沒有展開的行程站可量)"]);
    [".lead", ".meta", ".win", ".stepper", ".warn", ".ops"].forEach(function(sel){
      const el = stop.querySelector(sel);
      if (!el){ lines.push(sel + ": (不存在)"); return; }
      const r = el.getBoundingClientRect();
      lines.push(sel + ": left=" + r.left.toFixed(1) + " width=" + r.width.toFixed(1));
    });
    return lines;
  }
  function measureDvh(){
    const p = document.createElement("div");
    p.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;left:0;top:0;width:0;height:100dvh;";
    document.body.appendChild(p);
    const h = p.getBoundingClientRect().height;
    document.body.removeChild(p);
    return h;
  }
  function measureSafeArea(){
    const p = document.createElement("div");
    p.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;left:0;top:0;" +
      "padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);";
    document.body.appendChild(p);
    const cs = getComputedStyle(p);
    const top = parseFloat(cs.paddingTop) || 0;
    const bottom = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(p);
    return {top:top, bottom:bottom};
  }
  function rectLine(id){
    const el = document.getElementById(id);
    if (!el) return id + ": (找不到元素)";
    const r = el.getBoundingClientRect();
    return id + ": top=" + r.top.toFixed(1) + " bottom=" + r.bottom.toFixed(1) +
           " height=" + r.height.toFixed(1) + "  [" + OUTLINE[id][1] + "框]";
  }
  function refresh(){
    if (!overlay) return;
    const bar = document.querySelector(".bar");
    overlay.style.top = (bar ? bar.getBoundingClientRect().bottom : 0) + "px";
    const dvh = measureDvh();
    const sa = measureSafeArea();
    const rootCS = getComputedStyle(document.documentElement);
    const vv = window.visualViewport;
    const standalone = matchMedia("(display-mode: standalone)").matches;
    /* 修正後 .app 實高：直接讀 #app 的 getBoundingClientRect().height 跟
       screen.height 對照，讓本人一眼看出缺口有沒有補滿（目標＝這行的差值趨近
       0，本人實測缺口原本是 59px）。__iosStandaloneFix 是上面那層 JS 防線寫的
       全域狀態，這裡只讀不寫。 */
    const fix = window.__iosStandaloneFix || {};
    const appElNow = document.getElementById("app");
    const appHNow = appElNow ? appElNow.getBoundingClientRect().height : null;
    const screenH = (window.screen && window.screen.height != null) ? window.screen.height : null;
    /* 2026-08-22 新增（HANDOFF §6.27，本人橫向截圖回報地圖下緣與行程列之間
       多出空白）：screen.width／orientation media feature——判斷「橫向」不能
       只看 screen.width>screen.height（部分 iOS 版本轉向不互換，這個比較本身
       可能就是錯的），額外印 orientation media feature 的判讀當對照組，兩者
       不一致就是實測到「screen.* 不可信」這個怪癖本身，不用再猜。行內
       style.height 三行是「清殘留」這個修法有沒有生效的直接證據：橫向下這三
       行應該全是空字串（表示 clearInline() 真的清乾淨了），若還殘留舊的 px
       值，就是本輪防禦性修法沒接住的漏網案例。 */
    const screenW = (window.screen && window.screen.width != null) ? window.screen.width : null;
    const orientPortrait = window.matchMedia ? matchMedia("(orientation:portrait)").matches : null;
    const lines = [
      "== 真機診斷（長按 logo 3 秒關閉）==",
      "innerWidth/innerHeight: " + innerWidth + " / " + innerHeight,
      "visualViewport.height: " + (vv ? vv.height.toFixed(1) : "(不支援)"),
      "100dvh 實測: " + dvh.toFixed(1) + "px",
      "screen.width/height: " + (screenW != null ? screenW : "(不支援)") + " / " + (screenH != null ? screenH : "(不支援)"),
      "orientation media feature: " + (orientPortrait == null ? "(不支援)" : (orientPortrait ? "portrait" : "landscape")),
      "safe-area-inset-top 實測: " + sa.top.toFixed(1) + "px",
      "safe-area-inset-bottom 實測: " + sa.bottom.toFixed(1) + "px",
      "display-mode standalone: " + standalone,
      "iOS standalone 缺口修正(JS層): " + (fix.active
        ? ("啟用，已設高 " + fix.appliedH + "px")
        : ("未啟用" + (fix.gap != null ? "（量到 gap=" + fix.gap.toFixed(1) + "px，不在 15~100 容忍範圍）" : standalone ? "（尚未量測，或非 portrait 不適用）" : "（非 standalone，不需要）"))),
      "修正後 .app 實高: " + (appHNow != null ? appHNow.toFixed(1) + "px" : "(找不到 #app)") +
        (screenH != null && appHNow != null ? "　缺口(screen.height－app實高)=" + (screenH - appHNow).toFixed(1) + "px" : ""),
      "html/body/#app 行內 style.height（應為空字串，非空＝殘留）: " +
        JSON.stringify(document.documentElement.style.height) + " / " +
        JSON.stringify(document.body.style.height) + " / " +
        JSON.stringify(appElNow ? appElNow.style.height : null),
      "--barh: " + rootCS.getPropertyValue("--barh").trim(),
      "--tripup: " + (rootCS.getPropertyValue("--tripup").trim() || "(未設定)"),
      "",
      rectLine("app"),
      rectLine("main"),
      rectLine("panel"),
      rectLine("stage"),
      rectLine("map"),
      rectLine("trip"),
      "",
      "== .trip 展開區欄位（第一個行程站）==",
    ].concat(tripRowRects());
    overlay.querySelector("#diagText").textContent = lines.join("\n");
  }
  function applyOutlines(on){
    Object.keys(OUTLINE).forEach(function(id){
      const el = document.getElementById(id);
      if (!el) return;
      el.style.outline = on ? ("2px solid " + OUTLINE[id][0]) : "";
      el.style.outlineOffset = on ? "-2px" : "";
    });
  }
  function open(){
    diagOn = true;
    applyOutlines(true);
    overlay = document.createElement("div");
    overlay.id = "diagOverlay";
    overlay.style.cssText =
      "position:fixed;left:0;right:0;bottom:0;top:0;z-index:99999;" +
      "background:rgba(10,10,10,.88);color:#9f9;" +
      "font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;" +
      "padding:10px 14px 14px;overflow:auto;-webkit-user-select:text;user-select:text;";
    const legend = document.createElement("div");
    legend.style.cssText = "margin-bottom:8px;color:#fff;";
    legend.innerHTML = "圖例：<span style='color:#e33'>■app</span> " +
      "<span style='color:#2a2'>■main</span> <span style='color:#39f'>■panel</span> " +
      "<span style='color:#0cc'>■stage</span> <span style='color:#c0c'>■map</span> " +
      "<span style='color:#f90'>■trip</span>　（長按 logo 3 秒關閉）";
    const pre = document.createElement("pre");
    pre.id = "diagText";
    pre.style.cssText = "margin:0;white-space:pre-wrap;word-break:break-all;";
    overlay.appendChild(legend);
    overlay.appendChild(pre);
    document.body.appendChild(overlay);
    refresh();
    diagTimer = setInterval(refresh, 400);
    addEventListener("resize", refresh);
  }
  function close(){
    diagOn = false;
    applyOutlines(false);
    clearInterval(diagTimer); diagTimer = null;
    removeEventListener("resize", refresh);
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = null;
  }
  function toggleDiag(){ if (diagOn) close(); else open(); }

  const logo = document.getElementById("logo");
  if (logo){
    let pressTimer = null, sx = 0, sy = 0, moved = false;
    const HOLD_MS = 3000, TOL = 14;
    function begin(x, y){
      moved = false; sx = x; sy = y;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(function(){ if (!moved) toggleDiag(); }, HOLD_MS);
    }
    function trackMove(x, y){
      if (Math.abs(x - sx) > TOL || Math.abs(y - sy) > TOL){ moved = true; clearTimeout(pressTimer); }
    }
    function cancelPress(){ clearTimeout(pressTimer); }
    logo.addEventListener("touchstart", function(e){ const t = e.touches[0]; begin(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchmove", function(e){ const t = e.touches[0]; trackMove(t.clientX, t.clientY); }, {passive:true});
    logo.addEventListener("touchend", cancelPress);
    logo.addEventListener("touchcancel", cancelPress);
    logo.addEventListener("mousedown", function(e){ begin(e.clientX, e.clientY); });
    logo.addEventListener("mousemove", function(e){ if (pressTimer) trackMove(e.clientX, e.clientY); });
    logo.addEventListener("mouseup", cancelPress);
    logo.addEventListener("mouseleave", cancelPress);
    logo.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }
})();
</script>
</body>
