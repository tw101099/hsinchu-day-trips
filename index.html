 "town": "新竹縣關西鎮", "theme": "heritage", "kind": "古蹟", "lat": 24.7887356, "lng": 121.1682465, "coord_conf": "high", "diff": "開車", "time": "1 小時（含導覽）", "drive": "從新竹市區約 35 分", "desc": "建於 1904 年的關西上南片客家伙房，為新竹縣歷史建築。早年作為家族私塾書房使用，建築保留一堂二橫格局，正身與廊道裝飾有極為細膩的客家交趾陶、石雕、木雕與磚雕工藝，門前即為開闊的鳳山溪稻田景觀。", "season": "", "note": "由羅家後人經營，參觀與導覽需事先預約（不接受無預約入內），也可訂住宿。門口空地可停 3–5 台車。", "source": "https://www.hsinchu-travel.tw/", "far": false, "route": "tai3-guanxi", "tags": ["需預約", "老宅"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "p6b800dda"}, {"name": "關西鎮農會仙草加工廠", "town": "新竹縣關西鎮", "theme": "heritage", "kind": "古蹟", "lat": 24.803546417300282, "lng": 121.16270067301132, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 30 分", "desc": "關西是全台仙草種植面積最大的地方，農會的加工廠開放參觀製程、免費喝仙草茶，也可以做仙草凍 DIY。", "season": "11–12 月關西仙草花季（花田在周邊）", "note": "免費入場；平日 08:00–17:00、假日 09:00–17:00。DIY 需先報名。", "source": "https://html.duckduckgo.com/html/?q=%E9%97%9C%E8%A5%BF%E9%8E%AE%E8%BE%B2%E6%9C%83%E4%BB%99%E8%8D%89%E5%8A%A0%E5%B7%A5%E5%BB%A0", "far": false, "route": "tai3-guanxi", "tags": ["雨天", "親子", "需預約", "手作"], "stay_h": 1.0, "drive_min": 30, "total_h": 2.0, "season_months": [11, 12], "season_type": "add", "id": "pb6353b52"}, {"name": "關西老街", "town": "新竹縣關西鎮", "theme": "oldstreet", "kind": "老街", "lat": 24.78953088497398, "lng": 121.17668393586939, "coord_conf": "high", "diff": "散步", "time": "中正路一段約 300 公尺，含太和宮 40 分", "drive": "從新竹市區約 30 分", "desc": "位於關西中正路一段，舊名「石店子」，全長約三百公尺，為關西最早發展的客庄商業街肆。沿街保留日治大正至戰後初期的連續紅磚拱廊與木構長條街屋，街尾坐落有百年信仰中心太和宮，街頭鄰近日式關西分駐所宿舍群，近年多座老屋活化為獨立書店與文創藝文空間。", "season": "", "note": "關西是台灣仙草主產地，仙草雞與仙草凍是本地吃的；另有粄條與客家菜包。街道窄，停中正路外圍或鎮公所周邊。", "source": "https://zh.wikipedia.org/wiki/%E9%97%9C%E8%A5%BF%E5%A4%AA%E5%92%8C%E5%AE%AE", "far": false, "route": "tai3-guanxi", "gmap": "關西老街（石店子）", "stay_h": 0.67, "drive_min": 30, "total_h": 1.7, "season_months": [], "id": "pf399abb8"}, {"name": "外鳥嘴山", "town": "新竹縣關西鎮", "theme": "trail-mountain", "kind": "步道", "diff": "挑戰", "time": "馬武督園區登山口起，來回約 5–6 小時", "drive": "從新竹市區約 60 分", "desc": "標高 1,350 公尺，因山勢由大漢溪遠眺形似突出之鳥喙而得名。路線多由關西馬武督探索森林起登，單程約 2.5 公里，前半段穿梭於高聳柳杉林中，後半段為原始陡坡與樹根山徑；山頂為裸露巨石岩稜，具備開闊視野，可居高臨下俯瞰石門水庫集水區湖光山色與周邊山巒。", "note": "另一端可從水田林道上，那條要 7–8 小時。要走園區得先買門票。", "season": "", "source": "https://ballenf.pixnet.net/blog/post/42643619", "lat": 24.765698552438298, "lng": 121.29280508465914, "coord_conf": "high", "route": "tai3-guanxi", "gmap": "306新竹縣關西鎮錦山里外鳥嘴山", "nav": [24.768105660361392, 121.28144965687265], "tags": ["展望"], "stay_h": 6.0, "drive_min": 60, "total_h": 8.0, "season_months": [], "id": "p05031528"}, {"name": "打牛崎登山步道", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "步道", "lat": 24.7915629818482, "lng": 121.20541416931823, "coord_conf": "high", "diff": "健行", "time": "2.5 公里約 1 小時 20 分，海拔 220–381 公尺", "drive": "從新竹市區約 35 分", "desc": "位於關西東山里竹28鄉道旁，全長約 3.5 公里，早年因牛車運送農產上下陡坡需鞭打牛隻而得名。步道前段包含約三百公尺需拉繩攀爬的陡坡好漢坡，稜線穿行於相思林蔭間，山頂老虎山海拔約 395 公尺，可俯瞰鄰近丘陵谷地。", "season": "", "note": "藥師佛禪寺有停車場。近期回報步道維護欠佳、部分防護設施損毀、蚊蟲多，要做好防蚊。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=976", "far": false, "route": "tai3-guanxi", "tags": ["展望"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "p742af992"}, {"name": "渡南古道", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "古道", "diff": "散步", "time": "單程約 600 公尺，來回 40 分", "drive": "從新竹市區約 35 分", "desc": "位於鳳山溪南岸山腰，早年為關西渡船頭通往南山里的農產保甲路，荒廢數十年後由在地志工以手作步道工法修復重啟。步道全長約 0.6 公里，沿途林蔭茂密、地勢平緩，途經石砌伯公廟與灌溉水圳，南端出山口可順訪百年客家夥房羅屋書院。", "note": "土徑卵石雨後濕滑；無正式停車場，車停渡船頭橋或南山大橋路邊。", "season": "4–5 月桐花", "source": "http://egoldenyears.com/93698/", "lat": 24.78553559187445, "lng": 121.17384653068176, "coord_conf": "high", "route": "tai3-guanxi", "stay_h": 0.67, "drive_min": 35, "total_h": 1.8, "season_months": [4, 5], "season_type": "add", "id": "p45e2e83d"}, {"name": "石光古道（老虎山步道）", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "古道", "diff": "健行", "time": "單程 2.2 公里；接面埔頂山、露德聖母朝聖地 O 繞約 5 公里 2.5 小時", "drive": "從新竹市區約 35 分", "desc": "具有近兩百年歷史的客庄農產商道，早年為關西石光（石岡子）通往龍潭的挑茶舊路，全長約 2.2 公里。步道由客家夥房豫章堂起登，沿途保留手作鵝卵石階與相思林，行經海拔 295 公尺的面埔頂山三角點，終點可順訪天主教露德聖母朝聖地。", "note": "免費；車停石光國中附近，登山口在羅家古厝旁、指標不明顯。", "season": "4–5 月桐花", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1038", "lat": 24.818, "lng": 121.1371, "coord_conf": "high", "route": "tai3-guanxi", "nav": [24.813852, 121.131017], "tags": ["展望"], "stay_h": 2.5, "drive_min": 35, "total_h": 3.7, "season_months": [4, 5], "season_type": "add", "id": "pc625be59"}, {"name": "石牛山", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "步道", "lat": 24.7935, "lng": 121.2533, "coord_conf": "high", "diff": "挑戰", "time": "4 公里約 2.5 小時，海拔 281–671 公尺、落差 390 公尺", "drive": "從新竹市區約 50 分", "desc": "671 公尺小百岳，山形如巨牛坐臥；山頂近 360 度視野，石門水庫、大漢溪河谷、羅馬公路與關西鳥嘴山一次收進來，天氣好望得到大霸尖山。路徑含溪床、岩壁與拉繩段。", "season": "", "note": "Google 標「地點已不存在」但山與步道都正常。石福宮登山口旁私人停車場 100 元／次；左線平緩、右線腰繞陡峭多拉繩，新手與雨季走左線。溪床岩石覆青苔極滑，建議手套與止滑鞋。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=580", "far": false, "route": "tai3-guanxi", "nav": [24.78497, 121.249249], "tags": ["展望"], "stay_h": 2.5, "drive_min": 50, "total_h": 4.2, "season_months": [], "id": "p5d65dea7"}, {"name": "赤柯山・東獅頭山", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "步道", "lat": 24.7567, "lng": 121.2015, "coord_conf": "high", "diff": "健行", "time": "O 形約 6 公里 3 小時，海拔 213–463 公尺", "drive": "從新竹市區約 45 分", "desc": "赤柯山三等三角點 454 公尺，因滿山赤柯樹得名；稜線有雙層木造涼亭，途中看得到水泥公司舊纜車遺構，遠眺可及加里山。", "season": "", "note": "多從太元宮旁玉山福德祠起登，另一入口在元山國小；四個出入口可依體力調整長度，部分路段設拉繩。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1107", "far": false, "route": "tai3-guanxi", "nav": [24.760734, 121.206309], "tags": ["展望"], "stay_h": 3.0, "drive_min": 45, "total_h": 4.5, "season_months": [], "id": "p4f28d753"}, {"name": "關西櫻花秘境", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "觀景", "lat": 24.80310590485261, "lng": 121.14187221718745, "coord_conf": "high", "diff": "散步", "time": "約 30–40 分鐘", "drive": "從新竹市區約 35 分", "desc": "坪林國小旁農塘小坡上，地主范先生自種十餘棵寒櫻已十多年，開放私人土地免費賞櫻；花期整片粉色壓在池畔小坡上，不必翻山。", "season": "2–3 月寒櫻", "note": "免費、24 小時開放但無照明；小路窄不好停車，建議停坪林國小到「福基」站牌間路邊。現場無廁所（可用元和宮）。花林在田間土坡，注意腳步。", "source": "https://golovetraveling.com/guanxi-sakura/", "far": false, "route": "tai3-guanxi", "stay_h": 0.67, "drive_min": 35, "total_h": 1.8, "season_months": [2, 3], "season_type": "core", "id": "pad4911c8"}, {"name": "馬武督探索森林", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "步道", "diff": "散步", "time": "園區 2–3 小時", "drive": "從新竹市區約 60 分", "desc": "元素步道平緩，綠光小學、虹橋瀑布、馬武督瀑布串起來就是一天。柳杉林很整齊。", "note": "門票 120（優待 60）。6–9 月平日 8:30–17:30、假日 8:00–18:00；10–5 月平日 9:00–17:00、假日 8:30–17:30。", "season": "4–5 月桐花", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=770", "lat": 24.76797, "lng": 121.28142, "coord_conf": "high", "route": "tai3-guanxi", "tags": ["親子", "瀑布"], "stay_h": 3.0, "drive_min": 60, "total_h": 5.0, "season_months": [4, 5], "season_type": "add", "id": "pbad3bdb7"}, {"name": "高遶溪古圳步道", "town": "桃園市復興區", "lat": 24.79027291905577, "lng": 121.27808824803137, "theme": "trail-near", "kind": "步道", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 55 分", "route": "tai3-guanxi", "desc": "位於羅馬公路桃118線旁，步道全長約 1.05 公里，前身為泰雅族高遶部落獵徑與日治時期開鑿的谷倉角灌溉古圳。全線穿梭於桂竹林與柳杉林間，坡度平緩，中段建有一座橫跨高遶溪谷的二十一公尺鋼索繩橋，林相完整且綠蔭遮蔽。", "note": "步道起點位於羅馬公路桃118線 41K 處，僅能路邊臨停；天空繩橋限載 5 人，遇強風大雨請勿通行。", "season": "", "source": "", "coord_conf": "high", "stay_h": 1.5, "drive_min": 55, "total_h": 3.3, "season_months": [], "id": "p2bc8b982"}, {"name": "黃劫古道（黃劫步道）", "town": "新竹縣關西鎮", "theme": "trail-near", "kind": "古道", "diff": "散步", "time": "1.4 公里，35 分", "drive": "從新竹市區約 35 分", "desc": "位於關西仁安里與龍潭交界丘陵，相傳以昔日在此採集草藥救人的青草師黃劫命名，全長約 1.4 公里。步道穿梭於紅土台地茶園與相思林間，坡度平緩，步道出口可順道探訪以天然泉水聞名的水母娘娘廟與早期仁安磚窯廠遺構。", "note": "石階與水泥路，雙向進出。登山口：仁安里集會所或水母娘道路口。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1818", "lat": 24.80853, "lng": 121.18879, "coord_conf": "high", "route": "tai3-guanxi", "nav": [24.802549, 121.187344], "stay_h": 0.58, "drive_min": 35, "total_h": 1.7, "season_months": [], "id": "p1890d6a4"}, {"name": "Project C3 Cafe", "town": "苗栗縣卓蘭鎮", "lat": 24.32409, "lng": 120.82429, "theme": "cafe", "kind": "咖啡廳", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 75 分", "desc": "卓蘭「丘家盆栽教室」內附設的日式庭園咖啡廳，由三位年輕人共同創立，店名 C3 取自 Cycling（單車）、Coffee（咖啡）、Clay（陶藝／盆栽）三個元素。禪風日式庭院搭榻榻米座位，主打單品咖啡，複合經營陶藝與盆栽教室。", "note": "平日 10:00–17:00、假日 09:00–18:00，週四公休，有汽機車停車位，建議先預約。", "season": "", "source": "https://upssmile.com/251443/project-c3-cafe", "route": "taian", "tags": ["需預約", "手作"], "stay_h": 1.5, "drive_min": 75, "total_h": 4.0, "season_months": [], "id": "project-c3-cafe"}, {"name": "大湖酒莊", "town": "苗栗縣大湖鄉", "lat": 24.429200344673667, "lng": 120.86811192570998, "theme": "food", "kind": "酒莊", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 55 分", "route": "taian", "desc": "大湖地區農會經營的草莓酒莊，樓上是草莓文化館，講大湖草莓的產業史；樓下賣草莓酒、草莓香腸與各式草莓加工品，可試飲試吃。", "note": "就在台3 線邊，草莓季假日車位緊張。", "season": "草莓季 12 月到隔年 4 月", "source": "", "coord_conf": "high", "tags": ["雨天", "親子", "採果"], "stay_h": 1.0, "drive_min": 55, "total_h": 2.8, "season_months": [1, 2, 3, 4, 12], "season_type": "add", "id": "p5598e942"}, {"name": "山吻泉餐廳", "town": "苗栗縣泰安鄉", "theme": "food", "kind": "餐飲", "lat": 24.4682, "lng": 120.953, "coord_conf": "high", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 70 分", "desc": "泰安鄉往溫泉區路上的山中餐廳，山產與溪魚料理，是這份清單裡最南、最深的一個點，只有安排大湖／泰安溫泉整日行程時才順路。", "season": "冬季為泰安溫泉旺季，用餐與住宿都需提前", "note": "單程接近 2 小時上限；山路彎多", "source": "", "far": true, "route": "taian", "stay_h": 1.5, "drive_min": 70, "total_h": 3.8, "season_months": [1, 2, 12], "season_type": "add", "id": "p1fd3541a"}, {"name": "洪台玉豆腐店", "town": "苗栗縣大湖鄉", "lat": 24.44653, "lng": 120.90441, "theme": "food", "kind": "豆腐／小吃", "diff": "開車", "time": "約 30–40 分鐘", "drive": "從新竹市區約 60 分", "desc": "清安洗水坑豆腐老街上的豆製品小吃店，招牌是脆皮臭豆腐、麻辣臭豆腐與黑白綜合豆花，豆香濃郁、口感滑順。", "note": "營業時間約上午 11:00 起、賣完為止，無固定打烊時間；電話 037-941017。", "season": "", "source": "https://nurseilife.cc/beancurd/", "route": "taian", "stay_h": 0.67, "drive_min": 60, "total_h": 2.7, "season_months": [], "id": "pe6d57f34"}, {"name": "穗花の山奈-善揚蔬食", "town": "苗栗縣三義鄉", "lat": 24.38567, "lng": 120.82161, "theme": "food", "kind": "山景合菜", "diff": "開車", "route": "taian", "time": "用餐約 1.5–2 小時", "drive": "從新竹市區約 70 分", "desc": "薑麻園聚落西側、行政區已跨進三義鄉雙潭村的山景餐廳，海拔約 760 公尺，離薑麻園遊客中心直線只有兩百多公尺。店名的「穗花山奈」是野薑花類（蝴蝶薑）的學名，「山奈」也諧音閩南語的「山內」。老闆夫婦本是果農，走無菜單合菜路線、菜蔬自種現採。座位面向關刀山，晴天可遠眺通霄、苑裡一帶海線，陰雨天反而看得到低海拔雲海。", "note": "Google 上店名已掛「善揚蔬食」，但查得到的公開遊記（2019–2020 年）記載的仍是含白斬雞的客家合菜——是否已轉為全蔬食查不到答案，**去之前務必先電話確認菜色與是否需預約**。網路上的營業時間為 10:00–17:00、11:30 起供餐、週四公休並採預約制，但這些資訊已有數年、可能已變動。園區內有停車位。", "season": "", "source": "https://margaret.tw/miaoli-restaurant-gingerlily/", "tags": ["需預約", "蔬食", "展望"], "stay_h": 2.0, "drive_min": 70, "total_h": 4.3, "season_months": [], "id": "p0e6ff6af"}, {"name": "糕粿粄之家", "town": "苗栗縣泰安鄉", "lat": 24.44632, "lng": 120.90546, "theme": "food", "kind": "客家糕點", "diff": "開車", "time": "約 20–30 分鐘", "drive": "從新竹市區約 60 分", "desc": "清安豆腐老街上的手工客家粿專賣店，芋頭口味是招牌，另有紅豆、艾草、桂圓紫米、抹茶等固定口味，每顆約 35 元，菜單依現場供應調整。", "note": "營業時間每日 10:00–17:00；公休日不明，電話 0985-476931 建議先電話確認。", "season": "", "source": "https://today.line.me/tw/v3/article/8n5NZrZ", "route": "taian", "stay_h": 0.5, "drive_min": 60, "total_h": 2.5, "season_months": [], "id": "pf898dc30"}, {"name": "泰雅原住民文化產業園區", "town": "苗栗縣泰安鄉", "lat": 24.4683664, "lng": 120.9438347, "theme": "heritage", "kind": "文化園區", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 70 分", "route": "taian", "desc": "泰安溫泉區的泰雅族文化園區，介紹在地泰雅族的文化與工藝；與虎山溫泉會館幾乎相鄰，可排進同一條動線。", "note": "開放時間與展覽內容出發前先確認。", "season": "", "source": "", "coord_conf": "high", "tags": ["雨天", "親子", "溫泉", "玩水"], "stay_h": 1.0, "drive_min": 70, "total_h": 3.3, "season_months": [], "id": "pd10c08a3"}, {"name": "洗水坑豆腐街", "town": "苗栗縣泰安鄉", "theme": "oldstreet", "kind": "老街", "lat": 24.44651, "lng": 120.90513, "coord_conf": "high", "diff": "散步", "time": "「ㄚ」字形街道約 300 公尺，40 分", "drive": "從新竹市區約 60 分", "desc": "位於泰安鄉公所旁汶水溪與洗水坑溪匯流處，為山地鄉境內少見的客家拓墾聚落。「洗水」源自客語清澈溪水之意，街廓依河谷呈「丁」字形分佈，長約二百公尺；當地居民引用洗水溪甘質水源循古法手工釀製各式豆腐，為前往泰安溫泉區的重要歷史街庄。", "season": "4–5 月桂竹筍", "note": "常被寫成「南庄洗水坑」，實際在泰安鄉清安村，從南庄還要再往南約 40 分。店家多下午 4–5 點就收、部分週一公休。街口有停車空地。", "source": "https://www.miaolitravel.net/", "far": false, "route": "taian", "stay_h": 0.67, "drive_min": 60, "total_h": 2.7, "season_months": [4, 5], "season_type": "add", "id": "p23357d24"}, {"name": "北坑溪古道", "town": "苗栗縣泰安鄉", "lat": 24.47212, "lng": 120.9821, "theme": "trail-mountain", "kind": "古道", "diff": "挑戰", "time": "全線封閉中，目前無法完整走完；局部路段視山友回報而定", "drive": "從新竹市區約 75 分", "desc": "泰雅族傳統遷徙與樟腦採集古道，大正 12 年（1923）修築、14 年（1925）完工，全長約 74 公里，北起新竹五峰田村台、南抵苗栗泰安梅園二本松，沿線留有隘寮與理蕃遺跡，曾是雪霸國家公園內最熱門的健行古道之一。", "note": "⚠ 因歷年地震颱風（含 2004 年風災）造成多處坍方、路基流失，雪霸國家公園已公告全線封閉、無法全程通行，僅零星路段被登山客局部走訪，不建議規劃為可行走路線；出發前請至雪霸國家公園官網確認最新公告。", "season": "", "source": "https://www.spnp.gov.tw/News4.aspx?n=14470&sms=12570", "route": "taian", "stay_h": 2.0, "drive_min": 75, "total_h": 4.5, "season_months": [], "id": "pdfe7b6c0"}, {"name": "薑麻園", "town": "苗栗縣大湖鄉", "lat": 24.38626, "lng": 120.82392, "theme": "trail-mountain", "kind": "休閒農業區", "diff": "散步", "route": "taian", "time": "約 1.5–2 小時", "drive": "從新竹市區約 70 分", "desc": "苗130縣道 25–27K 一帶的山中農村聚落，海拔約 700–800 公尺，坐落在關刀山山系稜線上，橫跨大湖鄉栗林村與三義鄉雙潭村。清代起就種薑，「薑麻」之名來自早年種薑與苧麻的生活，2007 年獲選全國十大經典農村；遊客中心賣在地薑製品與時令水果，並提供免費薑茶。旁邊的聖衡宮主祀關聖帝君，廟旁雲洞山有 838 公尺高的五層瞭望台與觀雲樓，360 度展望，是台灣少見的低海拔雲海與日出觀賞點。關刀山步道的登山口與穗花の山奈都在幾百公尺內，三個點串成一天剛好。", "note": "苗130縣道山區彎多路窄，會車要小心；遊客中心與聖衡宮前有停車空間，假日與草莓季車多。遊客中心 08:00–17:00。無大眾運輸直達。", "season": "11–3 月冷暖氣流交會時最容易看到雲海與日落雲瀑；11–3 月草莓、11–2 月柑橘、3–6 月桃李，秋冬是採薑與薑麻節的主季；4–5 月桐花。", "source": "https://130.org.tw/", "tags": ["展望", "夕陽", "採果"], "stay_h": 2.0, "drive_min": 70, "total_h": 4.3, "season_months": [1, 2, 3, 4, 5, 6, 11, 12], "season_type": "add", "id": "p4d310d66"}, {"name": "虎山（泰安）", "town": "苗栗縣泰安鄉", "lat": 24.482963, "lng": 120.994896, "theme": "trail-mountain", "kind": "步道", "diff": "挑戰", "time": "單程約 4.5 公里，來回約 4–5 小時", "drive": "從新竹市區約 75 分", "desc": "標高 1492 公尺，立有三等三角點，為泰安「水雲三星」之首。自溫泉區仰望為高聳直立的砂岩大岩壁，有「中級山大霸尖山」之稱。步道自水雲吊橋起登，前段沿溪腰繞，最後一公里為直升四百公尺的陡峭 ian", "desc": "位於卓蘭白布帆社區，沿大克山南稜修築，前身為日治時期「大克山隘勇線」的軍事砲台運補道。山徑沿大安溪峽谷岩稜陡升，林相原始且部分路段需拉繩攀爬，山頂砲台遺址保存石砌陣地與駁坎，可俯瞰大安溪河谷與卓蘭台地。", "note": "登山口位於白布帆社區產業道路旁，路邊僅能臨停數部車；山徑沿大安溪岩稜陡升需拉繩，建議攜帶手套。", "season": "", "source": "", "coord_conf": "high", "tags": ["展望"], "stay_h": 2.0, "drive_min": 85, "total_h": 4.8, "season_months": [], "id": "p240bd2d8"}, {"name": "雪霸國家公園管理處（汶水遊客中心）", "town": "苗栗縣大湖鄉", "theme": "trail-near", "kind": "觀景", "lat": 24.450481711789205, "lng": 120.87866878151381, "coord_conf": "high", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 55 分", "desc": "雪霸的門面館舍，展示櫻花鉤吻鮭與寬尾鳳蝶等園區特有種、雪山與大霸尖山的地形模型，園區內有小步道；是進大湖／泰安前補資訊的地方。", "season": "", "note": "免門票，週二休（遇假日順延）。旁邊即汶水老街。", "source": "https://zh.wikipedia.org/zh-tw/%E9%9B%AA%E9%9C%B8%E5%9C%8B%E5%AE%B6%E5%85%AC%E5%9C%92", "far": false, "route": "taian", "tags": ["雨天", "親子", "無障礙"], "stay_h": 1.5, "drive_min": 55, "total_h": 3.3, "season_months": [], "id": "p3f1bd75a"}, {"name": "冬瓜山瀑布", "town": "苗栗縣泰安鄉", "lat": 24.46354, "lng": 120.96586, "theme": "water", "kind": "步道／瀑布", "diff": "挑戰", "time": "官方估計來回約 160 分鐘（不含戲水時間）", "drive": "從新竹市區約 75 分", "desc": "官方名稱「冬瓜山登山步道」，沿打比厝溪而行，全長 1.6 公里、海拔 600–1,200 公尺、爬升約 600 公尺；沿途溪流有戲水點與潭深約 1.5–1.8 公尺的水潭，是熟門熟路者的溯溪野營地，步道終點原有一株號稱全台最大的千年櫸木。", "note": "⚠ 自 2026 年 7 月 14 日起因颱風災損公告暫停開放，目前無法進入，出發前務必查詢林務局台灣山林悠遊網最新公告；開放時不需入山證，但需涉溪或攀爬溪石。", "season": "", "source": "https://recreation.forest.gov.tw/Trail/RT?tr_id=046", "route": "taian", "tags": ["巨木", "避暑", "瀑布", "玩水"], "stay_h": 2.67, "drive_min": 75, "total_h": 5.2, "season_months": [], "id": "pdc81883b"}, {"name": "大湖石湯溫泉", "town": "苗栗縣大湖鄉", "lat": 24.40566, "lng": 120.87727, "theme": "water", "kind": "溫泉", "diff": "開車", "time": "露天大眾池不限時，湯屋約 1 小時", "drive": "從新竹市區約 60 分", "desc": "3000 坪峇里島風石砌露天風呂，美人湯（碳酸氫鈉泉）大眾池加沙灘戲水區，CP 值高，離大湖草莓園不遠，可以跟採草莓排同一天。", "note": "門票約 250 元（130 公分以下兒童約 150 元）；湯屋另計，一小時約 200 元；營業時間約 08:00–23:00，實際請以官方公告為準。", "season": "12–4 月是草莓季，可與大湖採草莓一起安排", "source": "https://www.stone-spa.com.tw/web1_about.php", "route": "taian", "tags": [" "https://hiking.biji.co/index.php?q=trail&act=detail&id=569", "far": false, "route": "toufen-city", "tags": ["展望"], "stay_h": 1.0, "drive_min": 40, "total_h": 2.3, "season_months": [4, 5], "season_type": "add", "id": "p7e59727d"}, {"name": "老崎古道（頭份後花園步道）", "town": "苗栗縣頭份市", "theme": "trail-near", "kind": "古道", "lat": 24.6805, "lng": 120.947, "coord_conf": "high", "diff": "健行", "time": "單程 1.3 公里、往返約 1 小時 15 分，落差 110 公尺", "drive": "從新竹市區約 30 分", "desc": "位於頭份市東北隅老崎紅土台地，全長約 2 公里，昔日為坪頂先民前往斗煥坪市集的交易路徑。步道穿行於台灣赤松林、楓香林與相思林蔭間，沿線設有慈母亭、楓林吊橋與早年軍事訓練場遺跡，最高點老崎坪頂山立有三等三角點。", "season": "秋末楓香轉紅；春櫻、4–5 月桐花、秋芒", "note": "入口在台124線 9.6K 斗煥國小旁巷道再進 350 公尺；步道須折返。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=858", "far": false, "route": "toufen-city", "tags": ["展望", "巨木"], "stay_h": 1.0, "drive_min": 30, "total_h": 2.0, "season_months": [4, 5], "season_type": "add", "id": "p2da9ad86"}, {"name": "造橋口山步道", "town": "苗栗縣造橋鄉", "theme": "trail-near", "kind": "古道", "lat": 24.6398, "lng": 120.8639, "coord_conf": "high", "diff": "散步", "time": "全程 3 公里約 1 小時，海拔僅 18–68 公尺", "drive": "從新竹市區約 35 分", "desc": "位於造橋火車站後方丘陵，環狀全長約 3 公里，為早期農民巡山之丘陵路徑。步道鋪設枕木階梯與泥土路，沿途串聯老庄山、菜瓜窩山與造橋口山等三座基石，並建有木造周生橋與瞭望平台，南端起點緊鄰百年造橋車站與日式宿舍群。", "season": "4–5 月桐花", "note": "南登山口在造橋國中旁、北登山口在清明福德祠旁；停車可停造橋國中，搭台鐵山線到造橋站步行約 400 公尺即到南口。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=507", "far": false, "route": "toufen-city", "tags": ["大眾運輸", "展望"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [4, 5], "season_type": "add", "id": "p5ba46bba"}, {"name": "鄭漢紀念步道", "town": "苗栗縣造橋鄉", "theme": "trail-near", "kind": "步道", "lat": 24.6532, "lng": 120.8471, "coord_conf": "high", "diff": "散步", "time": "全長 800 公尺，單程約 20 分", "drive": "從新竹市區約 35 分", "desc": "終點觀景平台俯瞰談文湖稻田、中港溪平原直到台灣海峽，也是海線鐵路 C 型彎道的知名拍攝點；紀念碑立於 1965 年，紀念前一年跳河救童溺斃的青年鄭漢，教育部長閻振興題「人溺己溺」。", "season": "稻作綠毯期約 4–5 月與 9–10 月", "note": "登山口在育達科技大學前的小巷內，巷口有小指標，巷內岔路左轉再走約 350 公尺。清單標三灣有誤，實際在造橋鄉。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1155", "far": false, "route": "toufen-city", "tags": ["展望", "夕陽", "看火車"], "stay_h": 0.33, "drive_min": 35, "total_h": 1.5, "season_months": [4, 5, 9, 10], "season_type": "add", "id": "pa243d985"}, {"name": "鹿廚坑步道", "town": "苗栗縣頭份市", "lat": 24.65642, "lng": 120.89151, "theme": "trail-near", "kind": "步道", "diff": "散步", "time": "全程 3.4 公里約 1 小時 20 分（內環 3 公里／外環 2 公里可自選）", "drive": "從新竹市區約 35 分", "desc": "位於頭份廣興里，舊名「鹿廚坑」源於早期先民在谷地設置捕鹿陷阱的歷史，步道系統長約 3.4 公里。山徑沿低矮丘陵稜線開闢，路面平整寬敞，穿行於相思林、油桐林與農塘之間，途經早期留存的歐式公園建築殘跡與客家山背伯公廟。", "note": "由廣興社區活動中心旁進入，全線為平緩泥土路與農路；步道岔路多，建議沿主要指標行走。", "season": "4–5 月沿途桐花林是社區主打的賞桐點。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1243", "route": "toufen-city", "tags": [], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [4, 5], "season_type": "add", "id": "pb14a913e"}, {"name": "永和山水庫", "town": "苗栗縣頭份市", "theme": "water", "kind": "水庫", "diff": "散步", "time": "環湖公路一圈約 13 公里（單車）", "drive": "從新竹市區約 35 分", "desc": "台灣第一座沒有水門和水閘的水庫（舊名東興水庫）。環湖公路兼自行車道，沿途小公園、百年楓樹、茄苳、挑擔古道，還有因建水庫遷來的 27 位土地公一整排。", "note": "水源保護區，禁止進入水域、禁止垂釣戲水；沿線沒有停車場只能路邊找空地，廁所商店要回三灣或頭份。", "season": "4–5 月桐花，滿山油桐", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1602", "lat": 24.66111, "lng": 120.92278, "coord_conf": "high", "route": "toufen-city", "tags": ["巨木", "展望", "自行車"], "stay_h": 0.5, "drive_min": 35, "total_h": 1.7, "season_months": [4, 5], "season_type": "add", "id": "p4bbfea93"}, {"name": "龍昇綠龍隧道（龍昇湖）", "town": "苗栗縣造橋鄉", "theme": "water", "kind": "步道", "lat": 24.63511140789278, "lng": 120.8243550441761, "coord_conf": "high", "diff": "散步", "time": "環湖 2.2 公里約 45 分", "drive": "從新竹市區約 30 分", "desc": "十一公頃的龍昇湖環湖步道上搭了 250 公尺瓜棚隧道，頂上垂著南瓜、蒲瓜、絲瓜，走進去整條是綠的；沿途另有古廟與水鳥。", "season": "5–7 月瓜果盛產，隧道最好看", "note": "免門票免申請；非瓜季只剩空棚架。導航設「靈天禪寺」較準。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1418", "far": false, "route": "toufen-city", "nav": [24.63521784917707, 120.82517805049476], "nav_target": "龍昇綠龍隧道 361苗栗縣造橋鄉13號 龍昇湖畔", "tags": ["親子"], "stay_h": 0.75, "drive_min": 30, "total_h": 1.8, "season_months": [5, 6, 7], "season_type": "core", "id": "p7eb4280c"}, {"name": "噢哈娜咖啡屋", "town": "苗栗縣西湖鄉", "lat": 24.56018, "lng": 120.75766, "theme": "cafe", "kind": "景觀咖啡", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 40 分", "desc": "西湖鄉金獅村的紫色主題咖啡莊園，整園以紫色布景串起來——紫色傘海、紫藤花裝飾隧道、小歐洲花園、棒棒糖步道，園區裡還養了羊駝。以拍照為主，咖啡屋內供應飲品、甜點和簡單輕食。", "note": "目前只在週六、日 09:00–17:30 營業（Google 顯示平日休息，與早期部落格寫的公休日不同，出發前再確認）；門票 200 元可折抵 100 元；有停車場、不能刷卡。", "season": "紫藤約在春季 3–4 月開花，其餘時間以紫色人造造景為主。", "source": "https://shin.tw/miaoli-ohana/", "route": "xihu", "tags": ["親子"], "stay_h": 1.5, "drive_min": 40, "total_h": 2.8, "season_months": [3, 4], "season_type": "add", "id": "p479063d0"}, {"name": "柴燒卡帕尼", "town": "苗栗縣西湖鄉", "lat": 24.56348, "lng": 120.74994, "theme": "food", "kind": "窯烤麵包", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 40 分", "desc": "西湖鄉山路邊的柴燒窯烤店，凌晨兩點就點龍眼木起窯，一個麵包從養酵種到出爐走完約 48 小時，只加鮮奶不加水，招牌是柴燒鮮奶吐司和酒釀核桃麵包。餐點主打窯烤大盆雞和土耳其餅，用餐附無限供應的滷肉飯與蘿蔔味噌湯。", "note": "週二、三、五公休；週四、週一 11:00–17:00，週六日 11:00–16:00；大盆雞要先預約；寵物友善，有停車位。", "season": "", "source": "https://minimiigo.com/campagne/", "route": "xihu", "tags": ["寵物", "需預約"], "stay_h": 1.5, "drive_min": 40, "total_h": 2.8, "season_months": [], "id": "p973e24e0"}, {"name": "田媽媽祕密花園", "town": "苗栗縣西湖鄉", "lat": 24.55168, "lng": 120.78605, "theme": "food", "kind": "田媽媽合菜", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 45 分", "desc": "農委會輔導的「田媽媽」班經營的餐廳，開在西湖鄉金獅村的山坡上，用在地食材做套餐與合菜，常見的有迷迭香烤腿、香茅東坡肉、麻油雞。園區腹地大，有草皮和花圃可以讓小孩跑，也開手作 DIY 課程。", "note": "週二公休，約 10:00 開門、供餐 11:00–17:00；人多建議先訂位；有停車空間。", "season": "", "source": "https://yoke918.tw/tian-ma/", "route": "xihu", "tags": ["親子", "需預約", "野餐", "手作"], "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "p1de0d7b3"}, {"name": "劉恩寬古宅（彭城堂）", "town": "苗栗縣西湖鄉", "lat": 24.52891, "lng": 120.75085, "theme": "heritage", "kind": "古厝", "diff": "開車", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "始建於清乾隆二十五年（1760年），為西湖四湖劉氏宗族之核心祠堂（彭城堂），屬格局完整的三合院客家伙房。建築採燕尾翹脊與綠色琉璃瓦，外埕完整保留咸豐與光緒年間之兩對石刻貢生旗杆座，正廳內懸有多面清代文魁功名執事牌。", "note": "為劉氏家族私有宗祠、仍在使用中，非常態開放的觀光景點，沒有售票與導覽；一般只能在外埕欣賞建築與旗杆座石，入內須經家族同意，遇祭祀活動請勿打擾。鄉道狹窄，停車請找路邊安全處。", "season": "", "source": "https://www.xihu.gov.tw/News_Content.aspx?n=3604&s=135540", "gmap": "劉恩寬古宅", "route": "xihu", "tags": ["老宅"], "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [], "id": "pa63a554f"}, {"name": "吳濁流藝文館", "town": "苗栗縣西湖鄉", "lat": 24.52467, "lng": 120.77033, "theme": "heritage", "kind": "文學館", "diff": "開車", "time": "約 40 分", "drive": "從新竹市區約 50 分", "desc": "紀念《亞細亞的孤兒》作者吳濁流的地方文學館，2003 年落成，設於西湖鄉五湖社區活動中心二樓。吳濁流 1922 年因文章被降調到四湖公學校（今西湖國小）任教，之後又輾轉任教於五湖分教場，前後在西湖鄉待了十五年。館內分兩間：一間珍藏本室存放吳濁流的著作、手稿與照片；另一間展示空間定期更換主題並開放創作者預約策展。", "note": "免費入館。開放週二至週日 10:00–18:00，每週一與春節休館。館舍規模不大，是社區型小館，前往前建議先致電西湖鄉公所確認當日開放。", "season": "", "source": "https://www.xihu.gov.tw/News_Content.aspx?n=3604&s=135547", "route": "xihu", "tags": ["雨天"], "stay_h": 0.67, "drive_min": 50, "total_h": 2.3, "season_months": [], "id": "pca5db0de"}, {"name": "西湖老街（店仔街）", "town": "苗栗縣西湖鄉", "lat": 24.55777, "lng": 120.75703, "theme": "heritage", "kind": "老街", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 40 分", "desc": "位於西湖溪東岸，舊稱「店仔街」，為清代因設有驛站而發展形成的客家小街市。街廓呈特殊的「Y」字形分佈，全長約六百公尺，以同治年間興建之飛龍宮為核心，街內留存逾百年歷史、堅持古法手工鍛造農具的「年盛鐵店」與傳統柑仔店，維持清幽純樸的農村步調。", "note": "規模很小、只有短短一段街，且非商業化觀光老街，店家零星、平日多半安靜無人，不要期待像內灣或南庄老街那樣的攤販規模。適合安排成順遊點而非主要目的地。路邊停車。", "season": "", "source": "https://www.xihu.gov.tw/News_Content.aspx?n=3604&s=135557", "gmap": "西湖老街", "route": "xihu", "stay_h": 1.0, "drive_min": 40, "total_h": 2.3, "season_months": [], "id": "p490b986e"}, {"name": "賴屋武秀才崇達公伙房", "town": "苗栗縣西湖鄉", "lat": 24.52014, "lng": 120.77494, "theme": "heritage", "kind": "古厝", "diff": "開車", "time": "約 20 分", "drive": "從新竹市區約 50 分", "desc": "建於清同治年間，為西湖武秀才賴崇達之大型三進三合院客家伙房，宅第佔地逾兩千坪。正門懸掛「武秀才宅第」匾額且大門加高三尺以彰顯官階，屋內仍妥善留存早期習武用之 50 斤與 160 斤石刻練武石，亦為電影《悲情城市》取景地。", "note": "這是私人住宅兼賴氏祭祀場所，並非對外開放的景點，沒有固定開放時間、也無導覽與售票。僅適合在外埕與路邊外觀欣賞，請勿擅入廳堂、勿打擾住戶，拍照請徵得同意。周邊為鄉間小路 .05791269708386, "diff": "散步", "time": "約 0.5 小時", "drive": "從新竹市區約 35 分", "route": "zhu37", "nav_target": "314新竹縣北埔鄉南興村公園街20號忠恕堂", "desc": "1922 年由清末北埔文秀才曾學熙後人興建的客家伙房，為新竹縣定古蹟。建築融合客家燕尾屋脊與日治大正洋風雕花山牆，最著名的是為避免正對姜家天水堂風水煞氣而將外門樓偏轉 45 度的「歪門樓」避煞格局，是北埔老街極富風水故事性的精美老宅。", "note": "新竹縣定古蹟，免費開放時間為週六、日 10:30–17:00（平日不對外開放）；位於秀巒公園旁。", "season": "", "source": "", "coord_conf": "high", "tags": ["老宅"], "stay_h": 0.5, "drive_min": 35, "total_h": 1.7, "season_months": [], "id": "p66138f83"}, {"name": "鄧南光影像紀念館暨北埔遊客中心", "town": "新竹縣北埔鄉", "theme": "heritage", "kind": "影像紀念館", "lat": 24.698423433348452, "lng": 121.05824395302812, "diff": "散步", "time": "約 0.5–1 小時", "drive": "從新竹市區約 35 分", "route": "zhu37", "nav_target": "314新竹縣北埔鄉南興村公園街15號鄧南光影像紀念館暨北埔遊客中心", "desc": "原為北埔鄧家故居「靜風堂」及日治時期柑林幼稚園，現活化為紀念台灣攝影先驅鄧南光的影像館與北埔遊客中心。日洋混合紅磚木造洋樓內常設展出大師筆下 1930–1960 年代的客庄庶民與歷史影像，庭院綠意盎然，是認識北埔人文歷史的藝文窗口。", "note": "免門票開放，開館時間 10:00–17:00；同址為北埔遊客中心，提供老街旅遊諮詢與導覽預約。", "season": "", "source": "", "coord_conf": "high", "tags": ["雨天", "老宅"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "p48a79513"}, {"name": "金廣福公館（含天水堂）", "town": "新竹縣北埔鄉", "theme": "heritage", "kind": "古蹟", "lat": 24.70075, "lng": 121.05782, "coord_conf": "high", "diff": "散步", "time": "30 分（導覽約 40 分）", "drive": "從新竹市區約 35 分", "desc": "創建於清道光十五年（1835年），為新竹縣唯一的國定古蹟。為清代閩粵合資「金廣福墾號」武裝開闢大隘三鄉的指揮防禦中心與行政總部，也是全台唯一保存的拓墾公館。建築為一層四合院形制，黑瓦搭配斗砌磚牆，隔壁天水堂則為墾首姜秀鑾一堂六橫的大型客家伙房。", "season": "", "note": "金廣福公館為週二至週日採預約導覽制，不預約進不去；天水堂是私人住宅，只能看外觀。就在北埔老街上，車停北埔停車場步行 3 分。", "source": "https://zh.wikipedia.org/wiki/%E9%87%91%E5%BB%A3%E7%A6%8F%E5%85%AC%E9%A4%A8", "far": false, "route": "zhu37", "tags": ["需預約", "老宅"], "stay_h": 0.67, "drive_min": 35, "total_h": 1.8, "season_months": [], "id": "p308778dd"}, {"name": "北埔老街", "town": "新竹縣北埔鄉", "theme": "oldstreet", "kind": "老街", "diff": "散步", "time": "1–2 小時", "drive": "從新竹市區約 35 分", "desc": "始建於清道光十五年（1835年），為閩粵合資「金廣福墾號」武裝拓墾大隘地區的指揮防禦中樞。聚落以縣定古蹟慈天宮為核心，街道呈防禦性丁字形與曲巷布局；街廓內完整座落國定古蹟金廣福公館、天水堂、姜阿新洋樓與忠恕堂等歷史建築，展現客庄拓墾與茶業發展歷程。", "note": "吃的是擂茶、柿餅、芋頭與地瓜月餅、客家粄條。老街內禁行車輛，停北埔停車場或南興街外圍，假日常要排隊。金廣福公館、天水堂、姜阿新洋樓都在步行範圍。", "season": "秋冬 10–12 月九降風做柿餅，也是東方美人茶（膨風茶）最好的季節", "source": "https://bunnyann.tw/goemei/", "lat": 24.6999, "lng": 121.0581, "coord_conf": "high", "route": "zhu37", "stay_h": 2.0, "drive_min": 35, "total_h": 3.2, "season_months": [10, 11, 12], "season_type": "add", "id": "p00ed508f"}, {"name": "五指山風景區", "town": "新竹縣北埔鄉", "theme": "trail-near", "kind": "風景區", "diff": "健行", "time": "2–3 小時", "drive": "從新竹市區約 45 分", "desc": "位於北埔五指山觀音寺與受北宮之間的山腰橫向步道系統，O 型環線長約 3.5 公里。步道以木棧階梯穿梭於柳杉林間，最大地質特色為長達三十公尺、垂直岩壁夾峙僅容一人通行的「猴洞一線天」岩縫，以及覆滿金色地衣的巨型金龜岩，地貌奇特陰涼。", "note": "部分路段較險，雨後濕滑。用名稱導航會被 Google 導到名稱相近的別條路線，導航請認 Plus Code。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=243", "lat": 24.6419773, "lng": 121.089322, "coord_conf": "high", "route": "zhu37", "gmap": "J3RQ+QP 外坪村 新竹縣北埔鄉", "nav_target": "J3RQ+QP 外坪村 新竹縣北埔鄉", "tags": ["展望", "峽谷"], "stay_h": 3.0, "drive_min": 45, "total_h": 4.5, "season_months": [], "id": "pbcc08f17"}, {"name": "北埔翠鳥藝園", "town": "新竹縣北埔鄉", "lat": 24.68456, "lng": 121.05652, "theme": "trail-near", "kind": "賞鳥園", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 35 分", "desc": "北埔鄉大林村大分林巷底的私人生態園，Google 地圖歸類為「觀鳥區」。園主收集了不少特殊品種的荷花，刻意把水池布置成翠鳥停棲捕食的位置，又廣植寶塔龍船花招大鳳蝶，所以來的多半是扛大砲鏡頭拍鳥、拍荷花倒影的人。評論提到有供熱茶、入園採象徵性收費。", "note": "06:00–18:00。評論一致提到小黑蚊很多，要做好防蚊。是私人園子，前往前建議先電話確認園主在不在。", "season": "荷花約 6–8 月最盛，賞鳥拍照也以這段期間人最多。", "source": "", "route": "zhu37", "tags": ["濕地"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [6, 7, 8], "season_type": "add", "id": "p2b565e2b"}, {"name": "大分林山", "town": "新竹縣北埔鄉", "theme": "trail-near", "kind": "步道", "lat": 24.6843, "lng": 121.0543, "coord_conf": "high", "diff": "健行", "time": "單程 0.7 公里，往返 35 分至 1 小時，海拔 173–334 公尺", "drive": "從新竹市區約 35 分", "desc": "位於北埔大林村，由老頭擺客家餐廳旁起登，步道全長約 1.4 公里。全程鋪設平整寬敞的花崗石板階梯，穿行於果園與竹林間；山頂海拔 334 公尺，罕見同時立有一等與三等兩顆三角點，視野開闊，可遠眺五指山、鵝公髻山與北埔盆地。", "season": "", "note": "登山口在老頭擺客家菜餐廳廁所旁，停車前先徵得餐廳同意。少人走 %E5%9C%92%E5%8D%80", "far": false, "route": "zhudong", "tags": ["雨天", "老宅"], "stay_h": 1.5, "drive_min": 25, "total_h": 2.3, "season_months": [], "id": "p21a679da"}, {"name": "新竹二重埔夜市", "town": "新竹縣竹東鎮", "lat": 24.76525, "lng": 121.05748, "theme": "oldstreet", "kind": "夜市", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "位於竹東中興路五穀宮前廣場的每週四限定社區型夜市，緊鄰內灣線鐵道，以傳統平價小吃與童玩遊戲攤位為主，生活氣息濃厚。", "note": "**只在每週四營業**，其餘日子沒有攤販。跟只在週六營業的竹東觀光夜市是兩個不同的夜市，別搞混。", "season": "", "source": "https://blythe77777.pixnet.net/blog/post/427668098", "route": "zhudong", "tags": ["夜景", "看火車"], "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [], "id": "p95f26469"}, {"name": "竹東中央市場", "town": "新竹縣竹東鎮", "theme": "oldstreet", "kind": "老街", "lat": 24.73748, "lng": 121.09073, "coord_conf": "high", "diff": "散步", "time": "市場加仁愛路、東林路一圈約 1 小時", "drive": "從新竹市區約 25 分", "desc": "成立於 1957 年（民國四十六年），為全台灣規模最大的客家傳統早市市集。以仁愛路與東林路為核心，聚集數百攤生鮮與在地小吃，完整匯集客家水煙腸、手工水晶餃、客家米食粄類與傳統醬菜；周邊緊鄰竹東火車站與客家戲曲公園，展現新竹山線客庄深厚的生活採買脈絡。", "season": "", "note": "是早市，10 點前最完整、下午幾乎收攤。周邊吃的有粄條、水晶餃與貢丸。市場旁停車困難，建議停竹東火車站旁停車場步行約 8 分。", "source": "https://www.hsinchu-travel.tw/", "far": false, "route": "zhudong", "tags": ["大眾運輸"], "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [], "id": "p71e6d586"}, {"name": "竹東觀光夜市", "town": "新竹縣竹東鎮", "lat": 24.73653, "lng": 121.09774, "theme": "oldstreet", "kind": "夜市", "diff": "散步", "time": "約 1.5–2 小時", "drive": "從新竹市區約 25 分", "desc": "新竹縣規模最大的每週六限定沿河街封街夜市，全長逾一公里，匯集數百家台式傳統小吃、熱炒與排檔遊戲攤位，是竹東週末最具規模的夜間市集。", "note": "**只在每週六 18:00–23:00 營業**，雨天可能休市；週日到週五平日沒有攤販。", "season": "", "source": "https://bigmouthblog.tw/blog/post/220930", "route": "zhudong", "tags": ["夜景"], "stay_h": 2.0, "drive_min": 25, "total_h": 2.8, "season_months": [], "id": "pc2ecee9b"}, {"name": "文林古道", "town": "新竹縣芎林鄉", "theme": "trail-near", "kind": "古道", "diff": "散步", "time": "全長 3.7 公里，2 小時", "drive": "從新竹市區約 20 分", "desc": "起點位於芎林文林閣與芎林國小旁，全長約 3.7 公里，為早年糖仔谷與紙寮窩先民挑運農產的保甲古道。步道地勢平緩，穿行於茂密高聳的桂竹林綠色隧道與相思林間，途中最高點 let SHARE_PENDING = null;
function readHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if (!h) return;
  const q={}, rest=[];
  let hit=false;
  h.split("&").forEach(kv=>{
    const i=kv.indexOf("=");
    const k= i>0 ? kv.slice(0,i) : "";
    if (k==="plan" || k==="start" || k==="stay"){
      hit=true;
      try{ q[k]=decodeURIComponent(kv.slice(i+1)); }catch(e){ q[k]=""; }
    } else if (kv) rest.push(kv);
  });
  if (!hit) return;
  history.replaceState(history.state, "", location.pathname + location.search + (rest.length ? "#" + rest.join("&") : ""));
  if (!q.plan) return;
  const raw=q.plan.split(",");
  const ids=raw.filter(id=>BY_ID[id]);
  if (!ids.length) return;
  const stay={};
  if (q.stay!=null){
    const st=q.stay.split(",");
    raw.forEach((id,i)=>{ const v=parseFloat(st[i]); if (BY_ID[id] && Number.isFinite(v) && v>0) stay[id]=v; });
  }
  let start=null;
  if (/^\d{1,2}:\d{2}$/.test(q.start||"")){
    const [hh,mm]=q.start.split(":").map(Number);
    start=(hh||0)*60+(mm||0);
  }
  SHARE_PENDING={ids, stay, start};
}

function applySharePending(){
  const sp=SHARE_PENDING; SHARE_PENDING=null;
  if (!sp) return;
  const cur=PLAN.filter(id=>BY_ID[id]);
  const stayOr=(o,id)=> o[id]==null ? null : o[id];
  const same = cur.join(",")===sp.ids.join(",")
            && (sp.start==null || sp.start===START)
            && sp.ids.every(id=>stayOr(STAY,id)===stayOr(sp.stay,id));
  const apply=()=>{
    PLAN=sp.ids.slice();
    sp.ids.forEach(id=>{ delete STAY[id]; });
    Object.assign(STAY, sp.stay);
    if (sp.start!=null) START=sp.start;
    if (CLR_UNDO) dropClrUndo(false);   // 行程換了一份，「清空」的復原窗不再成立（見那段）
    syncRouteView();   // 「往返路線」檢視以行程為前提，行程一換就重算（同 `togglePlan()`）
    if (isTwoLane()){
      if (S.foldToday===true) S.foldToday=null;
      TODAY_AUTO_OPENED=true;
    } else gotoTab("trip");
    save(); render(); resizeMap();
  };
  if (!cur.length || same){ apply(); return; }
  setTimeout(()=>{
    const n=PLAN.filter(id=>BY_ID[id]).length;
    if (!n){ apply(); return; }
    const ok=confirm(`用分享的行程（${sp.ids.length} 站）取代你現在排的 ${n} 站？\n\n按「取消」會保留你自己的行程。`);
    if (ok) apply();
  }, 60);
}

const TAGSET=new Set();

function termHit(p, hay, t){
  if (TAGSET.has(t))
    return (p.tags||[]).some(x=>String(x).toLowerCase()===t) || p.name.toLowerCase().includes(t);
  return hay.includes(t);
}

const PASS_AXES = [
  {id:"route",    blocks:p=>S.route.size  && !S.route.has(p.route),        clear:()=>{ S.route=new Set(); ROUTE_VIEW=false; }},
  {id:"themes",   blocks:p=>S.themes.size && !S.themes.has(p.theme),       clear:()=>{ S.themes=new Set(); }},
  {id:"diffs",    blocks:p=>S.diffs.size  && !S.diffs.has(p.diff),         clear:()=>{ S.diffs=new Set(); }},
  {id:"budget",   blocks:p=>S.budget.size && !S.budget.has(bud(p)),        clear:()=>{ S.budget=new Set(); }},
  {id:"inseason", blocks:p=>S.inseason    && !inSeason(p),                 clear:()=>{ S.inseason=false; }},
];

function matchQ(p){
  if (!(S.q || S.qtags.length)) return true;
  const hay=(p.name+p.town+p.desc+p.note+p.season+p.kind+(p.tags||[]).join("")).toLowerCase();
  if (S.q && !termHit(p, hay, S.q)) return false;
  for (const t of S.qtags) if (!termHit(p, hay, t)) return false;
  return true;
}

function passExcept(p, skip){
  for (const a of PASS_AXES) if (a.id!==skip && a.blocks(p)) return false;
  return matchQ(p);
}

function releaseForAll(list){
  PASS_AXES.forEach(a=>{ if (list.some(p=>a.blocks(p))) a.clear(); });
}
const pass = p => passExcept(p, null);
const shown = () => {
  const list = PLACES.filter(pass);
  const ids = new Set(list.map(p=>p.id));
  EXTRA.forEach(id=>{ if (BY_ID[id] && !ids.has(id)) list.push(BY_ID[id]); });
  return list;
};

const RAD = Math.PI/180;
function km(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLng=(b.lng-a.lng)*RAD, la=(a.lat+b.lat)/2*RAD;
  return Math.hypot(dLat, dLng*Math.cos(la))*6371;
}

const navpt = p => (p.nav ? {lat:p.nav[0], lng:p.nav[1]} : p);
const nkm = (a,b) => km(navpt(a), navpt(b));

const HILLY = new Set(["jianshi-front","jianshi-back","shuitian","nanqing",
                       "beiheng","taian","nanzhuang","emei","zhu37","sanyi"]);
function legEstimate(a,b){
  const n=(HILLY.has(a.route)?1:0)+(HILLY.has(b.route)?1:0);
  const [detour,speed] = n===0 ? [1.41,53] : n===1 ? [1.54,44] : [1.69,40];
  const d=nkm(a,b)*detour;
  return {km:d, min:Math.round(d/speed*60), real:false};
}

function legOf(a,b){
  const r=neighGet(a.id||"HOME", b.id||"HOME");
  if (r) return {km:r.km, min:r.min, real:true};

  neighPending(true);   // 矩陣已到（只是這一對查無＝資料過期）時它什麼都不做
  return legEstimate(a,b);
}

let NEIGH_TRI=null;
let TRI_P=null, TRI_BUSY=false, TRI_FAILED=false, TRI_RETRY_AT=0, NEIGH_WANT=false;
const dataURL = k => (typeof DATA_URLS==="object" && DATA_URLS && DATA_URLS[k]) || null;

function dataFetch(url, how, low){
  return fetch(url, low ? {priority:"low"} : undefined)
    .then(r=>{ if (!r.ok) throw new Error("HTTP " + r.status); return r[how](); });
}
function ensureTri(low){
  if (NEIGH_TRI) return Promise.resolve(true);
  if (TRI_P) return TRI_P;
  const u=dataURL("neighbors");
  if (!u || Date.now()<TRI_RETRY_AT) return Promise.resolve(false);
  TRI_BUSY=true; TRI_FAILED=false;
  TRI_P = dataFetch(u, "arrayBuffer", low).then(buf=>{

    NEIGH_TRI = buf && buf.byteLength>=2 ? new Uint16Array(buf) : null;
    return !!NEIGH_TRI;
  }).catch(e=>{
    TRI_P=null; NEIGH_TRI=null; TRI_FAILED=true; TRI_RETRY_AT=Date.now()+10000;
    console.warn("[一日遊] 點對車程矩陣 neighbors.bin 載入失敗，維持降級態（稍後需要時再試一次）：", e);
    return false;
  }).then(ok=>{
    TRI_BUSY=false;

    if (NEIGH_WANT){ NEIGH_WANT=false; render(); }
    return ok;
  });
  return TRI_P;
}

function neighPending(low){
  if (NEIGH_TRI) return false;
  ensureTri(low);
  if (!TRI_BUSY) return false;
  NEIGH_WANT=true;
  return true;
}
const IDX_OF={}; PLACES.forEach((p,i)=>{ IDX_OF[p.id]=i; });
function neighGet(aid,bid){
  if (aid===bid) return null;
  if (aid==="HOME" || bid==="HOME"){
    const i=IDX_OF[aid==="HOME"?bid:aid];
    const h=(i!=null) && NEIGH_HOME[i];
    return (h && h[0]!==65535) ? {km:h[0]/10, min:h[1]} : null;
  }
  if (!NEIGH_TRI) return null;
  let ia=IDX_OF[aid], ib=IDX_OF[bid];
  if (ia==null || ib==null) return null;
  if (ia>ib){ const t=ia; ia=ib; ib=t; }
  const n=PLACES.length;
  const k=(ia*(2*n-ia-1)/2 + (ib-ia-1))*2;   // 上三角列序的格位
  const km10=NEIGH_TRI[k];
  return km10===65535 ? null : {km:km10/10, min:NEIGH_TRI[k+1]};
}

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(min){
  const m=((Math.round(min)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}

const EST_RAW_MAX = 10;     // 這個分鐘數以下照原值，不取階
const EST_STEP    = 5;      // 90 分以前的階距
const EST_HR_AT   = 90;     // 到這個分鐘數改走半小時階
function estT(min){
  const m = Math.max(0, Math.round(min));
  if (m <= EST_RAW_MAX) return `${m}m`;
  const stepped = Math.round(m / EST_STEP) * EST_STEP;
  if (stepped < EST_HR_AT) return `${stepped}m`;
  const h = Math.round(m / 30) / 2;
  return `${Number.isInteger(h) ? h : h.toFixed(1)}hr`;
}

const est   = min => `<span class="num">${estT(min)}</span>`;
const estHT = h => estT(h * 60);          // 小數小時入口（total_h 那類）
function kmT(v){
  if (v < 10){
    const s = v.toFixed(1);
    if (s !== "10.0") return `${s}km`;
  }
  return `${Math.round(v)}km`;
}

function hmT(min){
  const m = Math.round(min);
  if (m < 60) return `${m}m`;
  return m % 60 ? `${Math.floor(m / 60)}hr${m % 60}m` : `${m / 60}hr`;
}
const hmHT = h => hmT(h * 60);

function rawT(min, km){
  const parts=[];
  if (min != null) parts.push(`${Math.round(min)} 分`);
  if (km != null) parts.push(`${km.toFixed(1)} 公里`);
  return parts.join(" · ");
}

function legText(min, km, real){
  return km!=null ? `${real?"":"約 "}${estT(min)} · ${kmT(km)}` : `${estT(min)}`;
}

let engine=null, map=null, marks={}, lines=null, pts=null, ready=false, zoom=11;

function drawLines(){
  if (engine!=="osm" || !lines) return;
  lines.clearLayers();
  const planRoutes=new Set();
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p) planRoutes.add(p.route); });
  ROUTES.forEach(c=>{
    if (!c.path || !c.path.length) return;
    const forced=planRoutes.has(c.id);
    const dim=!forced && S.route.size && !S.route.has(c.id);

    const style={color:(DR[c.dir]||{}).color||"#888",
                 opacity:dim?.18:.7, weight:dim?1.5:3, lineCap:"round", pane:"routes"};
    const segs = Array.isArray(c.path[0][0]) ? c.path : [c.path];
    segs.forEach(s=>{ if (s.length>1) L.polyline(s,style).addTo(lines); });
  });
}

const LEAF_CSS_URL="vendor/leaflet/leaflet.css", LEAF_JS_URL="vendor/leaflet/leaflet.js";
let LEAFLET_CSS=null, LEAF_JS=null, LEAF_OK=false, LEAF_PRE=null;
function loadOSM(why, pre){
  if (ready) return;
  if (LEAF_OK){ if (!pre) initOSM(why); return; }   // 引擎已在、圖還沒建：看得見就當場建
  if (LEAF_JS) return;                                // script 標籤已在路上，onload 接手
  if (pre && LEAF_PRE) return;                        // 預熱的 fetch 已在路上
  engine="loading";
  const msg=document.getElementById("mapmsg");
  if (msg) msg.style.display="none";
  if (pre){
    const low=u=>fetch(u, {priority:"low"}).then(r=>{ if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
    LEAF_PRE=Promise.all([low(LEAF_CSS_URL), low(LEAF_JS_URL)]).then(
      ()=>{ LEAF_PRE=null; if (!LEAF_JS && !LEAF_OK) addLeaflet(why); },
      ()=>{ LEAF_PRE=null; if (!LEAF_JS && !LEAF_OK) engine=null; });
    return;
  }
  addLeaflet(why);
}
function addLeaflet(why){
  if (!LEAFLET_CSS){
    LEAFLET_CSS=document.createElement("link");
    LEAFLET_CSS.rel="stylesheet"; LEAFLET_CSS.href=LEAF_CSS_URL;
    document.head.appendChild(LEAFLET_CSS);
  }
  const js=document.createElement("script");
  js.src=LEAF_JS_URL;

  js.onload=()=>{ LEAF_OK=true; if (mapShown()) initOSM(why); else whenIdle(()=>initOSM(why)); };

  js.onerror=()=>{
    LEAF_JS=null;
    engine=null;
    js.remove();
    const m=document.getElementById("mapmsg");
    m.style.display="flex";
    m.textContent="底圖載不進來，可能是沒連網。切到「清單」，內容一樣看得到。";
  };
  LEAF_JS=js;
  document.head.appendChild(js);
}

function initOSM(why){
  if (ready) return;
  engine="osm";
  map=L.map("map",{zoomControl:true, preferCanvas:true}).setView([24.76,121.06],11);

  L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"hubpin",

    .bindTooltip(HOME.name,{direction:"top",offset:[0,-11],className:"tt",opacity:1})
    .addTo(map);

  ready=true;
  note(why ? "底圖用 OpenStreetMap：" + why : "");

  if (mapShown()){
    draw();

    if (isMobile()) enterMap();

}

const pinState = (p, plan) => {
  const sel = p.id===S.sel;
  const cand = !sel && !plan && TODAY_NEAR_SET && TODAY_NEAR_SET.has(p.id);
  return (sel ? " on" : "") + ((sel || plan) ? " has-halo" : "") + (cand ? " cand" : "");
};
function markerHTML(p){

         `<span class="pinlbl">${esc(p.name)}</span></div>`;

function planPinHTML(p, n){

    `<span class="mi" title="停留">${HOURGLASS_SVG}${hmHT(p.stay_h)}</span></i>` +

function drawList(){
  const list=shown().slice();
  const ids=new Set(list.map(p=>p.id));
  if (S.sel && BY_ID[S.sel] && !ids.has(S.sel)){ list.push(BY_ID[S.sel]); ids.add(S.sel); }
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p && !ids.has(id)){ list.push(p); ids.add(id); } });

  if (TODAY_NEAR_SET) TODAY_NEAR_SET.forEach(id=>{
    const p=BY_ID[id]; if (p && !ids.has(id)){ list.push(p); ids.add(id); }
  });
  return list;
}

let DRAW_SIG=null, DRAW_GEN=0;
function drawSig(list, asIcon){
  return [asIcon ? 1 : 0, S.sel || "", PLAN.join(","),
          TODAY_NEAR_SET ? [...TODAY_NEAR_SET].join(",") : "",
          [...S.route].join(","), list.map(p=>p.id).join(",")].join("|");
}
const planNos = () => { const o={}; PLAN.forEach((id,i)=>{ o[id]=i+1; }); return o; };
function draw(){
  if (!ready) return;
  const list=drawList();
  const planRoutes=new Set();
  PLAN.forEach(id=>{ const p=BY_ID[id]; if (p) planRoutes.add(p.route); });
  if (engine==="osm"){
    const asIcon = zoom >= ICON_ZOOM;
    const sig = drawSig(list, asIcon);
    if (isMobile() && (!mapShown() || sig===DRAW_SIG)) return;   // 手機兩條規則，見上面那段
    DRAW_GEN++;
    pts.clearLayers(); marks={};
    drawLines();
    const planNo=planNos();
    list.forEach(p=>addMark(p, asIcon, planNo));
    DRAW_SIG=sig;

  }
}

const MARK_BATCH=50;
function drawChunked(){
  if (!ready || engine!=="osm") return;
  const gen=++DRAW_GEN;
  const list=drawList();
  const asIcon = zoom >= ICON_ZOOM;
  const sig=drawSig(list, asIcon);
  const planNo=planNos();
  DRAW_SIG=null;
  pts.clearLayers(); marks={};
  let i=-1;
  const step=()=>{
    if (gen!==DRAW_GEN) return;
    if (i<0){ drawLines(); i=0; }
    else {
      const end=Math.min(i+MARK_BATCH, list.length);
      for (; i<end; i++) addMark(list[i], asIcon, planNo);
    }
    if (i<list.length) yieldThen(step); else DRAW_SIG=sig;
  };
  yieldThen(step);
}

function addMark(p, asIcon, planNo){
      const on=p.id===S.sel;
      const n=planNo[p.id];

      const zoff = on ? Z_PLACE_ON : n ? Z_PLAN_STOP : Z_PLACE_NORMAL;
      let m;

      if (n){
        m = asIcon
          ? L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planPinHTML(p,n), iconSize:[26,26], iconAnchor:[13,13]}),
                                     zIndexOffset:zoff})
          : L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:planDotHTML(p,n), iconSize:[20,20], iconAnchor:[10,10]}),
                                     zIndexOffset:zoff});
      } else if (asIcon){
        m = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"", html:markerHTML(p), iconSize:[26,26], iconAnchor:[13,13]}),
                                     zIndexOffset:zoff});
      } else {

        const c=(TH[p.theme]||{}).color||"#888";
        m = L.marker([p.lat,p.lng], {icon:L.divIcon({className:"poidot"+pinState(p,false), iconSize:[13,13], iconAnchor:[6.5,6.5],
                                                     html:`<span class="pd" style="background:${c}"></span>`}),
                                     zIndexOffset:zoff});
      }
      m._zBase=zoff;   // `emphasize()` hover 完要退回的那一格
      m.addTo(pts);
      m.bindTooltip(tipHTML(p), {direction:"top", offset:[0,asIcon?-14:-8], className:"tt", opacity:1});
      m.on("mouseover", ()=>highlightRow(p.id,true));
      m.on("mouseout", ()=>highlightRow(p.id,false));
      m.on("click", ()=>select(p.id));
      marks[p.id]=m;
}

function fit(items, opts){

             '-1.6,2.1s.6,2.3,1.4,2.3,1.5-.9,1.6-2.1S27.9,6.3,27.1,6.3ZM30.7,8c-.7-.1' +

const stayOf = p => (STAY[p.id]==null ? p.stay_h : STAY[p.id]);

const stayLabel = h => `停 ${hmHT(h)}`;
function adjustStay(p, delta){
  STAY[p.id]=Math.max(0.25, Math.round((stayOf(p)+delta)*4)/4);
  save(); renderTrip();
}
function togglePlan(id){
  if (CLR_UNDO) dropClrUndo(false);
  const i=PLAN.indexOf(id);
  if (i<0){
    PLAN.push(id);
    maybeAutoOpenToday();
  } else PLAN.splice(i,1);
  syncRouteView();   // 這個檢視以行程為前提，行程一動就重算（`syncNearView()` 棒 J5 退役）
  save(); render();
}

function optimizePlan(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (ps.length<3) return;
  const rest=ps.slice(), order=[];
  let cur=HOME;
  while (rest.length){
    let bi=0, bd=Infinity;
    rest.forEach((p,i)=>{ const d=km(cur,p); if (d<bd){ bd=d; bi=i; } });
    cur=rest[bi]; order.push(rest.splice(bi,1)[0]);
  }
  PLAN=order.map(p=>p.id);
  save(); render();
}
function schedule(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return null;
  let t=START, stayTotal=0, driveTotal=0;
  const items=ps.map((p,i)=>{
    let legMin, legKm, legReal;
    if (i===0){
      const home=neighGet("HOME", p.id);
      legMin=p.drive_min;
      if (home){ legKm=home.km; legReal=true; }
    } else {
      const lg=legOf(ps[i-1],p);
      legMin=lg.min; legKm=lg.km; legReal=lg.real;
    }
    driveTotal += legMin;
    const arrive=t+legMin, stay=stayOf(p), leave=arrive+stay*60;
    t=leave; stayTotal+=stay;
    const sn=seasonNote(p);
    return {p, n:i+1,
      leg: legText(legMin, legKm, legReal),
      legRaw: rawT(legMin, legKm),          // 徽章 title 用：取階前的實算原值
      win: `${fmt(arrive)}–${fmt(leave)}`,
      stay: stayLabel(stay),
      warn: sn.text, warnTip: sn.tip};
  });
  const last=ps[ps.length-1];
  const homeBack=neighGet("HOME", last.id);   // 同上：分鐘照策展值，公里數才取表值
  const back = last.drive_min;
  const backKm = homeBack ? homeBack.km : null;
  const backReal = !!homeBack;
  driveTotal+=back;
  return {ps, items, back, backKm, backReal, backTime:t+back, stayMin:stayTotal*60,
          driveTotal, totalMin:(t+back)-START};
}
function planURL(){
  const ps=PLAN.map(id=>BY_ID[id]).filter(Boolean);
  if (!ps.length) return "#";
  const last=ps[ps.length-1];
  const way=ps.slice(0,-1).map(gnav).join("|"); // 途經點也是要「開到得了」，跟單點導航同一套規則
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving" +
    "&origin=" + encodeURIComponent(HOME.name) +
    "&destination=" + encodeURIComponent(gnav(last)) +
    (way ? "&waypoints=" + encodeURIComponent(way) : "");
}

let BADGE_LAST=0;
function syncBadge(){
  const b=document.getElementById("tripbadge");
  if (!b) return;
  const n=PLAN.length;
  b.textContent=n; b.hidden=!n;
  if (n>BADGE_LAST){
    b.classList.remove("pulse"); void b.offsetWidth;   // 重觸發動畫
    b.classList.add("pulse");
    b.addEventListener("animationend", ()=>b.classList.remove("pulse"), {once:true});
  }
  BADGE_LAST=n;
}

const TODAY_NEAR_STEPS = [10, 20, 30];
const TODAY_NEAR_PEEK = 3;     // 收合時顯示幾筆（規格 §3.2「預設 3 筆」）
let TODAY_NEAR_OPEN = false, TODAY_NEAR_LEVEL = 0, TODAY_NEAR_SET = null;

function nearestStop(p){
  let best=null;
  PLAN.forEach(id=>{
    const st=BY_ID[id];
    if (!st || st.id===p.id) return;
    const r=neighGet(st.id, p.id);
    if (r && (!best || r.min<best.min)) best={stop:st, km:r.km, min:r.min};
  });
  return best;
}

function todayNearList(level){
  const lim=TODAY_NEAR_STEPS[Math.min(level, TODAY_NEAR_STEPS.length-1)];
  const out=[];
  PLACES.forEach(p=>{
    if (inPlan(p.id)) return;
    const ns=nearestStop(p);
    if (ns && ns.min<=lim) out.push({p, ns});
  });
  out.sort((a,b)=>a.ns.min-b.ns.min);
  return out;
}

let TODAY_NEAR_ROWS = [];
function syncTodayNear(){
  const live = PLAN.length && (isMobile() || !todayFolded());
  TODAY_NEAR_ROWS = live ? todayNearList(TODAY_NEAR_LEVEL) : [];
  TODAY_NEAR_SET = (TODAY_NEAR_OPEN && TODAY_NEAR_ROWS.length)
    ? new Set(TODAY_NEAR_ROWS.map(o=>o.p.id)) : null;
}

function tripNearSection(){
  if (!PLAN.length) return null;
  const lim=TODAY_NEAR_STEPS[Math.min(TODAY_NEAR_LEVEL, TODAY_NEAR_STEPS.length-1)];
  const canWiden = TODAY_NEAR_LEVEL < TODAY_NEAR_STEPS.length-1;
  const rows=TODAY_NEAR_ROWS;

  const stateMsg = neighPending(true) ? "車程資料載入中…"
    : (!NEIGH_TRI && TRI_FAILED) ? "車程資料暫時載不到，恢復連線後再試一次。" : "";
  if (stateMsg){
    const box=document.createElement("div"); box.className="tnear";
    const h=document.createElement("h3");
    h.textContent=`順遊推薦（車程 ${lim} 分內）`;
    const e=document.createElement("p"); e.className="nonear";
    e.setAttribute("role","status");
    e.textContent=stateMsg;
    box.append(h, e);
    return box;
  }
  if (!rows.length && !canWiden && !TODAY_NEAR_OPEN) return null;
  const box=document.createElement("div"); box.className="tnear";
  const h=document.createElement("h3");
  h.textContent=`順遊推薦（車程 ${lim} 分內）`;
  box.appendChild(h);
  const list = TODAY_NEAR_OPEN ? rows : rows.slice(0, TODAY_NEAR_PEEK);
  list.forEach(({p,ns})=>
    box.appendChild(rowFor(p, null, {min:ns.min, km:ns.km, stop:ns.stop}, ()=>openFromToday(p.id))));
  if (!list.length){
    const e=document.createElement("p"); e.className="nonear";
    e.textContent="這個車程範圍內沒有還沒排的點。可以放寬時間再看。";
    box.appendChild(e);
  }
  const acts=document.createElement("div"); acts.className="tnearacts";
  if (!TODAY_NEAR_OPEN){
    if (rows.length>TODAY_NEAR_PEEK || canWiden){
      const more=document.createElement("button"); more.className="wider";
      more.textContent="查看更多順遊";
      more.setAttribute("aria-expanded","false");
      more.onclick=()=>{ TODAY_NEAR_OPEN=true; render(); };
      acts.appendChild(more);
    }
  } else {
    if (canWiden){
      const w=document.createElement("button"); w.className="wider";
      w.textContent=`再遠一點（${TODAY_NEAR_STEPS[TODAY_NEAR_LEVEL+1]} 分內）`;
      w.onclick=()=>{ TODAY_NEAR_LEVEL++; render(); };
      acts.appendChild(w);
    }
    const c=document.createElement("button"); c.className="wider";
    c.textContent="收起"; c.setAttribute("aria-expanded","true");
    c.onclick=()=>{ TODAY_NEAR_OPEN=false; render(); };
    acts.appendChild(c);
  }
  if (acts.childNodes.length) box.appendChild(acts);
  return box;
}

                 : document.querySelector("#panel > .lane-today:not(.rail)");

  if (!mob && other.childNodes.length) other.innerHTML="";
  syncBadge();
  if (!el) return;   // 今天 lane 收成 rail（或此刻根本沒有那個家）
  const st=schedule();
  el.className = (mob ? "trip tripview" : "lane lane-today trip") + (st ? " open" : "");

  const keep = mob ? (TJUMP!=null ? TJUMP : el.scrollTop) : LANE_KEEP.today;
  TJUMP=null;
  el.innerHTML="";

  if (!st){

    const d=document.createElement("div"); d.className="empty tempty";
    const h=document.createElement("p"); h.className="eh";
    const c=document.createElement("p"); c.className="ec";
    h.textContent = mob ? "今天還沒排任何地方。" : "還沒排景點";
    c.textContent = mob ? "到「景點」頁，按景點卡右邊的 ＋ 就會排進來。" : "在左邊景點按 ＋ 加進今天";
    const a=document.createElement("div"); a.className="ea";
    const go=document.createElement("button"); go.type="button"; go.className="ebtn primary"; go.textContent="去挑地方";

    go.onclick = mob
      ? ()=>{ gotoTab("place"); render(); }
      : ()=>{
          if (S.foldExplore){ setLaneFold("explore", false); return; }
          const box=scrollBox();
          if (box) box.scrollTo({top:0, behavior: RM.matches ? "auto" : "smooth"});
        };

    if (CLR_UNDO){
      const u=document.createElement("button"); u.type="button"; u.className="ebtn tundo";
      u.textContent="已清空・復原";
      u.title=`把剛剛清掉的 ${CLR_UNDO.plan.length} 站放回來`;
      u.onclick=undoClear;
      a.appendChild(u);
    }
    a.appendChild(go); d.append(h,c,a);
    el.appendChild(d);
    el.scrollTop=0;
    return;
  }

  const head=document.createElement("div");
  head.className="head";
  {
    const hint=document.createElement("span"); hint.className="hint";
    hint.textContent=`今天 · ${st.ps.length} 站`;
    head.appendChild(hint);
  }
  el.appendChild(head);

  const sheet=document.createElement("div"); sheet.className="sheet";

  const set=document.createElement("div"); set.className="setrow";
  const home=document.createElement("span"); home.className="home"; home.textContent="家";
  const time=document.createElement("input");
  time.type="time"; time.id="start"; time.value=fmt(START);
  time.onchange=()=>{
    const [hh,mm]=(time.value||"09:00").split(":").map(Number);
    START=(hh||0)*60+(mm||0); save(); renderTrip();
  };
  const lab=document.createElement("label"); lab.className="lab"; lab.textContent="出發"; lab.htmlFor="start";
  const backbit=document.createElement("span"); backbit.className="backbit";
  backbit.innerHTML=`→ 預計 <span class="num">${fmt(st.backTime)}</span> 回新竹`;
  set.append(home,time,lab,backbit);

  const plan=document.createElement("div"); plan.className="plan";

  const legRow=(from, to, text, raw)=>{
    const r=document.createElement("div"); r.className="legrow";
    const via=document.createElement("span"); via.className="via"; via.textContent=`${from} → ${to}`;
    r.innerHTML=CAR_SVG; r.appendChild(via);
    const val=document.createElement("span"); val.title=`實算 ${raw}`;
    const dot=text.indexOf(" · ");
    const mv=document.createElement("span"); mv.className="mv"; mv.textContent = dot<0 ? text : text.slice(0,dot);
    val.appendChild(mv);
    if (dot>=0){
      val.appendChild(document.createTextNode(" · "));
      const km=document.createElement("span"); km.className="mv"; km.textContent=text.slice(dot+3);
      val.appendChild(km);
    }
    r.appendChild(val);

    const wrap=document.createElement("div"); wrap.className="stopwrap"; wrap.dataset.id=it.p.id;
    const swipebg=document.createElement("div"); swipebg.className="swipebg";
    swipebg.innerHTML = BIN_SVG + "<span>移出行程</span>";
    const stop=document.createElement("div"); stop.className= mob ? "stop mstop" : "stop dstop"; stop.dataset.id=it.p.id;

      const w=document.createElement("span"); w.className="warn"; w.textContent=it.warn;

  sumv.title=`車程合計 ${rawT(st.driveTotal)}　總時程 ${rawT(st.totalMin)}`;
  sum.appendChild(sumv);
  if (late){
    const w=document.createElement("span"); w.className="warn";
    w.textContent="天已經黑了，山路請留餘裕";

  }

  const go=document.createElement("div"); go.className="go";
  const a=document.createElement("a");
  a.className="primary"; a.href=planURL(); a.target="_blank"; a.rel="noopener";
  a.textContent="用 Google 地圖導航";

    const url=shareURL();
    const done=()=>{ sh.textContent="連結已複製"; setTimeout(()=>{ sh.textContent=shLabel; },1800); };

      history.replaceState(history.state, "", "#" + (url.split("#")[1]||""));
      sh.textContent="請複製網址列"; setTimeout(()=>{ sh.textContent=shLabel; },1800);
    };
    const copy=()=>{
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,nocopy);
      else { location.hash=url.split("#")[1]||""; done(); }
    };
    if (nativeShare) navigator.share({title:"新竹出發一日遊｜今天的行程", url}).catch(err=>{ if (!err || err.name!=="AbortError") copy(); });
    else copy();

  const clr=document.createElement("button");

let STEP_HOLD=null, STEP_SUPPRESS_UNTIL=0;
function stopStepHold(){
  if (!STEP_HOLD) return;
  clearTimeout(STEP_HOLD.timer); clearInterval(STEP_HOLD.iv);
  if (STEP_HOLD.fired) STEP_SUPPRESS_UNTIL=Date.now()+400;
  STEP_HOLD=null;
}
function wireStepHold(btn, fn){
  btn.addEventListener("pointerdown", e=>{
    if (e.pointerType==="mouse" && e.button!==0) return;
    stopStepHold();
    const h={fired:false, x:e.clientX, y:e.clientY, timer:0, iv:0};
    h.timer=setTimeout(()=>{ h.fired=true; fn(); h.iv=setInterval(fn, 150); }, 400);
    STEP_HOLD=h;
  });
  btn.addEventListener("click", ()=>{
    if (Date.now()<STEP_SUPPRESS_UNTIL) return;
    fn();
  });
}

function stopHit(el, fn){
  let down=null;
  el.addEventListener("pointerdown", e=>{ down={x:e.clientX, y:e.clientY, t:Date.now(), touch:e.pointerType!=="mouse"}; });
  el.addEventListener("click", e=>{
    const d=down; down=null;
    if (d && (Math.abs(e.clientX-d.x)>8 || Math.abs(e.clientY-d.y)>8)) return;
    if (d && d.touch && Date.now()-d.t>=400) return;
    e.stopPropagation();
    fn();
  });
}
document.addEventListener("pointerup", stopStepHold);
document.addEventListener("pointercancel", stopStepHold);
document.addEventListener("pointermove", e=>{
  if (STEP_HOLD && (Math.abs(e.clientX-STEP_HOLD.x)>12 || Math.abs(e.clientY-STEP_HOLD.y)>12)) stopStepHold();
});

const MSCROLL={place:0, trip:0};
let MAPKEEP=null, MJUMP=null, TJUMP=null;

function wireStopGestures(wrap, stop, grip, id){
  grip.addEventListener("pointerdown", e=>{
    if (e.pointerType==="mouse" && e.button!==0) return;
    e.preventDefault();
    startDrag(id, wrap, e);
  });
  wrap.addEventListener("contextmenu", e=>{ if (wrap.classList.contains("dragging")) e.preventDefault(); });

  wrap.addEventListener("pointerdown", e=>{
    if (e.target.closest("button, .grip, a")) return;
    if (e.pointerType==="mouse" && e.button!==0) return;
    GESTURE = { id, wrap, stop, startX:e.clientX, startY:e.clientY,
                pointerId:e.pointerId, mouse:e.pointerType==="mouse", dir:null, dx:0, thresh:SWIPE_DELETE_PX };
    if (e.pointerType!=="mouse"){
      clearTimeout(PRESS_TIMER);
      const pe=e;
      PRESS_TIMER=setTimeout(()=>{
        if (!GESTURE || GESTURE.id!==id || GESTURE.pointerId!==pe.pointerId || GESTURE.dir!=null) return;
        GESTURE=null;
        startDrag(id, wrap, pe);
      }, 400);
    }
  });
  wrap.addEventListener("pointermove", e=>{
    if (!GESTURE || GESTURE.id!==id || e.pointerId!==GESTURE.pointerId) return;
    const dx=e.clientX-GESTURE.startX, dy=e.clientY-GESTURE.startY;
    if (GESTURE.dir==null){
      if (Math.abs(dx)<8 && Math.abs(dy)<8) return;
      clearTimeout(PRESS_TIMER);   // 位移已經超過長按門檻，不會再是長按

      if (GESTURE.mouse){
        const ev=e; GESTURE=null;
        startDrag(id, wrap, ev);
        return;
      }
      if (Math.abs(dx)>Math.abs(dy)){
        GESTURE.dir="h";
        try{ wrap.setPointerCapture(e.pointerId); }catch(_){}   // 極少數情況（如合成事件）沒有 active pointer 可抓，抓不到就算了，不影響橫滑本身
        wrap.classList.add("swiping");
      } else { GESTURE=null; return; }   // 觸控縱向：放手，讓原生捲頁接手
    }
    if (GESTURE.dir!=="h") return;
    e.preventDefault();
    const clamped=Math.min(0, dx);
    stop.style.transform=`translateX(${clamped}px)`;
    GESTURE.dx=clamped;
    GESTURE.thresh=Math.min(SWIPE_DELETE_PX, wrap.getBoundingClientRect().width*0.35);
    wrap.classList.toggle("del-armed", -clamped>GESTURE.thresh);
  });
  const endSwipe=()=>{
    clearTimeout(PRESS_TIMER);
    if (!GESTURE || GESTURE.id!==id) return;
    if (GESTURE.dir==="h"){
      const commit = -GESTURE.dx > GESTURE.thresh;
      wrap.classList.remove("swiping","del-armed");
      if (commit){
        if (!RM.matches){
          stop.style.transition="transform .16s ease";
          stop.style.transform=`translateX(-${wrap.getBoundingClientRect().width}px)`;
        }
        setTimeout(()=>togglePlan(id), RM.matches?0:150);
      } else {
        if (!RM.matches) stop.style.transition="transform .16s ease";
        stop.style.transform="translateX(0)";
        setTimeout(()=>{ stop.style.transition=""; }, 180);
      }
    }
    GESTURE=null;
  };
  wrap.addEventListener("pointerup", endSwipe);
  wrap.addEventListener("pointercancel", endSwipe);
}

function clearDragIndicators(){
  document.querySelectorAll(".stopwrap.drag-over-top,.stopwrap.drag-over-bottom")
    .forEach(el=>el.classList.remove("drag-over-top","drag-over-bottom"));
}
function markDragOver(id,pos){
  const el=document.querySelector(`.stopwrap[data-id="${id}"]`);
  if (el) el.classList.add(pos==="top"?"drag-over-top":"drag-over-bottom");
}

const DRAG_EDGE=48, DRAG_STEP=8, DRAG_TICK=16;
function startDrag(id, wrap, e){
  const startIndex=PLAN.indexOf(id);
  if (startIndex<0) return;
  const box = isMobile() ? document.getElementById("tripview") : null;
  DRAG={id, startY:e.clientY, lastY:e.clientY, startIndex, targetIndex:startIndex, pointerId:e.pointerId,
        box, startScroll: box ? box.scrollTop : 0, timer:0};
  wrap.classList.add("dragging");
  const others=()=>Array.from(document.querySelectorAll("#panel .lane-today .stopwrap, #tripview .stopwrap")).filter(r=>r.dataset.id!==id);
  const place=()=>{
    if (!DRAG) return;
    const shift = DRAG.box ? DRAG.box.scrollTop-DRAG.startScroll : 0;
    wrap.style.transform=`translateY(${DRAG.lastY-DRAG.startY+shift}px)`;
    const rows=others();
    let count=0;
    rows.forEach(r=>{ const rc=r.getBoundingClientRect(); if (DRAG.lastY > rc.top + rc.height/2) count++; });
    DRAG.targetIndex=count;
    clearDragIndicators();
    if (count<rows.length) markDragOver(rows[count].dataset.id,"top");
    else if (rows.length) markDragOver(rows[rows.length-1].dataset.id,"bottom");
  };
  const tick=()=>{
    if (!DRAG || !DRAG.box) return;
    DRAG.timer=0;
    const b=DRAG.box.getBoundingClientRect();
    let dy=0;
    if (DRAG.lastY < b.top+DRAG_EDGE) dy=-DRAG_STEP;
    else if (DRAG.lastY > b.bottom-DRAG_EDGE) dy=DRAG_STEP;
    if (!dy) return;
    const before=DRAG.box.scrollTop;
    DRAG.box.scrollTop=before+dy;
    if (DRAG.box.scrollTop===before) return;   // 捲到底／到頂：停，等手指再動
    place();
    DRAG.timer=setTimeout(tick, DRAG_TICK);
  };
  const move=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    ev.preventDefault();
    DRAG.lastY=ev.clientY;
    place();
    if (DRAG.box && !DRAG.timer) DRAG.timer=setTimeout(tick, DRAG_TICK);
  };
  const up=ev=>{
    if (!DRAG || ev.pointerId!==DRAG.pointerId) return;
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.removeEventListener("pointercancel",up);
    if (DRAG.timer) clearTimeout(DRAG.timer);
    clearDragIndicators();
    wrap.classList.remove("dragging");
    const {startIndex:si, targetIndex:ti}=DRAG;
    DRAG=null;
    if (ti!==si){
      const arr=PLAN.slice(); arr.splice(si,1); arr.splice(ti,0,id);
      PLAN=arr; save(); render();
    } else {
      if (!RM.matches) wrap.style.transition="transform .14s ease";
      wrap.style.transform="translateY(0)";
      setTimeout(()=>{ wrap.style.transition=""; }, 160);
    }
  };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
  document.addEventListener("pointercancel",up);
}

const SP_GAP = 12;    // 浮層下緣與 lane 底之間留的邊距
const SP_MIN = 120;   // 矮視窗的高度地板：視窗矮到 560 仍看得到一段內容並可內捲
let STICKPOP = null;  // null | {kind, key}；**模組層旗標，不進 `S`、不存檔**（同 `LF_POP`）

const SP_KINDS = {
  intro:  { sel:".ghead",     key:el=>el.dataset.spkey,
            body:k=>gintroFor(RT[k]), base:k=>ROAD_OPEN.has(k) },
};

function spDisplaced(el){
  const now=el.getBoundingClientRect().top;
  const prev=el.style.position; el.style.position="static";
  const flow=el.getBoundingClientRect().top;
  el.style.position=prev;
  return Math.abs(now-flow) > 1;
}
function spStuck(el){ return !!el && el.classList.contains("stuck") && spDisplaced(el); }

function spVisible(el, box){
  const r=el.getBoundingClientRect(), b=box.getBoundingClientRect();
  return r.bottom > b.top+0.5 && r.top < b.bottom-0.5;
}

function spIsCurrent(el, k, box){
  const st=[...box.querySelectorAll(k.sel)].filter(x=>x.classList.contains("stuck"));
  return !st.length || st[st.length-1]===el;
}

function stickpopAnchor(){
  if (!STICKPOP) return null;
  const k=SP_KINDS[STICKPOP.kind], box=scrollBox();
  if (!k || !box) return null;
  const all=[...box.querySelectorAll(k.sel)];
  return k.key ? (all.find(el=>k.key(el)===STICKPOP.key) || null) : (all[0] || null);
}
function spAria(el, k){
  if (el && k) el.setAttribute("aria-expanded", !!k.base(k.key ? k.key(el) : null));
}

function setStickpop(spec){
  const prev=stickpopAnchor(), pk=STICKPOP && SP_KINDS[STICKPOP.kind];
  spAria(prev, pk);                       // 舊錨列的 `aria-expanded` 翻回它自己的真值
  STICKPOP = spec || null;
  const old=document.querySelector(".stickpop");
  if (old) old.remove();
  if (STICKPOP) stickpopSync(true);
}

function stickpopSync(rebuild){
  const old=document.querySelector(".stickpop");
  if (!STICKPOP){ if (old) old.remove(); return; }
  const k=SP_KINDS[STICKPOP.kind], box=scrollBox(), a=stickpopAnchor();
  if (!k || !box || !a || !spVisible(a,box) || (k.key && !spIsCurrent(a,k,box))){
    STICKPOP=null; if (old) old.remove(); spAria(a,k); return;
  }
  let p=old;
  if (!p){
    p=document.createElement("div"); p.className="stickpop";
    p.onclick=e=>e.stopPropagation();     // 浮層內的點擊不算「點到外面」（同 `.fpop`）
    document.body.appendChild(p); rebuild=true;
  }
  if (rebuild){
    const keep=p.scrollTop;               // 重造內容不該把人捲回浮層頂端
    p.innerHTML=""; p.appendChild(k.body(STICKPOP.key));
    p.scrollTop=keep;
  }
  a.setAttribute("aria-expanded", true);

  const r=a.getBoundingClientRect(), lr=box.getBoundingClientRect();
  p.style.top       = r.bottom+"px";
  p.style.left      = r.left+"px";
  p.style.width     = r.width+"px";
  p.style.maxHeight = Math.max(SP_MIN, lr.bottom-r.bottom-SP_GAP)+"px";
}

function stickpopHit(el, kind, key){
  if (!spStuck(el)) return false;
  const kk = (key==null) ? null : key;
  const same = STICKPOP && STICKPOP.kind===kind && STICKPOP.key===kk;
  setStickpop(same ? null : {kind, key:kk});
  return true;
}

document.addEventListener("pointerdown", e=>{
  if (!STICKPOP) return;
  const p=document.querySelector(".stickpop");
  if (p && p.contains(e.target)) return;
  const a=stickpopAnchor();
  if (a && a.contains(e.target)) return;
  setStickpop(null);
}, true);

  return true;
}

  if (!SHEET) return;                  // 這一輪又被守衛收掉了（桌機／換頁籤／主體不在）

  HSTEP++;
  history.pushState(navState(), "", location.href);
}

const SHEET_H = {peek:0, full:0};          // 兩態的像素高（每次按下去現量，見下面）

function measureSheet(){
  const wrap=document.getElementById("sheetwrap"), sh=sheetEl();
  if (!wrap || !sh) return;
  const had=sh.classList.contains("dragging");
  sh.classList.add("dragging");
  const was=wrap.getAttribute("data-st") || SHEET_ST;
  wrap.setAttribute("data-st","peek"); SHEET_H.peek=sh.offsetHeight;
  wrap.setAttribute("data-st","full"); SHEET_H.full=sh.offsetHeight;
  wrap.setAttribute("data-st", was);
  void sh.offsetHeight;                       // 讓還原後的高度在拿掉 class 之前先定住
  if (!had) sh.classList.remove("dragging");
}
(()=>{
  const grab=document.getElementById("sheetgrab");
  if (!grab) return;
  let y0=0, base=0, moved=false, kind=null;
  const wrap=()=>document.getElementById("sheetwrap");
  grab.addEventListener("touchstart", e=>{
    if (!SHEET || e.touches.length!==1) return;
    const spec=SHEETS[SHEET]; if (!spec) return;
    kind=spec.kind;
    y0=e.touches[0].clientY; moved=false;
    const sh=sheetEl(); if (!sh) return;
    sh.classList.add("dragging");
    const w=wrap(); if (w) w.classList.add("dragging");
    if (kind==="map"){ measureSheet(); base=sh.offsetHeight; }
  }, {passive:true});
  grab.addEventListener("touchmove", e=>{
    if (!SHEET || !kind || e.touches.length!==1) return;
    const sh=sheetEl(); if (!sh) return;
    const dy=e.touches[0].clientY - y0;
    if (Math.abs(dy)>3){ moved=true; SHEET_DRAGGED=true; }
    if (e.cancelable) e.preventDefault();     // 擋掉瀏覽器把這一下當頁面捲動
    if (kind==="map"){
      sh.style.height = Math.max(40, Math.min(SHEET_H.full, base - dy))+"px";
    } else {
      sh.style.transform = `translateY(${Math.max(0, dy)}px)`;
    }
  }, {passive:false});
  const end=()=>{
    if (!SHEET || !kind) return;
    const sh=sheetEl();
    const w=wrap();
    if (sh) sh.classList.remove("dragging");
    if (w) w.classList.remove("dragging");
    if (!sh || !moved){ kind=null; return; }
    if (kind==="map"){
      const h=sh.offsetHeight;
      sh.style.height="";                       // 交還給 CSS 的 `--sheeth`
      kind=null;
      if (h < SHEET_H.peek*0.55){ closeSheet(); return; }
      setSheetState(h > (SHEET_H.peek + SHEET_H.full)/2 ? "full" : "peek");
    } else {
      const dy=parseFloat((sh.style.transform.match(/-?[\d.]+/)||[0])[0]) || 0;
      sh.style.transform="";
      kind=null;
      if (dy > sh.offsetHeight/3) closeSheet();
    }
  };
  grab.addEventListener("touchend", end, {passive:true});
  grab.addEventListener("touchcancel", end, {passive:true});
})();

const NEAR_STEPS = [{min:15,n:5},{min:30,n:8},{min:45,n:10},{min:60,n:12}];

function pickNearby(list, n){
  const groups=new Map();
  list.forEach(o=>{ if(!groups.has(o.x.theme)) groups.set(o.x.theme,[]); groups.get(o.x.theme).push(o); });
  groups.forEach(g=>g.sort((a,b)=>a.d-b.d));
  const picked=[];
  const gOld=groups.get("oldstreet");
  if (gOld){
    const quota=Math.min(gOld.length, Math.ceil(n/3));
    picked.push(...gOld.splice(0, quota));
    if (!gOld.length) groups.delete("oldstreet");
  }
  const order=[...groups.keys()].sort((a,b)=>groups.get(a)[0].d-groups.get(b)[0].d);
  let idx=0;
  while (picked.length<n){
    let added=false;
    for (const th of order){
      const g=groups.get(th);
      if (idx<g.length){ picked.push(g[idx]); added=true; if (picked.length>=n) break; }
    }
    if (!added) break;
    idx++;
  }
  return picked.sort((a,b)=>a.d-b.d);
}

function stopAt(withGroup, box){
  box = box || scrollBox();
  let y = box.getBoundingClientRect().top + box.clientTop;
  const stuck = el => (el && getComputedStyle(el).position==="sticky") ? el.offsetHeight : 0;
  [...box.children].forEach(el=>{ y += stuck(el); });
  if (withGroup) y += stuck(box.querySelector(".ghead"));
  return y;
}

const CV_ROW_SEL=".results > .grp > .row";
let CV_MEM=null;
function cvRemember(cur){
  if (!cur) return CV_MEM;
  if (!CV_MEM || Math.abs(CV_MEM.w - cur.w) > 0.5) CV_MEM={w:cur.w, hs:new Map()};
  cur.hs.forEach((h, id)=>CV_MEM.hs.set(id, h));
  return CV_MEM;
}
function cvHarvest(root, oldBox){
  if (!oldBox || isRail(oldBox)) return null;
  const extra=new Map(), hs=new Map();
  for (const r of root.querySelectorAll(`${CV_ROW_SEL}, .results > .grp > .place-card > .row`)){
    const id=r.dataset.id;
    if (!id || hs.has(id)) continue;
    const h=r.getBoundingClientRect().height;
    if (!h) continue;                       // 手機另一頁籤 `display:none` 的那一族：沒有高可搬
    let ex=extra.get(r.className);
    if (ex==null){
      const cs=getComputedStyle(r);
      ex=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth);
      extra.set(r.className, ex);
    }
    if (h-ex>0) hs.set(id, h-ex);
  }
  return hs.size ? {w:oldBox.clientWidth, hs} : null;
}
function cvApply(box, carry){
  if (!carry || !box || isRail(box)) return;
  const done=[];
  for (const r of box.querySelectorAll(CV_ROW_SEL)){
    const h=carry.hs.get(r.dataset.id);
    if (h){ r.style.containIntrinsicSize=`auto ${h}px`; done.push(r); }
  }
  if (done.length && Math.abs(box.clientWidth - carry.w) > 0.5) done.forEach(r=>{ r.style.containIntrinsicSize=""; });
}

  if (SCROLL_TO){

    const wantId = (typeof SCROLL_TO==="string") ? SCROLL_TO : SCROLL_TO.id;

    const row=expLane.querySelector(`.results > .grp > .place-card > .row[data-id="${wantId}"]`)

    if (el && el.offsetParent){

      const bodyTop=(nx && nx.classList.contains("place-detail")) ? nx.getBoundingClientRect().top : r.bottom;
      let d=0;

      if (bodyTop + r.height > ceilY) d = Math.max(0, Math.min(bodyTop - ceilY + r.height, r.top - floorY));
      if (d) expLane.scrollTop += d;
    }
    SCROLL_NEAR=null;
  }

}

let REFIX=null;
function refixLanding(fromFrame){
  const R=REFIX;
  if (!R) return;
  if (R.passes>=3){ REFIX=null; return; }
  const box=scrollBox();
  if (!box || isRail(box)){ REFIX=null; return; }
  const row=box.querySelector(`.results > .grp > .place-card > .row[data-id="${R.id}"]`)
         || box.querySelector(`.results > .grp > .row[data-id="${R.id}"]`);
  const el=(R.top && row) ? (row.closest(".place-card") || row) : row;
  if (!el || !el.offsetParent){ REFIX=null; return; }
  const diff=el.getBoundingClientRect().top - R.target;
  if (Math.abs(diff)<1){ if (fromFrame && REFIX===R) REFIX=null; return; }
  R.passes++;
  box.scrollTop=Math.max(0, box.scrollTop+diff);
  syncStuck(box);
  requestAnimationFrame(()=>requestAnimationFrame(()=>refixLanding(true)));
}

let MSEARCH = false;
const navState = () => {

  if (SHEET && SHEET_PUSHED){ st.sh = 1; st.sk = SHEET; }

};
const hashNow = () => S.sel || null;
function parseHash(){
  const h=(location.hash||"").replace(/^#/,"");
  if (!h) return null;
  let any=false, place=null;
  h.split("&").forEach(kv=>{
    const i=kv.indexOf("="); if (i<0) return;
    if (kv.slice(0,i)!=="place") return;
    any=true;
    let v; try{ v=decodeURIComponent(kv.slice(i+1)); }catch(e){ return; }
    if (BY_ID[v]) place=v;
  });
  return any ? {place} : null;
}

function syncHash(){
  if (HASH_APPLYING) return;
  const st=hashNow();
  const s = st ? "#place="+encodeURIComponent(st) : "";
  const cur=location.hash||"";
  if (s===cur){ HASH_LAST=st; return; }
  if (!s && !/(^#|&)place=/.test(cur)){ HASH_LAST=st; return; }
  const deeper = !!st && !HASH_LAST;
  const url = s || (location.pathname + location.search);
  if (deeper) HSTEP++;
  history[deeper ? "pushState" : "replaceState"](navState(), "", url);
  HASH_LAST=st;
}

function applyHash(initial){
  const h=parseHash();
  if (initial && !h){ HASH_APPLYING=false; HASH_LAST=hashNow(); syncHash(); return; }
  const want = h ? h.place : null;

  try{
    if (want!==S.sel){
      if (want) select(want);
      else { S.sel=null; S.near=0; }

  HASH_LAST=hashNow();
  render();          // 「關掉景點」那一路沒有 render 過，補一次

function syncStuck(box){

  const bt=box.getBoundingClientRect().top + box.clientTop; let last=null;
