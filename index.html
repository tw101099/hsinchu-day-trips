*{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--sb) transparent;
  -webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--sb); border-radius:999px; border:3px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--sb-hover); background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

html{height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
     background:var(--bg); background-image:var(--paper-bg)}
body{
  margin:0; height:100dvh; overflow:hidden; overscroll-behavior:none;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;

  background-image:var(--paper-bg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
button{font:inherit; color:inherit; cursor:pointer}

.num{font-family:var(--mono); font-size:.92em; letter-spacing:-.01em}
.ic{width:14px; height:14px; flex:none; stroke:currentColor; fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px; margin-right:4px}

.app{display:flex; flex-direction:column; height:100dvh; overflow:hidden}

@media (display-mode:standalone) and (orientation:portrait){
  html, body, .app{ height:100vh; height:-webkit-fill-available; }
}
.bar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  background:var(--panel); border-bottom:1px solid var(--hair); flex-wrap:wrap;   
}

.logo{margin:0; font-size:inherit; font-weight:700; white-space:nowrap}
.logo small{display:block; font-weight:400; font-size:11px; color:var(--ink3); letter-spacing:.06em}

#qwrap{

  flex:1 1 150px; max-width:250px; min-width:110px; padding:2px 9px 2px 6px;
  border-radius:999px; border:1px solid var(--hair2); background:var(--bg);   
  display:flex; flex-wrap:nowrap; align-items:center; gap:3px; min-height:32px; cursor:text;
  overflow-x:auto; scrollbar-width:none;
}
#qwrap::-webkit-scrollbar{display:none}
@media (hover:hover){#qwrap:hover{border-color:var(--accent)}}
#qwrap:focus-within{outline:1px solid var(--accent); border-color:var(--accent)}
#q{
  flex:1 1 60px; min-width:50px; width:0; padding:3px 0 3px 6px; border:none; outline:none;
  background:transparent; color:var(--ink); font:inherit; font-size:16px;
}

.qtok{
  flex:none;   
  display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:1.7;
  padding:0 7px 0 9px; border-radius:999px; border:1px solid var(--accent);
  color:var(--accent); background:none; cursor:pointer; white-space:nowrap; font-family:inherit;
}
@media (hover:hover){.qtok:hover{opacity:.7}}
.qtok .x{font-size:14px; line-height:1; opacity:.8}

#theme{
  flex:none; border:1px solid var(--hair); background:var(--chip-bg); border-radius:999px;   
  padding:5px 9px; line-height:1; color:var(--ink2);
  position:relative;   
}

#theme::after{content:""; position:absolute; inset:-8px -4px}

#theme svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6;
           stroke-linecap:round; stroke-linejoin:round; vertical-align:-2px}

#qreset{
  flex:none; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  border:1px solid var(--hair); background:var(--chip-bg); color:var(--ink2);   
  border-radius:999px; padding:3px 10px; font-size:12.5px; line-height:1.5; font-family:inherit;
}
#qreset[hidden]{display:none}

#qreset .gl{display:inline-flex; line-height:1}
#qreset .gl svg{
  display:block; width:14px; height:14px;
  stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;

.detail{

.place-card{

.place-detail .facts, .place-detail .tags, .place-detail .desc,

.crumb{margin:0 0 8px}
.facts{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; font-size:13px; margin-top:0; margin-bottom:10px}

.detail .desc{font-size:14px; margin-top:0; margin-right:0; margin-bottom:9px; -webkit-user-select:text; user-select:text}

.flag{

}

}

.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:0; margin-bottom:9px}

  border:1px solid var(--hair); color:var(--ink2); white-space:nowrap; cursor:pointer;

}

.tags .tag::after{content:""; position:absolute; inset:-2.5px 0}

.mapcard .tags{margin:8px 0 0}

.acts{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; margin-top:10px; margin-right:0; margin-bottom:4px}

}

@media (hover:hover){.acts .primary:hover{color:var(--on-accent); border-color:var(--accent); background-color:color-mix(in srgb, var(--accent) 88%, var(--ink))}}

.nearby{margin-top:14px; margin-left:-10px; padding-top:0; border-top:0}

.nearby h3{margin:0 0 8px 10px}
.nearby .row{padding:5px 6px}
.nearby .nonear{margin:2px 6px 0; font-size:12px; color:var(--ink3); line-height:1.6}
.wider{border:0; background:none; color:var(--ink3); font-size:12px; text-decoration:underline; padding:4px 6px 0}
@media (hover:hover){.wider:hover{color:var(--accent)}}

.legend{display:flex; flex-wrap:wrap; gap:4px 12px; padding:11px 15px 8px; font-size:11.5px;
        color:var(--ink3); margin-top:11px; border-top:1px solid var(--hair)}   
.legend span{display:inline-flex; align-items:center}
.foot{font-size:11.5px; color:var(--ink3); line-height:1.75; padding:6px 15px 24px; margin:0}

.trip{background:var(--panel)}

.trip .head{

  font-size:13.5px;
}
.trip .head .hint{flex:1; min-width:0; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.trip .sheet{display:none; max-height:min(60vh,520px); overflow-y:auto; overscroll-behavior:contain; padding:0 14px 14px; border-top:1px solid var(--hair)}   
.trip.open .sheet{display:block}
.setrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 0 4px}
.setrow .lab{font-size:12px; color:var(--ink3); letter-spacing:.06em}

.backbit{font-size:12px; color:var(--ink3); white-space:nowrap}
.backbit .num{font-family:var(--mono); color:var(--ink2)}

#start{

  border:1px solid var(--hair2); background:var(--bg); color:var(--ink2); border-radius:999px;
  padding:2px 7px; font:inherit; font-size:16px; line-height:1.15; font-family:var(--mono);

}

#start:focus{outline:1px solid var(--accent); border-color:var(--accent)}

#start::-webkit-calendar-picker-indicator{ cursor:pointer; filter:opacity(.42); }

@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #start{ color-scheme:dark; } }

.plan{display:flex; flex-direction:column; margin:6px 0 10px; max-height:38vh; overflow-y:auto; overscroll-behavior:contain}

.setrow .home{

  display:grid; place-items:center; font-size:10px; color:var(--ink3);
}

.ttotal{
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;

}
.ttotal.late{color:var(--warn)}

.tnear{margin-top:11px; margin-bottom:11px; border-top:1px solid var(--hair); padding-top:8px}
.tnear h3{margin:0 0 6px}
.tnear .row{padding:5px 6px}
.tnear .nonear{margin:2px 6px 0; font-size:12px; color:var(--ink3); line-height:1.6}

.tnearacts{display:flex; align-items:center; gap:10px; flex-wrap:wrap}

.mi{display:inline-flex; align-items:baseline; gap:3px}

.mi .caric, .mi .hgic{align-self:center; position:relative; top:-0.05em}

.mi .sep{line-height:0}

.tnear .row .m{flex-wrap:nowrap; min-width:0}
.tnear .row .m .mi{min-width:0}

  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.caric{width:15px; height:8px; flex:none; stroke:currentColor; fill:none; stroke-width:5;
       stroke-linecap:round; stroke-linejoin:round}
.hgic{width:5.5px; height:9px; flex:none; stroke:currentColor; fill:none; stroke-width:1.3;
      stroke-linecap:round; stroke-linejoin:round}

.stopwrap{position:relative}

.stopwrap + .stopwrap{margin-top:var(--rowgap)}

.stop{
  background-color:var(--surface-sheet);
  background-image:var(--card-lift),var(--paper-sheet);
  box-shadow:var(--lift-shadow);
  border-color:transparent;
}

@media (hover:hover){.nearby .row:hover, .tnear .row:hover{background-color:var(--state-hover)}}

.stop{
  padding:7px 9px; position:relative; z-index:1;

}

.stop .jump{cursor:pointer}

.stopwrap.dragging .stop{box-shadow:0 4px 14px rgba(var(--sh),.20); cursor:grabbing}

.stopwrap.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent)}

.swipebg{
  position:absolute; inset:0; border-radius:var(--r); background:var(--accent); color:var(--on-accent);

.stop .no{
  flex:none; width:22px; height:22px; border-radius:999px; background:var(--accent); color:var(--on-accent);
  font-size:11px; font-weight:700; text-align:center; line-height:22px; font-family:var(--mono);
}
.stop .nm{border:0; background:none; padding:0; text-align:left; font-size:14px; font-weight:600; white-space:nowrap}
@media (hover:hover){.stop button.nm:hover{color:var(--accent)}}

@media (hover:hover){.stop .nm.jump:hover, .stop .no.jump:hover + .nm{color:var(--accent)}}

.stop .win{font-size:12px; color:var(--ink2); font-family:var(--mono); white-space:nowrap}
.stop .warn{font-size:11.5px; color:var(--warn)}

.stepper{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--hair); background:var(--chip-bg); border-radius:999px; padding:1px 2px}

@media (hover:hover){.stepper button:hover{color:var(--accent)}}
.stepper .v{font-size:11.5px; color:var(--ink2); font-family:var(--mono); min-width:52px; text-align:center; white-space:nowrap}

.stop.dstop{
  display:grid; grid-template-columns:minmax(0,1fr) 28px; column-gap:8px; row-gap:3px;

.dstop .rb{grid-area:rb; display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}

.dstop .warn{grid-area:warn}

.dstop .nm{white-space:normal; line-height:1.35; min-width:0}

.dstop .grip{
  grid-area:grip; display:grid; place-items:center; width:28px; height:28px; justify-self:end;

  border:1px solid var(--hair); background:var(--chip-bg); color:var(--ink2);   
  width:28px; height:28px; border-radius:999px; line-height:1; font-size:12px; padding:0;
}
@media (hover:hover){.dstop .x:hover{color:var(--accent)}}   

.trip .go{display:flex; gap:6px; flex-wrap:wrap; padding-bottom:4px}

10:00–17:00、假日 10:00–17:30，全年無休。每日 11:00 與 14:30 兩場免費定時導覽（約 50 分鐘，憑票入場）。", "season": "", "source": "https://www.taiwan.net.tw/m1.aspx?sNo=0001107&id=A12-00243", "route": "beiheng", "tags": ["雨天", "手作", "老宅"], "stay_h": 2.0, "drive_min": 60, "total_h": 4.0, "season_months": [], "id": "p8805f824"}, {"name": "後慈湖", "town": "桃園市大溪區", "lat": 24.84525, "lng": 121.30239, "theme": "heritage", "kind": "管制歷史園區", "diff": "散步", "time": "步道全長約 1.6 公里，含導覽約 1.5–2 小時", "drive": "從新竹市區約 50 分", "desc": "1950–60 年代規劃為蔣中正戰時避難所與備用官邸的軍事管制區，塵封多年後局部開放。沿湖步道可見多座戰備碉堡、防空洞與集中安置的蔣公銅像群，山林保留較原始的生態樣貌。", "note": "**全程預約制**，要先在桃園市後慈湖入園申請系統或電話預約；也可當日上午 8 時起帶證件到慈湖導覽服務站現場候補。票價全票 100 元、優待票 50 元。入園規定與梯次近年變動過（試營運轉正式營運），出發前務必上官網確認當期梯次與是否休園整備。", "season": "", "source": "https://backcihu.tycg.gov.tw/", "route": "beiheng", "nav": [24.84034, 121.29402], "tags": ["需預約"], "stay_h": 2.0, "drive_min": 50, "total_h": 3.7, "season_months": [], "id": "p7c035ca2"}, {"name": "北插天山（赫威神木）", "town": "桃園市復興區", "lat": 24.790340169773053, "lng": 121.4375732893024, "theme": "trail-mountain", "kind": "步道", "diff": "挑戰", "time": "來回抓一整天", "drive": "從新竹市區約 90 分", "route": "beiheng", "desc": "標高 1,727 公尺，位於插天山自然保留區內，需事先申請入園許可。山徑長約 13 公里且後段泥濘陡峭需拉繩攀登，沿途分佈全台海拔最低的赫威紅檜巨木群，稜線則覆蓋珍貴的台灣山毛櫸純林，秋冬之際山毛櫸葉轉為金黃，為北部具代表性的長程中級山健行路線。", "note": "**屬插天山自然保留區，須於入園前 5–60 天線上申請許可**；全程步程 8–10 小時，後段泥濘陡峭需拉繩攀爬，務必攜帶頭燈、雨具與足夠飲水。", "season": "秋末山毛櫸轉黃是主要造訪季節。", "source": "", "coord_conf": "high", "nav_target": "QCX9+F5 Beichatian Parking Lot, 義盛里復興區桃園市336", "tags": ["需預約", "巨木", "避暑"], "stay_h": 8.0, "drive_min": 90, "total_h": 11.0, "season_months": [9, 10, 11], "season_type": "add", "id": "pdc19cc27"}, {"name": "拉拉山國家森林遊樂區", "town": "桃園市復興區", "lat": 24.711290529794812, "lng": 121.43303330990288, "theme": "trail-mountain", "kind": "國家森林遊樂區", "diff": "散步", "time": "遊客中心與巨木步道約 2–3 小時；四條步道走完可達整天", "drive": "從新竹市區約 120 分", "desc": "位於中海拔霧林帶，海拔約 1,500 至 1,650 公尺，為北台灣著名的紅檜與台灣扁柏原始森林。園區環狀步道長約 3.3 公里，全程鋪設平緩碎石路與木棧道，沿線串聯 24 株受列管保護的千年巨木，終點達觀亭環境清幽，適合全年齡層進行森林浴與生態觀察。", "note": "門票全票 150 元、半票 75 元、優待票 10 元（平假日均同）；園區開放 06:00–17:00，除夕休園一日，遊客中心服務 08:00–17:00；山路狹窄，不開放甲乙類客車與保母車，進入車輛限車長 6 公尺、車寬 2 公尺；管理站電話 03-3912142。", "season": "", "source": "https://recreation.forest.gov.tw/forest/RA?typ_id=0200005", "route": "beiheng", "gmap": "336桃園市復興區華陵里巴陵207號拉拉山國家森林遊樂區 遊客中心", "nav_target": "336桃園市復興區華陵里巴陵207號拉拉山國家森林遊樂區 遊客中心", "tags": ["巨木", "避暑"], "stay_h": 3.0, "drive_min": 120, "total_h": 7.0, "season_months": [], "id": "p2296bb13"}, {"name": "東眼山國家森林遊樂區", "town": "桃園市復興區", "lat": 24.83126, "lng": 121.40794, "theme": "trail-mountain", "kind": "森林遊樂區", "diff": "健行", "time": "自導式步道環一圈約 2 小時；加走東滿步道等路線可安排 4–6 小時", "drive": "從新竹市區約 85 分", "desc": "位於海拔 900 至 1,212 公尺之間，東眼山名列台灣小百岳，山頂立有三等三角點與高架瞭望台，天氣晴朗時可遠眺台北盆地與七星山。自導式步道長約 4 公里，穿梭於整齊筆直的柳杉人工造林地與三千萬年前生痕化石區，園區後方並有東滿步道可越嶺連通三峽滿月圓。", "note": "需購票：平日全票 80 元、假日 100 元，半票 50 元。開放平日 08:00–17:00、例假日 07:00–17:00，除夕休園。小型車停車另計（平日 100 元、假日 150 元）。", "season": "楓紅季 11–12 月。", "source": "https://recreation.forest.gov.tw/Forest/RA?typ_id=0200003", "route": "beiheng", "tags": ["展望", "避暑"], "stay_h": 6.0, "drive_min": 85, "total_h": 8.8, "season_months": [11, 12], "season_type": "add", "id": "p36a266ff"}, {"name": "那結山步道", "town": "桃園市復興區", "lat": 24.773916545330554, "lng": 121.32498297473548, "theme": "trail-mountain", "kind": "步道", "diff": "挑戰", "time": "中級山路線，來回抓半天", "drive": "從新竹市區約 85 分", "route": "beiheng", "desc": "標高 1520 公尺，與夫婦山、復興尖山合稱「復興三尖」，山名源自昔日泰雅族那結社。山徑原始陡峭，沿途分布杜鵑純林與巨木，登頂前需手腳並用攀爬近垂直的陡峭岩壁與拉繩，山頂裸岩視野絕佳，為北部極具挑戰性與攀登樂趣的中級山代表。", "note": "登頂前有多段近垂直裸岩需拉繩攀爬，建議攜帶手套；山徑原始濕滑，雨天或雨後切勿前往。", "season": "", "source": "", "coord_conf": "high", "tags": ["展望", "避暑"], "stay_h": 4.0, "drive_min": 85, "total_h": 6.8, "season_months": [], "id": "p25c29ec4"}, {"name": "小烏來天空步道", "town": "桃園市復興區", "lat": 24.79033, "lng": 121.37548, "theme": "trail-near", "kind": "玻璃步道", "diff": "健行", "time": "天空步道停留約 20–30 分；含天空繩橋、風動石步道全程約 1.5–2 小時", "drive": "從新竹市區約 70 分", "desc": "突出崖邊的 U 形玻璃廊道可直視腳下的小烏來瀑布，另有全國最長的繩索吊橋「天空繩橋」與著名的風動石景觀。園區海拔約 650 公尺，四周是陡峭溪谷地形。", "note": "**採總量管制與時段預約制**：每日限額、每半小時一梯次，開放 08:00–12:00 與 13:00–17:00（中午清潔整備不開放）。線上預約於入園前 2–30 天申請，也可當日到石板廣場現場候補。每週一休園（遇連續假日順延一日）。出發前務必上官方系統確認名額。", "season": "", "source": "https://www.taiwan.net.tw/m1.aspx?sNo=0001107&id=A12-00239", "route": "beiheng", "tags": ["需預約", "展望", "瀑布", "峽谷"], "stay_h": 2.0, "drive_min": 70, "total_h": 4.3, "season_months": [], "id": "p5daf103d"}, {"name": "打鐵寮古道", "town": "桃園市大溪區", "lat": 24.85336118209008, "lng": 121.29799705455716, "theme": "trail-near", "kind": "古道", "diff": "健行", "time": "約 3 小時", "drive": "從新竹市區約 55 分", "route": "beiheng", "desc": "清代大溪往復興的挑運舊路，日治時期用來運樟腦。沿線有三座糯米橋（濟安橋、東興橋、太平橋），溪谷段林蔭密、石階與土路交錯，是大溪這一帶最完整的一條古道。", "note": "登山口在三層地區、慈康宮附近；可以只走到東興橋折返，也可以接白石山，兩種走法時間差很多。", "season": "", "source": "", "coord_conf": "high", "tags": [], "stay_h": 3.0, "drive_min": 55, "total_h": 4.8, "season_months": [], "id": "pf30e665c"}, {"name": "枕頭山古砲臺步道", "town": "桃園市復興區", "lat": 24.81127, "lng": 121.33444, "theme": "trail-near", "kind": "古砲台步道", "diff": "健行", "time": "環走約 6.2 公里、爬升 300 餘公尺，約 3.5–4 小時", "drive": "從新竹市區約 65 分", "desc": "山頂平緩、四周陡削形似枕頭而得名，海拔 641 公尺。清代與日治時期都曾在山頂平台架設砲台鎮壓當地泰雅族部落，是大嵙崁事件與枕頭山事件的古戰場。稜線步道穿行相思林與桂竹林，可眺望三民聚落與北橫公路。", "note": "免門票。山徑原始，部分路段土徑濕滑，建議穿登山鞋。台7線 12.3K 或 14.5K 兩處可接產業道路上登山口，還要再步行 1–2 公里才到正式步道口。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=619", "route": "beiheng", "nav": [24.81418, 121.3316], "tags": ["展望"], "stay_h": 4.0, "drive_min": 65, "total_h": 6.2, "season_months": [], "id": "p9705818f"}, {"name": "白石山", "town": "桃園市大溪區", "theme": "trail-near", "kind": "步道", "lat": 24.8527, "lng": 121.3176, "coord_conf": "high", "diff": "健行", "time": "單走 4.5 公里約 1 小時 45 分；接打鐵寮古道 O 形 3–4 小時", "drive": "從新竹市區約 60 分", "desc": "山頂一整片砂岩壁長約 700 公尺、垂直落差數十公尺，末段要沿岩稜壁橫渡；打鐵寮古道段是日治時期樟腦採集的挑運舊路。", "season": "春季金毛杜鵑；7–8 月艷紅鹿子百合", "note": "兩個起登點：桃118鄉道、百吉隧道南口往復興方向約 1.7 公里處，或從白石埤起登。岩稜段雨後濕滑。打鐵寮古道另有獨立條目，那是可以分開走的另一趟行程。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1027", "far": false, "route": "beiheng", "gmap": "白石山（接打鐵寮古道）", "nav": [24.8454, 121.31705], "tags": ["展望"], "stay_h": 4.0, "drive_min": 60, "total_h": 6.0, "season_months": [7, 8], "season_type": "add", "id": "p4ef79e58"}, {"name": "百吉林蔭步道", "town": "桃園市大溪區", "lat": 24.83898, "lng": 121.30729, "theme": "trail-near", "kind": "林蔭步道", "diff": "散步", "time": "全長約 2.6 公里，單程約 1 小時、原路折返約 2 小時", "drive": "從新竹市區約 55 分", "desc": "沿石龜坑山腰整建的舊時越嶺道，柏油路面平緩好走，早年是大溪通往角板山唯一的山路。西入口就在後慈湖南管制門對面，往東翻過稜線後接近舊百吉隧道，東端終點在石龜坑橋。", "note": "免門票。林蔭遮蔭度高但展望有限。可與舊百吉隧道、後慈湖排在同一站順遊（後慈湖需另外預約入園）。", "season": "4–5 月螢火蟲季。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=519", "route": "beiheng", "tags": ["寵物", "無障礙"], "stay_h": 2.0, "drive_min": 55, "total_h": 3.8, "season_months": [4, 5], "season_type": "add", "id": "p6e4f3a10"}, {"name": "石龜坑古道（百吉林蔭步道）", "town": "桃園市大溪區", "theme": "trail-near", "kind": "古道", "lat": 24.8347, "lng": 121.3039, "coord_conf": "high", "diff": "散步", "time": "林蔭步道段來回約 1.5 小時；接石龜坑山、白石山 O 形 4–5 小時", "drive": "從新竹市區約 55 分", "desc": "路線本體是廢棄的舊桃118鄉道，順山稜緩上、路面土石、林相完整；石龜坑山 485 公尺山頂立一顆「總督府」基石，位在林間無展望。清代至日治是大溪往角板山的幹線。西入口旁就是舊百吉隧道——1944 年日治時期開鑿供輕便車與行人通行，1969 年拓寬通車，1993 年新百吉隧道啟用後封閉了 14 年，2007 年整修重新開放；洞內平整涼爽，南洞口留有前台灣省主席黃杰題字「北段橫貫公路」，走步道前後順道進去看一趟。", "season": "", "note": "停車在百吉隧道口。可與湳仔溝古道（總督府步道）串走。", "source": "https://hiking.biji.co/index.php?q=news&act=info&id=18499", "far": false, "route": "beiheng", "gmap": "335桃園市大溪區百吉林蔭步道-西入口", "nav_target": "335桃園市大溪區百吉林蔭步道-西入口", "tags": ["避暑"], "stay_h": 5.0, "drive_min": 55, "total_h": 6.8, "season_months": [], "id": "pee43d4ea"}, {"name": "蝙蝠洞", "town": "桃園市復興區", "lat": 24.83814, "lng": 121.35027, "theme": "trail-near", "kind": "天然洞穴", "diff": "健行", "time": "蝙蝠洞到觀音洞的連通步道約 2 公里，來回約 2 小時", "drive": "從新竹市區約 65 分", "desc": "三民溪谷間天然形成的砂岩洞穴，洞口高約 20 公尺、寬約 50 公尺、深約 20 公尺，早年洞內棲有大量蝙蝠而得名。市府已完成觀音洞步道連通蝙蝠洞的工程，兩點現在能一次串走。", "note": "免門票。步道沿溪岸修築，部分路段濕滑，雨後注意落石與溪水暴漲。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1062", "route": "beiheng", "tags": ["峽谷", "避暑"], "stay_h": 2.0, "drive_min": 65, "total_h": 4.2, "season_months": [], "id": "p3ccd1c6b"}, {"name": "觀音洞橋", "town": "桃園市復興區", "lat": 24.83538, "lng": 121.35571, "theme": "trail-near", "kind": "溪谷步道", "diff": "健行", "time": "觀音洞步道全長約 2 公里，單程約 1 小時", "drive": "從新竹市區約 65 分", "desc": "觀音洞步道沿三民溪上游溪谷而建，串連秋山清泉岩觀音洞與三民蝙蝠洞。步道中段的觀音洞橋橋面已改鋪鐵板，走上去會隨腳步晃動並發出聲響，是全程最有記憶點的一段。", "note": "免門票。鐵板橋面雨天濕滑要小心。建議與蝙蝠洞排在同一趟走完整條溪谷步道。", "season": "", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1062", "route": "beiheng", "tags": ["峽谷"], "stay_h": 1.0, "drive_min": 65, "total_h": 3.2, "season_months": [], "id": "pe2b887c6"}, {"name": "角板山公園", "town": "桃園市復興區", "lat": 24.81397, "lng": 121.35068, "theme": "trail-near", "kind": "歷史公園", "diff": "散步", "time": "含行館、梅園、戰備隧道繞行約 1.5–2 小時", "drive": "從新竹市區約 65 分", "desc": "台地上原為泰雅族部落舊址，蔣中正 1960 年闢建角板山行館作為北部行館之一。園內思親亭可俯瞰大漢溪河谷，另有戰備隧道、樟腦收納所史蹟，與近 300 棵梅樹的梅園——是北台灣最大的梅園之一。", "note": "行館與公園免門票；戰備隧道開放時段以現場公告為準。假日人潮多、車位有限，建議提早到。", "season": "12 月到隔年 1 月梅花季；秋季部分區域楓紅。", "source": "https://www.scenic.tycg.gov.tw/cp.aspx?n=9507", "route": "beiheng", "tags": ["展望"], "stay_h": 2.0, "drive_min": 65, "total_h": 4.2, "season_months": [1, 12], "season_type": "add", "id": "pb206995f"}, {"name": "嘎拉賀野溪溫泉步道", "town": "桃園市復興區", "lat": 24.633016875810906, "lng": 121.4078366145947, "theme": "water", "kind": "野溪溫泉步道", "diff": "挑戰", "time": "下切、泡湯與回程抓半天以上", "drive": "從新竹市區約 140 分", "route": "beiheng", "desc": "單程約 1.6 公里，下切至大漢溪上游溪谷，為全台少見的天然溫泉瀑布步道。", "note": "去程一路下切、回程全是上坡，體力要留一半給回程；溪水暴漲時危險，雨後不要前往。", "season": "", "source": "", "coord_conf": "high", "nav_target": "336桃園市復興區25、嘎拉賀溫泉停車場", "tags": ["瀑布", "峽谷", "溫泉", "玩水"], "stay_h": 4.0, "drive_min": 140, "total_h": 8.7, "season_months": [], "id": "pf63b5eca"}, {"name": "羅浮溫泉", "town": "桃園市復興區", "lat": 24.792867578657418, "lng": 121.36664396633878, "theme": "water", "kind": "溫泉", "diff": "開車", "time": "約 1–2 小時（泡湯）", "drive": "從新竹市區約 70 分", "route": "beiheng", "desc": "北橫羅浮泰雅部落核心的溫泉休閒園區，泉水為與礁溪同源的優質弱鹼性碳酸氫鈉泉（美人湯），水質滑潤洗滌肌膚。園區規劃戶外露天 SPA 池、高低溫泉池、賞景池與免費足湯，坐擁大漢溪谷山色，可與一旁的復興橋、羅浮雙橋串成北橫泡湯一日遊。", "note": "戶外大眾池全票約 280–300 元（需著泳裝泳帽）；週二公休（寒暑假除外），出發前建議查詢官方當期營運公告。", "season": "", "source": "", "coord_conf": "high", "tags": ["溫泉"], "stay_h": 2.0, "drive_min": 70, "total_h": 4.3, "season_months": [], "id": "p56e30ec9"}, {"name": "鐵木瀑布（優霞雲瀑布）", "town": "桃園市復興區", "lat": 24.81381, "lng": 121.38484, "theme": "water", "kind": "瀑布", "diff": "健行", "time": "停車處步行約 5–10 分鐘即達，來回約 30–40 分", "drive": "從新竹市區約 70 分", "desc": "位於霞雲里庫志道路旁，因泰雅族頭目 Temu 首先發現而稱鐵木瀑布，又因鄰近優霞雲部落也稱優霞雲瀑布。落差不算高但水量豐沛、峽谷地形陡峭，步行距離短，親子也能輕鬆到達。", "note": "免門票、免費停車。步道短但溪石濕滑，雨後水量暴漲時勿靠近戲水。", "season": "夏季戲水消暑。", "source": "https://fullfen.tw/youxiayun-waterfall/", "route": "beiheng", "tags": ["避暑", "瀑布", "峽谷", "玩水"], "stay_h": 0.67, "drive_min": 70, "total_h": 3.0, "season_months": [6, 7, 8], "season_type": "add", "id": "p7b98017b"}, {"name": "阿姆坪（石門水庫東岸）", "town": "桃園市大溪區", "theme": "water", "kind": "水庫", "lat": 24.81779, "lng": 121.31181, "coord_conf": "high", "diff": "開車", "time": "停車走 40 分–1 小時", "drive": "從新竹市區約 60 分", "desc": "環湖公路東端的湖畔營地與碼頭，湖面在這裡收窄成峽谷狀，是少數能從水面高度看石門水庫的角度；往薑母島的渡船也從這一帶出發。", "season": "枯水期水位下降時湖岸露出大片礫灘，景觀差很多。", "note": "從大溪走台 7 乙轉環湖路，路窄彎多、大車不易會車；渡船班次不固定，要現場問；水域禁止戲水。", "source": "https://zh.wikipedia.org/wiki/石門水庫_(臺灣)", "far": false, "route": "beiheng", "stay_h": 1.0, "drive_min": 60, "total_h": 3.0, "season_months": [], "id": "pf34c63fb"}, {"name": "霞雲生態池", "town": "桃園市復興區", "lat": 24.81163, "lng": 121.38675, "theme": "water", "kind": "生態池", "diff": "散步", "time": "池畔繞行約 20–30 分", "drive": "從新竹市區約 70 分", "desc": "官方多稱「嘎嘎生態池」，因夜晚蛙鳴此起彼落而得名。位於霞雲國小前庫志道路約 400 公尺處，池水因水生植物與微生物作用呈現特別的水色。與鐵木瀑布同在庫志溪沿線，可安排同一趟。", "note": "免門票。生態敏感，請勿下水或餵食。", "season": "", "source": "https://travel.tycg.gov.tw/zh-tw/travel/attraction/1182", "route": "beiheng", "tags": ["濕地"], "stay_h": 0.5, "drive_min": 70, "total_h": 2.8, "season_months": [], "id": "pef834993"}, {"name": "回咖啡", "town": "新竹市香山區", "theme": "cafe", "kind": "咖啡", "lat": 24.7975562, "lng": 120.95192899999999, "coord_conf": "high", "diff": "開車", "time": "約 45 分", "drive": "從新竹市區約 10 分", "desc": "藏身香山靜巷住宅的不限時自烘咖啡館，主打濃郁滑順的「開心果巴斯克」、扎實焦糖布丁與清爽西西里氣泡咖啡；綠意採光與居家般的溫潤氛圍，讓人能慢下腳步細品咖啡香。", "season": "", "note": "營業時間 12:00–18:00（公休日以店家 IG 公告為準）；店內不限時、無訂位服務。", "source": "", "far": false, "route": "coast-17km", "stay_h": 0.75, "drive_min": 10, "total_h": 1.1, "season_months": [], "id": "pa07d3f31"}, {"name": "示畐", "town": "新竹市香山區", "theme": "cafe", "kind": "咖啡", "lat": 24.794681699999998, "lng": 120.9451089, "coord_conf": "high", "diff": "開車", "time": "約 45 分", "drive": "從新竹市區約 10 分", "desc": "隱身香山東華路的平價蔬食早午餐與甜點咖啡館，以香濃手作肉桂捲、巴斯克乳酪與自烘精品咖啡為招牌；溫馨明亮的空間提供全素與蛋奶素無肉料理，是香山清幽舒適的歇腳處。", "season": "", "note": "營業時間約 08:30–16:30（週三、四公休）；鄰近香山親子館，路邊停車格。", "source": "", "far": false, "route": "coast-17km", "tags": ["蔬食"], "stay_h": 0.75, "drive_min": 10, "total_h": 1.1, "season_months": [], "id": "p91705bb8"}, {"name": "飛帆生活藝術·人文·咖啡館", "town": "新竹市香山區", "theme": "cafe", "kind": "咖啡", "lat": 24.7195, "lng": 120.9194, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "香山中華路（台1線）邊的人文咖啡館，往西走就是香山濕地賞蟹步道與香山車站（1928 年的日式木造車站），適合排在海線行程的中段。", "season": "香山濕地退潮時才看得到招潮蟹，需先查潮汐", "note": "位於台1線中華路旁，車速較快需注意迴轉動線；店內設有專屬停車空間。", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [], "id": "p3a892109"}, {"name": "十七公里海岸線自行車道", "town": "新竹市北區", "theme": "coast", "kind": "自行車道", "lat": 24.84406, "lng": 120.92516, "coord_conf": "high", "diff": "散步", "time": "單程 17.5 公里、高度落差僅 3 公尺；騎乘來回約 3 小時，全程步行 4 小時 25 分", "drive": "從新竹市區約 15 分", "desc": "從漁港生態公園一路鋪到鹽水港溪南岸，3.5 公尺車道與 1.5 公尺人行道分開走，中途跨港北運河、客雅溪、三姓公溪、鹽水港溪等五座橋，串起看海公園、海天一線、港南運河、紅樹林、賞蟹步道到南港賞鳥區。", "season": "全程無遮蔽、正對西面海風；10–3 月東北季風季由北往南騎順風，回程逆風要多留半小時。", "note": "南寮與港南都有租車店；沿線便利商店少，帶水；全線無下水點，海側都是堤岸與消波塊。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "tags": ["寵物", "夕陽", "濕地", "自行車"], "stay_h": 4.0, "drive_min": 15, "total_h": 4.5, "season_months": [1, 2, 3, 10, 11, 12], "season_type": "add", "id": "pc3a06666"}, {"name": "南寮漁港與魚鱗天梯", "town": "新竹市北區", "theme": "coast", "kind": "海岸", "lat": 24.84694, "lng": 120.9225, "coord_conf": "high", "diff": "散步", "time": "港區加魚鱗天梯散步 1–2 小時", "drive": "從新竹市區約 20 分", "desc": "91 公頃的二級漁港，看點是浪形屋頂的波光市集與魚鱗天梯——一整片階梯狀消波工事，退潮時能走下石階看堤外潮間帶。十七公里海岸線自行車道從這裡起算，租車站就在停車場旁。", "season": "面西北，日落全年落在海上；秋冬東北季風最強，新竹風箏節就是借這股風在漁港旁草地辦的。", "note": "停車每小時 30 元，假日第一停車場常滿；波光市集週四至週日 11:00–20:00；港區與魚鱗天梯都不可游泳，石階濕滑、漲潮勿下。", "source": "https://zh.wikipedia.org/wiki/新竹漁港", "far": false, "route": "coast-17km", "tags": ["夕陽", "濕地", "野餐"], "stay_h": 2.0, "drive_min": 20, "total_h": 2.7, "season_months": [1, 2, 9, 10, 11, 12], "season_type": "add", "id": "pf3c5a336"}, {"name": "海之聲", "town": "新竹市香山區", "theme": "coast", "kind": "海岸", "lat": 24.73789, "lng": 120.88347, "coord_conf": "high", "diff": "散步", "time": "停車走 30 分", "drive": "從新竹市區約 20 分", "desc": "南港里一條伸進海裡的長堤，走上去像走向海天交界，所以叫「天堂路」。但堤身被侵蝕多年，2022 年起已有大段坍塌中空——現在能做的是站在岸邊看堤與風機，不是走出去。", "season": "面西，日落落海；漲潮時海水會灌進堤身破口。", "note": "堤面有斷裂與中空段落，不要走上去；路邊空地停車，沒有廁所與商家；風大時砂石打臉。", "source": "https://linnote.com/sound-of-the-sea/", "far": false, "route": "coast-17km", "tags": ["夕陽"], "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [], "id": "p93ffd9fa"}, {"name": "海天一線看海區", "town": "新竹市北區", "theme": "coast", "kind": "觀景", "lat": 24.8328, "lng": 120.9154, "coord_conf": "high", "diff": "散步", "time": "停車走 20–30 分", "drive": "從新竹市區約 20 分", "desc": "看海公園南邊約 400 公尺的堤岸觀景區，一條直線堤頂步道往海裡延伸，兩側是消波塊與泥灘。純堤岸、不能下水，但人比看海公園少，畫面也更空。", "season": "面西，日落全年落海；冬季東北季風時堤上風強到站不住。", "note": "停車格不多，多半停自行車道旁；堤面無護欄，浪大時勿靠邊緣。", "source": "https://bobbytravel.tw/17km/", "far": false, "route": "coast-17km", "tags": ["夕陽", "濕地", "自行車"], "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 12], "season_type": "add", "id": "pe01fe4bd"}, {"name": "港南運河公園", "town": "新竹市香山區", "theme": "coast", "kind": "觀景", "lat": 24.81034, "lng": 120.9095, "coord_conf": "high", "diff": "散步", "time": "環運河散步約 1 小時", "drive": "從新竹市區約 25 分", "desc": "一條人工運河切進海岸防風林，水岸有木棧道、拱橋與看海平台，是十七公里車道中段唯一有樹蔭與座位的休息點。運河是內陸水域，海側仍是堤岸，不能下水。", "season": "冬季風被防風林擋掉大半，是這條線上少數不會被吹翻的段落；春夏傍晚蚊子多。", "note": "運河旁有免費停車場、公廁與自行車租借站；假日午後親子人潮集中在拱橋一帶。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "tags": ["寵物", "親子", "自行車"], "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [1, 2, 3, 4, 5, 6, 7, 8, 12], "season_type": "add", "id": "p9da3c555"}, {"name": "看海公園", "town": "新竹市北區", "theme": "coast", "kind": "觀景", "lat": 24.83616, "lng": 120.91843, "coord_conf": "high", "diff": "開車", "time": "停車走 20–40 分", "drive": "從新竹市區約 20 分", "desc": "自行車道北段的大草坡加觀景平台，堤外是消波塊與離岸風機——堤岸地形、沒有沙灘也沒有下水點。是從新竹市區最快能站到「看得到整片海」的位置。", "season": "正面朝西，冬季約 17:20、夏季約 18:40 日落直接落海；秋冬風大到草地上排隊放風箏。", "note": "小型停車場加路邊停車，假日傍晚易滿；堤上部分段落無護欄，帶小孩注意。", "source": "https://bobbytravel.tw/17km/", "far": false, "route": "coast-17km", "tags": ["寵物", "展望", "夕陽", "自行車", "野餐"], "stay_h": 0.67, "drive_min": 20, "total_h": 1.3, "season_months": [1, 2, 6, 7, 8, 9, 10, 11, 12], "season_type": "add", "id": "pe8449a79"}, {"name": "豎琴橋", "town": "新竹市香山區", "theme": "coast", "kind": "自行車道", "lat": 24.74891, "lng": 120.90408, "coord_conf": "high", "diff": "散步", "time": "停車走 15–30 分（十七公里車道南端）", "drive": "從新竹市區約 20 分", "desc": "鹽水港溪口的斜張橋，白色主塔拉出扇形鋼索像一把豎琴，是十七公里海岸線的南端意象。橋下是紅樹林與泥灘，人比北段少很多。", "season": "日落時拍橋的剪影最好；冬季河口風強。", "note": "橋兩端都有停車空間；夜間有燈但周邊沒有商家與廁所。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "tags": ["夕陽", "夜景", "濕地"], "stay_h": 0.5, "drive_min": 20, "total_h": 1.2, "season_months": [1, 2, 12], "season_type": "caution", "id": "pf301a90c"}, {"name": "香山濕地賞蟹步道", "town": "新竹市香山區", "theme": "coast", "kind": "步道", "lat": 24.78313, "lng": 120.91434, "coord_conf": "high", "diff": "散步", "time": "步道全長 250 公尺，含等退潮約 1 小時", "drive": "從新竹市區約 15 分", "desc": "從堤岸伸進潮間帶的心型石滬造型棧道，全長 250 公尺，退潮時腳下整片泥灘是招潮蟹與和尚蟹大軍。只能走步道，泥灘禁止進入，不能下水。", "season": "退潮才有蟹；滿潮前後兩小時步道封閉，風速六級以上也封閉——冬季東北季風常中招，出發前先查潮汐與新竹市政府公告。", "note": "免門票，開放 09:00–18:00（週二公休）；滿潮前後 2 小時與風速達 6 級以上步道預警性封閉，行前請查即時公告。", "source": "https://bobbyworld.tw/2023-08-31-2508/", "far": false, "route": "coast-17km", "tags": ["無障礙", "夕陽", "濕地"], "stay_h": 1.0, "drive_min": 15, "total_h": 1.5, "season_months": [1, 2, 12], "season_type": "add", "id": "ped8edd52"}, {"name": "香山紅樹林公園", "town": "新竹市香山區", "theme": "coast", "kind": "觀景", "lat": 24.80811, "lng": 120.91788, "coord_conf": "high", "diff": "散步", "time": "棧道來回 30 分", "drive": "從新竹市區約 15 分", "desc": "客雅溪口的水筆仔林，架高木棧道穿林而過，退潮時泥灘上滿是招潮蟹與彈塗魚。堤岸與泥灘地形，不能下水，也不能走進灘地。", "season": "退潮前後兩小時才看得到蟹；夏季蚊子多，長袖比防曬重要。", "note": "自行車道旁有停車空間與觀景平台；木棧道濕滑。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1444", "far": false, "route": "coast-17km", "tags": ["濕地"], "stay_h": 0.5, "drive_min": 15, "total_h": 1.0, "season_months": [6, 7, 8], "season_type": "add", "id": "p6f366fec"}, {"name": "Ronghua Garden & Dining", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.8235007, "lng": 120.928781, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "在地餐飲點，備註：露營車早午餐。", "season": "", "note": "露營車造景早午餐，營業時間以官方粉絲專頁預約公告為主；車位有限建議提早抵達。", "source": "", "far": false, "route": "coast-17km", "tags": ["野餐"], "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [], "id": "ronghua-garden-dining"}, {"name": "古今車用中蔬食餐廳", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.739176399999998, "lng": 120.93113989999999, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 25 分", "desc": "位於安東彌勒山園區內的中西式蔬食餐廳，供應三杯猴頭菇豆腐煲、南瓜山藥焗烤飯、松露義大利麵與手工素點；現場常態陳列展示多輛經典美式古董老爺車，附設大型停車場。", "season": "", "note": "營業時間 11:00–14:00、17:00–20:00（週一公休）；園區附設大型免費停車場，古董車展區免費參觀。", "source": "", "far": false, "tags": ["親子", "蔬食"], "route": "coast-17km", "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [], "id": "p47b0a5e4"}, {"name": "同心豆花（香山大庄路）", "town": "新竹市香山區", "lat": 24.79043, "lng": 120.92696, "theme": "food", "kind": "豆花", "diff": "開車", "time": "約 20 分", "drive": "從新竹市區約 10 分", "desc": "香山大庄路上的豆花剉冰店，豆花軟硬適中、豆香濃郁，配料選項多（地瓜、芋頭、仙草、小薏仁、軟花生），是在地人常去的平價甜品店。注意「同心豆花」在新竹市東區西大路另有一家，兩者地址不同、不是同一間店面。", "note": "營業時間 12:00–21:00（週六公休）；僅供現金交易，周邊巷弄狹窄建議騎車前往。", "season": "", "source": "https://blog.pklife.tw/2023/06/hsinchu-tong-xin.html", "gmap": "同心豆花", "route": "coast-17km", "stay_h": 0.33, "drive_min": 10, "total_h": 0.7, "season_months": [], "id": "pc1975bf9"}, {"name": "村落餐廳", "town": "新竹市北區", "theme": "food", "kind": "西班牙料理", "lat": 24.8482, "lng": 120.9293, "coord_conf": "high", "diff": "開車", "time": "約 1–1.5 小時", "drive": "從新竹市區約 15 分", "desc": "南寮舊港旁的西班牙鄉村風料理餐廳，兩層樓，二樓用餐區可眺望海景。主打西班牙海鮮燉飯（蛤蜊、鮮蝦、綜合海鮮）與義大利麵，燉飯鐵盤邊緣會微焦。距竹風漁市約 300 公尺，可以先逛漁市買現流、再過來吃燉飯。", "season": "夏季傍晚西曬強，看夕陽時間約 18:00–19:00", "note": "週二、週三公休；平日 11:30–21:30，假日 11:30–15:00、17:30–21:30。人多常客滿，建議先電話預約。寵物牽繩可入內。", "source": "", "far": false, "route": "coast-17km", "tags": ["寵物", "需預約", "夕陽"], "stay_h": 1.5, "drive_min": 15, "total_h": 2.0, "season_months": [6, 7, 8], "season_type": "caution", "id": "p8290d930"}, {"name": "沒有名字的甜點專賣", "town": "新竹市香山區", "lat": 24.74324, "lng": 120.91536, "theme": "food", "kind": "甜點", "diff": "開車", "time": "約 40 分", "drive": "從新竹市區約 20 分", "desc": "藏在香山田園間、沒有招牌的透天民宅甜點店，主理的甜點師傅資歷超過 25 年，用日本國產小麥、北海道奶油與新鮮水果現做。招牌是彩虹水果捲、鮮芒果卡士達蛋糕、北海道原味生乳捲與檸檬奶油蛋糕，也接生日與彌月蛋糕客製。行政區雖屬香山，但實際位置離竹南公義路那幾家只有一公里，可以排同一趟。", "note": "平日 13:30–20:00、假日 10:30–20:00（週二公休）；店門前設有停車空地，內用低消每人一杯飲品。", "season": "", "source": "https://bobowin.blog/noname/", "route": "coast-17km", "stay_h": 0.67, "drive_min": 20, "total_h": 1.3, "season_months": [], "id": "p9a770e5d"}, {"name": "竹風漁市-南寮漁產直銷中心", "town": "新竹市北區", "lat": 24.84808, "lng": 120.92547, "theme": "food", "kind": "漁產直銷中心", "diff": "散步", "time": "約 1–2 小時", "drive": "從新竹市區約 15 分", "desc": "新竹市府斥資逾四億改建的南寮漁港漁貨直銷中心，取代用了 29 年、2025 年 10 月拆除的舊館，2026 年 2 月重新開幕。館內分兩區：現撈海鮮生鮮市場約 86 攤，賣鮮魚、蝦蟹貝類、現切生魚片與乾貨；海味嘗鮮代客料理區約 14 家，可以買了現流海鮮直接請店家煮上桌。是可以逛著買、也能坐下來吃的市集，不是單一店家。走路五分鐘可到村落餐廳，兩點常排在同一趟南寮行程，也是十七公里海岸線自行車道的起點區。", "note": "生鮮市場區約 08:00–20:00、代客料理區約 10:00–22:00（單一來源，建議行前再確認）。代客料理的計價曾被消保官稽查要求落實價格標示，點餐前務必先確認秤重與計價方式。中午前後是漁船進港、海鮮最新鮮的時段。", "season": "", "source": "https://udn.com/news/story/7324/9297743", "route": "coast-17km", "tags": ["雨天", "無障礙", "自行車"], "stay_h": 2.0, "drive_min": 15, "total_h": 2.5, "season_months": [], "id": "p89d29978"}, {"name": "綠谷沙拉生菜園", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.744345046361232, "lng": 120.93901266792355, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "desc": "香山的生菜農場直營餐廳，現採生菜沙拉配自家料理，走的是產地到餐桌路線，適合想吃清爽一點的行程。", "season": "", "note": "營業時間 08:00–17:30；採果與現採生菜體驗建議事先電話確認備料與預約。", "source": "https://hsinchucitymuseum.hccg.gov.tw/home/zh-tw/store/1451", "far": false, "drive": "從新竹市區約 25 分", "route": "coast-17km", "tags": ["採果"], "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [], "id": "pffc05117"}, {"name": "長興釣蝦場", "town": "新竹市香山區", "theme": "food", "kind": "餐飲", "lat": 24.745898999999998, "lng": 120.90507699999999, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 20 分", "desc": "位於香山長興街的熱炒餐廳，前身為釣蝦場，現以麻辣臭豆腐與現撈泰國蝦料理為主力；麻辣臭豆腐以香菇、絞肉與小魚乾熬製濃稠湯底，並供應胡椒蝦、檸檬蝦與台式熱炒。", "season": "", "note": "營業時間 11:00–22:00（週一公休）；現已無釣蝦服務，專營熱炒與麻辣臭豆腐；假日人潮眾多需現場候位。", "source": "", "far": false, "route": "coast-17km", "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [], "id": "p4a925fb6"}, {"name": "鷹王肉圓", "town": "新竹市香山區", "lat": 24.80852, "lng": 120.93375, "theme": "food", "kind": "肉圓", "diff": "開車", "time": "約 20 分", "drive": "從新竹市區約 15 分", "desc": "香山延平路上飄香近一甲子（民國 51 年創立）的肉圓老店，厚皮肉圓 Q 彈、內餡蔥肉，配獨門醬汁與蒜泥；旁邊攤位現灌現烤香腸、不加亞硝酸鹽，在地人多推薦肉圓配香腸。鐵皮屋搭建但內用空間乾淨，還保留早期推車攤販的餐車。", "note": "營業時間 10:30–19:00（週三公休）；僅收現金，店旁空地設有簡易停車空間。", "season": "", "source": "https://tenjo.tw/yingwang-meatball/", "route": "coast-17km", "stay_h": 0.33, "drive_min": 15, "total_h": 0.8, "season_months": [], "id": "p8fb565a6"}, {"name": "南十八尖山", "town": "新竹市香山區", "theme": "trail-near", "kind": "步道", "lat": 24.735, "lng": 120.8928, "coord_conf": "high", "diff": "散步", "time": "全長約 1.4 公里，主線加支線走完約 40 分", "drive": "從新竹市區約 25 分", "desc": "位於新竹香山南港里與苗栗竹南交界稜線，原名赤山，早年曾為童軍營地。步道長約 1.4 公里，鋪設平緩碎石路面與木欄杆，兩側相思林茂密陰涼；地處十七公里海岸線南端，可順遊南港賞鳥區與竹南崎頂子母隧道。", "season": "", "note": "入口在南港街；規模小、沿線無商店與廁所，停車靠路邊。行政區歸屬兩來源不一（維基記新竹市香山區、OSM 記苗栗竹南），實際在市縣界稜線上。", "source": "https://zh.wikipedia.org/zh-tw/%E5%8D%97%E5%8D%81%E5%85%AB%E5%B0%96%E5%B1%B1", "far": false, "route": "coast-17km", "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": [], "id": "p79355a32"}, {"name": "新屋綠色走廊", "town": "桃園市新屋區", "lat": 24.96941, "lng": 121.01238, "theme": "coast", "kind": "自行車道", "diff": "散步", "time": "單程約 40 分；含租車與濱海路段來回約 2–3 小時", "drive": "從新竹市區約 35 分", "desc": "由綠蔭大道與濱海道路組成的海岸自行車道，單程約 4.2 公里，一端林蔭遮蔽、另一端連接海岸線，地勢平坦適合親子與初學者，沿途設有中繼站可補給休息，因茂密林蔭而有「龍貓隧道」之稱。", "note": "入口附近有多家租車店，單人腳踏車約每小時 100–150 元、親子協力車約 200–300 元。", "season": "全年皆宜，夏季林蔭遮陽效果佳。", "source": "https://myjourney.tw/xinwu-green-tunnel/", "route": "coast-north", "tags": ["寵物", "親子", "自行車"], "stay_h": 3.0, "drive_min": 35, "total_h": 4.2, "season_months": [6, 7, 8], "season_type": "add", "id": "p1604053c"}, {"name": "新月沙灣", "town": "新竹縣竹北市", "theme": "coast", "kind": "沙灘", "lat": 24.86441, "lng": 120.93975, "coord_conf": "high", "diff": "散步", "time": "海濱步道約 1.5 公里，來回 1 小時", "drive": "從新竹市區約 20 分", "desc": "鳳山溪口北岸的新月形沙灘，是這一帶少數真正能踩沙、下水踏浪的地方；步道與海面幾乎沒有落差，直接接上潮間帶。有免費淋浴間、更衣室與沖腳池。", "season": "傍晚夕陽正對沙灘落海；夏季正午完全無遮蔽極曬，秋冬東北季風把沙吹得會打人。", "note": "設有免費大型停車場、沖腳區與公廁；現場無救生員駐點，嚴禁深入戲水游泳。", "source": "https://bobowin.blog/p4199/", "far": false, "route": "coast-north", "nav": [24.866237, 120.944249], "tags": ["寵物", "夕陽", "玩水"], "stay_h": 1.0, "drive_min": 20, "total_h": 1.7, "season_months": [1, 2, 6, 7, 8, 9, 10, 11, 12], "season_type": "caution", "id": "pabd968d4"}, {"name": "新豐紅樹林生態步道", "town": "新竹縣新豐鄉", "theme": "coast", "kind": "海岸", "diff": "散步", "time": "40 分", "drive": "從新竹市區約 25 分", "desc": "北台灣唯一水筆仔與海茄苳混生的紅樹林，8.5 公頃，約 400 公尺木棧道架在林中、枝葉合攏成綠色隧道，是全台唯一設觀賞步道的生態保護區。堤岸與泥灘地形，不能下水。", "note": "免費 24 小時開放，紅毛港遊憩區設有免費停車場與公廁；木棧道平緩，推車輪椅皆可行走。", "season": "退潮時去才看得到蟹", "source": "https://bunnyann.tw/xinfeng/", "lat": 24.91026, "lng": 120.96915, "coord_conf": "high", "route": "coast-north", "tags": ["親子", "無障礙", "濕地"], "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": [], "id": "p4d3bd668"}, {"name": "永安漁港", "town": "桃園市新屋區", "theme": "coast", "kind": "海岸", "lat": 24.98913, "lng": 121.01257, "coord_conf": "high", "diff": "散步", "time": "停車逛 1–1.5 小時", "drive": "從新竹市區約 35 分", "desc": "全台唯一以客家人為主的漁港，港上跨一座觀海橋、入夜亮 LED，魚市是一棟龍蝦造型建築，漁獲以白鯧、土魠、小卷、烏魚為主。港區為堤岸不能下水，但北接新屋綠色走廊自行車道，木麻黃樹蔭下可以騎很久。", "season": "面西日落落海；冬季烏魚季魚市最熱鬧。", "note": "港區大型停車場，假日中午魚市人最多；綠色走廊入口可租自行車。", "source": "https://zh.wikipedia.org/wiki/永安漁港", "far": false, "route": "coast-north", "tags": ["夕陽", "夜景", "自行車"], "stay_h": 1.5, "drive_min": 35, "total_h": 2.7, "season_months": [1, 2, 12], "season_type": "add", "id": "p321d35ac"}, {"name": "竹圍漁港", "town": "桃園市大園區", "lat": 25.11716, "lng": 121.24448, "theme": "coast", "kind": "漁港", "diff": "散步", "time": "約 2 小時", "drive": "從新竹市區約 55 分", "desc": "北台灣三大漁獲供銷重地之一，港區有漁產品直銷中心（一樓生鮮零售、二樓多家海鮮餐廳含代客料理）。地標紅色彩虹橋跨港而立，沿海岸步行約 15 分鐘可達造型特殊的豬鼻子沙灘（消波塊呈 8 字雙孔造型），可安排看飛機起降、吃海鮮、賞夕陽的複合行程。", "note": "港區有多處免費大型停車場。建議下午前往，可避開用餐尖峰並銜接夕陽時段。", "season": "", "source": "https://misshuan.tw/zhuwei-fishing-harbor/", "route": "coast-north", "tags": ["夕陽"], "stay_h": 2.0, "drive_min": 55, "total_h": 3.8, "season_months": [], "id": "p09438ed1"}, {"name": "觀新藻礁與藻礁生態環境教室", "town": "桃園市新屋區", "theme": "coast", "kind": "海岸", "lat": 25.01633, "lng": 121.03681, "coord_conf": "high", "diff": "散步", "time": "停車走 30–60 分", "drive": "從新竹市區約 35 分", "desc": "約 370 公頃的藻礁生態系野生動物保護區，範圍從觀音區大潭電廠進水口南堤延伸到新屋永興、永安，含小飯壢溪與新屋溪口；退潮才露出那片殼狀珊瑚藻造的礁台，是本島保存最完整的一段。礁石鋒利，不能下水。", "season": "只有大退潮才看得到礁面，出發前務必查潮汐；冬季東北季風把海浪打上堤岸。", "note": "進入保護區範圍須於 7 日前向桃園市政府環保局申請（水質保護科 03-3386021 分機 1332）；不申請就只在堤岸與生態環境教室周邊看。路邊停車、免費。", "source": "https://tydep.tycg.gov.tw/cp.aspx?n=20010", "far": false, "route": "coast-north", "tags": ["雨天", "需預約", "濕地"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [1, 2, 12], "season_type": "add", "id": "p4bf67b9f"}, {"name": "觀音濱海休憩區", "town": "桃園市觀音區", "lat": 25.047211595625996, "lng": 121.07629494059435, "theme": "coast", "kind": "濱海休憩區／燈塔", "diff": "散步", "time": "約 1–1.5 小時", "drive": "從新竹市區約 45 分", "desc": "白沙岬燈塔所在的濱海休憩區。燈塔明治 31 年（1898）動工、明治 34 年（1901）啟用，磚石構造、塔高約 37 公尺，僅次於墾丁鵝鑾鼻燈塔，是台灣現存最完整的日治初期燈塔之一，2021 年指定為國定古蹟。園區有木棧道、小橋流水與百年苦楝樹，仿地中海風格的附屬建物是熱門拍照點，鄰近沙灘與潮間帶，可與觀音草漯沙丘一起排。", "note": "白沙岬燈塔園區免費開放；開放時間夏令 09:00–18:00、冬令 09:00–17:00（週一休園），附設停車場。", "season": "", "source": "https://fullfenblog.tw/ty-baishajia-lighthouse/", "route": "coast-north", "gmap": "328003桃園市觀音區白玉里中興路469號觀音濱海休憩區", "nav_target": "328003桃園市觀音區白玉里中興路469號觀音濱海休憩區", "tags": ["夕陽", "野餐"], "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "pdfeab372"}, {"name": "觀音草漯沙丘", "town": "桃園市觀音區", "lat": 25.07555722347115, "lng": 121.12669818674584, "theme": "coast", "kind": "沙丘地質公園", "diff": "散步", "time": "約 1–1.5 小時", "drive": "從新竹市區約 45 分", "desc": "全國首座沙丘地質公園，沿海岸線綿延約 8.1 公里，是台灣海岸線中保存最寬廣完整的沙丘地形，搭配一整排風力發電機，有「台版撒哈拉沙漠」之稱。沙丘上有百年張家古厝與門前的老無患子樹，黃昏沙丘與海連成一線、風車剪影很好拍。", "note": "室內的觀音草漯沙丘展示館有 7 大主題與互動體驗設施，可當雨天備案；沙地鬆軟，穿好走的鞋，退潮時可順遊觀音濱海遊憩區的潮間帶。", "season": "", "source": "https://www.taiwan.net.tw/m1.aspx?sNo=0001107&id=A12-00482", "route": "coast-north", "gmap": "328桃園市觀音區保障里觀音草漯沙丘", "nav_target": "328桃園市觀音區保障里觀音草漯沙丘", "tags": ["雨天", "展望", "夕陽", "濕地"], "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [], "id": "p975adcc8"}, {"name": "許厝港濕地", "town": "桃園市大園區", "lat": 25.08733, "lng": 121.17625, "theme": "coast", "kind": "濕地", "diff": "散步", "time": "約 1.5–2 小時", "drive": "從新竹市區約 50 分", "desc": "內政部公告的國家級重要濕地，占地 961 公頃、縱長達 10.5 公里。河流水系發達、河口地形發育良好，是候鳥過境的重要棲地，現有鳥種近 200 種。園區設有濱海自行車道與景觀大橋，也是熱門的夕陽觀賞點。", "note": "免費開放。賞鳥建議帶望遠鏡，清晨 6–9 點與下午 3 點到天黑前是鳥類覓食活躍、較易觀察的時段。", "season": "最佳賞鳥季為每年 10 月到隔年 5 月冬候鳥過境期。", "source": "https://taoyuanbird.org.tw/", "route": "coast-north", "tags": ["夕陽", "濕地", "自行車"], "stay_h": 2.0, "drive_min": 50, "total_h": 3.7, "season_months": [1, 2, 3, 4, 5, 10, 11, 12], "season_type": "add", "id": "pecda9368"}, {"name": "鳳坑沙灣（鳳坑漁港）", "town": "新竹縣新豐鄉", "theme": "coast", "kind": "海岸", "lat": 24.90449, "lng": 120.96664, "coord_conf": "high", "diff": "散步", "time": "停車走 30–40 分", "drive": "從新竹市區約 25 分", "desc": "數十座圓柱形消波塊一路排到海裡，像一排踏石延伸出去，被稱作「海之聲 2.0」。沙灘小、以礫石與堤岸為主，不適合下水；賣點是人少、安靜。", "season": "面西，黃昏斜光打在圓柱上最有戲；冬季東北季風直吹，體感很冷。", "note": "入口只有一塊碎石空地約可停 10–15 輛，假日搶手；沒有廁所商店；消波塊表面濕滑，不要跳上去。", "source": "https://travel.hsinchu.gov.tw/attraction/content/20YVPOB1vWb6", "far": false, "route": "coast-north", "tags": ["夕陽"], "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": [1, 2, 12], "season_type": "caution", "id": "p8d69c729"}, {"name": "鳳崎落日步道", "town": "新竹縣新豐鄉", "theme": "coast", "kind": "步道", "diff": "散步", "time": "全長 3 公里，來回約 2 小時", "drive": "從新竹市區約 20 分", "desc": "新豐與竹北交界，海拔 63–131 公尺，鋪面完善坡度平緩。沿途壕溝、碉堡、坑道等軍事遺跡，往西看南寮漁港、竹北平原與風機，天氣好看得到新竹機場的飛機。台灣百大必訪步道。", "note": "主要由天德堂或蓮花寺兩端起登，兩處皆設有免費停車場與洗手間；步道平緩好走，傍晚建議攜帶手電筒備用。", "season": "看夕陽抓日落前 1 小時，最佳點在鳳崎咖啡附近", "source": "http://egoldenyears.com/106581/", "lat": 24.8673, "lng": 120.9797, "coord_conf": "high", "route": "coast-north", "tags": ["展望", "夕陽"], "stay_h": 2.0, "drive_min": 20, "total_h": 2.7, "season_months": [], "id": "pfa5e3281"}, {"name": "樹園子 日式無菜單懐石料理", "town": "桃園市觀音區", "theme": "food", "kind": "餐飲", "lat": 25.0016166, "lng": 121.1246458, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 45 分", "desc": "位於觀音鄉間的預約制日式無菜單懷石料理，供應九道式旬季海陸和食套餐，包含招牌蓮花雞湯、蒲葉燒牛小排與季節生魚片；建築採日式和風設計，外圍環繞松柏枯山水庭園。", "season": "", "note": "**採全預約制**，需事先預訂席位；用餐時間約 1.5–2 小時，附設專屬停車場。", "source": "", "far": false, "route": "coast-north", "tags": ["需預約"], "stay_h": 1.0, "drive_min": 45, "total_h": 2.5, "season_months": [], "id": "p10a6ff58"}, {"name": "水來青舍", "town": "桃園市觀音區", "theme": "food", "kind": "餐飲", "lat": 25.0089, "lng": 121.1327, "coord_conf": "high", "diff": "開車", "time": "約 2 小時", "drive": "從新竹市區約 50 分", "desc": "把一棟從安徽整棟拆遷、在觀音蓮花園區重組的清代老宅當餐廳，供應無菜單蔬食；老屋的木構、磚牆與門前水塘是主角，用餐只是進場方式。", "season": "6–8 月觀音蓮花季，周邊蓮園同時開放", "note": "**採全預約制無菜單蔬食**，務必事先電話訂位；營業時間 11:00–14:30、17:00–20:30（週一、二公休）。", "source": "", "far": false, "tags": ["需預約", "蔬食", "老宅"], "route": "coast-north", "stay_h": 2.0, "drive_min": 50, "total_h": 3.7, "season_months": [6, 7, 8], "season_type": "add", "id": "pc4c028ca"}, {"name": "新屋范姜祖堂", "town": "桃園市新屋區", "lat": 24.97619, "lng": 121.10444, "theme": "heritage", "kind": "宗祠古厝", "diff": "散步", "time": "約 40–60 分", "drive": "從新竹市區約 45 分", "desc": "興建於 1855 年（清咸豐五年），為桃園市定古蹟，「新屋」地名即源自范姜家族在此起造之新大厝。祖堂為典型客家一堂二橫合院形制，堂前設有外埕與半月池，門楣懸掛「陶渭流芳」匾額，並飾以交趾陶、彩繪與磚雕，完整記錄清代范姜宗族渡海拓墾之歷史。", "note": "祖堂是范姜家族的祭祀場所，部分區域可能不對外開放，前往請尊重當地居民生活。**查不到可靠來源明確列出公眾開放時間與門票**，建議行前致電新屋區公所或桃園市政府觀光旅遊局確認。", "season": "", "source": "https://travel.tycg.gov.tw/zh-tw/travel/attraction/308", "route": "coast-north", "tags": ["老宅"], "stay_h": 1.0, "drive_min": 45, "total_h": 2.5, "season_months": [], "id": "p89061f7d"}, {"name": "五酒桶山步道", "town": "桃園市蘆竹區", "theme": "trail-near", "kind": "步道", "lat": 25.0674, "lng": 121.3044, "coord_conf": "high", "diff": "散步", "time": "全線約 4 公里 2 小時；最短線 1.4 公里 1 小時內攻頂", "drive": "從新竹市區約 55 分", "desc": "位於蘆竹南崁近郊，主步道由南天宮起登，串連南崁山、山鼻山與六福步道等多條支線，全長約 4 公里。山徑鋪設石階與平緩土路，沿途設有地名由來的陶製酒甕造景，稜線觀景平台視野開闊，可俯瞰桃園國際機場班機起降與竹圍海面。", "season": "秋冬芒花", "note": "登山口位於南天宮旁，廟方提供免費大型停車場與公廁；步道岔路多，建議沿主要指標行走。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=534", "far": false, "route": "coast-north", "tags": ["展望"], "stay_h": 2.0, "drive_min": 55, "total_h": 3.8, "season_months": [1, 2, 9, 10, 11, 12], "season_type": "add", "id": "pa643891d"}, {"name": "向陽休閒農場", "town": "桃園市觀音區", "lat": 25.00811, "lng": 121.11164, "theme": "trail-near", "kind": "休閒農場", "diff": "散步", "time": "約 2 小時", "drive": "從新竹市區約 45 分", "desc": "佔地約 18000 坪，號稱北台灣最大的向日葵主題休閒農場，栽種向日葵、薰衣草、麥桿菊、七彩金魚草與粉黛亂子草等花卉，並設有兔子、羊等小動物區，提供拔蘿蔔、採洛神花等季節限定 DIY 體驗。", "note": "入園清潔費約 100 元，可全額折抵園內消費。營業週二至週日 09:00–18:00，週一公休。", "season": "花況依栽種批次每年略有不同，洛神花與蘿蔔採摘為季節限定，行前建議查官方粉專確認當期花況。", "source": "http://www.sun-green.com.tw/", "route": "coast-north", "tags": ["親子", "手作", "採果"], "stay_h": 2.0, "drive_min": 45, "total_h": 3.5, "season_months": [], "id": "p09c77944"}, {"name": "白千層綠色隧道", "town": "桃園市觀音區", "lat": 25.01689, "lng": 121.15645, "theme": "trail-near", "kind": "綠色隧道", "diff": "散步", "time": "約 30–45 分", "drive": "從新竹市區約 50 分", "desc": "觀音區福山路二段一條長約 2.8 公里的林蔭道路，兩側種了約 700 棵白千層，因樹皮會層層剝落而有「脫皮樹」之稱。筆直林蔭配兩旁的稻田，適合散步或騎單車，鄰近桃園機場航道、偶有飛機低空掠過。跟白千層鐵砲百合花園不遠，但這裡全年可看、不受花期限制。", "note": "免費開放。路幅不寬，會車與臨停空間有限，建議路邊停放後步行或騎車。", "season": "", "source": "https://travel.yam.com/article/121857", "route": "coast-north", "tags": ["自行車"], "stay_h": 0.75, "drive_min": 50, "total_h": 2.4, "season_months": [], "id": "pb07b0a51"}, {"name": "白千層鐵砲百合花園", "town": "桃園市觀音區", "lat": 25.02305, "lng": 121.16061, "theme": "trail-near", "kind": "花園", "diff": "散步", "time": "花期約 1 小時；非花期只是路過 15 分鐘", "drive": "從新竹市區約 50 分", "desc": "觀音區廣青路 672 巷的私人花園，園主為追思母親栽種超過 4000 株、約 2 萬朵鐵砲百合，花色純白帶淡香，因花形似嗩吶又稱喇叭百合。**花期只有約 4 月下旬到 5 月中旬**，過了就恢復平常農地景觀，不是常態景點。跟旁邊的白千層綠色隧道是不同地址、但相距很近，常一起排。", "note": "入園酌收清潔費。花期短且每年確切開園與盛開日期會變動，行前務必查當年最新公告，避免撲空。", "season": "花期約每年 4 月下旬到 5 月中旬，非花期只剩單純農地與樹道。", "source": "https://annieko.tw/taoyuan-easter-lily/", "route": "coast-north", "stay_h": 1.0, "drive_min": 50, "total_h": 2.7, "season_months": [4, 5], "season_type": "core", "id": "p9995c86c"}, {"name": "羊稠森林步道", "town": "桃園市蘆竹區", "theme": "trail-near", "kind": "步道", "lat": 25.0513, "lng": 121.3058, "coord_conf": "high", "diff": "散步", "time": "單程 3.2 公里、往返約 2 小時，海拔 115–245 公尺", "drive": "從新竹市區約 50 分", "desc": "前身是防火道與載運相思樹的牛車路（「稠」＝閩南語牛羊廄舍）；展望台可同時看到高鐵列車鑽出山洞、桃園機場班機與台灣海峽船影，沿途設森林盪鞦韆與繩索攀爬設施。", "season": "6–8 月光臘樹幹上獨角仙等甲蟲出沒，蘆竹區有甲蟲季導覽", "note": "全線共有五處出入口，以中山路羊稠巷入口交通最為便利；步道平緩陰涼，適合親子健行。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=480", "far": false, "route": "coast-north", "tags": ["親子", "展望", "看火車"], "stay_h": 2.0, "drive_min": 50, "total_h": 3.7, "season_months": [6, 7, 8], "season_type": "add", "id": "p80e58a6a"}, {"name": "蓮花園休閒農業區", "town": "桃園市觀音區", "lat": 24.9977328, "lng": 121.1179024, "theme": "trail-near", "kind": "休閒農業區", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 45 分", "route": "coast-north", "desc": "觀音的蓮花田聚落，夏天整片荷花與睡蓮開在田裡，農家各自附設餐飲與採蓮體驗，蓮子、蓮藕做的小吃是這裡的特色。", "note": "範圍是一整片農業區不是單一景點，沿新華路一帶各家可以走走看看。", "season": "6–8 月蓮花季", "source": "", "coord_conf": "high", "tags": ["親子", "玩水", "採果"], "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [6, 7, 8], "season_type": "core", "id": "pe88c4903"}, {"name": "溪海埤塘生態公園", "town": "桃園市大園區", "lat": 25.03331, "lng": 121.19318, "theme": "water", "kind": "埤塘公園", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 50 分", "desc": "大園溪海休閒農業區內，由灌溉埤塘「罐仔埤」整治而成的生態公園，埤塘面積約 10.5 公頃。設有環埤景觀步道與木棧觀景平台，園內常見小白鷺、黃頭鷺、鳳頭潛鴨等水鳥棲息。", "note": "戶外開放空間，無門票、無固定開放時間。鄰近桃園彩色海芋季展區，可順遊。", "season": "賞鳥以秋冬候鳥季（約 10 月至隔年 3 月）鳥況較豐富。", "source": "http://lovegeo.blogspot.com/2021/04/blog-post_41.html", "route": "coast-north", "tags": ["濕地"], "stay_h": 1.0, "drive_min": 50, "total_h": 2.7, "season_months": [1, 2, 3, 10, 11, 12], "season_type": "add", "id": "pf21af559"}, {"name": "假日之森・親子之森・長青之森", "town": "苗栗縣竹南鎮", "theme": "coast", "kind": "沙灘", "lat": 24.69507, "lng": 120.85405, "coord_conf": "high", "diff": "散步", "time": "沙灘綿延約 1.5 公里，逛 1–2 小時", "drive": "從新竹市區約 25 分", "desc": "竹南濱海森林公園最北的一段，穿過防風林隧道就是約 1.5 公里的沙灘，是北台灣的衝浪基地，現場有衝浪店可教學租板，真的能下水，設有更衣室與沖腳區。園區南北長約 5 公里、佔地約 103 公頃，由北而南分假日之森、親子之森、長青之森（含長青湖）幾段：親子之森地勢平坦、多水泥鋪面與涼亭桌椅；長青之森林蔭較密、步道平緩，適合散步乘涼；三段之間有自行車道與步道相連，可以沿線一次逛完。", "season": "秋冬東北季風起浪是衝浪季；夏季適合玩沙與 SUP。日落正對沙灘落海。", "note": "入口處有停車場，假日滿；無救生員、注意離岸流；園區三段（假日、親子、長青之森）以步道與自行車道串連。", "source": "https://linnote.com/holiday-beach/", "far": false, "route": "coast-south", "gmap": "竹南假日之森", "tags": ["寵物", "親子", "夕陽", "自行車", "玩水"], "stay_h": 2.0, "drive_min": 25, "total_h": 2.8, "season_months": [1, 2, 6, 7, 8, 9, 10, 11, 12], "season_type": "add", "id": "pe7a800de"}, {"name": "崎頂子母隧道", "town": "苗栗縣竹南鎮", "theme": "coast", "kind": "步道", "lat": 24.72127, "lng": 120.87032, "coord_conf": "high", "diff": "散步", "time": "停車走 40 分–1 小時", "drive": "從新竹市區約 25 分", "desc": "舊縱貫線留下的兩座並連隧道，一號長 120.78 公尺、二號 67.48 公尺、相距 60 公尺，是全台唯一並連的雙軌隧道。兩洞之間有觀景台俯瞰海面與離岸風機，旁邊還有二戰碉堡與信號場遺跡。", "season": "隧道內全年陰涼，是這條海線夏天少數能躲太陽的點。", "note": "24 小時免費；一號隧道口停車場位子很少，假日建議停崎頂車站再走；隧道內有無照明段落，帶手電筒。", "source": "https://www.jsimplelife.com/miaoli-trip-8/", "far": false, "route": "coast-south", "tags": ["大眾運輸", "展望", "避暑", "看火車"], "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [6, 7, 8], "season_type": "add", "id": "p9a5952dc"}, {"name": "崎頂海水浴場", "town": "苗栗縣竹南鎮", "theme": "coast", "kind": "沙灘", "lat": 24.723, "lng": 120.86529, "coord_conf": "high", "diff": "散步", "time": "停車走 30–40 分", "drive": "從新竹市區約 25 分", "desc": "舊海水浴場的沙灘現在免費開放，退潮後濕沙面反射天空成「天空之鏡」，是這一段最好拍的位置。但苗栗縣政府民國 98 年已公告此處為危險海域，禁止下水游泳，只能踏浪。", "season": "面西，日落落海；沙灘逐年流失、礫石外露，退潮才有大片鏡面。", "note": "免門票、無救生員、禁止游泳；停車與崎頂車站、子母隧道共用；接十七公里海岸線自行車道往北。", "source": "https://uptogo.com.tw/旅遊/崎頂海水浴場怎麼去？/", "far": false, "route": "coast-south", "tags": ["大眾運輸", "夕陽", "自行車", "玩水"], "stay_h": 0.67, "drive_min": 25, "total_h": 1.5, "season_months": [], "id": "pfd7866bd"}, {"name": "後龍好望角風景區", "town": "苗栗縣後龍鎮", "lat": 24.60197, "lng": 120.73119, "theme": "coast", "kind": "觀景台", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 40 分", "desc": "原名半天寮，過去是軍事基地，現為後龍鎮半天寮休閒文化園區。位在後龍溪與西湖溪之間一塊地勢較高的濱海台地制高點，從觀景台往西看是整條海岸線與 21 座風力發電機（含葉片高約 107 公尺），往下還能看到海線鐵路的火車經過。停車場到觀景台沿路有攤販賣蜜芋頭、花生、烤地瓜。園區內另有日治時期留下的貝類化石保護區。", "note": "免費、24 小時開放，設有免費停車場，平日位子多、週末假日容易客滿。從觀景台往過港舊鐵路隧道口的步道單程約 2.4 公里、非環狀需原路折返，全程約 1.5–2 小時，雨後泥濘不好走。", "season": "冬季東北季風強勁，台地完全無遮蔽、風大且冷；夏季正午曝曬無處躲。", "source": "https://tenjo.tw/houlong-capeofgoodhope/", "gmap": "後龍好望角風景區", "route": "coast-south", "tags": ["展望", "夕陽", "看火車"], "stay_h": 1.0, "drive_min": 40, "total_h": 2.3, "season_months": [1, 2, 6, 7, 8, 12], "season_type": "caution", "id": "p50234d44"}, {"name": "心形公路觀景點", "town": "苗栗縣通霄鎮", "lat": 24.5386, "lng": 120.70673, "theme": "coast", "kind": "觀景點", "diff": "散步", "time": "約 30 分", "drive": "從新竹市區約 50 分", "desc": "通霄鎮新埔路往嶺頂方向的山路，其中一段彎道從高處俯瞰恰好圍成愛心形狀。看點不在路面上而在路邊坡地——要在台電電桿「乾厝分40」附近臨停，翻過一塊水泥墩往上走十幾公尺到山坡空地，往下看才會看到完整的心形。從山下到這個觀景點約 1 公里，再往上約 750 公尺經過嶺頂瞭望臺、到嶺頂福德祠。", "note": "沒有正式停車場，只能路邊臨停，周邊空地不大；山路窄、會車不易。現場沒有廁所。要走一小段上坡，不適合推車與輪椅。", "season": "冬季東北季風強，稜線與坡地上無遮蔽；傍晚時段光線與夕陽最佳。", "source": "https://fullfenblog.tw/love-highway/", "gmap": "心形公路觀景點-瞭望台", "route": "coast-south", "tags": ["展望", "夕陽"], "stay_h": 0.5, "drive_min": 50, "total_h": 2.2, "season_months": [1, 2, 12], "season_type": "caution", "id": "pb06b90a6"}, {"name": "新埔海堤步道（觀海・通海）", "town": "苗栗縣通霄鎮", "lat": 24.53737, "lng": 120.69292, "theme": "coast", "kind": "海堤步道", "diff": "散步", "time": "單走一段約 30 分；往北到白沙屯站約 4 公里、1 小時", "drive": "從新竹市區約 45 分", "desc": "通霄鎮新埔里（白沙屯南邊的新埔里，不是新竹縣新埔鎮）的海堤步道。Google 地圖上分成「觀海步道」與「通海步道」兩個點，實地是同一條海堤的兩段、相距約 300 公尺，不必分兩次跑。距台鐵新埔車站步行約 5 分鐘——新埔車站是西部幹線離台灣海峽最近的木造老車站，1922 年啟用。海堤面西正對台灣海峽，堤上有六角形消波塊堆疊而成的觀海階梯、漁村主題壁畫與潮汐解說牌。往北沿堤走約 4 公里可到白沙屯車站，往南約 1 公里是通霄跨海拱橋與秋茂園。", "note": "免費、24 小時開放。沿線完全沒有遮蔽物，夏天很曬。沒有正式停車場，只能路邊停車；要上廁所得回新埔車站。", "season": "冬季東北季風直接打在堤面上，風大到難以久站；傍晚可看夕陽沉入台灣海峽。", "source": "https://siouteng0822.pixnet.net/blog/post/121010083", "gmap": "新埔海堤觀海步道", "route": "coast-south", "tags": ["大眾運輸", "夕陽"], "stay_h": 1.0, "drive_min": 45, "total_h": 2.5, "season_months": [1, 2, 12], "season_type": "caution", "id": "pec2f55b2"}, {"name": "新埔路看海", "town": "苗栗縣通霄鎮", "lat": 24.54057, "lng": 120.70096, "theme": "coast", "kind": "路邊觀景點", "diff": "散步", "time": "約 15 分", "drive": "從新竹市區約 45 分", "desc": "與新埔海堤那兩處不是同一組設施——那兩處在海邊堤防上，這個點在往內陸爬升的新埔路山路上，兩者相距約 800 公尺、有明顯高度差。座標落在新埔路往嶺頂方向的路肩，從高處往西俯瞰台61 線、新埔聚落與台灣海峽；再沿同一條路往上約 700 公尺就是心形公路觀景點與嶺頂瞭望臺。屬於地圖自行標記的路邊看海點，現場沒有任何設施或標示。", "note": "沒有停車場、廁所或護欄，只能路邊臨停；山路窄、視線彎曲，停車時務必留意後方來車，不建議久留。建議直接併進心形公路那趟一起走完。", "season": "冬季東北季風強。", "source": "https://fullfenblog.tw/love-highway/", "route": "coast-south", "tags": ["展望", "夕陽"], "stay_h": 0.25, "drive_min": 45, "total_h": 1.8, "season_months": [1, 2, 12], "season_type": "caution", "id": "pb33ffa92"}, {"name": "白沙屯拱天宮", "town": "苗栗縣通霄鎮", "theme": "coast", "kind": "古蹟", "lat": 24.57139, "lng": 120.70917, "coord_conf": "high", "diff": "開車", "time": "停車走 30–40 分", "drive": "從新竹市區約 45 分", "desc": "同治二年（1863）建的媽祖廟，最有名的是徒步往北港的白沙屯媽祖進香——沒有固定路線與日期，全由神轎在路口決定，2011 年列為國家重要民俗。廟離海只有幾百公尺，可順走白沙屯漁港堤岸看夕陽。", "season": "進香在農曆三月二十三日媽祖聖誕前後，那幾天鎮上與周邊道路會完全塞住；不想擠人就避開。", "note": "進香期與假日廟前巷弄狹窄易塞車，建議停放於拱天宮大型公有收費停車場再步行進入。", "source": "https://zh.wikipedia.org/wiki/白沙屯拱天宮", "far": false, "route": "coast-south", "tags": ["大眾運輸"], "stay_h": 0.67, "drive_min": 45, "total_h": 2.2, "season_months": [], "id": "p1364660e"}, {"name": "白沙屯沙灘", "town": "苗栗縣通霄鎮", "lat": 24.57341, "lng": 120.70884, "theme": "coast", "kind": "沙灘", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 45 分", "desc": "白沙屯舊名白沙墩——強勁的東北季風長年把海沙吹堆成一彎新月形的白色沙丘，地名就是這樣來的。沙灘面西，灘上散布形狀好看的礫石，背後就是海岸風力發電機群；靠近過溝溪口一段沒什麼遮擋，是近距離拍風車的角度。從台鐵白沙屯車站出站步行約十分鐘可到海邊，車站到拱天宮也是步行約 15 分鐘。", "note": "沒有救生員與正式海水浴場設施，下水風險自負，務必確認漲退潮。停車要在白沙屯聚落內找路邊車位，巷弄窄。灘上無遮蔽，夏天曝曬。", "season": "冬季東北季風最強，飛沙大、體感很冷。農曆三月白沙屯拱天宮媽祖徒步進香期間，白沙屯聚落與周邊道路會被信眾和遊覽車塞爆、停車幾乎不可能，建議直接避開或改搭火車到白沙屯站。", "source": "https://zh.wikipedia.org/zh-tw/白沙屯媽祖進香", "route": "coast-south", "tags": ["寵物", "大眾運輸", "夕陽"], "stay_h": 1.0, "drive_min": 45, "total_h": 2.5, "season_months": [1, 2, 12], "season_type": "caution", "id": "p27e5a96b"}, {"name": "竹南海濱自然公園", "town": "苗栗縣竹南鎮", "lat": 24.68409, "lng": 120.84295, "theme": "coast", "kind": "濱海森林公園", "diff": "散步", "time": "散步約 1.5 小時", "drive": "從新竹市區約 25 分", "desc": "竹南濱海森林遊憩區的一部分，整區北起龍鳳漁港、南到中港溪出海口，南北長約 5 公里、佔地約 103 公頃，分為長青湖、長青之森、親子之森、假日之森幾個區塊。地勢平坦、多為水泥鋪面，設有自行車道、涼亭與桌椅；林相以原生木麻黃、黃槿等防風林為主。森林步道約 1.5 公里、幾乎沒有落差。靠中港溪出海口這一段有寬約 200 公尺的潮間帶，退潮時水深只到腳踝，看得到招潮蟹與彈塗魚。", "note": "免費開放，設有停車場。防風林段蚊蟲多，建議帶防蚊液；下潮間帶前確認潮汐時間。沙灘沒有救生員與更衣設施。", "season": "每年 4、5 月防風林可見大量斯氏紫斑蝶；冬季東北季風強，沙灘與海堤段飛沙明顯，林間段相對擋得住風。", "source": "https://hiking.biji.co/index.php?q=trail&act=detail&id=1417", "route": "coast-south", "tags": ["寵物", "濕地", "自行車"], "stay_h": 1.5, "drive_min": 25, "total_h": 2.3, "season_months": [5], "season_type": "add", "id": "p4fcd28dc"}, {"name": "竹南溼地（竹南海口人工濕地）", "town": "苗栗縣竹南鎮", "lat": 24.67509, "lng": 120.83365, "theme": "coast", "kind": "濕地", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 25 分", "desc": "正式名稱是竹南海口人工濕地，位在台61 線約 94.2 公里、中港溪出海口一帶，屬竹南濱海森林遊憩區的南端。常被誤稱崎頂濕地，但崎頂是竹南北邊子母隧道那一帶，是另一個地方。園區有一條顯眼的橘色木棧道穿過水域，以及可登高俯瞰整片濕地的大型觀景平台；水面倒映防風林，遠處是海岸線上一整排白色風力發電機，退潮時灘地上看得到招潮蟹與彈塗魚。", "note": "免費、不需門票，設有三個大型免費停車場，平假日都容易停。有洗手間，但實際維護狀況一般。棧道與濕地邊緣濕滑，建議穿防滑鞋，不要踩進鬆軟的泥灘地。", "season": "每年 4、5 月周邊防風林是斯氏紫斑蝶的繁殖熱點，最高紀錄逾十萬隻；黃昏拍晚霞倒影與風車剪影最好。冬季東北季風強，出海口一帶完全無遮蔽。", "source": "https://www.chunan.gov.tw/News4.aspx?n=2614&sms=10343", "gmap": "竹南溼地", "route": "coast-south", "tags": ["展望", "夕陽", "濕地"], "stay_h": 1.5, "drive_min": 25, "total_h": 2.3, "season_months": [5], "season_type": "add", "id": "p8b2b9104"}, {"name": "竹南綠光海風自行車道", "town": "苗栗縣竹南鎮", "lat": 24.72243, "lng": 120.86726, "theme": "coast", "kind": "自行車道", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 25 分", "desc": "「綠光海風」是苗栗沿海整條自行車道的總稱（全線約 68 公里），竹南這一段約 8–9 公里，是最北端的起點。路線從崎頂往南經龍鳳漁港、竹南濱海森林遊憩區到中港溪口，一路穿過防風林、沙丘、濕地與河口。海岸線長而直、沙質細，沿途有涼亭座椅，是看夕陽的地方。", "note": "免費。兩端入口都有免費停車場，中間也有多處出入口可切到沙灘，沙灘旁設有洗手間與沖水區。步道與車道並行，不騎車也可以純散步；沿線遮蔽少，夏天中午很曬。", "season": "夏天可踏浪玩水，但沙灘無救生員，下水注意安全；秋冬東北季風強、海邊風大。", "source": "https://guide.easytravel.com.tw/scenic/2966", "route": "coast-south", "tags": ["夕陽", "自行車", "玩水"], "stay_h": 1.5, "drive_min": 25, "total_h": 2.3, "season_months": [1, 2, 6, 7, 8, 9, 10, 11, 12], "season_type": "add", "id": "p5470c5e8"}, {"name": "竹南龍鳳漁港", "town": "苗栗縣竹南鎮", "theme": "coast", "kind": "海岸", "lat": 24.69986, "lng": 120.85706, "coord_conf": "high", "diff": "散步", "time": "停車走 40 分–1 小時", "drive": "從新竹市區約 25 分", "desc": "2008 年建的白色風帆造型景觀橋跨在港口上，橋上直接看海與夕陽，夜間點燈。港邊有沙灘與潮間帶可以玩沙，但多是礁岩與消波塊，不建議游泳。", "season": "面西，夕陽是竹南人的固定行程；冬季風大。", "note": "港區有超大免費停車場，平日空、假日建議早到；接綠光海風自行車道，往南 5 分鐘就是假日之森。", "source": "https://linnote.com/longfeng-fishing-port/", "far": false, "route": "coast-south", "tags": ["夕陽", "自行車"], "stay_h": 1.0, "drive_min": 25, "total_h": 1.8, "season_months": [1, 2, 12], "season_type": "add", "id": "paec584d2"}, {"name": "臺鹽通霄觀光園區（鹽來館）", "town": "苗栗縣通霄鎮", "lat": 24.55595, "lng": 120.70358, "theme": "coast", "kind": "觀光工廠", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 45 分", "desc": "台鹽通霄精鹽廠附設的免費觀光園區。主展館鹽來館介紹製鹽流程與海洋深層水；園區地標是一個巨無霸精鹽包造景。戶外有海洋深層水親水廣場（寶特瓶造型噴泉戲水池）與溫泉泡腳池，兩者都免費使用，另有 DIY 體驗、展售中心、鹽鄉小棧與台鹽冰棒。位置緊鄰海邊、離台61 線很近，適合作為通霄海線的中繼補給點。", "note": "免費入園、有免費停車場。各區時間不同：鹽來館週二至週日 08:30–16:30（週一休）、泡腳池與戲水池週二至週日 09:00–16:00。要玩水記得帶替換衣物。", "season": "戲水與泡腳設施會依季節與天候調整開放，夏天玩水最合適；冬季海邊風大，戶外區體感很冷。", "source": "https://fullfenblog.tw/ml-taiyen-museum/", "gmap": "臺鹽通霄觀光園區 (臺鹽通霄精鹽廠)", "route": "coast-south", "tags": ["雨天", "親子", "無障礙", "溫泉", "玩水", "手作"], "stay_h": 1.5, "drive_min": 45, "total_h": 3.0, "season_months": [1, 2, 6, 7, 8, 12], "season_type": "add", "id": "p228edf9e"}, {"name": "觀海景台", "town": "苗栗縣通霄鎮", "lat": 24.56565, "lng": 120.705, "theme": "coast", "kind": "觀海台", "diff": "開車", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "苗41 濱海公路旁的一座有頂觀景平台，位在通霄鎮白西里、白沙屯漁港北方約 600 公尺。坐下來就是整片通霄海灘、沙岸和風力發電機，評論說平日幾乎只聽得到海浪聲，很多人是拜完白沙屯拱天宮順路過來吹風、等夕陽。", "note": "24 小時開放、免費，旁邊有停車區；屋頂有縫隙擋不住太陽，夏天要戴帽防曬、冬天風大要保暖。", "season": "", "source": "https://qqd.tw/54kms_coastline1/", "route": "coast-south", "tags": ["夕陽"], "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [], "id": "p45aa795f"}, {"name": "通霄日落大道", "town": "苗栗縣通霄鎮", "lat": 24.54258, "lng": 120.70186, "theme": "coast", "kind": "觀景點", "diff": "開車", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "台61 線西濱快速道路新埔交流道旁，一段約 500 公尺筆直、東高西低的路面正對台灣海峽，黃昏時太陽剛好懸在路的正中央，曾被票選為台灣十大最美公路第一名。縣府在旁邊蓋了貨櫃改造的觀景台，分三個觀景區、有階梯上二樓，附設洗手間與小型停車場。面西，日落直接落海。", "note": "免門票。觀景台平日 8:00–16:40 開放、假日全天，颱風或天候不佳不開放；停車位不多，日落前後容易滿。台地上風很大。觀景台是階梯，不建議推嬰兒車或輪椅上樓。", "season": "5–7 月夕陽正落在路中央的懸日最準，是攝影人主要時段；冬季東北季風強、體感很冷。", "source": "https://fullfenblog.tw/sunset-boulevard/", "route": "coast-south", "tags": ["展望", "夕陽"], "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [5, 6, 7], "season_type": "add", "id": "p1b86bd58"}, {"name": "風車聚落（空距73）", "town": "苗栗縣後龍鎮", "lat": 24.58835, "lng": 120.71319, "theme": "coast", "kind": "海岸風車", "diff": "散步", "time": "約 40 分", "drive": "從新竹市區約 45 分", "desc": "後龍鎮南港里山邊、山邊媽祖廟後方的一段海岸。這裡離陸上與離岸風機都很近，是攝影者拍風車、夕陽和海岸線的定點；漲潮時堤防外的小平台會被浪打上來，退潮則露出小沙灘和礁石，可以撿螃蟹、海螺。海岸自行車道從這裡往南可接白沙屯、往北可接海角樂園一帶。名稱後綴「空距73」是地圖自行加的標註，不是官方名稱。", "note": "24 小時開放、免費；沿山邊媽祖廟旁的路可開車直達，旁邊空地可停車；現場沒有廁所或商家，山邊媽旁有攤販；部分路段已禁止車輛進入，只能走自行車道。", "season": "東北季風季（約 10 月至隔年 3 月）風極大，要注意保暖與強風。", "source": "https://tenjo.tw/houlong-capeofgoodhope/", "gmap": "風車聚落(空距73)", "route": "coast-south", "tags": ["夕陽", "自行車", "玩水"], "stay_h": 0.67, "drive_min": 45, "total_h": 2.2, "season_months": [1, 2, 3, 10, 11, 12], "season_type": "caution", "id": "73"}, {"name": "鹽山沙灘", "town": "苗栗縣通霄鎮", "lat": 24.55876, "lng": 120.70131, "theme": "coast", "kind": "沙灘", "diff": "散步", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "通霄鎮內島里、台鹽通霄精鹽廠外側的一段海灘，名字就來自廠區裡那座鹽山。Google 地圖歸類為海濱長廊，灘外有一排消波塊，看得到風力發電機與夕陽；冬天東北季風一起，沙會在灘面上被吹出風吹沙的紋路，是這裡的特色。離白沙屯拱天宮很近，可以順遊。", "note": "24 小時開放、免費；路邊停車；沒有沖洗更衣設施，評論提到灘上垃圾不少。", "season": "冬季（10 月至隔年 3 月）東北季風強，風吹沙景象最明顯但也最冷。", "source": "https://travel.yam.com/article/119736", "route": "coast-south", "tags": ["夕陽"], "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [1, 2, 3, 10, 11, 12], "season_type": "add", "id": "p07a49acd"}, {"name": "龍貓公車站", "town": "苗栗縣通霄鎮", "lat": 24.51692, "lng": 120.68671, "theme": "coast", "kind": "造景打卡點", "diff": "開車", "time": "約 15 分", "drive": "從新竹市區約 50 分", "desc": "網友取的暱稱，實體是仿宮崎駿《龍貓》公車站的私人造景，位在通霄鎮通灣里、通霄海水浴場與通霄發電廠之間的農路旁。做得比一般網美景點講究：龍貓像用類似水泥的材質而非玻璃纖維，周邊多是原生樹木與石材。範圍非常小——就是一隻龍貓、一支公車站牌和一個簡易小攤，藏在一排約 1.5 公尺高的矮籬後方。查證到 2025 年仍在，維護狀況正常。", "note": "免費、24 小時開放，但只能路邊停車，農路窄小；現場沒有廁所。位置隱蔽且無明顯招牌，導航要看仔細，很容易開過頭。是私人整理的造景，人多時請排隊、垃圾帶走。", "season": "冬季東北季風強，田野間無遮蔽、體感偏冷。", "source": "https://curly.com.tw/totoro-station/", "route": "coast-south", "stay_h": 0.25, "drive_min": 50, "total_h": 1.9, "season_months": [1, 2, 12], "season_type": "caution", "id": "p75ef3b4e"}, {"name": "Daddy&Mommy", "town": "苗栗縣後龍鎮", "theme": "food", "kind": "餐飲", "lat": 24.6141349, "lng": 120.7881312, "coord_conf": "high", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 35 分", "desc": "鄰近後龍車站的老宅咖啡館，由兩層樓老洋房改建，以日系木質調為主要風格；供應慢燉牛肉咖哩飯、雞肉咖哩，以及手作焦糖巴斯克乳酪蛋糕、肉桂捲與義式咖啡。", "season": "", "note": "營業時間 10:00–18:00（週二公休）；老宅內用座位有限，遇客滿限時 90 分鐘。", "source": "", "far": false, "route": "coast-south", "tags": ["大眾運輸"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "daddy-mommy"}, {"name": "後龍夜市", "town": "苗栗縣後龍鎮", "lat": 24.61195, "lng": 120.78667, "theme": "food", "kind": "夜市", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 35 分", "desc": "苗栗海線規模最大的每週日限定封街夜市，沿後龍鎮南龍街與信義街排開，聚集數百個攤位，供應平價牛排、熱炒、地瓜球與傳統點心，是在地人週末聚會的核心夜市。", "note": "只有週日營業，約 17:00 到 23:00；地點在後龍鎮南龍街一帶；免費停車；攤位多為現金。", "season": "", "source": "https://almablog.tw/blog/post/houlon-gnight-market", "route": "coast-south", "tags": ["夜景"], "stay_h": 1.5, "drive_min": 35, "total_h": 2.7, "season_months": [], "id": "p7d539f22"}, {"name": "後龍慈雲宮 廟口黑輪伯", "town": "苗栗縣後龍鎮", "lat": 24.614391, "lng": 120.787162, "theme": "food", "kind": "廟口小吃", "diff": "開車", "time": "約 0.5 小時", "drive": "從新竹市區約 35 分", "route": "coast-south", "desc": "後龍慈雲宮廟口經營逾三十年的經典台式關東煮名店，各式黑輪、手工燕丸與蔬菜捲吸飽大骨鮮甜高湯，淋上獨門特調甜辣醬更顯鹹香對味；內用可免費無限續喝熱高湯，是後龍廟口最具代表性的銅板美食。", "note": "廟口停車不易，建議停遠一點走過去。", "season": "", "source": "", "gmap": "356苗栗縣後龍鎮中龍里三民路120號黑輪伯", "nav_target": "356苗栗縣後龍鎮中龍里三民路120號黑輪伯", "stay_h": 0.5, "drive_min": 35, "total_h": 1.7, "season_months": [], "id": "pe80e2939"}, {"name": "杏仁露刀削冰", "town": "苗栗縣後龍鎮", "lat": 24.614368, "lng": 120.786809, "theme": "food", "kind": "冰品", "diff": "開車", "time": "約 0.5 小時", "drive": "從新竹市區約 35 分", "route": "coast-south", "desc": "後龍慈雲宮旁傳承一甲子的夏季限定古早味冰品名店，主打古法熬製、口感滑嫩的天然「杏仁露」與手工粉條；搭配口感爽脆的古早味刀削粗碎冰與微酸檸檬糖水，是海線夏日不可錯過的消暑聖品。", "note": "**夏季限定營業（約 5–10 月）**，營業時間約 11:00–21:00；位於慈雲宮廟口旁，僅收現金。", "season": "夏天最熱門", "source": "", "gmap": "356苗栗縣後龍鎮中龍里三民路120號苗栗後龍杏仁露刀削冰", "nav_target": "356苗栗縣後龍鎮中龍里三民路120號苗栗後龍杏仁露刀削冰", "stay_h": 0.5, "drive_min": 35, "total_h": 1.7, "season_months": [6, 7, 8], "season_type": "add", "id": "p31f7b5a8"}, {"name": "福堂餅行（通霄旗艦店）", "town": "苗栗縣通霄鎮", "lat": 24.4912, "lng": 120.68481, "theme": "food", "kind": "餅舖", "diff": "開車", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "1899 年創立的百年餅舖福堂餅行的通霄旗艦店，目前傳至第四代，古法製餅之外也研發養生新口味大餅，鄰近白沙屯拱天宮，是通霄一帶主要的伴手禮採買點。與頭份分店相距約 45 公里，是同品牌的不同店面。", "note": "營業時間每日 08:00–19:30；提供現場免費試吃，門口路邊可臨停採買。", "season": "", "source": "https://umechen.pixnet.net/blog/post/33765671", "gmap": "福堂餅行通霄旗艦店", "route": "coast-south", "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [], "id": "pe9c6fb0e"}, {"name": "紅瓦厝創意生活美食館", "town": "苗栗縣後龍鎮", "lat": 24.65812470398151, "lng": 120.82260264785057, "theme": "food", "kind": "客家私廚", "diff": "開車", "time": "約 2 小時（含 DIY 體驗）", "drive": "從新竹市區約 35 分", "desc": "後龍灣寶社區的無菜單客家私廚，曾拿下客家湯圓料理競賽冠軍，主打當令食材配拔花生、搓湯圓、做米果等 DIY 體驗，活動空間不大，一次約可容納 4 桌。", "note": "**採全預約制客家私廚**，最晚須於活動前 3 天電話預約；一次僅接待約 4 桌。", "season": "", "source": "https://camille7531.pixnet.net/blog/post/66412563", "route": "coast-south", "tags": ["需預約", "手作", "採果"], "stay_h": 2.0, "drive_min": 35, "total_h": 3.2, "season_months": [], "id": "pfcaede50"}, {"name": "阿水飯店", "town": "苗栗縣後龍鎮", "lat": 24.614008, "lng": 120.787322, "theme": "food", "kind": "在地飯館", "diff": "開車", "time": "約 1 小時", "drive": "從新竹市區約 35 分", "route": "coast-south", "desc": "苗栗後龍號稱「海線最強」的無菜單海鮮熱炒名店，堅持不接受預約、天天大排長龍。主打料多味美的招牌海鮮粥、酥脆鮮甜的手工甘蔗蝦與各式現撈現炒海味，份量澎湃且鑊氣十足，是海線聚餐的重量級地標。", "note": "營業時間 11:00–14:00、17:00–20:00；**不接受預約訂位，一律現場排隊且全員到齊方可入座**。", "season": "", "source": "", "gmap": "356苗栗縣後龍鎮中龍里中龍街183-2號阿水飯店", "nav_target": "356苗栗縣後龍鎮中龍里中龍街183-2號阿水飯店", "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "pc9ed873d"}, {"name": "苗栗縣百變影城文創園區", "town": "苗栗縣造橋鄉", "lat": 24.6398699, "lng": 120.7791805, "theme": "heritage", "kind": "園區", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 35 分", "route": "coast-south", "desc": "影城主題的文創園區。", "note": "營業時間每日 09:00–17:00；入園門票全票約 250–300 元，附設大型停車場。", "season": "", "source": "", "coord_conf": "high", "tags": ["親子", "手作"], "stay_h": 1.5, "drive_min": 35, "total_h": 2.7, "season_months": [], "id": "p570e26cf"}, {"name": "英才書院", "town": "苗栗縣後龍鎮", "lat": 24.60873, "lng": 120.81594, "theme": "heritage", "kind": "書院", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 35 分", "desc": "位於高鐵苗栗站特定區內，佔地約三千坪，於 2015 年依循傳統閩南書院合院規制仿古興建。園區以大成殿與文昌祠為核心，配置半月形泮池、狀元橋、山門與環池迴廊，內部設有國學展示室與傳統技藝體驗空間。", "note": "自 2017 年起免費參觀。開放週二至週日 09:00–17:00，每週一休館。設有免費停車場。這是新建的仿古建築而非古蹟，看的是形制與庭園，不是歷史遺構。", "season": "", "source": "https://miaolitravel.net/Article.aspx?sNo=04006930", "route": "coast-south", "tags": ["雨天", "無障礙", "大眾運輸", "手作"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "p79a89523"}, {"name": "過港隧道", "town": "苗栗縣後龍鎮", "theme": "heritage", "kind": "古蹟", "lat": 24.5984, "lng": 120.72452, "coord_conf": "high", "diff": "散步", "time": "三座走完來回約 1 小時", "drive": "從新竹市區約 40 分", "desc": "登錄為歷史建築，為日治大正十一年（1922年）海線鐵路通車時啟用之三座單線紅磚鐵路隧道（長度分別為 279、162、56 公尺）。隧道內壁全由紅磚拱券疊砌，保存早期蒸汽火車煙燻痕跡，現整建為平整的自行車與步行景觀步道。", "season": "", "note": "可與半天寮好望角串成一趟。隧道內昏暗，騎車放慢。", "source": "https://html.duckduckgo.com/html/?q=%E9%81%8E%E6%B8%AF%E9%9A%A7%E9%81%93", "far": false, "route": "coast-south", "tags": ["自行車"], "stay_h": 1.0, "drive_min": 40, "total_h": 2.3, "season_months": [], "id": "pcfe5eb5e"}, {"name": "南窩綠丘", "town": "苗栗縣通霄鎮", "theme": "trail-near", "kind": "草原園區", "lat": 24.447769011333158, "lng": 120.74277183209584, "coord_conf": "high", "diff": "散步", "time": "約 2 小時", "drive": "從新竹市區約 55 分", "desc": "通霄城南里的草原園區，就在飛牛牧場北側，大片草坡供野餐與草地露營，同時經營民宿；園區開放時間 10:00–18:00。野餐方案與住宿都要事先預約，草原可以帶寵物（平時需牽繩，另有不定期的寵物日）。", "season": "", "note": "地址苗栗縣通霄鎮城南里城南 66-5 號；園方留的洽詢時段是 9:30–12:00、13:00–18:30。入園、野餐與住宿的收費方案各家資料寫法不一，出發前先向園方確認。", "source": "https://www.greenhill.tw/", "route": "coast-south", "tags": ["寵物", "需預約", "野餐"], "stay_h": 2.0, "drive_min": 55, "total_h": 3.8, "season_months": [], "id": "paefb0220"}, {"name": "嶺頂瞭望臺（嶺頂步道）", "town": "苗栗縣通霄鎮", "lat": 24.54203, "lng": 120.70965, "theme": "trail-near", "kind": "步道", "diff": "散步", "time": "心形公路觀景點到嶺頂福德祠約 750 公尺，含兩座瞭望臺來回約 1 小時", "drive": "從新竹市區約 50 分", "desc": "通霄新埔路半山腰的短程稜線步道，從心形公路觀景點沿水泥階往上約 750 公尺到嶺頂福德祠，途中有兩座木造瞭望臺。第一座只在階梯上方兩分鐘處，視野已能一路掃過通霄到後龍的海岸線、風力發電機與台灣海峽。兩座瞭望臺之間有可停約 20 輛車的空地。", "note": "臨海稜線風極強，四季都要帶外套。木造平台與欄杆已有耗損痕跡，踩踏前留意。步道多為芒草與矮樹，遮蔭少，夏天正午不建議。", "season": "傍晚看夕陽落海最佳；冬季東北季風強勁。", "source": "https://hiking.biji.co/index.php?q=review&act=info&review_id=25078", "gmap": "嶺頂瞭望臺", "route": "coast-south", "tags": ["展望", "夕陽"], "stay_h": 1.0, "drive_min": 50, "total_h": 2.7, "season_months": [1, 2, 12], "season_type": "caution", "id": "p2fb9c556"}, {"name": "苗栗抹茶山（塗崁頂山西南峰）", "town": "苗栗縣通霄鎮", "lat": 24.53684, "lng": 120.70467, "theme": "trail-near", "kind": "郊山", "diff": "健行", "time": "從嶺頂步道口單程約 1.5–2 公里，來回約 1.5–2 小時", "drive": "從新竹市區約 50 分", "desc": "「抹茶山」是網路暱稱不是正式地名——山頭真名塗崁頂山，海拔只有 162 公尺，山頂有三等三角點；因為整片翠綠草坡遠看像抹茶冰淇淋而得名，跟宜蘭聖母山莊那座抹茶山沒有關係。座標指的西南峰只有一顆四等控制點、沒有山頂石碑，卻是拍草坡與海景的主要位置。一般走法是心形公路觀景點→嶺頂步道→嶺頂福德祠→塗崁頂山→西南峰，全程約 3.3 公里、落差 103 公尺。", "note": "導航設「嶺頂福德祠」或新埔路嶺頂步道入口，福德祠附近有停車空間。芒草葉緣銳利，建議長袖長褲；沿途無販賣部。返程建議原路折返，其他岔路指標不清。", "season": "10–12 月芒草季最漂亮；夏季草長人高、視野與體感都差。", "source": "https://travelss.net/2025/09/04/", "gmap": "塗崁頂山西南峰|苗栗抹茶山", "route": "coast-south", "tags": ["展望", "夕陽"], "stay_h": 2.0, "drive_min": 50, "total_h": 3.7, "season_months": [10, 11, 12], "season_type": "add", "id": "p4b0e2cc5"}, {"name": "通霄鎮楓樹里蒜香藤花廊", "town": "苗栗縣通霄鎮", "lat": 24.48665, "lng": 120.73393, "theme": "trail-near", "kind": "花廊步道", "diff": "散步", "time": "約 30 分", "drive": "從新竹市區約 45 分", "desc": "國道三號通霄交流道附近、楓樹社區裡一條約 200 公尺長的蒜香藤花廊，開花時整片紫色花瀑掛在步道上方，彎曲的小徑很好取景。這裡是私人土地，地主無償開放讓人進去拍照，沒有售票口也沒有其他設施。要講清楚的是：不是花期來就只是一條普通的綠藤棚架，看不到什麼東西，這是純粹為了花才值得跑一趟的點。", "note": "免費、無管理單位。路邊停車位有限，花期假日人多，請不要踩進旁邊的農田。", "season": "蒜香藤一年開好幾次，主要在秋季約 9–11 月。花期很短，盛開後大約一週內最漂亮，出發前務必先查當年花況再決定要不要去。", "source": "https://www.mook.com.tw/article/39060", "route": "coast-south", "stay_h": 0.5, "drive_min": 45, "total_h": 2.0, "season_months": [9, 10, 11], "season_type": "core", "id": "paf529f21"}, {"name": "飛牛牧場", "town": "苗栗縣通霄鎮", "lat": 24.44127, "lng": 120.74129, "theme": "trail-near", "kind": "牧場", "diff": "散步", "time": "約 3 小時", "drive": "從新竹市區約 55 分", "desc": "通霄南和里的觀光牧場，名字裡的「飛」指蝴蝶、「牛」指乳牛。遊憩區約 50 公頃，連同牧草種植與乳牛養殖用地共約 120 公頃。有大草原、乳牛區、可愛動物區與蝴蝶生態環境，每天有餵小牛、擠牛奶、餵羊、鴨子遊行等固定場次，另設奶酪與冰淇淋 DIY 教室，餐廳供應自家鮮乳做的餐點與冰品。", "note": "全票 280 元、學童票 220 元、幼童票 160 元，3 歲以下免費；憑門票可免費兌換乳製品一杯。營業時間各家資料在 07:00–19:00 與 08:00–19:00 之間有出入，出發前確認。園區大又有坡，建議留 2–3 小時以上。", "season": "", "source": "https://bobowin.blog/flying-cow-ranch/", "route": "coast-south", "tags": ["寵物", "親子", "野餐", "手作"], "stay_h": 3.0, "drive_min": 55, "total_h": 4.8, "season_months": [], "id": "pa1b4cc1a"}, {"name": "北勢溪親水廊道", "town": "苗栗縣後龍鎮", "lat": 24.61061, "lng": 120.82133, "theme": "water", "kind": "親水步道", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 35 分", "desc": "高鐵苗栗站旁整治過的親水河廊，兩岸鋪了臨水步道，堤頂另闢人行道與自行車專用道，全長約 2.6 至 3.8 公里。沿線串起客家圓樓、英才書院與傳藝公園，河道裡做了七處滯洪池和景觀石滬；月牙橋下的月相灣是最容易親近水面的一段，設有飼料機可以餵魚。", "note": "免費、全日開放。導航設「客家圓樓」即可，圓樓有停車場。週六、日晚間 19:00 與 20:00 各一場音樂水舞，每場約 10–15 分鐘。搭車可從台鐵豐富站或高鐵苗栗站步行約 5 分。", "season": "", "source": "https://vivawei.tw/houlong-beishixi/", "route": "coast-south", "tags": ["寵物", "親子", "無障礙", "大眾運輸", "夜景", "自行車"], "stay_h": 1.0, "drive_min": 35, "total_h": 2.2, "season_months": [], "id": "p6bfe31e1"}, {"name": "出水沙灘（沙漠）", "town": "苗栗縣苑裡鎮", "lat": 24.45051, "lng": 120.6382, "theme": "coast", "kind": "沙灘", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 55 分", "desc": "在苑裡鎮出水路海邊。所謂「沙漠」是海堤外側以竹籬護沙工法攔出來的風積沙丘，沙被季風堆成起伏的丘面，因此被稱作小沙漠。導航「苑裡出水沙灘海堤」可停在堤邊，翻過海堤就是沙灘；退潮後灘面平坦寬廣，佈滿招潮蟹洞，可挖蛤、看螃蟹，也有石蚵養殖。面西，傍晚看夕陽。", "note": "沒有正規停車場與廁所，只能停在海堤邊。務必查漲退潮時間——退潮走遠後被漲潮困住很危險。沙丘上的竹籬是護沙設施，不要破壞或踩踏。夏天灘上無遮蔽。", "season": "每年 4–5 月退潮時，沿海岸線約 200 公尺的礁石上會長滿滸苔，看起來像撒了抹茶粉，俗稱抹茶石，只有這兩個月看得到。冬季東北季風強、飛沙嚴重。", "source": "https://travel.yam.com/article/121153", "gmap": "出水沙灘(沙漠)", "route": "dajia", "tags": ["寵物", "夕陽", "濕地", "玩水"], "stay_h": 1.0, "drive_min": 55, "total_h": 2.8, "season_months": [4, 5], "season_type": "add", "id": "p600cf0c3"}, {"name": "高美濕地", "town": "臺中市清水區", "lat": 24.3125568, "lng": 120.5448018, "theme": "coast", "kind": "濕地", "diff": "散步", "time": "約 2 小時", "drive": "從新竹市區約 65 分", "route": "dajia", "desc": "大甲溪出海口南岸的潮間帶濕地，木棧道直接架在灘地上，退潮時整片水鏡映著風車與夕陽，是台灣最有名的濕地夕照。雲林莞草與招潮蟹是這裡的生態主角。", "note": "**木棧道有開放時間、依潮汐調整**，出發前查當日潮汐與開放時段；漲潮會封閉。海風極強。", "season": "", "source": "", "coord_conf": "high", "tags": ["無障礙", "夕陽", "濕地"], "stay_h": 2.0, "drive_min": 65, "total_h": 4.2, "season_months": [], "id": "p5bc38f08"}, {"name": "垂坤食品-旗艦店", "town": "苗栗縣苑裡鎮", "lat": 24.3988, "lng": 120.66752, "theme": "food", "kind": "伴手禮", "diff": "散步", "time": "約 40 分", "drive": "從新竹市區約 50 分", "desc": "民國 74 年從肉鬆肉乾專賣店起家，旗艦店開在國道三號苑裡交流道旁，下交流道約 100 公尺就到。賣場大到客人拿洗衣籃當購物籃，餅乾零食多從 50 元起跳，肉乾、肉鬆是主力，現場設試吃區。", "note": "07:30–21:00，週五、六、日到 21:30；免費停車場與廁所；量大建議開車。", "season": "", "source": "https://tenjo.tw/chuei-kun/", "route": "dajia", "tags": ["雨天"], "stay_h": 0.67, "drive_min": 50, "total_h": 2.3, "season_months": [], "id": "p5736e363"}, {"name": "大甲芋頭城", "town": "臺中市大甲區", "lat": 24.3417028, "lng": 120.6196974, "theme": "food", "kind": "伴手禮", "diff": "開車", "time": "約 30 分", "drive": "從新竹市區約 60 分", "route": "dajia", "desc": "大甲鎮瀾宮旁極具人氣的芋頭甜品名店，嚴選大甲在地檳榔心芋頭慢火蜜煮；招牌「芋圓綜合冰」鋪滿大塊鬆軟綿密的蜜芋頭與彈牙手工芋圓，香濃不甜膩，是參拜媽祖後必嚐的在地經典甜品。", "note": "營業時間每日 10:00–18:00；鄰近鎮瀾宮商圈停車不易，建議停放於周邊收費停車場再步行前往。", "season": "秋冬是芋頭產季", "source": "", "coord_conf": "high", "stay_h": 0.5, "drive_min": 60, "total_h": 2.5, "season_months": [1, 2, 9, 10, 11, 12], "season_type": "add", "id": "p772c6e6f"}, {"name": "大甲蔣公路夜市", "town": "臺中市大甲區", "lat": 24.3461589, "lng": 120.6198346, "theme": "food", "kind": "夜市", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 60 分", "route": "dajia", "desc": "鎮瀾宮廟埕外的小吃街，芋頭、粉腸、肉圓與各式廟口點心集中在幾條巷子裡，白天到晚上都有得吃。", "note": "與鎮瀾宮同一區，停車走進來。", "season": "", "source": "", "coord_conf": "high", "tags": ["夜景"], "stay_h": 1.5, "drive_min": 60, "total_h": 3.5, "season_months": [], "id": "p0144ca30"}, {"name": "愛情果園-苑裡鎮農會農民直銷站", "town": "苗栗縣苑裡鎮", "lat": 24.4135358, "lng": 120.6828674, "theme": "food", "kind": "農民市場", "diff": "開車", "time": "約 40 分", "drive": "從新竹市區約 55 分", "route": "dajia", "desc": "苑裡鎮農會的直銷站，以在地小番茄（愛情果）為招牌，另有稻米、藺草編織品與農產加工品。", "note": "開放時間週二至週日 09:00–16:30（週一公休）；採果體驗按斤計價，附設免費停車場。", "season": "番茄產季冬春", "source": "", "coord_conf": "high", "tags": ["雨天", "採果"], "stay_h": 0.67, "drive_min": 55, "total_h": 2.5, "season_months": [1, 2, 3, 4, 5, 12], "season_type": "add", "id": "pfd7df8b6"}, {"name": "清水五權夜市", "town": "台中市清水區", "lat": 24.276956229970416, "lng": 120.56807366061099, "theme": "food", "kind": "夜市", "diff": "開車", "time": "約 1.5 小時", "drive": "從新竹市區約 65 分", "route": "dajia", "desc": "清水市區的在地夜市，可以接在大甲鎮瀾宮、高美濕地一線的傍晚收尾。", "note": "每週三、六、日營業（約 17:00–23:30）；附設免費汽機車停車場。", "season": "", "source": "", "coord_conf": "high", "tags": ["夜景"], "stay_h": 1.5, "drive_min": 65, "total_h": 3.7, "season_months": [], "id": "p9c00cb9a"}, {"name": "王塔米糕店", "town": "臺中市清水區", "lat": 24.2714393, "lng": 120.5720679, "theme": "food", "kind": "米糕", "diff": "開車", "time": "約 40 分", "drive": "從新竹市區約 65 分", "route": "dajia", "desc": "清水筒仔米糕超過七十年歷史的創始老店，米糕經高溫蒸透、粒粒分明，內含厚實三層肉與干貝提香，淋上特製甜辣醬更是靈魂滋味；搭配用料實在的四神湯與鑲肉油豆腐，是造訪清水必吃的美食地標。", "note": "營業時間每日 09:30–19:00；店旁附設專屬免費停車場，用餐尖峰時段需排隊。", "season": "", "source": "", "coord_conf": "high", "stay_h": 0.67, "drive_min": 65, "total_h": 2.8, "season_months": [], "id": "p222605d3"}, {"name": "山腳國小日治後期宿舍群", "town": "苗栗縣苑裡鎮", "lat": 24.417487, "lng": 120.685828, "theme": "heritage", "kind": "日式宿舍群", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 55 分", "route": "dajia", "desc": "登錄為苗栗縣歷史建築，建於昭和十二年至十六年間（1937–1941年），為山腳國小僅存的日式教職員宿舍。現存兩棟四戶雙併木造建築，外牆採用杉木雨淋板、屋頂覆蓋日式黑瓦，座落於校園老樹綠地間，呈現日治後期標準官舍形式。", "note": "宿舍群位於校園內，上課日進出請避開學生活動時間；假日開放時間以校方公告為準。", "season": "", "source": "https://zh.wikipedia.org/wiki/山腳國小日治後期宿舍群", "gmap": "358苗栗縣苑裡鎮舊社里舊社里10鄰47號 山腳國小日治後期宿舍群", "nav_target": "358苗栗縣苑裡鎮舊社里舊社里10鄰47號 山腳國小日治後期宿舍群", "tags": ["老宅"], "stay_h": 1.0, "drive_min": 55, "total_h": 2.8, "season_months": [], "id": "pd7936f15"}, {"name": "房裡古城", "town": "苗栗縣苑裡鎮", "lat": 24.434717, "lng": 120.646533, "theme": "heritage", "kind": "古城聚落", "diff": "散步", "time": "約 1–1.5 小時", "drive": "從新竹市區約 55 分", "route": "dajia", "desc": "始建於清道光年間，為早年泉州籍先民因應族群械鬥而以土石與刺竹構築之防禦土堡市街。城垣與城門現多已不存，但聚落內部仍保留方正街廓肌理，串聯縣定古蹟房裡順天宮、清代義渡碑與大正時期紅磚合院街屋蔡泉盛號。", "note": "聚落內是民居，參觀請降低音量、勿闖私人院落。", "season": "", "source": "https://zh.wikipedia.org/wiki/房裡古城", "gmap": "358苗栗縣苑裡鎮房裡古城", "nav_target": "358苗栗縣苑裡鎮房裡古城", "tags": [], "stay_h": 1.5, "drive_min": 55, "total_h": 3.3, "season_months": [], "id": "pbc9984f4"}, {"name": "臺中市港區藝術中心", "town": "臺中市清水區", "lat": 24.2694578, "lng": 120.5550911, "theme": "heritage", "kind": "美術館", "diff": "散步", "time": "約 1.5 小時", "drive": "從新竹市區約 65 分", "route": "dajia", "desc": "以閩南合院為概念的低矮建築群，展覽館、演藝廳與大片草坪水池連成一區，免門票，是海線少見的室內備案。", "note": "園區戶外 05:00–22:00 免費開放；展覽館 09:00–17:30（週一休館），附設地下收費停車場。", "season": "", "source": "", "coord_conf": "high", "tags": ["雨天", "無障礙", "野餐"], "stay_h": 1.5, "drive_min": 65, "total_h": 3.7, "season_months": [], "id": "pafc94c49"}, {"name": "華陶窯", "town": "苗栗縣苑裡鎮", "lat": 24.37906, "lng": 120.70884, "theme": "heritage", "kind": "人文園林柴燒窯場", "diff": "散步", "route": "dajia", "time": "約 2 小時（純賞園）；加訂割稻飯與捏陶要抓半日約 4 小時", "drive": "從新竹市區約 55 分", "desc": "創立於 1984 年，佔地約 6 公頃，為融合陶藝、園林與生態植物的本土人文窯場。建築結合荷蘭紅磚、日本黑瓦與閩南三合院空間格局，核心設有以相思木為薪柴的傳統柴燒登窯，依火炎山西側山坡地勢建置原生植物園與陶花園。", "note": "週一、週二兩天都公休（注意不是只休週一），09:30–16:30。純入園賞園不用預約，現場買票即可：平日全票 200 元、假日 250 元，兒童 150 元，15:30 後星光票 100 元；門票不折抵消費，停車免費。但割稻飯、捏陶 DIY 與生態植物園導覽這三項一律要事先預約，而且累計滿 20 人才成行——散客小家庭當天到場多半吃不到割稻飯，想吃要先打電話問當日有沒有團可以併。入口是一段偏陡的上坡；林木多、蚊蟲不少。", "season": "4–5 月油桐花與相思樹黃花期最美；園內復育台灣原生植物、四季花況不同，夏季蚊蟲多。", "source": "https://www.hui.com.tw/", "tags": ["雨天", "需預約", "手作", "老宅"], "stay_h": 4.0, "drive_min": 55, "total_h": 5.8, "season_months": [4, 5], "season_type": "add", "id": "p59a86ae9"}, {"name": "蕭家古厝", "town": "苗栗縣苑裡鎮", "lat": 24.44835, "lng": 120.66982, "theme": "heritage", "kind": "古厝", "diff": "散步", "time": "約 40 分", "drive": "從新竹市區約 55 分", "desc": "建於昭和十六年（1941年），座落於苑坑丘陵聚落，為保存完整的紅磚三合院客家民宅。建築牆基保留「三顆石頭一排」的傳統砌石工法，正身與護龍格局嚴謹，內部仍留存舊時紅磚大灶、石磨、木製風穀機與早期農具。", "note": "免費參觀，沒有固定開放時間。屋主平日上班，假日比較容易遇到；這是私人住宅，到了先打招呼、不要擅自進內院。無專屬停車場，路邊停車。", "season": "", "source": "https://siouteng0822.pixnet.net/blog/post/87355678", "route": "dajia", "tags": ["老宅"], "stay_h": 0.67, "drive_min": 55, "total_h": 2.5, "season_months": [], "id": "p53ebde9b"}, {"name": "藺草文化館", "town": "苗栗縣苑裡鎮", "lat": 24.414397, "lng": 120.6830481, "theme": "heritage", "kind": "文化館", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 55 分", "route": "dajia", "desc": "由苑裡鎮農會舊稻穀倉庫改建活化，展示苑裡百年藺草編織產業發展史。館內詳盡陳列大甲帽蓆從收割、曝曬、析草到純手工編織的傳統工序，並展出早期外銷草帽、草蓆器具與編織工藝品，戶外緊鄰彩繪稻田與農田景觀。", "note": "免門票，開放週二至週日 09:00–17:00（週一休館）；附設停車場，提供藺草編織 DIY（需預約）。", "season": "", "source": "", "coord_conf": "high", "tags": ["雨天", "無障礙", "手作"], "stay_h": 1.0, "drive_min": 55, "total_h": 2.8, "season_months": [], "id": "pa1ad86cf"}, {"name": "外埔忘憂谷", "town": "臺中市外埔區", "lat": 24.3084241, "lng": 120.6438844, "theme": "trail-near", "kind": "觀景", "diff": "散步", "time": "約 1 小時", "drive": "從新竹市區約 60 分", "route": "dajia", "desc": "外埔台地上的大片稻田，田埂路可以走進去，插秧後的水鏡、抽穗的綠浪與收割前的金黃各是一種樣子，遠處是火炎山與大安溪。", "note": "是農路不是景區，沒有廁所與商店；車停路邊要留意農機通行。", "season": "一期稻作 5–6 月、二期 10–11 月轉金黃", "source": "", "coord_conf": "high", "tags": ["展望", "夕陽"], "stay_h": 1.0, "drive_min": 60, "total_h": 3.0, "season_months": [5, 6, 10, 11], "season_type": "core", "id": "p95a89572"}, {"name": "葵海休閒農場", "town": "臺中市大甲區", "lat": 24.42147, "lng": 120.61696, "theme": "trail-near", "kind": "休閒農場", "diff": "散步", "time": "約 2 小時", "drive": "從新竹市區約 60 分", "desc": "西濱台61 線旁「匠師的故鄉休閒農業區」的向日葵農場，官方資料稱園區種了約 15 公頃向日葵、另有 10 公頃分批輪作以拉長花期，並闢有向日葵迷宮。園內有蓮花池（可划船餵魚）、大草皮、焢窯區與 DIY 教室，可做大甲芋頭酥、葵花粿；離海邊近，套裝行程含抓螃蟹、踏浪與看夕陽。免費停車場可停約 200 台車
